<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="ae-m3t7-title ae-m3t7-desc">
<title id="ae-m3t7-title">Dónde y cuándo empieza a arder</title>
<desc id="ae-m3t7-desc">Comparación conceptual. Normal: la chispa inicia un frente de llama. Preignición: un punto caliente inicia antes de la chispa prevista. Detonación: autoignición rápida de mezcla restante, separada del frente de llama normal. No representa tiempos, presiones ni dimensiones a escala.</desc>
<rect width="760" height="390" rx="20" fill="#0b182b"/>
<g font-family="Arial,sans-serif" fill="#e2eaf1">
<text x="26" y="40" font-size="25" font-weight="bold">Dónde y cuándo empieza a arder</text>
<text x="26" y="69" font-size="17" fill="#9aafc2">Tres mecanismos · no una secuencia de fallas</text>
<g fill="#15273c" stroke="#47647d" stroke-width="2"><rect x="24" y="94" width="226" height="235" rx="12"/><rect x="267" y="94" width="226" height="235" rx="12"/><rect x="510" y="94" width="226" height="235" rx="12"/></g>
<g font-size="22" text-anchor="middle"><text x="137" y="126">Normal</text><text x="380" y="126">Preignición</text><text x="623" y="126">Detonación</text></g>
