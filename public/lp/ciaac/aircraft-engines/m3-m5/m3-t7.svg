<path d="M669 177l6 14 16-4-9 14 12 12-18-1-7 17-7-16-18 3 11-14-10-13 17 3Z" fill="#f3946c" fill-opacity=".4" stroke="#f3946c" stroke-width="3"/>
<g font-size="18" text-anchor="middle"><text x="137" y="275" fill="#f4ca70">Chispa → llama</text><text x="380" y="275" fill="#f3946c">Punto caliente</text><text x="623" y="275" fill="#f3946c">Mezcla restante</text><text x="137" y="306">Encendido previsto</text><text x="380" y="306">Antes de la chispa</text><text x="623" y="306">Autoignición rápida</text></g>
<text x="26" y="362" font-size="17" fill="#9aafc2">Esquemas conceptuales · identifica el mecanismo, no sólo el síntoma.</text>
