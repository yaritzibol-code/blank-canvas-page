<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="m3-t3-title m3-t3-desc"><title id="m3-t3-title">Lee la posición de los cilindros</title><desc id="m3-t3-desc">Cuatro esquemas. En línea se muestra de lado y de frente. Las disposiciones en V, opuestos y radial se ven de frente; el círculo dorado marca el eje del cigüeñal. El radial incluye una segunda fila desplazada y tenue, dentro del mismo motor.</desc><defs><marker id="m3-t3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="760" height="480" rx="18" fill="#0b172a"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" fill="#e7eff6" font-size="25" text-anchor="start">Lee la posición de los cilindros</text><text x="28" y="67" fill="#9bb0c8" font-size="19" text-anchor="start">Cilindros respecto al cigüeñal • no a escala</text><rect x="24" y="88" width="344" height="178" rx="8" fill="#14243b" stroke="#334963" stroke-width="2"/><rect x="392" y="88" width="344" height="178" rx="8" fill="#14243b" stroke="#334963" stroke-width="2"/><rect x="24" y="279" width="344" height="178" rx="8" fill="#14243b" stroke="#334963" stroke-width="2"/><rect x="392" y="279" width="344" height="178" rx="8" fill="#14243b" stroke="#334963" stroke-width="2"/><text x="42" y="115" fill="#e7eff6" font-size="22" text-anchor="start">En línea</text><text x="234" y="115" fill="#9bb0c8" font-size="17" text-anchor="start">Lateral</text><rect x="65" y="135" width="31" height="63" rx="2" fill="#0b172a" stroke="#64d9e8" stroke-width="2"/><path d="M80 199 L80 224" fill="none" stroke="#efc66e" stroke-width="3"/><rect x="113" y="135" width="31" height="63" rx="2" fill="#0b172a" stroke="#64d9e8" stroke-width="2"/><path d="M128 199 L128 224" fill="none" stroke="#efc66e" stroke-width="3"/><rect x="161" y="135" width="31" height="63" rx="2" fil