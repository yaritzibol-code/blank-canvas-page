<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="m3-t2-title m3-t2-desc"><title id="m3-t2-title">Piezas distintas, funciones conectadas</title><desc id="m3-t2-desc">Culata y paredes contienen la cámara. Dos válvulas regulan gases y dos bujías aportan la chispa. Anillos rodean el pistón. El perno lo une a una biela que transmite esfuerzo al cigüeñal. Las flechas de fuerza lineal y giro son independientes.</desc><defs><marker id="m3-t2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="760" height="480" rx="18" fill="#0b172a"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" fill="#e7eff6" font-size="25" text-anchor="start">Piezas distintas, funciones conectadas</text><text x="28" y="68" fill="#9bb0c8" font-size="19" text-anchor="start">Un cilindro • corte conceptual</text><path d="M270 328 V122 Q270 91 300 91 H421 Q451 91 451 122 V328" fill="none" stroke="#668098" stroke-width="10"/><path d="M286 320 V126 Q286 107 305 107 H416 Q435 107 435 126 V320" fill="none" stroke="#668098" stroke-width="2"/><rect x="288" y="211" width="145" height="54" rx="3" fill="#645535" stroke="#efc66e" stroke-width="2"/><path d="M289 219 L432 219" fill="none" stroke="#64d9e8" stroke-width="4"/><path d="M289 228 L432 228" fill="none" stroke="#64d9e8" stroke-width="4"/><circle cx="360" cy="246" r="12" fill="#0b172a" stroke="#efc66e" stroke-width="3"/><path d="M360 246 L389 363" fill="none" stroke="#efc66e" stroke-width="12"/><circle cx="361" cy="391" r="44" fill="#0b172a" stroke="#668098" stroke-width="8"/><path d="M361 391 L389 363" fill="none" stroke="#efc66e" stroke-width="15"/><circle cx="389" cy="363" r="10" fill="#0b172a" stroke="#efc66e" stroke-width="3"/><circle cx="361" cy="391" r="9" fill="#efc66e" stroke="#efc66e" stroke-width="2"/><path d="M316 75 L316 126" 