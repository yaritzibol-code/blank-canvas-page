<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="m5-t2-title m5-t2-desc">
<title id="m5-t2-title">Combustible: propiedades independientes</title>
<desc id="m5-t2-desc">Tipo y aprobación determinan compatibilidad con motor y aeronave; octanaje caracteriza resistencia a detonación en ensayos. En combustión normal avanza un frente de llama desde la chispa. En detonación también se autoenciende mezcla restante por delante de ese frente. Limpieza y volatilidad son propiedades separadas. El octanaje no mide energía ni autoriza sustituciones.</desc>
<defs>
