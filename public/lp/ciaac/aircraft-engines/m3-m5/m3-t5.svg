<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="m3-t5-title m3-t5-desc"><title id="m3-t5-title">Dónde se mide la potencia</title><desc id="m3-t5-desc">Balance ilustrativo: 120 de potencia indicada se separan en 20 para vencer resistencias internas y 100 disponibles en el eje, denominadas potencia al freno. Potencia nominal aparece en una tarjeta independiente como valor declarado bajo condiciones definidas.</desc><defs><marker id="m3-t5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="760" height="480" rx="18" fill="#0b172a"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" fill="#e7eff6" font-size="25" text-anchor="start">Dónde se mide la potencia</text><text x="28" y="68" fill="#9bb0c8" font-size="18" text-anchor="start">Balance didáctico • cifras ilustrativas, sin unidades operativas</text><text x="39" y="128" fill="#9bb0c8" font-size="20" text-anchor="start">Dentro de los cilindros</text><text x="42" y="166" fill="#efc66e" font-size="27" text-anchor="start">120 indicadas</text><path d="M43 195 H270 C310 195 334 220 378 220 H690 V289 H378 C335 289 303 278 270 278 H43Z" fill="#b99348" stroke="#efc66e" stroke-width="0"/><path d="M267 195 C320 195 318 114 393 114 H542 V128 H393 C352 128 353 209 289 209Z" fill="#f49d78" stroke="#f49d78" stroke-width="0"/><text x="411" y="102" fill="#f49d78" font-size="20" text-anchor="start">20 resistencias internas</text><text x="445" y="255" fill="#0b172a" font-size="26" text-anchor="start">100 al eje</text><text x="434" y="322" fill="#64d9e8" font-size="22" text-anchor="start">Potencia al freno</text><path d="M550 285 L550 296" fill="none" stroke="#64d9e8" stroke-width="2"/><path d="M689 254 L728 254" fill="none" stroke="#64d9e8" stroke-width="3" marker-end="url(#m3-t5-arrow)"/><rect x="28" y="365" width="704" height="89" rx="8" fill="#14243b" stroke="#334963" stroke-width="2"/><text x="47" y="395" fill="#efc66e" font-size="20" text-anchor="start">NOMINAL</text><text x="205" y="395" fill="#e7eff6" font-size="20" text-anchor="start">Valor declarado para condiciones definidas</text><text x="47" y="430" fill="#9bb0c8" font-size="19" text-anchor="start">Es una referencia de clasificación; no otra parte del balance.</text></g></svg>