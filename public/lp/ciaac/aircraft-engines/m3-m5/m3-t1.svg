<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="m3-t1-title m3-t1-desc"><title id="m3-t1-title">Del combustible al empuje</title><desc id="m3-t1-desc">Cadena de energía: combustible, gases sobre pistón, biela y cigüeñal, hélice y aire acelerado. Una rama representa energía que se disipa con escape y enfriamiento; no tiene proporciones numéricas.</desc><defs><marker id="m3-t1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="760" height="480" rx="18" fill="#0b172a"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" fill="#e7eff6" font-size="25" text-anchor="start">Del combustible al empuje</text><text x="28" y="68" fill="#9bb0c8" font-size="19" text-anchor="start">De energía química a trabajo sobre el aire</text><rect x="32" y="99" width="116" height="166" rx="8" fill="#14243b" stroke="#668098" stroke-width="2"/><text x="90" y="293" fill="#e7eff6" font-size="21" text-anchor="middle">Combustible</text><text x="90" y="319" fill="#9bb0c8" font-size="17" text-anchor="middle">Energía química</text><rect x="177" y="99" width="116" height="166" rx="8" fill="#14243b" stroke="#668098" stroke-width="2"/><text x="235" y="293" fill="#e7eff6" font-size="21" text-anchor="middle">Cilindro</text><text x="235" y="319" fill="#9bb0c8" font-size="17" text-anchor="middle">Presión → trabajo</text><rect x="322" y="99" width="116" height="166" rx="8" fill="#14243b" stroke="#668098" stroke-width="2"/><text x="380" y="293" fill="#e7eff6" font-size="21" text-anchor="middle">Cigüeñal</text><text x="380" y="319" fill="#9bb0c8" font-size="17" text-anchor="middle">Rotación del eje</text><rect x="467" y="99" width="116" height="166" rx="8" fill="#14243b" stroke="#668098" stroke-width="2"/><text x="525" y="293" fill="#e7eff6" font-size="21" text-anchor="middle">Hélice</text><text x="525" y="319" fill="#9bb0c8" font-size="17" text-anchor="middle">Acelera el aire</text><rect x="612" y="99" width="116" height="166" rx="8" fill="#14243b" stroke="#668098" stroke-width="2"/><text x="670" y="293" fill="#e7eff6" font-size="21" text-anchor="middle">Aire</text><text x="670" y="319" fill="#9bb0c8" font-size="17" text-anchor="middle">Recibe energía</text><path d="M151 181 L173 181" fill="none" stroke="#64d9e8" stroke-width="3" marker-end="url(#m3-t1-arrow)"/><path d="M296 181 L318 181" fill="none" stroke="#64d9e8" stroke-width="3" marker-end="url(#m3-t1-arrow)"/><path d="M441 181 L463 181" fill="none" stroke="#64d9e8" stroke-width="3" marker-end="url(#m3-t1-arrow)"/><path d="M586 181 L608 181" fill="none" stroke="#64d9e8" stroke-width="3" marker-end="url(#m3-t1-arrow)"/><path d="M90 126 C84 140 67 154 67 172 A23 23 0 0 0 113 172 C113 154 98 140 90 126Z" fill="#564528" stroke="#efc66e" stroke-width="3"/><rect x="199" y="131" width="72" height="104" rx="2" fill="#0b172a" stroke="#668098" stroke-width="2"/><rect x="202" y="185" width="66" height="20" rx="2" fill="#efc66e" stroke="#efc66e" stroke-width="2"/><path d="M235 207 L235 248" fill="none" stroke="#efc66e" stroke-width="7"/><path d="M206 165 L261 165" fill="none" stroke="#f49d78" stroke-width="3"/><path d="M235 146 L235 178" fill="none" stroke="#f49d78" stroke-width="3" marker-end="url(#m3-t1-arrow)"/><circle cx="379" cy="199" r="32" fill="#0b172a" stroke="#668098" stroke-width="2"/><circle cx="379" cy="199" r="8" fill="#efc66e" stroke="#efc66e" stroke-width="2"/><path d="M379 199 L359 173" fill="none" stroke="#efc66e" stroke-width="8"/><path d="M359 173 L371 125" fill="none" stroke="#efc66e" stroke-width="8"/><circle cx="359" cy="173" r="6" fill="#0b172a" stroke="#efc66e" stroke-width="2"/><path d="M411 150 A52 52 0 0 1 420 235" fill="none" stroke="#64d9e8" stroke-width="3" marker-end="url(#m3-t1-arrow)"/><path d="M490 185 L557 185" fill="none" stroke="#efc66e" stroke-width="5"/><path d="M527 181 C497 148 510 118 523 123 C540 130 533 162 527 181 M527 189 C557 220 544 248 530 242 C516 231 521 207 527 189" fill="#64d9e8" stroke="#64d9e8" stroke-width="3"/><circle cx="527" cy="185" r="8" fill="#efc66e" stroke="#efc66e" stroke-width="2"/><path d="M628 144 L713 144" fill="none" stroke="#64d9e8" stroke-width="3" marker-end="url(#m3-t1-arrow)"/><path d="M628 181 L713 181" fill="none" stroke="#64d9e8" stroke-width="3" marker-end="url(#m3-t1-arrow)"/><path d="M628 218 L713 218" fill="none" stroke="#64d9e8" stroke-width="3" marker-end="url(#m3-t1-arrow)"/><path d="M199 247 H165 V363 H404" fill="none" stroke="#f49d78" stroke-width="2" marker-end="url(#m3-t1-arrow)"/><text x="422" y="369" fill="#f49d78" font-size="19" text-anchor="start">Calor : escape y enfriamiento</text><text x="28" y="428" fill="#e7eff6" font-size="19" text-anchor="start">El pistón entrega trabajo al eje; la hélice produce la fuerza propulsora.</text></g></svg>