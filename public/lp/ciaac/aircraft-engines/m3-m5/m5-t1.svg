<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="m5-t1-title m5-t1-desc">
<title id="m5-t1-title">Del tanque al dosificador</title>
<desc id="m5-t1-desc">Un único recorrido conceptual: tanque, selectora, filtro, bomba y dosificador. Un venteo independiente conecta la parte gaseosa del tanque con la atmósfera. Cantidad, presión y caudal se muestran como observaciones distintas. Un tanque con líquido y venteo obstruido ilustra que puede fallar el flujo. Orden y componentes varían entre instalaciones.</desc>
