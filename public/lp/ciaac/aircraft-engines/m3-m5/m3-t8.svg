<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 554" role="img" aria-labelledby="m3-t8-title m3-t8-desc"><title id="m3-t8-title">La hélice convierte par en empuje</title><desc id="m3-t8-desc">Una pala tiene mayor velocidad tangencial en su punta que cerca de la raíz y cambia de ángulo por torsión geométrica. Un triángulo separado suma velocidades de rotación y avance. El gobernador responde a las RPM modificando paso y carga dentro de límites; la carga realimenta las RPM. Se distinguen fuerza centrífuga radial y flexión de la pala.</desc><defs><marker id="m3-t8-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="760" height="554" rx="18" fill="#0b172a"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" fill="#e7eff6" font-size="25" text-anchor="start">La hélice convierte par en empuje</text><text x="28" y="66" fill="#9bb0c8" font-size="19" text-anchor="start">Velocidad local, torsión y control de paso</text><rect x="24" y="85" width="350" height="257" rx="8" fill="#14243b" stroke="#334963" stroke-width="2"/><text x="43" y="115" fill="#e7eff6" font-size="21" text-anchor="start">Una pala, distintos radios</text><circle cx="76" cy="271" r="23" fill="#0b172a" stroke="#efc66e" stroke-width="2"/><path d="M90 257 C125 241 157 192 180 137 C202 113 238 116 227 146 C187 223 150 270 96 283Z" fill="#244d5d" stroke="#64d9e8" stroke-width="3"/><path d="M120 240 L144 274" fill="none" stroke="#64d9e8" stroke-width="3" marker-end="url(#m3-t8-arrow)"/><text x="174" y="296" fill="#64d9e8" font-size="18" text-anchor="start">Raíz: menor v</text><path d="M207 148 L272 217" fill="none" stroke="#64d9e8" stroke-width="3" marker-end="url(#m3-t8-arrow)"/><text x="204" y="245" fill="#64d9e8" font-size="18" text-anchor="start">Punta: mayor v</text><path d="M116 239 L139 236 M189 173 L209 186" fill="none" stroke="#efc66e" stroke-width="5"/><text x="43" y="322" fill="#efc66e" font-size="18" text-anchor="start">Torsión: cambia el ángulo de sección</text><rect x="392" y="85" width="344" height="257" rx="8" fill="#14243b" stroke="#334963" stroke-width="2"/><text x="410" y="115" fill="#e7eff6" font-size="21" text-anchor="start">Velocidades locales</text><path d="M431 280 L676 280" fill="none" stroke="#64d9e8" stroke-width="3" marker-end="url(#m3-t8-arrow)"/><path d="M676 280 L676 155" fill="none" stroke="#efc66e" stroke-width="3" marker-end="url(#m3-t8-arrow)"/><path d="M431 280 L676 155" fill="none" stroke="#f49d78" stroke-width="3" marker-end="url(#m3-t8-arrow)"/><text x="506" y="308" fill="#64d9e8" font-size="18" text-anchor="start">Rotación</text><text x="644" y="143" fill="#efc66e" font-size="18" text-anchor="start">Avance</text><text x="436" y="188" fill="#f49d78" font-size="18" text-anchor="start">Resultante</text><text x="411" y="328" fill="#9bb0c8" font-size="17" text-anchor="start">Esquema vectorial, sin escala</text><text x="28" y="373" fill="#efc66e" font-size="20" text-anchor="start">Gobernador: realimentación, dentro de sus límites</text><rect x="28" y="391" width="145" height="47" rx="8" fill="#14243b" stroke="#668098" stroke-width="2"/><text x="100" y="421" fill="#e7eff6" font-size="20" text-anchor="middle">RPM</text><path d="M176 415 L224 415" fill="none" stroke="#64d9e8" stroke-width="2" marker-end="url(#m3-t8-arrow)"/><rect x="232" y="391" width="194" height="47" rx="8" fill="#14243b" stroke="#668098" stroke-width="2"/><text x="329" y="421" fill="#e7eff6" font-size="20" text-anchor="middle">Gobernador</text><path d="M428 415 L480 415" fill="none" stroke="#64d9e8" stroke-width="2" marker-end="url(#m3-t8-arrow)"/><rect x="488" y="391" width="243" height="47" rx="8" fill="#14243b" stroke="#668098" stroke-width="2"/><text x="609" y="421" fill="#e7eff6" font-size="20" text-anchor="middle">Paso → carga</text><path d="M609 440 V469 H100 V440" fill="none" stroke="#efc66e" stroke-width="2" marker-end="url(#m3-t8-arrow)"/><text x="365" y="494" fill="#9bb0c8" font-size="18" text-anchor="middle">El cambio de carga modifica las RPM</text><circle cx="38" cy="528" r="6" fill="#0b172a" stroke="#efc66e" stroke-width="2"/><path d="M45 528 L94 528" fill="none" stroke="#efc66e" stroke-width="4" marker-end="url(#m3-t8-arrow)"/><text x="106" y="535" fill="#efc66e" font-size="19" text-anchor="start">Centrífuga: radial</text><path d="M387 537 Q414 537 441 514" fill="none" stroke="#668098" stroke-width="5"/><path d="M427 541 L427 516" fill="none" stroke="#f49d78" stroke-width="2" marker-end="url(#m3-t8-arrow)"/><text x="459" y="535" fill="#f49d78" font-size="19" text-anchor="start">Flexión: dobla la pala</text></g></svg>