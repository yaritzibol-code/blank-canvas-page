<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="m3-t6-title m3-t6-desc">
<title id="m3-t6-title">Un cilindro, varios sistemas</title>
<desc id="m3-t6-desc">Esquema funcional de aire y combustible hacia un cilindro, chispa, circuito de aceite, enfriamiento exterior y gases de escape. Dos carriles separados distinguen magnetos a bujías y chispa, de batería a arranque eléctrico y giro del cigüeñal. La independencia de batería y alternador solo se refiere al ejemplo convencional con magnetos.</desc>
