<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="m5-t3-title m5-t3-desc">
<title id="m5-t3-title">Cómo dosifica un carburador</title>
<desc id="m5-t3-desc">Corte conceptual de carburador de flotador con aire descendente. La cuba contiene combustible; el flotador actúa sobre la válvula de entrada. La boquilla conecta combustible con la garganta del venturi. La mayor presión en la cuba respecto de la garganta impulsa el combustible. La mariposa está aguas abajo del venturi. Una ampliación muestra hielo estrechando garganta y mariposa, sin ajustes ni temperaturas operativas.</desc>
