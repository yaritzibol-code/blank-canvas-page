<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 494" role="img" aria-labelledby="m3-t4-title m3-t4-desc"><title id="m3-t4-title">Cuatro carreras, dos vueltas</title><desc id="m3-t4-desc">Secuencia ideal 0 a 720 grados: admisión con pistón descendente y admisión abierta; compresión ascendente con ambas válvulas cerradas; expansión descendente con ambas cerradas; escape ascendente con escape abierto. La chispa se ubica cerca del PMS de compresión. Una banda separada y cualitativa muestra traslape únicamente entre escape y admisión; no especifica grados de reglaje.</desc><defs><marker id="m3-t4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="760" height="494" rx="18" fill="#0b172a"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="28" y="38" fill="#e7eff6" font-size="25" text-anchor="start">Cuatro carreras, dos vueltas</text><text x="28" y="68" fill="#9bb0c8" font-size="19" text-anchor="start">Carreras ideales • dos vueltas del cigüeñal</text><rect x="32" y="88" width="166" height="226" rx="8" fill="#14243b" stroke="#334963" stroke-width="2"/><text x="115" y="116" fill="#e7eff6" font-size="21" text-anchor="middle">Admisión</text><path d="M72 255 V150 H158 V255" fill="none" stroke="#668098" stroke-width="4"/><rect x="75" y="219" width="80" height="20" rx="2" fill="#efc66e" stroke="#efc66e" stroke-width="2"/><path d="M115 239 L115 266" fill="none" stroke="#efc66e" stroke-width="5"/><path d="M89 133 L89 161" fill="none" stroke="#64d9e8" stroke-width="3"/><path d="M79 161 L99 161" fill="none" stroke="#64d9e8" stroke-width="4"/><path d="M141 133 L141 150" fill="none" stroke="#64d9e8" stroke-width="3"/><path d="M131 150 L151 150" fill="none" stroke="#64d9e8" stroke-width="4"/><path d="M174 193 L174 248" fill="none" stroke="#64d9e8" stroke-width="3" marker-end="url(#m3-t4-arrow)"/><path d="M54 141 H77 V189" fill="none" stroke="#64d9e8" stroke-width="2" marker-end="url(#m3-t4-arrow)"/><text x="115" y="294" fill="#9bb0c8" font-size="19" text-anchor="middle">0–180°</text><rect x="213" y="88" width="166" height="226" rx="8" fill="#14243b" stroke="#334963" stroke-width="2"/><text x="296" y="116" fill="#e7eff6" font-size="21" text-anchor="middle">Compresión</text><path d="M253 255 V150 H339 V255" fill="none" stroke="#668098" stroke-width="4"/><rect x="256" y="219" width="80" height="20" rx="2" fill="#efc66e" stroke="#efc66e" stroke-width="2"/><path d="M296 239 L296 266" fill="none" stroke="#efc66e" stroke-width="5"/><path d="M270 133 L270 150" fill="none" stroke="#64d9e8" stroke-width="3"/><path d="M260 150 L280 150" fill="none" stroke="#64d9e8" stroke-width="4"/><path d="M322 133 L322 150" fill="none" stroke="#64d9e8" stroke-width="3"/><path d="M312 150 L332 150" fill="none" stroke="#64d9e8" stroke-width="4"/><path d="M355 248 L355 193" fill="none" stroke="#64d9e8" stroke-width="3" marker-end="url(#m3-t4-arrow)"/><text x="296" y="294" fill="#9bb0c8" font-size="19" text-anchor="middle">180–360°</text><rect x="394" y="88" width="166" height="226" rx="8" fill="#14243b" stroke="#334963" stroke-width="2"/><text x="477" y="116" fill="#e7eff6" font-size="21" text-anchor="middle">Expansión</text><path d="M434 255 V150 H520 V255" fill="none" stroke="#668098" stroke-width="4"/><rect x="437" y="219" width="80" height="20" rx="2" fill="#efc66e" stroke="#efc66e" stroke-width="2"/><path d="M477 239 L477 266" fill="none" stroke="#efc66e" stroke-width="5"/><path d="M451 133 L451 150" fill="none" stroke="#64d9e8" stroke-width="3"/><path d="M441 150 L461 150" fill="none" stroke="#64d9e8" stroke-width="4"/><path d="M503 133 L503 150" fill="none" stroke="#64d9e8" stroke-width="3"/><path d="M493 150 L513 150" fill="none" stroke="#64d9e8" stroke-width="4"/><path d="M536 193 L536 248" fill="none" stroke="#64d9e8" stroke-width="3" marker-end="url(#m3-t4-arrow)"/><path d="M446 182 Q477 153 508 182" fill="none" stroke="#f49d78" stroke-width="3"/><path d="M477 185 L477 208" fill="none" stroke="#f49d78" stroke-width="3" marker-end="url(#m3-t4-arrow)"/><text x="477" y="294" fill="#9bb0c8" font-size="19" text-anchor="middle">360–540°</text><rect x="575" y="88" width="166" height="226" rx="8" fill="#14243b" stroke="#334963" stroke-width="2"/><text x="658" y="116" fill="#e7eff6" font-size="21" text-anchor="middle">Escape</text><path d="M615 255 V150 H701 V255" fill="none" stroke="#668098" stroke-width="4"/><rect x="618" y="219" width="80" height="20" rx="2" fill="#efc66e" stroke="#efc66e" stroke-width="2"/><path d="M658 239 L658 266" fill="none" stroke="#efc66e" stroke-width="5"/><path d="M632 133 L632 150" fill="none" stroke="#64d9e8" stroke-width="3"/><path d="M622 150 L642 150" fill="none" stroke="#64d9e8" stroke-width="4"/><path d="M684 133 L684 161" fill="none" stroke="#64d9e8" stroke-width="3"/><path d="M674 161 L694 161" fill="none" stroke="#64d9e8" stroke-width="4"/><path d="M717 248 L717 193" fill="none" stroke="#64d9e8" stroke-width="3" marker-end="url(#m3-t4-arrow)"/><path d="M683 192 V140 H720" fill="none" stroke="#f49d78" stroke-width="2" marker-end="url(#m3-t4-arrow)"/><text x="658" y="294" fill="#9bb0c8" font-size="19" text-anchor="middle">540–720°</text><text x="28" y="347" fill="#efc66e" font-size="20" text-anchor="start">Chispa: cerca del PMS de compresión (360°)</text><text x="28" y="375" fill="#9bb0c8" font-size="18" text-anchor="start">Válvulas reales: la apertura no coincide exactamente con cada carrera.</text><rect x="28" y="397" width="704" height="54" rx="5" fill="#0b172a" stroke="#334963" stroke-width="2"/><rect x="327" y="398" width="102" height="52" rx="1" fill="#344848" stroke="#344848" stroke-width="2"/><path d="M62 416 L410 416" fill="none" stroke="#f49d78" stroke-width="5"/><path d="M346 434 L696 434" fill="none" stroke="#64d9e8" stroke-width="5"/><path d="M378 389 L378 455" fill="none" stroke="#efc66e" stroke-width="2"/><text x="70" y="409" fill="#f49d78" font-size="16" text-anchor="start">Escape</text><text x="610" y="425" fill="#64d9e8" font-size="16" text-anchor="start">Admisión</text><text x="378" y="475" fill="#efc66e" font-size="18" text-anchor="middle">Traslape: PMS entre escape y admisión (720° / 0°)</text></g></svg>