<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="m5-t2-s2-title m5-t2-s2-desc"><title id="m5-t2-s2-title">El nombre no cuenta toda la historia</title><desc id="m5-t2-s2-desc">Etiqueta 100LL con aclaración de que LL no significa ausencia de plomo. Una muestra contiene agua y sedimentos en el fondo; otra línea contiene burbujas de vapor.</desc><defs><marker id="m5-t2-s2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="720" height="440" rx="18" fill="#0b172a"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="25" y="37" fill="#ecf3f9" font-size="25" text-anchor="start" font-weight="bold">El nombre no cuenta toda la historia</text><text x="25" y="65" fill="#a7bcd0" font-size="17" text-anchor="start" font-weight="normal">Grado, formulación y estado del combustible</text><rect x="24" y="90" width="325" height="290" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="40" y="119" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">Leer el nombre</text><rect x="81" y="151" width="213" height="86" rx="4" fill="#0b172a" stroke="#efc66e" stroke-width="2"/><text x="187" y="209" fill="#efc66e" font-size="40" text-anchor="middle" font-weight="normal">100LL</text><path d="M218 242V268H292" fill="none" stroke="#efc66e" stroke-width="2"/><text x="49" y="296" fill="#ecf3f9" font-size="17" text-anchor="start" font-weight="normal">LL: bajo contenido de plomo</text><text x="49" y="323" fill="#ff917d" font-size="18" text-anchor="start" font-weight="normal">No significa sin plomo.</text><text x="49" y="356" fill="#a7bcd0" font-size="17" text-anchor="start" font-weight="normal">La aprobación fija el uso.</text><rect x="371" y="90" width="325" height="290" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="387" y="119" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">Mirar más allá del grado</text><path d="M408 146V276H497V146" fill="none" stroke="#a7bcd0" stroke-width="4"/><rect x="413" y="202" width="79" height="70" rx="1" fill="#665635" stroke="#efc66e" stroke-width="2"/><rect x="413" y="259" width="79" height="13" rx="1" fill="#264a62" stroke="#64d9e8" stroke-width="2"/><circle cx="465" cy="273" r="3" fill="#ff917d" stroke="#ff917d" stroke-width="2"/><circle cx="439" cy="270" r="3" fill="#ff917d" stroke="#ff917d" stroke-width="2"/><text x="544" y="163" fill="#64d9e8" font-size="17" text-anchor="start" font-weight="normal">limpieza</text><path d="M533 167L485 259" fill="none" stroke="#64d9e8" stroke-width="2"/><path d="M536 237H663" fill="none" stroke="#a7bcd0" stroke-width="18"/><circle cx="578" cy="237" r="7" fill="#0b172a" stroke="#efc66e" stroke-width="2"/><circle cx="610" cy="237" r="9" fill="#0b172a" stroke="#efc66e" stroke-width="2"/><text x="594" y="281" fill="#efc66e" font-size="16" text-anchor="middle" font-weight="normal">vapor en línea</text><text x="403" y="328" fill="#ff917d" font-size="17" text-anchor="start" font-weight="normal">Color esperado ≠ pureza</text><text x="403" y="356" fill="#a7bcd0" font-size="15" text-anchor="start" font-weight="normal">También importan estabilidad</text><text x="403" y="377" fill="#a7bcd0" font-size="15" text-anchor="start" font-weight="normal">y volatilidad.</text><text x="360" y="420" fill="#a7bcd0" font-size="16" text-anchor="middle" font-weight="normal">Nombre, especificación y compatibilidad responden preguntas distintas.</text></g></svg>