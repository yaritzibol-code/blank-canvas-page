<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="m3-t2-s2-title m3-t2-s2-desc"><title id="m3-t2-s2-title">Un cierre que permite movimiento</title><desc id="m3-t2-s2-desc">Izquierda: anillos del pistón junto a la pared y la película de aceite, con presión encima y flecha de desplazamiento. Derecha: leva, varilla, balancín, resorte y válvula; relación de una vuelta de levas por dos de cigüeñal.</desc><defs><marker id="m3-t2-s2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="720" height="440" rx="18" fill="#0b172a"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="25" y="37" fill="#ecf3f9" font-size="25" text-anchor="start" font-weight="bold">Un cierre que permite movimiento</text><text x="25" y="65" fill="#a7bcd0" font-size="17" text-anchor="start" font-weight="normal">Dos mecanismos distintos dentro del motor</text><rect x="24" y="90" width="325" height="290" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="40" y="119" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">Anillos: sellar y deslizar</text><rect x="91" y="157" width="139" height="153" rx="3" fill="#0b172a" stroke="#a7bcd0" stroke-width="2"/><rect x="99" y="221" width="123" height="75" rx="2" fill="#14243b" stroke="#a7bcd0" stroke-width="2"/><path d="M98 233L223 233" fill="none" stroke="#efc66e" stroke-width="5"/><path d="M98 246L223 246" fill="none" stroke="#efc66e" stroke-width="5"/><path d="M98 266L223 266" fill="none" stroke="#efc66e" stroke-width="5"/><path d="M94 172L94 293" fill="none" stroke="#64d9e8" stroke-width="3"/><path d="M227 172L227 293" fill="none" stroke="#64d9e8" stroke-width="3"/><path d="M260 204L260 274" fill="none" stroke="#64d9e8" stroke-width="3" marker-end="url(#m3-t2-s2-arrow)"/><text x="247" y="301" fill="#64d9e8" font-size="16" text-anchor="start" font-weight="normal">desliza</text><text x="50" y="136" fill="#ff917d" font-size="17" text-anchor="start" font-weight="normal">presión de gases</text><path d="M157 163L157 211" fill="none" stroke="#ff917d" stroke-width="3" marker-end="url(#m3-t2-s2-arrow)"/><text x="50" y="339" fill="#efc66e" font-size="17" text-anchor="start" font-weight="normal">Anillos</text><path d="M111 332L146 268" fill="none" stroke="#efc66e" stroke-width="2"/><text x="165" y="364" fill="#64d9e8" font-size="16" text-anchor="middle" font-weight="normal">película de aceite</text><rect x="371" y="90" width="325" height="290" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="387" y="119" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">Válvulas: abrir a tiempo</text><path d="M396 317C386 295 409 278 421 284C438 260 455 279 448 295C453 320 427 341 405 335C392 331 392 325 396 317Z" fill="#0b172a" stroke="#efc66e" stroke-width="4"/><circle cx="421" cy="311" r="8" fill="#efc66e" stroke="#efc66e" stroke-width="2"/><path d="M430 290L436 261L470 182L535 170" fill="none" stroke="#efc66e" stroke-width="5"/><path d="M498 163L573 186" fill="none" stroke="#a7bcd0" stroke-width="7"/><path d="M551 180L551 253" fill="none" stroke="#64d9e8" stroke-width="4"/><path d="M530 253L572 253" fill="none" stroke="#64d9e8" stroke-width="5"/><path d="M538 197l26 8-26 8 26 8-26 8" fill="none" stroke="#a7bcd0" stroke-width="2"/><text x="473" y="135" fill="#efc66e" font-size="17" text-anchor="start" font-weight="normal">leva → balancín</text><text x="572" y="240" fill="#64d9e8" font-size="16" text-anchor="start" font-weight="normal">válvula</text><text x="391" y="361" fill="#ecf3f9" font-size="17" text-anchor="start" font-weight="normal">Levas 1 vuelta : cigüeñal 2</text><text x="360" y="418" fill="#a7bcd0" font-size="18" text-anchor="middle" font-weight="normal">El sellado contiene gases; la distribución decide cuándo pasan.</text></g></svg>