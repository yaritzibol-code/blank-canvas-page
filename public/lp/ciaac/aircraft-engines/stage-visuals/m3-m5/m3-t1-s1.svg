<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="m3-t1-s1-title m3-t1-s1-desc"><title id="m3-t1-s1-title">Del vaivén al giro</title><desc id="m3-t1-s1-desc">Corte de cilindro con pistón móvil, biela articulada y cigüeñal giratorio. La combustión produce trabajo, mientras parte de la energía sale como calor y escape.</desc><defs><marker id="m3-t1-s1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="720" height="440" rx="18" fill="#0b172a"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="25" y="37" fill="#ecf3f9" font-size="25" text-anchor="start" font-weight="bold">Del vaivén al giro</text><text x="25" y="65" fill="#a7bcd0" font-size="17" text-anchor="start" font-weight="normal">Alternativo = recíproco = motor de pistón</text><rect x="24" y="88" width="325" height="270" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="40" y="117" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">Vaivén dentro del cilindro</text><path d="M105 271V146H205V271" fill="none" stroke="#a7bcd0" stroke-width="4"/><rect x="109" y="206.0" width="92" height="20" rx="2" fill="#a7bcd0" stroke="#a7bcd0" stroke-width="2"/><path d="M125 123L125 146" fill="none" stroke="#64d9e8" stroke-width="4"/><path d="M116 146L134 146" fill="none" stroke="#64d9e8" stroke-width="5"/><path d="M185 123L185 146" fill="none" stroke="#ff917d" stroke-width="4"/><path d="M176 146L194 146" fill="none" stroke="#ff917d" stroke-width="5"/><path d="M150.0 160l11 10-10 0 10 11" fill="none" stroke="#efc66e" stroke-width="3"/><path d="M245 165L245 240" fill="none" stroke="#64d9e8" stroke-width="3" marker-end="url(#m3-t1-s1-arrow)"/><path d="M265 240L265 165" fill="none" stroke="#64d9e8" stroke-width="3" marker-end="url(#m3-t1-s1-arrow)"/><text x="277" y="207" fill="#ecf3f9" font-size="16" text-anchor="start" font-weight="normal">pistón</text><circle cx="166" cy="307" r="26" fill="#0b172a" stroke="#efc66e" stroke-width="2"/><path d="M155 226L181 292" fill="none" stroke="#efc66e" stroke-width="6"/><path d="M181 292L166 307" fill="none" stroke="#efc66e" stroke-width="6"/><path d="M191 287A36 36 0 0 1 193 329" fill="none" stroke="#efc66e" stroke-width="3" marker-end="url(#m3-t1-s1-arrow)"/><text x="47" y="343" fill="#efc66e" font-size="18" text-anchor="start" font-weight="normal">biela → cigüeñal → giro</text><rect x="371" y="88" width="325" height="270" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="387" y="117" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">La energía toma dos caminos</text><text x="392" y="139" fill="#ecf3f9" font-size="16" text-anchor="start" font-weight="normal">Combustión dentro de la cámara</text><path d="M526 151L526 184" fill="none" stroke="#ff917d" stroke-width="3" marker-end="url(#m3-t1-s1-arrow)"/><rect x="422" y="193" width="211" height="49" rx="8" fill="#0b172a" stroke="#efc66e" stroke-width="2"/><text x="528" y="224" fill="#efc66e" font-size="17" text-anchor="middle" font-weight="normal">trabajo sobre el pistón</text><path d="M499 247L425 286" fill="none" stroke="#efc66e" stroke-width="3" marker-end="url(#m3-t1-s1-arrow)"/><path d="M552 247L628 286" fill="none" stroke="#ff917d" stroke-width="3" marker-end="url(#m3-t1-s1-arrow)"/><text x="386" y="318" fill="#efc66e" font-size="17" text-anchor="start" font-weight="normal">potencia al eje</text><text x="560" y="318" fill="#ff917d" font-size="16" text-anchor="start" font-weight="normal">calor / escape</text><text x="360" y="404" fill="#a7bcd0" font-size="19" text-anchor="middle" font-weight="normal">Una hélice sola no identifica el tipo de motor.</text></g></svg>