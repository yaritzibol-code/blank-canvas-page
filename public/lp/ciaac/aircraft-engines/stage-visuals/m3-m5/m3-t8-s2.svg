<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="m3-t8-s2-title m3-t8-s2-desc"><title id="m3-t8-s2-title">Paso y revoluciones responden distinto</title><desc id="m3-t8-s2-desc">Arriba, trayectoria helicoidal ideal con flechas de avance geométrico y efectivo por vuelta. Debajo, rpm seleccionadas llegan al gobernador, que cambia el ángulo de pala. La variación de carga cambia las rpm del eje que realimentan al gobernador.</desc><defs><marker id="m3-t8-s2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="720" height="480" rx="18" fill="#0b172a"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="25" y="37" fill="#ecf3f9" font-size="25" text-anchor="start" font-weight="bold">Paso y revoluciones responden distinto</text><text x="25" y="65" fill="#a7bcd0" font-size="17" text-anchor="start" font-weight="normal">Esquemas conceptuales, sin una proporción universal</text><rect x="24" y="90" width="672" height="178" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="40" y="119" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">Una vuelta: geometría y avance real</text><path d="M73 157L625 157" fill="none" stroke="#a7bcd0" stroke-width="2"/><path d="M81 157C130 133 181 133 230 157S330 181 380 157" fill="none" stroke="#efc66e" stroke-width="3"/><path d="M82 227L380 227" fill="none" stroke="#efc66e" stroke-width="3" marker-end="url(#m3-t8-s2-arrow)"/><text x="231" y="252" fill="#efc66e" font-size="17" text-anchor="middle" font-weight="normal">paso geométrico</text><path d="M82 197L300 197" fill="none" stroke="#64d9e8" stroke-width="3" marker-end="url(#m3-t8-s2-arrow)"/><text x="210" y="184" fill="#64d9e8" font-size="17" text-anchor="middle" font-weight="normal">avance efectivo</text><text x="502" y="201" fill="#a7bcd0" font-size="17" text-anchor="middle" font-weight="normal">Diferencia:</text><text x="502" y="224" fill="#a7bcd0" font-size="17" text-anchor="middle" font-weight="normal">resbalamiento</text><rect x="24" y="281" width="672" height="150" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="40" y="310" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">Velocidad constante: cambiar carga</text><rect x="48" y="326" width="156" height="46" rx="8" fill="#0b172a" stroke="#64d9e8" stroke-width="2"/><text x="126" y="355" fill="#64d9e8" font-size="16" text-anchor="middle" font-weight="normal">rpm seleccionadas</text><path d="M215 349L278 349" fill="none" stroke="#64d9e8" stroke-width="3" marker-end="url(#m3-t8-s2-arrow)"/><rect x="288" y="319" width="135" height="58" rx="8" fill="#0b172a" stroke="#efc66e" stroke-width="2"/><text x="355" y="354" fill="#efc66e" font-size="17" text-anchor="middle" font-weight="normal">gobernador</text><path d="M434 349L493 349" fill="none" stroke="#efc66e" stroke-width="3" marker-end="url(#m3-t8-s2-arrow)"/><circle cx="550" cy="349" r="30" fill="#0b172a" stroke="#a7bcd0" stroke-width="2"/><path d="M532 369L566 329" fill="none" stroke="#64d9e8" stroke-width="9"/><text x="622" y="337" fill="#64d9e8" font-size="16" text-anchor="middle" font-weight="normal">ángulo</text><text x="622" y="361" fill="#64d9e8" font-size="16" text-anchor="middle" font-weight="normal">de pala</text><path d="M550 384V399H355V380" fill="none" stroke="#a7bcd0" stroke-width="2" marker-end="url(#m3-t8-s2-arrow)"/><text x="455" y="422" fill="#a7bcd0" font-size="16" text-anchor="middle">Carga → rpm del eje</text><text x="360" y="457" fill="#a7bcd0" font-size="18" text-anchor="middle" font-weight="normal">El gobernador regula dentro de límites; no añade potencia.</text></g></svg>