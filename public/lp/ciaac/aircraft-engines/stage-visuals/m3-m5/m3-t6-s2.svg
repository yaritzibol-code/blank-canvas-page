<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="m3-t6-s2-title m3-t6-s2-desc"><title id="m3-t6-s2-title">Dosificar la carga y encenderla</title><desc id="m3-t6-s2-desc">Comparación de dosificación por carburador antes del múltiple e inyección que dosifica cerca del cilindro; puntos de aire y combustible distinguen proporción de octanaje. Dos magnetos alimentan dos bujías, separados del circuito batería–arranque.</desc><defs><marker id="m3-t6-s2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="720" height="480" rx="18" fill="#0b172a"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="25" y="37" fill="#ecf3f9" font-size="25" text-anchor="start" font-weight="bold">Dosificar la carga y encenderla</text><text x="25" y="65" fill="#a7bcd0" font-size="17" text-anchor="start" font-weight="normal">Son funciones relacionadas, con circuitos diferentes</text><rect x="24" y="90" width="325" height="163" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="40" y="119" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">Dónde se dosifica</text><text x="41" y="144" fill="#64d9e8" font-size="17" text-anchor="start" font-weight="normal">Carburador</text><path d="M162 138L258 138" fill="none" stroke="#64d9e8" stroke-width="3" marker-end="url(#m3-t6-s2-arrow)"/><text x="41" y="173" fill="#a7bcd0" font-size="16" text-anchor="start" font-weight="normal">mezcla antes del múltiple</text><text x="41" y="207" fill="#efc66e" font-size="17" text-anchor="start" font-weight="normal">Inyección</text><path d="M150 201L258 201" fill="none" stroke="#efc66e" stroke-width="3" marker-end="url(#m3-t6-s2-arrow)"/><text x="41" y="235" fill="#a7bcd0" font-size="16" text-anchor="start" font-weight="normal">dosifica cerca del cilindro</text><rect x="275" y="122" width="53" height="100" rx="4" fill="#0b172a" stroke="#a7bcd0" stroke-width="2"/><rect x="371" y="90" width="325" height="163" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="387" y="119" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">Proporción ≠ octanaje</text><circle cx="410" cy="143" r="4" fill="#64d9e8" stroke="#64d9e8" stroke-width="1"/><circle cx="434" cy="143" r="4" fill="#64d9e8" stroke="#64d9e8" stroke-width="1"/><circle cx="458" cy="143" r="4" fill="#64d9e8" stroke="#64d9e8" stroke-width="1"/><circle cx="482" cy="143" r="4" fill="#64d9e8" stroke="#64d9e8" stroke-width="1"/><circle cx="410" cy="175" r="4" fill="#efc66e" stroke="#efc66e" stroke-width="1"/><circle cx="434" cy="175" r="4" fill="#efc66e" stroke="#efc66e" stroke-width="1"/><text x="527" y="149" fill="#64d9e8" font-size="17" text-anchor="start" font-weight="normal">aire</text><text x="527" y="181" fill="#efc66e" font-size="17" text-anchor="start" font-weight="normal">combustible</text><text x="392" y="232" fill="#ecf3f9" font-size="16" text-anchor="start" font-weight="normal">Octanaje: resistencia a detonación</text><rect x="24" y="273" width="672" height="182" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="40" y="302" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">Magnetos y arranque convencional</text><circle cx="79" cy="341" r="24" fill="#0b172a" stroke="#efc66e" stroke-width="2"/><circle cx="79" cy="410" r="24" fill="#0b172a" stroke="#efc66e" stroke-width="2"/><text x="79" y="347" fill="#efc66e" font-size="16" text-anchor="middle" font-weight="normal">M1</text><text x="79" y="416" fill="#efc66e" font-size="16" text-anchor="middle" font-weight="normal">M2</text><path d="M106 341L238 341" fill="none" stroke="#efc66e" stroke-width="3" marker-end="url(#m3-t6-s2-arrow)"/><path d="M106 410L238 410" fill="none" stroke="#efc66e" stroke-width="3" marker-end="url(#m3-t6-s2-arrow)"/><rect x="251" y="326" width="55" height="97" rx="3" fill="#0b172a" stroke="#a7bcd0" stroke-width="2"/><path d="M264 343l9 12-10-1 9 10M289 398l8 11-9 0 8 11" fill="none" stroke="#efc66e" stroke-width="3"/><text x="161" y="385" fill="#a7bcd0" font-size="17" text-anchor="middle" font-weight="normal">2 bujías</text><rect x="379" y="329" width="84" height="50" rx="4" fill="#0b172a" stroke="#64d9e8" stroke-width="2"/><text x="421" y="359" fill="#64d9e8" font-size="17" text-anchor="middle" font-weight="normal">batería</text><path d="M477 354L535 354" fill="none" stroke="#64d9e8" stroke-width="3" marker-end="url(#m3-t6-s2-arrow)"/><circle cx="576" cy="354" r="31" fill="#0b172a" stroke="#64d9e8" stroke-width="2"/><text x="576" y="359" fill="#64d9e8" font-size="16" text-anchor="middle" font-weight="normal">arr.</text><text x="514" y="426" fill="#a7bcd0" font-size="17" text-anchor="middle" font-weight="normal">giro para arrancar</text></g></svg>