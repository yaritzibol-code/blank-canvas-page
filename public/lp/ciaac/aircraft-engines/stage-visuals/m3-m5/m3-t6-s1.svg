<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 444" role="img" aria-labelledby="m3-t6-s1-title m3-t6-s1-desc"><title id="m3-t6-s1-title">Dos circuitos, dos funciones</title><desc id="m3-t6-s1-desc">Arriba, flechas de aire cruzan un filtro y un conducto de admisión hasta el cilindro. Abajo, una conducción independiente une una bomba de vacío conceptual con un instrumento.</desc><defs><marker id="m3-t6-s1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="720" height="444" rx="18" fill="#0b172a"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="25" y="37" fill="#ecf3f9" font-size="25" text-anchor="start" font-weight="bold">Dos circuitos, dos funciones</text><text x="25" y="65" fill="#a7bcd0" font-size="17" text-anchor="start" font-weight="normal">Compartir la palabra «succión» no los conecta</text><rect x="24" y="90" width="672" height="204" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="40" y="119" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">Inducción: aire hacia el cilindro</text><path d="M47 175H259L309 193H533M47 226H259L309 211H533" fill="none" stroke="#a7bcd0" stroke-width="5"/><rect x="117" y="177" width="29" height="47" rx="2" fill="#0b172a" stroke="#64d9e8" stroke-width="2"/><path d="M120 182L143 182" fill="none" stroke="#64d9e8" stroke-width="2"/><path d="M120 191L143 191" fill="none" stroke="#64d9e8" stroke-width="2"/><path d="M120 200L143 200" fill="none" stroke="#64d9e8" stroke-width="2"/><path d="M120 209L143 209" fill="none" stroke="#64d9e8" stroke-width="2"/><path d="M120 218L143 218" fill="none" stroke="#64d9e8" stroke-width="2"/><text x="130" y="151" fill="#64d9e8" font-size="17" text-anchor="middle" font-weight="normal">filtro</text><path d="M55 201L104 201" fill="none" stroke="#64d9e8" stroke-width="3" marker-end="url(#m3-t6-s1-arrow)"/><path d="M159 201L237 201" fill="none" stroke="#64d9e8" stroke-width="3" marker-end="url(#m3-t6-s1-arrow)"/><path d="M329 201L463 201" fill="none" stroke="#64d9e8" stroke-width="3" marker-end="url(#m3-t6-s1-arrow)"/><path d="M533 252V168H630V252" fill="none" stroke="#a7bcd0" stroke-width="4"/><rect x="537" y="221.76" width="89" height="20" rx="2" fill="#a7bcd0" stroke="#a7bcd0" stroke-width="2"/><path d="M581.5 241.76L581.5 287" fill="none" stroke="#efc66e" stroke-width="6"/><path d="M553 145L553 177" fill="none" stroke="#64d9e8" stroke-width="4"/><path d="M544 177L562 177" fill="none" stroke="#64d9e8" stroke-width="5"/><path d="M610 145L610 168" fill="none" stroke="#ff917d" stroke-width="4"/><path d="M601 168L619 168" fill="none" stroke="#ff917d" stroke-width="5"/><text x="290" y="269" fill="#ecf3f9" font-size="18" text-anchor="middle" font-weight="normal">La diferencia de presión impulsa el flujo.</text><rect x="24" y="314" width="672" height="104" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="40" y="343" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">Otro circuito: vacío de instrumentos</text><circle cx="106" cy="380" r="20" fill="#0b172a" stroke="#a7bcd0" stroke-width="2"/><path d="M106 380L115 368" fill="none" stroke="#efc66e" stroke-width="3"/><path d="M130 380L342 380" fill="none" stroke="#a7bcd0" stroke-width="3"/><circle cx="369" cy="380" r="20" fill="#0b172a" stroke="#a7bcd0" stroke-width="2"/><text x="407" y="386" fill="#a7bcd0" font-size="18" text-anchor="start" font-weight="normal">No alimenta los cilindros.</text></g></svg>