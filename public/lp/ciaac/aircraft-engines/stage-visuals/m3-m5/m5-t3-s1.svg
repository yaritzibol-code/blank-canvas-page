<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 481" role="img" aria-labelledby="m5-t3-s1-title m5-t3-s1-desc"><title id="m5-t3-s1-title">Venturi: aire rápido, presión menor</title><desc id="m5-t3-s1-desc">Un conducto se estrecha en un venturi. Una cuba con combustible conecta por una boquilla al cuello; una flecha muestra combustible subiendo y gotas incorporadas al aire. Las flechas de aire siguen hasta la salida.</desc><defs><marker id="m5-t3-s1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="720" height="481" rx="18" fill="#0b172a"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="25" y="37" fill="#ecf3f9" font-size="25" text-anchor="start" font-weight="bold">Venturi: aire rápido, presión menor</text><text x="25" y="65" fill="#a7bcd0" font-size="17" text-anchor="start" font-weight="normal">Carburador de flotador • corte conceptual</text><rect x="24" y="90" width="672" height="319" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="40" y="119" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">La presión explica el paso del combustible</text><path d="M51 158H205L288 205H357L440 158H669M51 284H205L288 237H357L440 284H669" fill="none" stroke="#a7bcd0" stroke-width="5"/><path d="M57 221L178 221" fill="none" stroke="#64d9e8" stroke-width="4" marker-end="url(#m5-t3-s1-arrow)"/><path d="M286 221L359 221" fill="none" stroke="#64d9e8" stroke-width="4" marker-end="url(#m5-t3-s1-arrow)"/><path d="M444 221L645 221" fill="none" stroke="#64d9e8" stroke-width="4" marker-end="url(#m5-t3-s1-arrow)"/><text x="124" y="141" fill="#64d9e8" font-size="17" text-anchor="middle" font-weight="normal">entrada</text><text x="326" y="141" fill="#64d9e8" font-size="17" text-anchor="middle" font-weight="normal">venturi</text><path d="M112 160V126M325 204V170" fill="none" stroke="#64d9e8" stroke-width="2"/><text x="451" y="320" fill="#efc66e" font-size="17" text-anchor="start" font-weight="normal">gotas → evaporación</text><rect x="130" y="321" width="160" height="69" rx="4" fill="#0b172a" stroke="#a7bcd0" stroke-width="2"/><rect x="134" y="349" width="152" height="37" rx="1" fill="#665635" stroke="#efc66e" stroke-width="2"/><path d="M286 366H324V232" fill="none" stroke="#efc66e" stroke-width="6"/><path d="M324 314L324 244" fill="none" stroke="#efc66e" stroke-width="3" marker-end="url(#m5-t3-s1-arrow)"/><circle cx="347" cy="219" r="4" fill="#efc66e" stroke="#efc66e" stroke-width="1"/><circle cx="363" cy="219" r="4" fill="#efc66e" stroke="#efc66e" stroke-width="1"/><circle cx="379" cy="219" r="4" fill="#efc66e" stroke="#efc66e" stroke-width="1"/><circle cx="395" cy="219" r="4" fill="#efc66e" stroke="#efc66e" stroke-width="1"/><text x="153" y="316" fill="#efc66e" font-size="17" text-anchor="start" font-weight="normal">cuba</text><text x="391" y="365" fill="#ecf3f9" font-size="17" text-anchor="start" font-weight="normal">Menor presión en el cuello:</text><text x="391" y="392" fill="#ecf3f9" font-size="17" text-anchor="start" font-weight="normal">combustible hacia la boquilla.</text><text x="360" y="453" fill="#a7bcd0" font-size="18" text-anchor="middle" font-weight="normal">En el estrechamiento: mayor velocidad, menor presión estática.</text></g></svg>