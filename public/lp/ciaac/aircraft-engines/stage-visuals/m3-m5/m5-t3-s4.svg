<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 457" role="img" aria-labelledby="m5-t3-s4-title m5-t3-s4-desc"><title id="m5-t3-s4-title">Densidad y hielo cambian la alimentación</title><desc id="m5-t3-s4-desc">Izquierda: dos volúmenes de aire con distinto número de puntos y el mismo número de gotas de combustible, ilustrando enriquecimiento si baja masa de aire sin compensación. Derecha: hielo adherido al venturi estrecha el paso del flujo.</desc><defs><marker id="m5-t3-s4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="720" height="457" rx="18" fill="#0b172a"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="25" y="37" fill="#ecf3f9" font-size="25" text-anchor="start" font-weight="bold">Densidad y hielo cambian la alimentación</text><text x="25" y="65" fill="#a7bcd0" font-size="17" text-anchor="start" font-weight="normal">Dos causas distintas: proporción y obstrucción</text><rect x="24" y="90" width="325" height="300" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="40" y="119" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">Menos aire sin compensación</text><rect x="50" y="154" width="122" height="110" rx="4" fill="#0b172a" stroke="#64d9e8" stroke-width="2"/><rect x="203" y="154" width="122" height="110" rx="4" fill="#0b172a" stroke="#64d9e8" stroke-width="2"/><circle cx="70" cy="175" r="4" fill="#64d9e8" stroke="#64d9e8" stroke-width="1"/><circle cx="96" cy="175" r="4" fill="#64d9e8" stroke="#64d9e8" stroke-width="1"/><circle cx="122" cy="175" r="4" fill="#64d9e8" stroke="#64d9e8" stroke-width="1"/><circle cx="148" cy="175" r="4" fill="#64d9e8" stroke="#64d9e8" stroke-width="1"/><circle cx="70" cy="204" r="4" fill="#64d9e8" stroke="#64d9e8" stroke-width="1"/><circle cx="96" cy="204" r="4" fill="#64d9e8" stroke="#64d9e8" stroke-width="1"/><