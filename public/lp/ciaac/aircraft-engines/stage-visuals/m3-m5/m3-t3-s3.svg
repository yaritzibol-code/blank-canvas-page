<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="m3-t3-s3-title m3-t3-s3-desc"><title id="m3-t3-s3-title">Cilindros respecto del cigüeñal</title><desc id="m3-t3-s3-desc">Esquemas de una fila en línea vista lateralmente, dos bancadas en V vistas frontalmente y cilindros opuestos vistos de frente. En cada uno se marca el cigüeñal común.</desc><defs><marker id="m3-t3-s3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="720" height="440" rx="18" fill="#0b172a"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="25" y="37" fill="#ecf3f9" font-size="25" text-anchor="start" font-weight="bold">Cilindros respecto del cigüeñal</text><text x="25" y="65" fill="#a7bcd0" font-size="17" text-anchor="start" font-weight="normal">Fija la vista antes de comparar</text><rect x="24" y="90" width="215" height="280" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="40" y="119" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">En línea · lateral</text><rect x="253" y="90" width="215" height="280" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="269" y="119" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">En V · frontal</text><rect x="482" y="90" width="214" height="280" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="498" y="119" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">Opuestos · frontal</text><rect x="55" y="176" width="31" height="68" rx="2" fill="#0b172a" stroke="#64d9e8" stroke-width="2"/><path d="M70 244L70 281" fill="none" stroke="#efc66e" stroke-width="4"/><rect x="103" y="176" width="31" height="68" rx="2" fill="#0b172a" stroke="#64d9e8" stroke-width="2"/><path d="M118 244L118 281" fill="none" stroke="#efc66e" stroke-width="4"/><rect x="151" y="176" width="31" height="68" rx="2" fill="#0b172a" stroke="#64d9e8" stroke-width="2"/><path d="M166 244L166 281" fill="none" stroke="#efc66e" stroke-width="4"/><path d="M46 281L204 281" fill="none" stroke="#efc66e" stroke-width="6"/><text x="131" y="335" fill="#a7bcd0" font-size="16" text-anchor="middle" font-weight="normal">Una fila longitudinal</text><g transform="translate(360 285) rotate(-33)"><rect x="-18" y="-116" width="36" height="75" rx="2" fill="#0b172a" stroke="#64d9e8" stroke-width="2"/><path d="M0 -41L0 0" fill="none" stroke="#efc66e" stroke-width="4"/></g><g transform="translate(360 285) rotate(33)"><rect x="-18" y="-116" width="36" height="75" rx="2" fill="#0b172a" stroke="#64d9e8" stroke-width="2"/><path d="M0 -41L0 0" fill="none" stroke="#efc66e" stroke-width="4"/></g><circle cx="360" cy="285" r="12" fill="#0b172a" stroke="#efc66e" stroke-width="2"/><text x="360" y="335" fill="#a7bcd0" font-size="15" text-anchor="middle" font-weight="normal">Dos bancadas en ángulo</text><circle cx="590" cy="248" r="13" fill="#0b172a" stroke="#efc66e" stroke-width="2"/><rect x="500" y="229" width="42" height="38" rx="2" fill="#0b172a" stroke="#64d9e8" stroke-width="2"/><rect x="638" y="229" width="42" height="38" rx="2" fill="#0b172a" stroke="#64d9e8" stroke-width="2"/><path d="M542 248L576 248" fill="none" stroke="#efc66e" stroke-width="4"/><path d="M604 248L638 248" fill="none" stroke="#efc66e" stroke-width="4"/><text x="590" y="335" fill="#a7bcd0" font-size="15" text-anchor="middle" font-weight="normal">Bancadas enfrentadas</text><text x="360" y="414" fill="#efc66e" font-size="19" text-anchor="middle" font-weight="normal">Dorado: el cigüeñal que comparte cada conjunto.</text></g></svg>