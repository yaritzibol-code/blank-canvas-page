<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 447" role="img" aria-labelledby="m3-t5-s3-title m3-t5-s3-desc"><title id="m3-t5-s3-title">De potencia indicada a potencia al freno</title><desc id="m3-t5-s3-desc">Un cilindro transmite movimiento a un eje conectado a un dinamómetro con carga. Una flecha separa pérdidas mecánicas antes de la medición al freno. Una placa independiente identifica potencia nominal como especificación de condiciones y límites.</desc><defs><marker id="m3-t5-s3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="720" height="447" rx="18" fill="#0b172a"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="25" y="37" fill="#ecf3f9" font-size="25" text-anchor="start" font-weight="bold">De potencia indicada a potencia al freno</text><text x="25" y="65" fill="#a7bcd0" font-size="17" text-anchor="start" font-weight="normal">Cilindro → pérdidas internas → eje bajo carga</text><rect x="24" y="90" width="672" height="244" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="40" y="119" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">Medir lo que llega al eje</text><path d="M66 215V151H134V215" fill="none" stroke="#a7bcd0" stroke-width="4"/><rect x="70" y="176.6" width="60" height="20" rx="2" fill="#a7bcd0" stroke="#a7bcd0" stroke-width="2"/><path d="M100.0 196.6L100.0 250" fill="none" stroke="#efc66e" stroke-width="6"/><path d="M86 128L86 151" fill="none" stroke="#64d9e8" stroke-width="4"/><path d="M77 151L95 151" fill="none" stroke="#64d9e8" stroke-width="5"/><path d="M114 128L114 151" fill="none" stroke="#ff917d" stroke-width="4"/><path d="M105 151L123 151" fill="none" stroke="#ff917d" stroke-width="5"/><path d="M100 250L415 250" fill="none" stroke="#efc66e" stroke-width="8"/><rect x="419" y="193" width="130" height="104" rx="6" fill="#0b172a" stroke="#a7bcd0" stroke-width="2"/><circle cx="484" cy="243" r="28" fill="#0b172a" stroke="#efc66e" stroke-width="4"/><text x="484" y="324" fill="#ecf3f9" font-size="17" text-anchor="middle" font-weight="normal">dinamómetro</text><path d="M221 238L221 164" fill="none" stroke="#ff917d" stroke-width="3" marker-end="url(#m3-t5-s3-arrow)"/><text x="212" y="143" fill="#ff917d" font-size="17" text-anchor="middle" font-weight="normal">pérdidas mecánicas</text><path d="M286 226L388 226" fill="none" stroke="#efc66e" stroke-width="3" marker-end="url(#m3-t5-s3-arrow)"/><text x="336" y="201" fill="#efc66e" font-size="18" text-anchor="middle" font-weight="normal">al freno</text><text x="601" y="217" fill="#ecf3f9" font-size="18" text-anchor="start" font-weight="normal">carga</text><path d="M550 244L640 244L640 285" fill="none" stroke="#a7bcd0" stroke-width="4"/><rect x="616" y="283" width="48" height="26" rx="2" fill="#0b172a" stroke="#a7bcd0" stroke-width="2"/><rect x="24" y="351" width="672" height="72" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="46" y="380" fill="#64d9e8" font-size="20" text-anchor="start" font-weight="normal">Nominal: una especificación</text><text x="46" y="408" fill="#a7bcd0" font-size="17" text-anchor="start" font-weight="normal">Condiciones y límites declarados · no otra pérdida del balance</text></g></svg>