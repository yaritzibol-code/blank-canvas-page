<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="m3-t1-s4-title m3-t1-s4-desc"><title id="m3-t1-s4-title">Separa las capas de la descripción</title><desc id="m3-t1-s4-desc">Un motor esquemático de cuatro cilindros sirve de referencia a etiquetas independientes: movimiento alternativo, disposición de cilindros, cuatro tiempos, chispa y hélice de paso fijo.</desc><defs><marker id="m3-t1-s4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="720" height="440" rx="18" fill="#0b172a"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="25" y="37" fill="#ecf3f9" font-size="25" text-anchor="start" font-weight="bold">Separa las capas de la descripción</text><text x="25" y="65" fill="#a7bcd0" font-size="17" text-anchor="start" font-weight="normal">Ejemplo de ficha • esquema conceptual, no una instalación</text><rect x="24" y="90" width="672" height="292" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="40" y="119" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">Una ficha describe criterios distintos</text><circle cx="353" cy="239" r="30" fill="#0b172a" stroke="#efc66e" stroke-width="3"/><rect x="249" y="199" width="67" height="37" rx="2" fill="#0b172a" stroke="#64d9e8" stroke-width="2"/><path d="M282 217L353 217" fill="none" stroke="#efc66e" stroke-width="3"/><rect x="249" y="255" width="67" height="37" rx="2" fill="#0b172a" stroke="#64d9e8" stroke-width="2"/><path d="M282 273L353 273" fill="none" stroke="#efc66e" stroke-width="3"/><rect x="390" y="199" width="67" height="37" rx="2" fill="#0b172a" stroke="#64d9e8" stroke-width="2"/><path d="M423 217L353 217" fill="none" stroke="#efc66e" stroke-width="3"/><rect x="390" y="255" width="67" height="37" rx="2" fill="#0b172a" stroke="#64d9e8" stroke-width="2"/><path d="M423 273L353 273" fill="none" stroke="#efc66e" stroke-width="3"/><path d="M353 185L353 307" fill="none" stroke="#efc66e" stroke-width="5"/><text x="47" y="160" fill="#64d9e8" font-size="19" text-anchor="start" font-weight="normal">Alternativo</text><text x="47" y="186" fill="#a7bcd0" font-size="16" text-anchor="start" font-weight="normal">pistones de ida y vuelta</text><path d="M202 191L228 213" fill="none" stroke="#64d9e8" stroke-width="3" marker-end="url(#m3-t1-s4-arrow)"/><text x="450" y="150" fill="#64d9e8" font-size="19" text-anchor="start" font-weight="normal">4 cilindros opuestos</text><text x="450" y="176" fill="#a7bcd0" font-size="16" text-anchor="start" font-weight="normal">cantidad + disposición</text><path d="M527 185L496 209" fill="none" stroke="#64d9e8" stroke-width="3" marker-end="url(#m3-t1-s4-arrow)"/><text x="49" y="293" fill="#efc66e" font-size="19" text-anchor="start" font-weight="normal">4 tiempos</text><text x="49" y="319" fill="#a7bcd0" font-size="16" text-anchor="start" font-weight="normal">ciclo de trabajo</text><text x="482" y="297" fill="#efc66e" font-size="19" text-anchor="start" font-weight="normal">Chispa</text><text x="451" y="326" fill="#a7bcd0" font-size="16" text-anchor="start" font-weight="normal">modo de encendido</text><text x="359" y="362" fill="#ecf3f9" font-size="18" text-anchor="middle" font-weight="normal">Paso fijo → configuración de la hélice</text><text x="360" y="416" fill="#a7bcd0" font-size="18" text-anchor="middle" font-weight="normal">Cada criterio responde una pregunta, no fija la potencia.</text></g></svg>