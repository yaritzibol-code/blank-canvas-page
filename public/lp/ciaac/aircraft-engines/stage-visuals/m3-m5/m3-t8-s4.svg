<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 457" role="img" aria-labelledby="m3-t8-s4-title m3-t8-s4-desc"><title id="m3-t8-s4-title">La pala recibe varias cargas</title><desc id="m3-t8-s4-desc">Vista frontal de una pala con fuerza centrífuga hacia afuera y fuerza de resistencia al giro. Vista lateral con la pala curvada esquemáticamente por una fuerza de empuje.</desc><defs><marker id="m3-t8-s4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="720" height="457" rx="18" fill="#0b172a"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="25" y="37" fill="#ecf3f9" font-size="25" text-anchor="start" font-weight="bold">La pala recibe varias cargas</text><text x="25" y="65" fill="#a7bcd0" font-size="17" text-anchor="start" font-weight="normal">Flechas conceptuales de carga • deformación exagerada</text><rect x="24" y="91" width="325" height="298" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="40" y="120" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">Frente: cargas en el giro</text><circle cx="186" cy="269" r="24" fill="#0b172a" stroke="#efc66e" stroke-width="4"/><path d="M177 245C160 205 158 156 180 131C196 158 199 207 193 245Z" fill="#14243b" stroke="#64d9e8" stroke-width="2"/><path d="M185 218L185 117" fill="none" stroke="#efc66e" stroke-width="4" marker-end="url(#m3-t8-s4-arrow)"/><text x="46" y="147" fill="#efc66e" font-size="17" text-anchor="start" font-weight="normal">centrífuga</text><path d="M183 184L253 184" fill="none" stroke="#ff917d" stroke-width="4" marker-end="url(#m3-t8-s4-arrow)"/><text x="239" y="216" fill="#ff917d" font-size="16" text-anchor="start" font-weight="normal">resiste</text><text x="239" y="238" fill="#ff917d" font-size="16" text-anchor="start" font-weight="normal">el giro</text><path d="M177 220A50 50 0 0 0 136 266" fill="none" stroke="#a7bcd0" stroke-width="2" marker-end="url(#m3-t8-s4-arrow)"/><text x="178" y="347" fill="#a7bcd0" font-size="17" text-anchor="middle" font-weight="normal">Vista frontal</text><rect x="371" y="91" width="325" height="298" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="387" y="120" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">De lado: flexión por empuje</text><path d="M414 270L660 270" fill="none" stroke="#efc66e" stroke-width="6"/><circle cx="484" cy="270" r="19" fill="#0b172a" stroke="#efc66e" stroke-width="2"/><path d="M484 250Q489 208 519 159" fill="none" stroke="#64d9e8" stroke-width="10"/><path d="M506 194L588 194" fill="none" stroke="#64d9e8" stroke-width="4" marker-end="url(#m3-t8-s4-arrow)"/><text x="585" y="177" fill="#64d9e8" font-size="17" text-anchor="middle" font-weight="normal">empuje</text><path d="M464 156V244" fill="none" stroke="#a7bcd0" stroke-width="2" stroke-dasharray="6 6"/><text x="527" y="321" fill="#a7bcd0" font-size="17" text-anchor="middle" font-weight="normal">La carga tiende a</text><text x="527" y="344" fill="#a7bcd0" font-size="17" text-anchor="middle" font-weight="normal">flexionar la pala.</text><text x="360" y="431" fill="#a7bcd0" font-size="17" text-anchor="middle" font-weight="normal">También hay momentos que tienden a cambiar el ángulo de pala.</text></g></svg>