oke="#64d9e8" stroke-width="5"/><path d="M139 151L139 174" fill="none" stroke="#ff917d" stroke-width="4"/><path d="M130 174L148 174" fill="none" stroke="#ff917d" stroke-width="5"/><path d="M52 143L88 157" fill="none" stroke="#64d9e8" stroke-width="3" marker-end="url(#m3-t2-s4-arrow)"/><path d="M79 143L100 165" fill="none" stroke="#ff917d" stroke-width="5"/><path d="M79 165L100 143" fill="none" stroke="#ff917d" stroke-width="5"/><text x="126" y="330" fill="#ff917d" font-size="15" text-anchor="middle" font-weight="normal">entrada bloqueada</text><path d="M313 270V174H397V270" fill="none" stroke="#a7bcd0" stroke-width="4"/><rect x="317" y="236.4" width="76" height="20" rx="2" fill="#a7bcd0" stroke="#a7bcd0" stroke-width="2"/><path d="M355.0 256.4L355.0 305" fill="none" stroke="#efc66e" stroke-width="6"/><path d="M333 151L333 183" fill="none" stroke="#64d9e8" stroke-width="4"/><path d="M324 183L342 183" fill="none" stroke="#64d9e8" stroke-width="5"/><path d="M377 151L377 174" fill="none" stroke="#ff917d" stroke-width="4"/><path d="M368 174L386 174" fill="none" stroke="#ff917d" stroke-width="5"/><path d="M354 216L329 188L329 143" fill="none" stroke="#ff917d" stroke-width="3" marker-end="url(#m3-t2-s4-arrow)"/><text x="360" y="330" fill="#ff917d" font-size="15" text-anchor="middle" font-weight="normal">válvula sin sellar</text><circle cx="593" cy="222" r="62" fill="#0b172a" stroke="#a7bcd0" stroke-width="9"/><circle cx="593" cy="222" r="43" fill="#0b172a" stroke="#efc66e" stroke-width="7"/><path d="M568 178A50 50 0 0 1 637 244" fill="none" stroke="#64d9e8" stroke-width="7"/><path d="M550 258L565 246" fill="none" stroke="#ff917d" stroke-width="5"/><text x="594" y="314" fill="#ff917d" font-size="15" text-anchor="middle" font-weight="normal">película insuficiente</text><text x="594" y="339" fill="#ff917d" font-size="16" text-anchor="middle" font-weight="normal">más fricción</text><text x="360" y="415" fill="#a7bcd0" font-size="18" text-anchor="middle" font-weight="normal">Un síntoma puede tener varias causas: localiza la función.</text></g></svg>