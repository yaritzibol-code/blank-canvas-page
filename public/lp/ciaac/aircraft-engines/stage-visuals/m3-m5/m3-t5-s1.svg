<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="m3-t5-s1-title m3-t5-s1-desc"><title id="m3-t5-s1-title">Potencia: trabajo por unidad de tiempo</title><desc id="m3-t5-s1-desc">Izquierda: fuerza tangencial aplicada a un brazo de eje y flecha de giro. Derecha: diagrama conceptual presión–volumen con un área de trabajo del ciclo sombreada.</desc><defs><marker id="m3-t5-s1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="720" height="440" rx="18" fill="#0b172a"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="25" y="37" fill="#ecf3f9" font-size="25" text-anchor="start" font-weight="bold">Potencia: trabajo por unidad de tiempo</text><text x="25" y="65" fill="#a7bcd0" font-size="17" text-anchor="start" font-weight="normal">Rotación del eje y trabajo de los gases</text><rect x="24" y="90" width="325" height="288" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="40" y="119" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">En el eje: par y velocidad</text><path d="M85 251L273 251" fill="none" stroke="#efc66e" stroke-width="10"/><circle cx="151" cy="251" r="51" fill="#0b172a" stroke="#a7bcd0" stroke-width="3"/><path d="M151 251L151 200" fill="none" stroke="#efc66e" stroke-width="6"/><path d="M151 200L221 200" fill="none" stroke="#efc66e" stroke-width="4" marker-end="url(#m3-t5-s1-arrow)"/><text x="212" y="179" fill="#efc66e" font-size="16" text-anchor="start" font-weight="normal">fuerza</text><path d="M103 283A57 57 0 1 1 201 285" fill="none" stroke="#64d9e8" stroke-width="3" marker-end="url(#m3-t5-s1-arrow)"/><text x="183" y="337" fill="#ecf3f9" font-size="17" text-anchor="middle" font-weight="normal">P = par × velocidad angular</text><rect x="371" y="90" width="325" height="288" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="387" y="119" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">En el cilindro: indicada</text><path d="M421 315L653 315" fill="none" stroke="#a7bcd0" stroke-width="2" marker-end="url(#m3-t5-s1-arrow)"/><path d="M421 315L421 153" fill="none" stroke="#a7bcd0" stroke-width="2" marker-end="url(#m3-t5-s1-arrow)"/><path d="M622 292C551 287 483 245 456 213L456 159C493 215 555 256 622 275Z" fill="#553841" stroke="#ff917d" stroke-width="3"/><text x="534" y="259" fill="#efc66e" font-size="19" text-anchor="middle" font-weight="normal">trabajo</text><text x="543" y="344" fill="#a7bcd0" font-size="16" text-anchor="middle" font-weight="normal">volumen</text><text x="404" y="150" fill="#a7bcd0" font-size="16" text-anchor="start" font-weight="normal">presión</text><text x="360" y="418" fill="#a7bcd0" font-size="17" text-anchor="middle" font-weight="normal">Rpm solas no dan potencia; «indicada» describe dónde se calcula.</text></g></svg>