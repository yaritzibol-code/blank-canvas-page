<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 446" role="img" aria-labelledby="m5-t2-s4-title m5-t2-s4-desc"><title id="m5-t2-s4-title">Mezcla es proporción; grado es propiedad</title><desc id="m5-t2-s4-desc">Dos grupos muestran la misma cantidad ilustrativa de aire. Uno recibe más combustible y representa mezcla más rica; el otro recibe menos y representa mezcla más pobre. Ambos conservan el grado del producto almacenado.</desc><defs><marker id="m5-t2-s4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="720" height="446" rx="18" fill="#0b172a"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="25" y="37" fill="#ecf3f9" font-size="25" text-anchor="start" font-weight="bold">Mezcla es proporción; grado es propiedad</text><text x="25" y="65" fill="#a7bcd0" font-size="17" text-anchor="start" font-weight="normal">Conteos ilustrativos: no representan una relación operativa</text><rect x="24" y="90" width="325" height="218" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="40" y="119" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">Misma masa de aire</text><rect x="371" y="90" width="325" height="218" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="387" y="119" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">Misma masa de aire</text><circle cx="65" cy="155" r="4" fill="#64d9e8" stroke="#64d9e8" stroke-width="1"/><circle cx="97" cy="155" r="4" fill="#64d9e8" stroke="#64d9e8" stroke-width="1"/><circle cx="129" cy="155" r="4" fill="#64d9e8" stroke="#64d9e8" stroke-width="1"/><circle cx="161" cy="155" r="4" fill="#64d9e8" stroke="#64d9e8" stroke-width="1"/><circle cx="193" cy="155" r="4" fill="#64d9e8" stroke="#64d9e8" stroke-width="1"/><circle cx="225" cy="155" r="4" fill="#64d9e8" stroke="#64d9e8" stroke-width="1"