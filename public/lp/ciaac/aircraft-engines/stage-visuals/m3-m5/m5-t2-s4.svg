ill="#efc66e" stroke="#efc66e" stroke-width="1"/><circle cx="188" cy="240" r="4" fill="#efc66e" stroke="#efc66e" stroke-width="1"/><circle cx="223" cy="240" r="4" fill="#efc66e" stroke="#efc66e" stroke-width="1"/><circle cx="258" cy="240" r="4" fill="#efc66e" stroke="#efc66e" stroke-width="1"/><circle cx="458" cy="240" r="4" fill="#efc66e" stroke="#efc66e" stroke-width="1"/><circle cx="503" cy="240" r="4" fill="#efc66e" stroke="#efc66e" stroke-width="1"/><circle cx="548" cy="240" r="4" fill="#efc66e" stroke="#efc66e" stroke-width="1"/><text x="187" y="288" fill="#efc66e" font-size="17" text-anchor="middle" font-weight="normal">más combustible → más rica</text><text x="534" y="288" fill="#efc66e" font-size="16" text-anchor="middle" font-weight="normal">menos combustible → más pobre</text><rect x="24" y="333" width="672" height="86" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="360" y="363" fill="#ecf3f9" font-size="20" text-anchor="middle" font-weight="normal">El producto del tanque conserva su grado.</text><text x="360" y="394" fill="#a7bcd0" font-size="16" text-anchor="middle" font-weight="normal">Cambiar proporción no elimina agua ni vuelve aprobado otro combustible.</text></g></svg>