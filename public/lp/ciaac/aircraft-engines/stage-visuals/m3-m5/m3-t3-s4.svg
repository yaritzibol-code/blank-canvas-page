<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="m3-t3-s4-title m3-t3-s4-desc"><title id="m3-t3-s4-title">Un radial puede tener varias filas</title><desc id="m3-t3-s4-desc">Dos estrellas de siete cilindros separadas y conectadas por el eje del mismo motor. Una flecha indica profundidad y la suma siete más siete da catorce cilindros.</desc><defs><marker id="m3-t3-s4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="720" height="440" rx="18" fill="#0b172a"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="25" y="37" fill="#ecf3f9" font-size="25" text-anchor="start" font-weight="bold">Un radial puede tener varias filas</text><text x="25" y="65" fill="#a7bcd0" font-size="17" text-anchor="start" font-weight="normal">Vistas frontales separadas para mostrar profundidad</text><rect x="24" y="90" width="672" height="292" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="40" y="119" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">Dos estrellas del mismo motor</text><g opacity="1"><g transform="translate(197 228) rotate(0.0)"><rect x="-12" y="-80" width="24" height="42" rx="2" fill="#0b172a" stroke="#64d9e8" stroke-width="2"/><path d="M0 -38L0 -15" fill="none" stroke="#efc66e" stroke-width="3"/></g><g transform="translate(197 228) rotate(51.42857142857143)"><rect x="-12" y="-80" width="24" height="42" rx="2" fill="#0b172a" stroke="#64d9e8" stroke-width="2"/><path d="M0 -38L0 -15" fill="none" stroke="#efc66e" stroke-width="3"/></g><g transform="translate(197 228) rotate(102.85714285714286)"><rect x="-12" y="-80" width="24" height="42" rx="2" fill="#0b172a" stroke="#64d9e8" stroke-width="2"/><path d="M0 -38L0 -15" fill="none" stroke="#efc66e" stroke-width="3"/></g><g transform="translate(197 228) rotate(154.28571428571428)"><re