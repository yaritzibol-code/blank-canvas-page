<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="m5-t1-s3-title m5-t1-s3-desc"><title id="m5-t1-s3-title">Dos formas de mantener alimentación</title><desc id="m5-t1-s3-desc">Izquierda: tanque elevado entrega combustible por una línea descendente al motor. Derecha: tanque y bomba en el recorrido con filtro; el combustible avanza por presión.</desc><defs><marker id="m5-t1-s3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="720" height="480" rx="18" fill="#0b172a"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="25" y="37" fill="#ecf3f9" font-size="25" text-anchor="start" font-weight="bold">Dos formas de mantener alimentación</text><text x="25" y="65" fill="#a7bcd0" font-size="17" text-anchor="start" font-weight="normal">La fuente de presión es distinta del dosificador</text><rect x="24" y="89" width="325" height="281" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="40" y="118" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">Gravedad: importa la altura</text><rect x="65" y="144" width="113" height="66" rx="5" fill="#0b172a" stroke="#a7bcd0" stroke-width="2"/><rect x="68" y="170" width="107" height="36" rx="1" fill="#665635" stroke="#efc66e" stroke-width="2"/><path d="M122 211V283H245" fill="none" stroke="#efc66e" stroke-width="6"/><path d="M149 283L219 283" fill="none" stroke="#efc66e" stroke-width="3" marker-end="url(#m5-t1-s3-arrow)"/><rect x="250" y="256" width="63" height="52" rx="5" fill="#0b172a" stroke="#a7bcd0" stroke-width="2"/><text x="286" y="337" fill="#a7bcd0" font-size="17" text-anchor="middle" font-weight="normal">motor</text><path d="M199 170L199 280" fill="none" stroke="#a7bcd0" stroke-width="2"/><text x="208" y="225" fill="#a7bcd0" font-size="16" text-anchor="start" font-weight="normal">altura</text><text x="114" y="131" fill="#efc66e" font-size="17" text-anchor="middle" font-weight="normal">tanque</text><rect x="371" y="89" width="325" height="281" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="387" y="118" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">Presión: la bomba aporta</text><rect x="394" y="157" width="73" height="79" rx="5" fill="#0b172a" stroke="#a7bcd0" stroke-width="2"/><rect x="397" y="191" width="67" height="42" rx="1" fill="#665635" stroke="#efc66e" stroke-width="2"/><path d="M431 237V282H654" fill="none" stroke="#efc66e" stroke-width="6"/><circle cx="526" cy="282" r="23" fill="#0b172a" stroke="#64d9e8" stroke-width="3"/><path d="M517 269L541 282L517 295Z" fill="#64d9e8" stroke="#64d9e8" stroke-width="2"/><rect x="582" y="257" width="21" height="47" rx="2" fill="#0b172a" stroke="#a7bcd0" stroke-width="2"/><text x="526" y="333" fill="#64d9e8" font-size="17" text-anchor="middle" font-weight="normal">bomba</text><text x="601" y="240" fill="#a7bcd0" font-size="16" text-anchor="start" font-weight="normal">filtro</text><path d="M628 282L672 282" fill="none" stroke="#efc66e" stroke-width="3" marker-end="url(#m5-t1-s3-arrow)"/><rect x="24" y="389" width="672" height="67" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="360" y="417" fill="#ecf3f9" font-size="18" text-anchor="middle" font-weight="normal">Seleccionar fuente → filtrar → entregar → dosificar</text><text x="360" y="442" fill="#a7bcd0" font-size="16" text-anchor="middle" font-weight="normal">Las conexiones reales dependen de la instalación.</text></g></svg>