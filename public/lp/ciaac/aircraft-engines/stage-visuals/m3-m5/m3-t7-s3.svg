<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" role="img" aria-labelledby="m3-t7-s3-title m3-t7-s3-desc"><title id="m3-t7-s3-title">El lugar de la llama cambia el fenómeno</title><desc id="m3-t7-s3-desc">Dos recorridos separados de admisión, cilindro y escape. El primero sitúa una llama en la admisión; el segundo la sitúa en el escape.</desc><defs><marker id="m3-t7-s3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="720" height="490" rx="18" fill="#0b172a"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="25" y="37" fill="#ecf3f9" font-size="25" text-anchor="start" font-weight="bold">El lugar de la llama cambia el fenómeno</text><text x="25" y="65" fill="#a7bcd0" font-size="17" text-anchor="start" font-weight="normal">Dos casos independientes, no simultáneos</text><rect x="24" y="91" width="672" height="156" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="40" y="120" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">Retorno de llama por admisión</text><path d="M72 178H307M407 178H650" fill="none" stroke="#a7bcd0" stroke-width="22"/><rect x="310" y="148" width="96" height="64" rx="5" fill="#0b172a" stroke="#a7bcd0" stroke-width="2"/><rect x="322" y="186" width="72" height="18" rx="2" fill="#14243b" stroke="#a7bcd0" stroke-width="2"/><path d="M253 178L187 178" fill="none" stroke="#ff917d" stroke-width="3" marker-end="url(#m3-t7-s3-arrow)"/><path d="M470 178L539 178" fill="none" stroke="#ff917d" stroke-width="3" marker-end="url(#m3-t7-s3-arrow)"/><g transform="translate(110 175) scale(0.76)"><path d="M0 22C-19 9-11-3-8-13C-5-3 0-7 2-26C20-7 23 9 0 22Z" fill="#ff917d" stroke="#ff917d" stroke-width="2"/><path d="M0 17C-7 8-3 2 1-5C9 8 10 10 0 17Z" fill="#efc66e" stroke="#efc66e" stroke-width="1"/></g><text x="136" y="229" fill="#64d9e8" font-size="17" text-anchor="middle" font-weight="normal">admisión</text><text x="589" y="229" fill="#ff917d" font-size="17" text-anchor="middle" font-weight="normal">escape</text><rect x="24" y="270" width="672" height="156" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="40" y="299" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">Postcombustión en escape</text><path d="M72 357H307M407 357H650" fill="none" stroke="#a7bcd0" stroke-width="22"/><rect x="310" y="327" width="96" height="64" rx="5" fill="#0b172a" stroke="#a7bcd0" stroke-width="2"/><rect x="322" y="365" width="72" height="18" rx="2" fill="#14243b" stroke="#a7bcd0" stroke-width="2"/><path d="M187 357L253 357" fill="none" stroke="#64d9e8" stroke-width="3" marker-end="url(#m3-t7-s3-arrow)"/><path d="M470 357L539 357" fill="none" stroke="#ff917d" stroke-width="3" marker-end="url(#m3-t7-s3-arrow)"/><g transform="translate(599 354) scale(0.76)"><path d="M0 22C-19 9-11-3-8-13C-5-3 0-7 2-26C20-7 23 9 0 22Z" fill="#ff917d" stroke="#ff917d" stroke-width="2"/><path d="M0 17C-7 8-3 2 1-5C9 8 10 10 0 17Z" fill="#efc66e" stroke="#efc66e" stroke-width="1"/></g><text x="136" y="408" fill="#64d9e8" font-size="17" text-anchor="middle" font-weight="normal">admisión</text><text x="589" y="408" fill="#ff917d" font-size="17" text-anchor="middle" font-weight="normal">escape</text><text x="360" y="466" fill="#a7bcd0" font-size="17" text-anchor="middle" font-weight="normal">Localiza dónde arde el combustible antes de nombrar el fenómeno.</text></g></svg>