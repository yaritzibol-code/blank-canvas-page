<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="m5-t1-s4-title m5-t1-s4-desc"><title id="m5-t1-s4-title">Cantidad, presión y caudal no son lo mismo</title><desc id="m5-t1-s4-desc">Un tanque con nivel muestra cantidad; en la conducción, una toma lateral mide presión y un medidor en línea representa caudal. El flujo termina en el motor.</desc><defs><marker id="m5-t1-s4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="720" height="450" rx="18" fill="#0b172a"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="25" y="37" fill="#ecf3f9" font-size="25" text-anchor="start" font-weight="bold">Cantidad, presión y caudal no son lo mismo</text><text x="25" y="65" fill="#a7bcd0" font-size="17" text-anchor="start" font-weight="normal">Una lectura aislada no prueba buena combustión</text><rect x="24" y="90" width="672" height="223" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="40" y="119" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">Tres lecturas en lugares distintos</text><rect x="60" y="167" width="122" height="104" rx="4" fill="#0b172a" stroke="#a7bcd0" stroke-width="2"/><rect x="64" y="215" width="114" height="52" rx="1" fill="#665635" stroke="#efc66e" stroke-width="2"/><path d="M85 185L85 258" fill="none" stroke="#a7bcd0" stroke-width="2"/><path d="M78 216L94 216" fill="none" stroke="#64d9e8" stroke-width="3"/><text x="119" y="141" fill="#64d9e8" font-size="18" text-anchor="middle" font-weight="normal">cantidad</text><path d="M182 245H641" fill="none" stroke="#efc66e" stroke-width="6"/><path d="M262 245L312 245" fill="none" stroke="#efc66e" stroke-width="3" marker-end="url(#m5-t1-s4-arrow)"/><path d="M491 245L553 245" fill="none" stroke="#efc66e" stroke-width="3" marker-end="url(#m5-t1-s4-arrow)"/><path d="M345 245V215" fill="none" stroke="#64d9e8" stroke-width="3"/><circle cx="345" cy="190" r="25" fill="#0b172a" stroke="#64d9e8" stroke-width="2"/><path d="M345 190L359 177" fill="none" stroke="#64d9e8" stroke-width="3"/><text x="345" y="154" fill="#64d9e8" font-size="18" text-anchor="middle" font-weight="normal">presión</text><circle cx="465" cy="245" r="29" fill="#0b172a" stroke="#64d9e8" stroke-width="2"/><path d="M447 245H483M465 227V263" fill="none" stroke="#64d9e8" stroke-width="3"/><text x="465" y="300" fill="#64d9e8" font-size="17" text-anchor="middle" font-weight="normal">caudal: cantidad / tiempo</text><rect x="596" y="210" width="61" height="70" rx="4" fill="#0b172a" stroke="#a7bcd0" stroke-width="2"/><text x="610" y="190" fill="#a7bcd0" font-size="17" text-anchor="start" font-weight="normal">motor</text><rect x="24" y="333" width="672" height="91" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="40" y="362" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">Si se bloquea el venteo…</text><text x="46" y="398" fill="#ff917d" font-size="18" text-anchor="start" font-weight="normal">Puede quedar combustible y aun así dificultarse el suministro.</text></g></svg>