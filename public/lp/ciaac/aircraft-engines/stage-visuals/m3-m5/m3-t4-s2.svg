<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 485" role="img" aria-labelledby="m3-t4-s2-title m3-t4-s2-desc"><title id="m3-t4-s2-title">La chispa inicia; los gases hacen trabajo</title><desc id="m3-t4-s2-desc">Una línea temporal coloca la chispa antes del PMS de compresión y muestra propagación posterior. Debajo, un pistón baja por expansión con válvulas cerradas y otro sube expulsando gases por escape abierto.</desc><defs><marker id="m3-t4-s2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="720" height="485" rx="18" fill="#0b172a"/><g font-family="Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="25" y="37" fill="#ecf3f9" font-size="25" text-anchor="start" font-weight="bold">La chispa inicia; los gases hacen trabajo</text><text x="25" y="65" fill="#a7bcd0" font-size="17" text-anchor="start" font-weight="normal">No se asignan ángulos de encendido universales</text><rect x="24" y="89" width="672" height="102" rx="8" fill="#14243b" stroke="#36516d" stroke-width="2"/><text x="40" y="118" fill="#ecf3f9" font-size="20" text-anchor="start" font-weight="normal">La llama necesita tiempo</text><path d="M85 154L638 154" fill="none" stroke="#a7bcd0" stroke-width="3"/><path d="M241 134l-8 14 14-3-7 18" fill="none" stroke="#efc66e" stroke-width="3"/><text x="225" y="141" fill="#efc66e" font-size="17" text-anchor="middle" font-weight="normal">chispa prevista</text><path d="M349 133L349 171" fill="none" stroke="#ecf3f9" stroke-width="3"/><text x="411" y="128" fill="#ecf3f9" font-size="17" text-anchor="start" font-weight="normal">PMS de compresión</text><path d="M355 154L603 154" fill="none" stroke="#ff917d" stroke-width="3" marker-end="url(#m3-t4-s2-arrow)"/><text x="530" y="181" fill="#ff917d" font-size="16" text-anchor="middle" font-weight="normal">propagación y expansión</text><rect x="24" y="210" width="325" 