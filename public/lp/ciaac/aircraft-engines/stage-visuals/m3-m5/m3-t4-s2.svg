 282L492 282" fill="none" stroke="#ff917d" stroke-width="5"/><path d="M522 355L522 287" fill="none" stroke="#ff917d" stroke-width="3" marker-end="url(#m3-t4-s2-arrow)"/><path d="M481 292L483 250L596 250" fill="none" stroke="#ff917d" stroke-width="3" marker-end="url(#m3-t4-s2-arrow)"/><text x="554" y="321" fill="#ff917d" font-size="18" text-anchor="start" font-weight="normal">gases</text><text x="554" y="348" fill="#ff917d" font-size="18" text-anchor="start" font-weight="normal">al exterior</text><text x="360" y="459" fill="#a7bcd0" font-size="17" text-anchor="middle" font-weight="normal">Los tiempos reales de válvula se adaptan al flujo de gases.</text></g></svg>