t-size="15" fill="#ecc16c" text-anchor="start">TIPO</text><text x="285" y="308" font-size="18" fill="#e3ecf4" text-anchor="start">Identificar la planta</text><rect x="520" y="250" width="215" height="75" rx="10" fill="#172c43" stroke="#91a9bf" stroke-width="2"/><text x="532" y="276" font-size="15" fill="#ecc16c" text-anchor="start">POSICIÓN</text><text x="532" y="308" font-size="18" fill="#e3ecf4" text-anchor="start">Mirar la instalación</text><text x="24" y="370" font-size="17" fill="#91a9bf" text-anchor="start">No deduzcas potencia ni prestaciones solamente de la cantidad de motores.</text></g></svg>