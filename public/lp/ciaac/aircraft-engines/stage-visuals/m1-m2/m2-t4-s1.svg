<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="ae-m2-t4-s1-title ae-m2-t4-s1-desc"><title id="ae-m2-t4-s1-title">El plano horizontal gobierna el cabeceo</title><desc id="ae-m2-t4-s1-desc">Vista lateral de un avión y señal de cabeceo. Corte conceptual del conjunto horizontal distingue la parte fija y el elevador móvil; no muestra una respuesta a escala.</desc><rect width="760" height="390" rx="18" fill="#0b182b"/><g font-family="Arial,sans-serif"><text x="24" y="36" font-size="24" fill="#e3ecf4" text-anchor="start">El plano horizontal gobierna el cabeceo</text><g transform="translate(245 177) scale(1.65)"><path d="M-90 0L90 0L72 -9L-40 -12L-65 -42H-78L-68 -8Z" stroke="#e3ecf4" stroke-width="2" fill="#91a9bf"/><path d="M-18 -5L35 -38H48L17 -3L50 21H35L-9 3Z" stroke="#e3ecf4" stroke-width="2" fill="#91a9bf"/></g><path d="M124 151L173 151L173 165L124 165Z" stroke="#60d6e1" stroke-width="3" fill="#60d6e1"/><text x="168" y="86" font-size="19" fill="#60d6e1" text-anchor="middle">Plano horizontal</text><path d="M168 94L149 147" stroke="#60d6e1" stroke-width="2" fill="none"/><path d="M270 259Q365 222 338 143" stroke="#ecc16c" stroke-width="4" fill="none"/><path d="M338 143L321 126" stroke="#ecc16c" stroke-width="3" fill="none"/><path d="M321 126L325.2426406871193 138.72792206135787L333.72792206135784 130.2426406871193Z" stroke="#ecc16c" stroke-width="1" fill="#ecc16c"/><text x="363" y="276" font-size="21" fill="#ecc16c" text-anchor="start">Cabeceo</text><rect x="462" y="99" width="264" height="213" rx="10" fill="#172c43" stroke="#91a9bf" stroke-width="2"/><text x="594" y="137" font-size="22" fill="#e3ecf4" text-anchor="middle">Fijo y móvil</text><path d="M490 205H620V223H490Z" stroke="#91a9bf" stroke-width="3" fill="#172c43"/><path d="M620 205L685 173L696 190L620 223Z" stroke="#60d6e1" stroke-width="3" fill="#60d6e1"/><circle cx="620" cy="214" r="5" fill="#ecc16c" stroke="#ecc16c" stroke-width="3"/><text x="