<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="ae-m2-t2-s2-title ae-m2-t2-s2-desc"><title id="ae-m2-t2-s2-title">Pregunta qué elemento lleva la carga</title><desc id="ae-m2-t2-s2-desc">Triángulos de una armadura forman caminos resistentes. La cubierta puede dar forma y protección; una superficie lisa no prueba que sea piel resistente.</desc><rect width="760" height="390" rx="18" fill="#0b182b"/><g font-family="Arial,sans-serif"><text x="24" y="36" font-size="24" fill="#e3ecf4" text-anchor="start">Pregunta qué elemento lleva la carga</text><text x="28" y="87" font-size="20" fill="#ecc16c" text-anchor="start">Armadura: los tubos transmiten cargas</text><rect x="46" y="126" width="312" height="128" rx="2" fill="none" stroke="#91a9bf" stroke-width="2"/><path d="M46 254L124 126L202 254L280 126L358 254M46 126L124 254L202 126L280 254L358 126" stroke="#ecc16c" stroke-width="4" fill="none"/><path d="M15 185L84 185" stroke="#60d6e1" stroke-width="3" fill="none"/><path d="M84 185L72.0 179.0L72.0 191.0Z" stroke="#60d6e1" stroke-width="1" fill="#60d6e1"/><path d="M322 185L389 185" stroke="#60d6e1" stroke-width="3" fill="none"/><path d="M389 185L377.0 179.0L377.0 191.0Z" stroke="#60d6e1" stroke-width="1" fill="#60d6e1"/><rect x="421" y="120" width="286" height="137" rx="10" fill="none" stroke="#91a9bf" stroke-width="2"/><path d="M434 133H694V244H434Z" stroke="#91a9bf" stroke-width="2" fill="none" stroke-dasharray="7 6"/><text x="564" y="168" font-size="22" fill="#e3ecf4" text-anchor="middle">Cubierta</text><text x="564" y="201" font-size="19" fill="#91a9bf" text-anchor="middle">Forma y protección</text><text x="199" y="294" font-size="20" fill="#e3ecf4" text-anchor="middle">Triangulación resistente</text><text x="566" y="294" font-size="17" fill="#e3ecf4" text-anchor="middle">Su función depende del diseño</text><text x="24" y="370" font-size="17" fill="#91a9bf" text-anchor="start">“Compuesta o armada” histórica no equivale automáticamente a fibra con resina.</text></g></svg>