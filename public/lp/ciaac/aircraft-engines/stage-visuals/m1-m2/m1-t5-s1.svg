<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="ae-m1-t5-s1-title ae-m1-t5-s1-desc"><title id="ae-m1-t5-s1-title">Clasifica por el medio de apoyo</title><desc id="ae-m1-t5-s1-desc">Un tren con ruedas contacta tierra; en hidrocanoa el casco del fuselaje contacta agua; en un hidroavión de flotadores los apoyos acuáticos son separados del fuselaje.</desc><rect width="760" height="390" rx="18" fill="#0b182b"/><g font-family="Arial,sans-serif"><text x="24" y="36" font-size="24" fill="#e3ecf4" text-anchor="start">Clasifica por el medio de apoyo</text><rect x="24" y="75" width="226" height="245" rx="10" fill="#172c43" stroke="#91a9bf" stroke-width="2"/><text x="137" y="109" font-size="22" fill="#e3ecf4" text-anchor="middle">Tierra</text><g transform="translate(137 164) scale(0.8)"><path d="M-90 0L90 0L72 -9L-40 -12L-65 -42H-78L-68 -8Z" stroke="#e3ecf4" stroke-width="2" fill="#91a9bf"/><path d="M-18 -5L35 -38H48L17 -3L50 21H35L-9 3Z" stroke="#e3ecf4" stroke-width="2" fill="#91a9bf"/></g><rect x="267" y="75" width="226" height="245" rx="10" fill="#172c43" stroke="#91a9bf" stroke-width="2"/><text x="380" y="109" font-size="22" fill="#e3ecf4" text-anchor="middle">Casco</text><g transform="translate(380 164) scale(0.8)"><path d="M-90 0L90 0L72 -9L-40 -12L-65 -42H-78L-68 -8Z" stroke="#e3ecf4" stroke-width="2" fill="#91a9bf"/><path d="M-18 -5L35 -38H48L17 -3L50 21H35L-9 3Z" stroke="#e3ecf4" stroke-width="2" fill="#91a9bf"/></g><rect x="510" y="75" width="226" height="245" rx="10" fill="#172c43" stroke="#91a9bf" stroke-width="2"/><text x="623" y="109" font-size="22" fill="#e3ecf4" text-anchor="middle">Flotadores</text><g transform="translate(623 164) scale(0.8)"><path d="M-90 0L90 0L72 -9L-40 -12L-65 -42H-78L-68 -8Z" stroke="#e3ecf4" stroke-width="2" fill="#91a9bf"/><path d="M-18 -5L35 -38H48L17 -3L50 21H35L-9 3Z" stroke="#e3ecf4" stroke-width="2" fill="#91a9bf"/></g><path d="M89 164V213M183 164V213" stroke="#91a9bf" stroke-width="4" fill="none"/><circle cx="89" cy="222" r="11" fill="none" stroke="#e3ecf4" stroke-width="3"/><circle cx="183" cy="222" r="11" fill="none" stroke="#e3ecf4" stroke-width="3"/><path d="M41 240H231" stroke="#91a9bf" stroke-width="3" fill="none"/><path d="M307 161L454 164Q447 193 429 211H332L307 185Z" stroke="#60d6e1" stroke-width="3" fill="#172c43"/><path d="M529 222H600L589 241H539ZM627 222H698L687 241H637Z" stroke="#60d6e1" stroke-width="3" fill="#172c43"/><path d="M550 168V222M661 168V222" stroke="#91a9bf" stroke-width="4" fill="none"/><path d="M283 246Q307 232 331 246T380 246T429 246T478 246" stroke="#60d6e1" stroke-width="2" fill="none"/><path d="M525 251Q549 237 573 251T622 251T671 251T720 251" stroke="#60d6e1" stroke-width="2" fill="none"/><text x="137" y="292" font-size="17" fill="#e3ecf4" text-anchor="middle">Ruedas</text><text x="380" y="292" font-size="17" fill="#e3ecf4" text-anchor="middle">Fuselaje como bote</text><text x="623" y="292" font-size="17" fill="#e3ecf4" text-anchor="middle">Apoyos separados</text><text x="24" y="370" font-size="17" fill="#91a9bf" text-anchor="start">Volar sobre agua no convierte un avión terrestre en hidroavión.</text></g></svg>