<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="ae-m1-t6-s1-title ae-m1-t6-s1-desc"><title id="ae-m1-t6-s1-title">Mira el cerramiento alrededor de los ocupantes</title><desc id="ae-m1-t6-s1-desc">Una cabina abierta puede tener parabrisas. Una cerrada tiene envolvente; la presencia de vidrio delante no basta para clasificarla como cerrada.</desc><rect width="760" height="390" rx="18" fill="#0b182b"/><g font-family="Arial,sans-serif"><text x="24" y="36" font-size="24" fill="#e3ecf4" text-anchor="start">Mira el cerramiento alrededor de los ocupantes</text><rect x="35" y="78" width="340" height="247" rx="10" fill="#172c43" stroke="#91a9bf" stroke-width="2"/><text x="205" y="114" font-size="23" fill="#e3ecf4" text-anchor="middle">Abierta</text><rect x="92" y="235" width="226" height="54" rx="10" fill="#172c43" stroke="#91a9bf" stroke-width="2"/><circle cx="205" cy="191" r="20" fill="none" stroke="#e3ecf4" stroke-width="3"/><path d="M205 212V262" stroke="#e3ecf4" stroke-width="5" fill="none"/><rect x="387" y="78" width="340" height="247" rx="10" fill="#172c43" stroke="#91a9bf" stroke-width="2"/><text x="557" y="114" font-size="23" fill="#e3ecf4" text-anchor="middle">Cerrada</text><rect x="444" y="235" width="226" height="54" rx="10" fill="#172c43" stroke="#91a9bf" stroke-width="2"/><circle cx="557" cy="191" r="20" fill="none" stroke="#e3ecf4" stroke-width="3"/><path d="M557 212V262" stroke="#e3ecf4" stroke-width="5" fill="none"/><path d="M95 235L114 164" stroke="#60d6e1" stroke-width="5" fill="none"/><text x="111" y="148" font-size="18" fill="#60d6e1" text-anchor="start">Parabrisas</text><path d="M447 235L470 145Q557 116 644 145L667 235" stroke="#60d6e1" stroke-width="5" fill="none"/><text x="557" y="309" font-size="17" fill="#e3ecf4" text-anchor="middle">Envolvente alrededor</text><text x="24" y="370" font-size="17" fill="#91a9bf" text-anchor="start">Abrir una puerta no cambia por sí solo el tipo constructivo de la cabina.</text></g></svg>