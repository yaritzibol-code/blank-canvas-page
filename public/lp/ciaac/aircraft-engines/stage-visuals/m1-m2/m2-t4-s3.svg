<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="ae-m2-t4-s3-title ae-m2-t4-s3-desc"><title id="ae-m2-t4-s3-title">Una superficie forma parte de un sistema</title><desc id="ae-m2-t4-s3-desc">Una superficie de mando muestra bisagra y conexión. Las comprobaciones se relacionan con unión, movimiento y continuidad, siempre según documentación del modelo.</desc><rect width="760" height="390" rx="18" fill="#0b182b"/><g font-family="Arial,sans-serif"><text x="24" y="36" font-size="24" fill="#e3ecf4" text-anchor="start">Una superficie forma parte de un sistema</text><text x="25" y="85" font-size="20" fill="#ecc16c" text-anchor="start">Reconoce primero, comprueba después</text><path d="M102 239L140 121L205 143L178 239Z" stroke="#91a9bf" stroke-width="3" fill="#172c43"/><path d="M158 130L205 143L178 239H142Z" stroke="#60d6e1" stroke-width="3" fill="#60d6e1"/><circle cx="149" cy="193" r="8" fill="#ecc16c" stroke="#ecc16c" stroke-width="3"/><path d="M158 193L319 142" stroke="#ecc16c" stroke-width="3" fill="none"/><path d="M319 142L305.66072118207614 140.56346228114666L309.847202534163 151.8095004230271Z" stroke="#ecc16c" stroke-width="1" fill="#ecc16c"/><rect x="344" y="102" width="357" height="70" rx="10" fill="#172c43" stroke="#91a9bf" stroke-width="2"/><text x="362" y="133" font-size="19" fill="#e3ecf4" text-anchor="start">Unión y libertad de movimiento</text><text x="362" y="155" font-size="16" fill="#91a9bf" text-anchor="start">Sin deducir límites a simple vista</text><path d="M172 224L319 244" stroke="#60d6e1" stroke-width="3" fill="none"/><path d="M319 244L307.9184207160032 236.43702435727224L306.3006719154197 248.3274780415608Z" stroke="#60d6e1" stroke-width="1" fill="#60d6e1"/><rect x="344" y="216" width="357" height="86" rx="10" fill="#172c43" stroke="#91a9bf" stroke-width="2"/><text x="362" y="245" font-size="19" fill="#e3ecf4" text-anchor="start">Continuidad del mando</text><text x="362" y="271" font-size="17" fill="#91a9bf" text-anchor="start">Comprobar según el procedimiento</text><text x="171" y="288" font-size="19" fill="#60d6e1" text-anchor="middle">Superficie móvil</text><text x="24" y="370" font-size="17" fill="#91a9bf" text-anchor="start">Reconocer una pieza no autoriza a forzarla ni a ajustar su recorrido.</text></g></svg>