<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="ae-m2-t3-s1-title ae-m2-t3-s1-desc"><title id="ae-m2-t3-s1-title">Del ala a la estructura central</title><desc id="ae-m2-t3-s1-desc">Ala en planta con largueros longitudinales y costillas transversales. Vista frontal de un ala arriostrada: los montantes también forman el camino de carga.</desc><rect width="760" height="390" rx="18" fill="#0b182b"/><g font-family="Arial,sans-serif"><text x="24" y="36" font-size="24" fill="#e3ecf4" text-anchor="start">Del ala a la estructura central</text><path d="M40 137L356 99L344 239L40 261Z" stroke="#91a9bf" stroke-width="3" fill="#172c43"/><path d="M51 169L350 134M47 223L344 200" stroke="#ecc16c" stroke-width="6" fill="none"/><path d="M107 255.31L115 128.96" stroke="#60d6e1" stroke-width="3" fill="none"/><path d="M169 250.97L177 121.52" stroke="#60d6e1" stroke-width="3" fill="none"/><path d="M231 246.63L239 114.08" stroke="#60d6e1" stroke-width="3" fill="none"/><path d="M293 242.29L301 106.64" stroke="#60d6e1" stroke-width="3" fill="none"/><text x="180" y="290" font-size="19" fill="#e3ecf4" text-anchor="middle">Largueros + costillas + piel</text><circle cx="559" cy="192" r="26" fill="#172c43" stroke="#e3ecf4" stroke-width="3"/><path d="M489 166H629" stroke="#60d6e1" stroke-width="7" fill="none"/><path d="M489 166L543 213M629 166L575 213" stroke="#ecc16c" stroke-width="5" fill="none"/><path d="M488 130L488 92" stroke="#60d6e1" stroke-width="3" fill="none"/><path d="M488 92L482.0 104.0L494.0 104.0Z" stroke="#60d6e1" stroke-width="1" fill="#60d6e1"/><path d="M632 130L632 92" stroke="#60d6e1" stroke-width="3" fill="none"/><path d="M632 92L626.0 104.0L638.0 104.0Z" stroke="#60d6e1" stroke-width="1" fill="#60d6e1"/><text x="559" y="295" font-size="19" fill="#e3ecf4" text-anchor="middle">Montantes: apoyo exterior</text><text x="24" y="370" font-size="17" fill="#91a9bf" text-anchor="start">Los apoyos exteriores no sustituyen la estructura interna del ala.</text></g></svg>