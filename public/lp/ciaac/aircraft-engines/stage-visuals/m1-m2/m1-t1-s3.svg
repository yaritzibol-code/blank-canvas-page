<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="ae-m1-t1-s3-title ae-m1-t1-s3-desc"><title id="ae-m1-t1-s3-title">Número de alas y posición no son lo mismo</title><desc id="ae-m1-t1-s3-desc">Arriba: uno, dos y tres conjuntos de alas. Abajo: un mismo monoplano visto de frente con ala alta, media o baja. Dos semialas cuentan como un conjunto.</desc><rect width="760" height="390" rx="18" fill="#0b182b"/><g font-family="Arial,sans-serif"><text x="24" y="36" font-size="24" fill="#e3ecf4" text-anchor="start">Número de alas y posición no son lo mismo</text><text x="140" y="83" font-size="21" fill="#e3ecf4" text-anchor="middle">Monoplano</text><circle cx="140" cy="140" r="24" fill="#172c43" stroke="#91a9bf" stroke-width="3"/><path d="M67 122H213" stroke="#60d6e1" stroke-width="6" fill="none"/><text x="380" y="83" font-size="21" fill="#e3ecf4" text-anchor="middle">Biplano</text><circle cx="380" cy="140" r="24" fill="#172c43" stroke="#91a9bf" stroke-width="3"/><path d="M307 122H453" stroke="#60d6e1" stroke-width="6" fill="none"/><path d="M307 146H453" stroke="#60d6e1" stroke-width="6" fill="none"/><text x="620" y="83" font-size="21" fill="#e3ecf4" text-anchor="middle">Triplano</text><circle cx="620" cy="140" r="24" fill="#172c43" stroke="#91a9bf" stroke-width="3"/><path d="M547 122H693" stroke="#60d6e1" stroke-width="6" fill="none"/><path d="M547 146H693" stroke="#60d6e1" stroke-width="6" fill="none"/><path d="M547 170H693" stroke="#60d6e1" stroke-width="6" fill="none"/><path d="M28 200H732" stroke="#91a9bf" stroke-width="1" fill="none"/><text x="28" y="232" font-size="20" fill="#ecc16c" text-anchor="start">Posición de unión: observa de frente</text><circle cx="140" cy="286" r="26" fill="#172c43" stroke="#e3ecf4" stroke-width="3"/><path d="M70 260H210" stroke="#60d6e1" stroke-width="7" fill="none"/><text x="140" y="337" font-size="19" fill="#e3ecf4" text-anchor="middle">Alta</text><circle cx="380" cy="286" r="26" fill="#172c43" stroke="#e3ecf4" stroke-width="3"/><path d="M310 286H450" stroke="#60d6e1" stroke-width="7" fill="none"/><text x="380" y="337" font-size="19" fill="#e3ecf4" text-anchor="middle">Media</text><circle cx="620" cy="286" r="26" fill="#172c43" stroke="#e3ecf4" stroke-width="3"/><path d="M550 306H690" stroke="#60d6e1" stroke-width="7" fill="none"/><text x="620" y="337" font-size="19" fill="#e3ecf4" text-anchor="middle">Baja</text><text x="24" y="370" font-size="17" fill="#91a9bf" text-anchor="start">Dos semialas forman un conjunto principal; el estabilizador no se suma.</text></g></svg>