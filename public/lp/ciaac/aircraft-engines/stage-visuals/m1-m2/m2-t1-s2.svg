<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="ae-m2-t1-s2-title ae-m2-t1-s2-desc"><title id="ae-m2-t1-s2-title">De la misión al diseño aceptado</title><desc id="ae-m2-t1-s2-desc">La misión relaciona carga, peso y resistencia. Un diseño definido se contrasta con requisitos mediante análisis, ensayos e inspección. Modelo y ejemplar no son lo mismo.</desc><rect width="760" height="390" rx="18" fill="#0b182b"/><g font-family="Arial,sans-serif"><text x="24" y="36" font-size="24" fill="#e3ecf4" text-anchor="start">De la misión al diseño aceptado</text><text x="25" y="83" font-size="20" fill="#ecc16c" text-anchor="start">Misión y límites se relacionan</text><text x="178" y="140" font-size="21" fill="#e3ecf4" text-anchor="middle">Carga</text><text x="108" y="226" font-size="21" fill="#e3ecf4" text-anchor="middle">Peso</text><text x="251" y="226" font-size="18" fill="#e3ecf4" text-anchor="middle">Resistencia</text><path d="M178 154L112 203L240 203Z" stroke="#60d6e1" stroke-width="3" fill="none"/><path d="M301 193L382 193" stroke="#ecc16c" stroke-width="3" fill="none"/><path d="M382 193L370.0 187.0L370.0 199.0Z" stroke="#ecc16c" stroke-width="1" fill="#ecc16c"/><rect x="404" y="106" width="308" height="73" rx="10" fill="#172c43" stroke="#91a9bf" stroke-width="2"/><text x="558" y="136" font-size="20" fill="#e3ecf4" text-anchor="middle">Diseño y limitaciones</text><text x="558" y="162" font-size="17" fill="#91a9bf" text-anchor="middle">Configuración definida</text><path d="M558 181L558 216" stroke="#60d6e1" stroke-width="3" fill="none"/><path d="M558 216L564.0 204.0L552.0 204.0Z" stroke="#60d6e1" stroke-width="1" fill="#60d6e1"/><rect x="404" y="233" width="308" height="80" rx="10" fill="#172c43" stroke="#91a9bf" stroke-width="2"/><text x="558" y="263" font-size="20" fill="#e3ecf4" text-anchor="middle">Demostrar cumplimiento</text><text x="558" y="290" font-size="17" fill="#91a9bf" text-anchor="middle">Análisis · ensayos · inspección</text><text x="24" y="370" font-size="17" fill="#91a9bf" text-anchor="start">Poder hacer una maniobra no demuestra que esté dentro de lo aprobado.</text></g></svg>