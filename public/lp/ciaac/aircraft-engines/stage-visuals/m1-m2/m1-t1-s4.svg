<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="ae-m1-t1-s4-title ae-m1-t1-s4-desc"><title id="ae-m1-t1-s4-title">Planta y perfil: cambia la vista</title><desc id="ae-m1-t1-s4-desc">Cuatro contornos vistos desde arriba; debajo un perfil visto en corte transversal. La planta no es el perfil.</desc><rect width="760" height="390" rx="18" fill="#0b182b"/><g font-family="Arial,sans-serif"><text x="24" y="36" font-size="24" fill="#e3ecf4" text-anchor="start">Planta y perfil: cambia la vista</text><text x="25" y="80" font-size="20" fill="#ecc16c" text-anchor="start">Vista superior: forma en planta</text><path d="M45 113H180V190H45Z" stroke="#60d6e1" stroke-width="2" fill="#60d6e1"/><text x="113" y="225" font-size="18" fill="#e3ecf4" text-anchor="middle">Rectangular</text><path d="M222 115L355 138V165L222 190Z" stroke="#60d6e1" stroke-width="2" fill="#60d6e1"/><text x="288" y="225" font-size="18" fill="#e3ecf4" text-anchor="middle">Estrechada</text><path d="M400 152C400 99 520 99 520 152C520 205 400 205 400 152Z" stroke="#60d6e1" stroke-width="2" fill="#60d6e1"/><text x="460" y="225" font-size="18" fill="#e3ecf4" text-anchor="middle">Elíptica</text><path d="M565 171L646 113L725 171V194L646 151L565 194Z" stroke="#60d6e1" stroke-width="2" fill="#60d6e1"/><text x="646" y="225" font-size="18" fill="#e3ecf4" text-anchor="middle">En flecha</text><path d="M28 249H730" stroke="#91a9bf" stroke-width="1" fill="none"/><text x="28" y="279" font-size="20" fill="#ecc16c" text-anchor="start">Corte transversal: perfil</text><path d="M374 297C380 259 469 254 690 297C526 304 409 315 374 297Z" stroke="#e3ecf4" stroke-width="3" fill="#172c43"/><text x="24" y="370" font-size="17" fill="#91a9bf" text-anchor="start">Una clasificación completa puede combinar familia, número, posición y planta.</text></g></svg>