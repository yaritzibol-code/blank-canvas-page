<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="ae-m1-t2-s2-title ae-m1-t2-s2-desc"><title id="ae-m1-t2-s2-title">El rotor mueve sus alas respecto del aire</title><desc id="ae-m1-t2-s2-desc">Izquierda, palas girando alrededor de un eje y área barrida. Derecha, motor y transmisión hacen girar el rotor de un helicóptero. La fuerza aerodinámica sigue siendo el soporte.</desc><rect width="760" height="390" rx="18" fill="#0b182b"/><g font-family="Arial,sans-serif"><text x="24" y="36" font-size="24" fill="#e3ecf4" text-anchor="start">El rotor mueve sus alas respecto del aire</text><rect x="24" y="72" width="339" height="255" rx="10" fill="#172c43" stroke="#91a9bf" stroke-width="2"/><rect x="383" y="72" width="353" height="255" rx="10" fill="#172c43" stroke="#91a9bf" stroke-width="2"/><text x="44" y="105" font-size="21" fill="#e3ecf4" text-anchor="start">La pala recorre el aire</text><circle cx="190" cy="201" r="75" fill="none" stroke="#91a9bf" stroke-width="3"/><path d="M115 201H265M190 126V276" stroke="#60d6e1" stroke-width="11" fill="none"/><circle cx="190" cy="201" r="13" fill="#ecc16c" stroke="#ecc16c" stroke-width="3"/><path d="M260 169L268 213" stroke="#60d6e1" stroke-width="3" fill="none"/><path d="M268 213L271.7565942021996 200.1202484496012L259.9501552810008 202.26687370800101Z" stroke="#60d6e1" stroke-width="1" fill="#60d6e1"/><text x="45" y="307" font-size="16" fill="#91a9bf" text-anchor="start">Disco: área barrida, no pared sólida</text><text x="403" y="105" font-size="21" fill="#e3ecf4" text-anchor="start">Helicóptero: giro accionado</text><rect x="418" y="224" width="115" height="51" rx="10" fill="#172c43" stroke="#91a9bf" stroke-width="2"/><text x="475" y="256" font-size="20" fill="#e3ecf4" text-anchor="middle">Motor</text><path d="M475 224V198H551" stroke="#ecc16c" stroke-width="4" fill="none"/><path d="M551 198L551 157" stroke="#ecc16c" stroke-width="3" fill="none"/><path d="M551 157L545.0 169.0L557.0 169.0Z" stroke="#ecc16c" stroke-width="1" fill="#ecc16c"/><path d="M421 153H681" stroke="#60d6e1" stroke-width="10" fill="none"/><path d="M551 153V196" stroke="#ecc16c" stroke-width="5" fill="none"/><path d="M560 219L647 164" stroke="#60d6e1" stroke-width="3" fill="none"/><path d="M647 164L633.6507536278287 165.34075400244515L640.0630553786533 175.48384949920407Z" stroke="#60d6e1" stroke-width="1" fill="#60d6e1"/><text x="590" y="249" font-size="19" fill="#e3ecf4" text-anchor="middle">Pala = ala</text><text x="24" y="370" font-size="17" fill="#91a9bf" text-anchor="start">La transmisión aporta movimiento; el aire sobre las palas produce sustentación.</text></g></svg>