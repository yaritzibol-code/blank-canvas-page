<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="ae-m1-t4-s2-title ae-m1-t4-s2-desc"><title id="ae-m1-t4-s2-title">El tren conecta la aeronave con la superficie</title><desc id="ae-m1-t4-s2-desc">Flechas de carga desde el contacto al avión. Convencional: apoyo auxiliar atrás; triciclo: delante. El número de neumáticos no define la disposición.</desc><rect width="760" height="390" rx="18" fill="#0b182b"/><g font-family="Arial,sans-serif"><text x="24" y="36" font-size="24" fill="#e3ecf4" text-anchor="start">El tren conecta la aeronave con la superficie</text><text x="25" y="81" font-size="19" fill="#ecc16c" text-anchor="start">El contacto transmite cargas a la estructura</text><g transform="translate(202 159) scale(1.3)"><path d="M-90 0L90 0L72 -9L-40 -12L-65 -42H-78L-68 -8Z" stroke="#e3ecf4" stroke-width="2" fill="#91a9bf"/><path d="M-18 -5L35 -38H48L17 -3L50 21H35L-9 3Z" stroke="#e3ecf4" stroke-width="2" fill="#91a9bf"/></g><path d="M137 160V222M264 159V215" stroke="#91a9bf" stroke-width="5" fill="none"/><circle cx="137" cy="232" r="16" fill="none" stroke="#e3ecf4" stroke-width="3"/><circle cx="264" cy="225" r="12" fill="none" stroke="#e3ecf4" stroke-width="3"/><path d="M72 250H324" stroke="#91a9bf" stroke-width="3" fill="none"/><path d="M137 278L137 184" stroke="#60d6e1" stroke-width="3" fill="none"/><path d="M137 184L131.0 196.0L143.0 196.0Z" stroke="#60d6e1" stroke-width="1" fill="#60d6e1"/><path d="M265 274L265 182" stroke="#60d6e1" stroke-width="3" fill="none"/><path d="M265 182L259.0 194.0L271.0 194.0Z" stroke="#60d6e1" stroke-width="1" fill="#60d6e1"/><text x="439" y="91" font-size="20" fill="#ecc16c" text-anchor="start">Apoyo auxiliar</text><g transform="translate(563 151) scale(0.9)"><path d="M-90 0L90 0L72 -9L-40 -12L-65 -42H-78L-68 -8Z" stroke="#e3ecf4" stroke-width="2" fill="#91a9bf"/><path d="M-18 -5L35 -38H48L17 -3L50 21H35L-9 3Z" stroke="#e3ecf4" stroke-width="2" fill="#91a9bf"/></g><path d="M546 151V190M491 151V183" stroke="#91a9bf" stroke-width="4" fill="none"/><circle cx="546" cy="197" r="12" fill="none" stroke="#e3ecf4" stroke-width="3"/><circle cx="491" cy="188" r="7" fill="none" stroke="#ecc16c" stroke-width="3"/><text x="578" y="228" font-size="19" fill="#e3ecf4" text-anchor="middle">Convencional: atrás</text><g transform="translate(563 278) scale(0.9)"><path d="M-90 0L90 0L72 -9L-40 -12L-65 -42H-78L-68 -8Z" stroke="#e3ecf4" stroke-width="2" fill="#91a9bf"/><path d="M-18 -5L35 -38H48L17 -3L50 21H35L-9 3Z" stroke="#e3ecf4" stroke-width="2" fill="#91a9bf"/></g><path d="M546 278V317M624 278V308" stroke="#91a9bf" stroke-width="4" fill="none"/><circle cx="546" cy="325" r="12" fill="none" stroke="#e3ecf4" stroke-width="3"/><circle cx="624" cy="315" r="7" fill="none" stroke="#ecc16c" stroke-width="3"/><text x="180" y="321" font-size="19" fill="#e3ecf4" text-anchor="middle">No es sólo el neumático</text><text x="24" y="370" font-size="17" fill="#91a9bf" text-anchor="start">Triciclo: apoyo auxiliar delante. La posición y la retracción son criterios distintos.</text></g></svg>