<svg xmlns="http://www.w3.org/2000/svg" width="760" height="365" viewBox="0 0 760 365" role="img" aria-labelledby="ae-stage-m1t1s2-title ae-stage-m1t1s2-desc">
<title id="ae-stage-m1t1s2-title">Qué lo sostiene y si tiene motor son preguntas distintas</title><desc id="ae-stage-m1t1s2-desc">Globo: flotación, sin motor. Avión: sustentación aerodinámica, con motor. Planeador: sustentación aerodinámica, sin motor. En las alas importa el movimiento relativo del aire. Las flechas de aire se desplazan brevemente; no representan velocidades ni fuerzas a escala.</desc>
<style>.flow{stroke-dasharray:8 7;animation:ae-stage-m1t1s2-flow 4s linear 1}@keyframes ae-stage-m1t1s2-flow{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style>
<rect width="760" height="365" rx="18" fill="#0b182b"/><g font-family="Arial,sans-serif" fill="#e7edf4">
<text x="24" y="34" font-size="24" font-weight="bold">Dos preguntas, tres aeronaves</text>
<g fill="#162a40" stroke="#526c85"><rect x="20" y="57" width="228" height="257" rx="14"/><rect x="266" y="57" width="228" height="257" rx="14"/><rect x="512" y="57" width="228" height="257" rx="14"/></g>
<g font-size="22" text-anchor="middle"><text x="134" y="87">Globo</text><text x="380" y="87">Avión</text><text x="626" y="87">Planeador</text></g>
