<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="ae-m1-t3-s1-title ae-m1-t3-s1-desc"><title id="ae-m1-t3-s1-title">El motor convierte energía; el propulsor la utiliza</title><desc id="ae-m1-t3-s1-desc">Un pistón mueve el cigüeñal y este una hélice. Una turbina puede entregar potencia por eje o energía en un chorro; motor y propulsor son conceptos distintos.</desc><rect width="760" height="390" rx="18" fill="#0b182b"/><g font-family="Arial,sans-serif"><text x="24" y="36" font-size="24" fill="#e3ecf4" text-anchor="start">El motor convierte energía; el propulsor la utiliza</text><rect x="24" y="74" width="335" height="256" rx="10" fill="#172c43" stroke="#91a9bf" stroke-width="2"/><rect x="380" y="74" width="356" height="256" rx="10" fill="#172c43" stroke="#91a9bf" stroke-width="2"/><text x="44" y="109" font-size="21" fill="#e3ecf4" text-anchor="start">Pistón → eje → hélice</text><rect x="65" y="138" width="71" height="93" rx="3" fill="none" stroke="#91a9bf" stroke-width="2"/><path d="M68 196H133" stroke="#ecc16c" stroke-width="10" fill="none"/><path d="M101 200L143 264" stroke="#ecc16c" stroke-width="7" fill="none"/><circle cx="157" cy="282" r="29" fill="none" stroke="#91a9bf" stroke-width="3"/><circle cx="143" cy="264" r="7" fill="#ecc16c" stroke="#ecc16c" stroke-width="3"/><path d="M190 210L267 210" stroke="#ecc16c" stroke-width="3" fill="none"/><path d="M267 210L255.0 204.0L255.0 216.0Z" stroke="#ecc16c" stroke-width="1" fill="#ecc16c"/><path d="M290 147V268" stroke="#60d6e1" stroke-width="10" fill="none"/><circle cx="290" cy="210" r="8" fill="#ecc16c" stroke="#ecc16c" stroke-width="3"/><text x="402" y="109" font-size="21" fill="#e3ecf4" text-anchor="start">Turbina: dos salidas útiles</text><path d="M411 167H534L558 190L534 216H411Z" stroke="#91a9bf" stroke-width="3" fill="#172c43"/><text x="475" y="198" font-size="19" fill="#e3ecf4" text-anchor="middle">Turbina</text><path d="M558 177L686 143" stroke="#ecc16c" stroke-width="3" fill="none"/><path d="M686 143L672.8618428058429 140.28176058051923L675.9425141479211 151.87958210363718Z" stroke="#ecc16c" stroke-width="1" fill="#ecc16c"/><text x="644" y="131" font-size="19" fill="#ecc16c" text-anchor="middle">Eje</text><path d="M558 216L686 259" stroke="#60d6e1" stroke-width="3" fill="none"/><path d="M686 259L676.5354103816095 249.4909756885654L672.714026779818 260.86625710785165Z" stroke="#60d6e1" stroke-width="1" fill="#60d6e1"/><text x="652" y="291" font-size="19" fill="#60d6e1" text-anchor="middle">Chorro</text><text x="24" y="370" font-size="17" fill="#91a9bf" text-anchor="start">No confundas cuántos motores hay con cómo se produce la propulsión.</text></g></svg>