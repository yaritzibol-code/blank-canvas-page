<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="ae-m2-t5-s1-title ae-m2-t5-s1-desc"><title id="ae-m2-t5-s1-title">El fuselaje une espacios y caminos de carga</title><desc id="ae-m2-t5-s1-desc">El contorno dorado sigue el fuselaje. Líneas de referencia señalan la raíz del ala y la unión de la cola; flechas inferiores muestran la transferencia conceptual de cargas interiores a su estructura.</desc><rect width="760" height="390" rx="18" fill="#0b182b"/><g font-family="Arial,sans-serif"><text x="24" y="36" font-size="24" fill="#e3ecf4" text-anchor="start">El fuselaje une espacios y caminos de carga</text><g transform="translate(376 179) scale(2.1)"><path d="M-90 0L90 0L72 -9L-40 -12L-65 -42H-78L-68 -8Z" stroke="#e3ecf4" stroke-width="2" fill="#91a9bf"/><path d="M-18 -5L35 -38H48L17 -3L50 21H35L-9 3Z" stroke="#e3ecf4" stroke-width="2" fill="#91a9bf"/></g><path d="M187 179L233 162L292 154L527 160L565 179Z" stroke="#ecc16c" stroke-width="4" fill="none"/><text x="370" y="88" font-size="23" fill="#ecc16c" text-anchor="middle">Fuselaje</text><path d="M370 96V151" stroke="#ecc16c" stroke-width="2" fill="none"/><text x="97" y="128" font-size="21" fill="#60d6e1" text-anchor="start">Cola</text><path d="M148 132L235 157" stroke="#60d6e1" stroke-width="2" fill="none"/><circle cx="235" cy="157" r="5" fill="#60d6e1" stroke="#60d6e1" stroke-width="3"/><text x="599" y="106" font-size="21" fill="#60d6e1" text-anchor="start">Ala</text><path d="M591 113L403 174" stroke="#60d6e1" stroke-width="2" fill="none"/><circle cx="403" cy="174" r="5" fill="#60d6e1" stroke="#60d6e1" stroke-width="3"/><path d="M298 275L327 179" stroke="#ecc16c" stroke-width="3" fill="none"/><path d="M327 179L317.78622195424134 188.75224559388738L329.27352964765475 192.22236979293933Z" stroke="#ecc16c" stroke-width="1" fill="#ecc16c"/><path d="M454 275L436 179" stroke="#ecc16c" stroke-width="3" fill="none"/><path d="M436 179L432.3142292989963 191.900197453513L444.1086955422082 189.68873503291076Z" stroke="#ecc16c" stroke-width="1" fill="#ecc16c"/><text x="377" y="310" font-size="20" fill="#ecc16c" text-anchor="middle">Carga interior → sujeciones → estructura</text><text x="24" y="370" font-size="17" fill="#91a9bf" text-anchor="start">Las alas y la cola se conectan al fuselaje; su volumen no demuestra capacidad de carga.</text></g></svg>