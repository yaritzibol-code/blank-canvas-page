<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="aem4-stage-08-01-desplome-compresor-title aem4-stage-08-01-desplome-compresor-desc"><title id="aem4-stage-08-01-desplome-compresor-title">Desplome: el flujo se separa del álabe</title><desc id="aem4-stage-08-01-desplome-compresor-desc">Dos álabes esquemáticos comparan flujo adherido con flujo separado al exceder el ángulo crítico. En el segundo, líneas se alejan de la superficie y una recirculación muestra la perturbación. La menor capacidad de compresión puede acompañarse de fluctuaciones; el esquema no fija un ángulo universal.</desc><defs><marker id="aem4-stage-08-01-desplome-compresor-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64d8ec"/></marker><marker id="aem4-stage-08-01-desplome-compresor-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f2c46d"/></marker><marker id="aem4-stage-08-01-desplome-compresor-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ff9291"/></marker><marker id="aem4-stage-08-01-desplome-compresor-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8393a9"/></marker><marker id="aem4-stage-08-01-desplome-compresor-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8be2bd"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="420" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="34" fill="#edf3fa" font-size="23" text-anchor="start" font-weight="600">Desplome: el flujo se separa del álabe</text><rect x="25" y="91" width="322" height="236" rx="12" fill="#112239" stroke="none" stroke-width="2"/><rect x="373" y="91" width="322" height="236" rx="12" fill="#112239" stroke="none" stroke-width="2"/><text x="187" y="125" fill="#64d8ec" font-size="19" text-anchor="middle" font-weight="600">Flujo adherido</text><text x="535" y="125" fill="#ff9291" font-size="19" text-anchor="middle" font-weight="600">Flujo separado</text><path d="M105 223Q84 195 122 191Q182 190 302 220Q181 242 105 223Z" fill="#8393a9" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M43 177Q83 176 111 165Q179 152 239 176L310 189" fill="none" stroke="#64d8ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-08-01-desplome-compresor-cyan)"/><path d="M43 205Q78 205 98 186Q161 174 221 193L309 208" fill="none" stroke="#64d8ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-08-01-desplome-compresor-cyan)"/><path d="M44 251Q95 251 134 248Q219 241 309 233" fill="none" stroke="#64d8ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-08-01-desplome-compresor-cyan)"/><path d="M449 206Q436 174 471 178Q529 189 647 247Q530 247 449 206Z" fill="#8393a9" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M389 174Q423 174 450 145Q477 129 511 150Q567 181 658 180" fill="none" stroke="#ff9291" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-08-01-desplome-compresor-red)"/><path d="M392 199Q420 199 439 166Q469 145 491 164Q506 182 528 177" fill="none" stroke="#ff9291" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-08-01-desplome-compresor-red)"/><path d="M391 257Q446 249 481 237Q562 263 658 264" fill="none" stroke="#64d8ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-08-01-desplome-compresor-cyan)"/><path d="M556 200C589 179 610 211 584 223C564 232 546 215 556 200" fill="none" stroke="#ff9291" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-08-01-desplome-compresor-red)"/><text x="187" y="304" fill="#b4c3d5" font-size="15" text-anchor="middle" font-weight="400">El álabe sostiene la compresión</text><text x="535" y="304" fill="#b4c3d5" font-size="15" text-anchor="middle" font-weight="400">Menor capacidad de comprimir</text><text x="26" y="360" fill="#b4c3d5" font-size="16" text-anchor="start" font-weight="400">El ángulo depende del aire recibido y del movimiento del álabe.</text><text x="26" y="385" fill="#b4c3d5" font-size="16" text-anchor="start" font-weight="400">Golpes, vibración o fluctuaciones son indicios, no un diagnóstico aislado.</text><text x="24" y="403" fill="#b4c3d5" font-size="14" text-anchor="start" font-weight="400">Diagrama original · relaciones funcionales, no a escala.</text></g></svg>