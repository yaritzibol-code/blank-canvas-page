<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="aem4-stage-01-03-descarga-y-accesorios-title aem4-stage-01-03-descarga-y-accesorios-desc"><title id="aem4-stage-01-03-descarga-y-accesorios-title">Chorro y accesorios: recorridos distintos</title><desc id="aem4-stage-01-03-descarga-y-accesorios-desc">Arriba, gases salen de la turbina alrededor de un cono y atraviesan la tobera hacia la derecha; empuje hacia la izquierda. Abajo, el eje mueve una caja de accesorios conectada a bomba y generador fuera del conducto.</desc><defs><marker id="aem4-stage-01-03-descarga-y-accesorios-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64d8ec"/></marker><marker id="aem4-stage-01-03-descarga-y-accesorios-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f2c46d"/></marker><marker id="aem4-stage-01-03-descarga-y-accesorios-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ff9291"/></marker><marker id="aem4-stage-01-03-descarga-y-accesorios-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8393a9"/></marker><marker id="aem4-stage-01-03-descarga-y-accesorios-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8be2bd"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="420" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="34" fill="#edf3fa" font-size="23" text-anchor="start" font-weight="600">Chorro y accesorios: recorridos distintos</text><text x="62" y="75" fill="#edf3fa" font-size="18" text-anchor="start" font-weight="400">Turbina</text><text x="275" y="75" fill="#edf3fa" font-size="18" text-anchor="start" font-weight="400">Cono de escape</text><text x="537" y="75" fill="#edf3fa" font-size="18" text-anchor="start" font-weight="400">Tobera</text><path d="M45 110H464L607 146M45 225H464L607 190" fill="none" stroke="#8393a9" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M177 169L283 142L424 169L283 195Z" fill="#112239" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M105 135 Q125 159 105 200" fill="none" stroke="#f2c46d" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><path d="M54 133L91 133" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-01-03-descarga-y-accesorios-gold)"/><path d="M177 126L430 126" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-01-03-descarga-y-accesorios-gold)"/><path d="M177 209L430 209" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-01-03-descarga-y-accesorios-gold)"/><path d="M480 168L686 168" fill="none" stroke="#f2c46d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-01-03-descarga-y-accesorios-gold)"/><text x="520" y="212" fill="#f2c46d" font-size="17" text-anchor="start" font-weight="400">Gas acelerado</text><path d="M207 96L48 96" fill="none" stroke="#8be2bd" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-01-03-descarga-y-accesorios-green)"/><text x="148" y="86" fill="#8be2bd" font-size="16" text-anchor="middle" font-weight="400">Empuje</text><path d="M105 202L105 285" fill="none" stroke="#f2c46d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M105 285L234 285" fill="none" stroke="#f2c46d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-01-03-descarga-y-accesorios-gold)"/><rect x="248" y="257" width="174" height="55" rx="10" fill="#112239" stroke="#f2c46d" stroke-width="2"/><text x="335" y="280" fill="#edf3fa" font-size="18" text-anchor="middle" font-weight="400">Caja de</text><text x="335" y="302" fill="#edf3fa" font-size="18" text-anchor="middle" font-weight="400">accesorios</text><path d="M422 273H476V254H518" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-01-03-descarga-y-accesorios-gold)"/><path d="M422 297H476V330H518" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-01-03-descarga-y-accesorios-gold)"/><rect x="532" y="235" width="152" height="42" rx="10" fill="#112239" stroke="#8393a9" stroke-width="2"/><text x="608" y="262" fill="#edf3fa" font-size="18" text-anchor="middle" font-weight="400">Bomba</text><rect x="532" y="309" width="152" height="42" rx="10" fill="#112239" stroke="#8393a9" stroke-width="2"/><text x="608" y="336" fill="#edf3fa" font-size="18" text-anchor="middle" font-weight="400">Generador</text><text x="36" y="337" fill="#f2c46d" font-size="17" text-anchor="start" font-weight="400">Trabajo de eje</text><text x="36" y="374" fill="#b4c3d5" font-size="18" text-anchor="start" font-weight="400">Los accesorios quedan fuera del conducto del gas.</text><text x="24" y="403" fill="#b4c3d5" font-size="14" text-anchor="start" font-weight="400">Diagrama original · relaciones funcionales, no a escala.</text></g></svg>