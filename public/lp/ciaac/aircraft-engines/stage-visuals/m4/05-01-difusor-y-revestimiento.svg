<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="aem4-stage-05-01-difusor-y-revestimiento-title aem4-stage-05-01-difusor-y-revestimiento-desc"><title id="aem4-stage-05-01-difusor-y-revestimiento-title">Desacelerar y repartir el aire</title><desc id="aem4-stage-05-01-difusor-y-revestimiento-desc">Un conducto subsónico divergente disminuye velocidad y recupera presión estática antes de la cámara. Dentro de la carcasa, un revestimiento perforado separa la llama de los pasos de refrigeración; aire entra por orificios y diluye el gas.</desc><defs><marker id="aem4-stage-05-01-difusor-y-revestimiento-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64d8ec"/></marker><marker id="aem4-stage-05-01-difusor-y-revestimiento-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f2c46d"/></marker><marker id="aem4-stage-05-01-difusor-y-revestimiento-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ff9291"/></marker><marker id="aem4-stage-05-01-difusor-y-revestimiento-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8393a9"/></marker><marker id="aem4-stage-05-01-difusor-y-revestimiento-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8be2bd"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="420" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="34" fill="#edf3fa" font-size="23" text-anchor="start" font-weight="600">Desacelerar y repartir el aire</text><text x="37" y="77" fill="#edf3fa" font-size="18" text-anchor="start" font-weight="600">Difusor subsónico</text><text x="368" y="77" fill="#edf3fa" font-size="18" text-anchor="start" font-weight="600">Carcasa y revestimiento</text><path d="M40 145L224 103H670M40 229L224 271H670" fill="none" stroke="#8393a9" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M279 145H592L644 168M279 229H592L644 206" fill="none" stroke="#8393a9" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M43 187L149 187" fill="none" stroke="#64d8ec" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-05-01-difusor-y-revestimiento-cyan)"/><path d="M183 187L236 187" fill="none" stroke="#64d8ec" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-05-01-difusor-y-revestimiento-cyan)"/><text x="52" y="309" fill="#64d8ec" font-size="18" text-anchor="start" font-weight="400">Velocidad ↓</text><text x="52" y="335" fill="#64d8ec" font-size="18" text-anchor="start" font-weight="400">Presión estática ↑</text><text x="52" y="361" fill="#b4c3d5" font-size="17" text-anchor="start" font-weight="400">Sin trabajo de eje</text><rect x="261" y="176" width="21" height="22" rx="2" fill="#8393a9" stroke="none" stroke-width="2"/><path d="M272 120L272 173" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-05-01-difusor-y-revestimiento-gold)"/><text x="242" y="96" fill="#f2c46d" font-size="16" text-anchor="start" font-weight="400">Inyector</text><path d="M290 187Q310 154 335 178Q360 154 399 187Q360 219 335 197Q310 222 290 187" fill="#f2c46d" stroke="#f2c46d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="363" cy="145" r="4" fill="#0b1728" stroke="#64d8ec" stroke-width="2"/><circle cx="363" cy="229" r="4" fill="#0b1728" stroke="#64d8ec" stroke-width="2"/><path d="M355 124L370 168" fill="none" stroke="#64d8ec" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="