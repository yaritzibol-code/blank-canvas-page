xt x="345" y="340" fill="#f2c46d" font-size="17" text-anchor="start" font-weight="400">Dorado: llama y gas caliente</text><text x="345" y="370" fill="#b4c3d5" font-size="16" text-anchor="start" font-weight="400">Hay pérdidas reales de presión total.</text><text x="24" y="403" fill="#b4c3d5" font-size="14" text-anchor="start" font-weight="400">Diagrama original · relaciones funcionales, no a escala.</text></g></svg>