<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="aem4-stage-05-03-carcasa-y-descarga-title aem4-stage-05-03-carcasa-y-descarga-desc"><title id="aem4-stage-05-03-carcasa-y-descarga-title">Carcasa fija, rotor móvil y salida</title><desc id="aem4-stage-05-03-carcasa-y-descarga-desc">Corte de turbina y escape. La carcasa exterior sostiene guías fijas; un rotor unido al eje extrae trabajo. El gas pasa alrededor del cono de escape y hacia la tobera. Las etiquetas distinguen estructura, piezas fijas, piezas móviles y recorrido del gas.</desc><defs><marker id="aem4-stage-05-03-carcasa-y-descarga-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64d8ec"/></marker><marker id="aem4-stage-05-03-carcasa-y-descarga-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f2c46d"/></marker><marker id="aem4-stage-05-03-carcasa-y-descarga-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ff9291"/></marker><marker id="aem4-stage-05-03-carcasa-y-descarga-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8393a9"/></marker><marker id="aem4-stage-05-03-carcasa-y-descarga-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8be2bd"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="420" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="34" fill="#edf3fa" font-size="23" text-anchor="start" font-weight="600">Carcasa fija, rotor móvil y salida</text><text x="40" y="83" fill="#8393a9" font-size="18" text-anchor="start" font-weight="600">Carcasa exterior</text><path d="M198 77L221 106" fill="none" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M32 111H466L651 145M32 255H466L651 221" fill="none" stroke="#8393a9" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M126 112V147M126 221V253" fill="none" stroke="#8393a9" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M126 150 Q146 174 126 215" fill="none" stroke="#8393a9" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><path d="M240 150 Q260 174 240 215" fill="none" stroke="#f2c46d" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><circle cx="241" cy="222" r="7" fill="#f2c46d" stroke="#f2c46d" stroke-width="2"/><path d="M241 229L241 285" fill="none" stroke="#f2c46d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M241 285L63 285" fill="none" stroke="#f2c46d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-05-03-carcasa-y-descarga-gold)"/><path d="M306 183L376 151L536 183L376 215Z" fill="#112239" stroke="#8393a9" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M41 183L101 183" fill="none" stroke="#f2c46d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-05-03-carcasa-y-descarga-gold)"/><path d="M148 183Q180 173 207 183" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-05-03-carcasa-y-descarga-gold)"/><path d="M272 148H431L486 155" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-05-03-carcasa-y-descarga-gold)"/><path d="M272 222H431L486 213" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-05-03-carcasa-y-descarga-gold)"/><path d="M554 184L690 184" fill="none" stroke="#f2c46d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-05-03-carcasa-y-descarga-gold)"/><text x="125" y="331" fill="#edf3fa" font-size="18" text-anchor="middle" font-weight="400">Guías fijas</text><text x="125" y="357" fill="#edf3fa" font-size="18" text-anchor="middle" font-weight="400">Orientan el gas</text><path d="M126 302L126 259" fill="none" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="324" y="331" fill="#edf3fa" font-size="18" text-anchor="middle" font-weight="400">Rotor + eje</text><text x="324" y="357" fill="#edf3fa" font-size="18" text-anchor="middle" font-weight="400">Extraen trabajo</text><path d="M317 302L251 239" fill="none" stroke="#f2c46d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="554" y="331" fill="#edf3fa" font-size="18" text-anchor="middle" font-weight="400">Cono y tobera</text><text x="554" y="357" fill="#edf3fa" font-size="18" text-anchor="middle" font-weight="400">Organizan la salida</text><path d="M554 302L570 241" fill="none" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="24" y="385" fill="#b4c3d5" font-size="17" text-anchor="start" font-weight="400">La velocidad puede cambiar de modo distinto en cada tramo.</text><text x="24" y="403" fill="#b4c3d5" font-size="14" text-anchor="start" font-weight="400">Diagrama original · relaciones funcionales, no a escala.</text></g></svg>