<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="aem4-stage-06-02-energia-y-mision-title aem4-stage-06-02-energia-y-mision-desc"><title id="aem4-stage-06-02-energia-y-mision-title">Dos conversiones antes de mover el avión</title><desc id="aem4-stage-06-02-energia-y-mision-desc">La energía del combustible se convierte en trabajo de eje o energía del chorro, y el propulsor la aprovecha para mover la aeronave. Una turbina entrega trabajo de eje a una hélice; sus flechas muestran energía que permanece en la estela. Dos llaves separan rendimiento térmico y propulsivo.</desc><defs><marker id="aem4-stage-06-02-energia-y-mision-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64d8ec"/></marker><marker id="aem4-stage-06-02-energia-y-mision-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f2c46d"/></marker><marker id="aem4-stage-06-02-energia-y-mision-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ff9291"/></marker><marker id="aem4-stage-06-02-energia-y-mision-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8393a9"/></marker><marker id="aem4-stage-06-02-energia-y-mision-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8be2bd"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="420" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="34" fill="#edf3fa" font-size="23" text-anchor="start" font-weight="600">Dos conversiones antes de mover el avión</text><text x="38" y="77" fill="#f2c46d" font-size="18" text-anchor="start" font-weight="400">Combustible</text><text x="297" y="77" fill="#edf3fa" font-size="18" text-anchor="start" font-weight="400">Motor</text><text x="535" y="77" fill="#edf3fa" font-size="18" text-anchor="start" font-weight="400">Propulsor</text><path d="M72 148Q55 126 73 111Q78 131 87 117Q108 141 88 153Z" fill="#f2c46d" stroke="#f2c46d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M105 139L193 139" fill="none" stroke="#f2c46d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-06-02-energia-y-mision-gold)"/><path d="M204 104H366L392 124M204 174H366L392 154" fill="none" stroke="#8393a9" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M321 105 Q341 129 321 170" fill="none" stroke="#f2c46d" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><path d="M259 140L316 140" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-06-02-energia-y-mision-gold)"/><path d="M330 176L522 176" fill="none" stroke="#f2c46d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M547 164Q515 123 538 129L555 164M547 187Q579 230 556 221L539 187" fill="#64d8ec" stroke="#64d8ec" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="547" cy="176" r="12" fill="#f2c46d" stroke="#f2c46d" stroke-width="2"/><path d="M581 147L676 147" fill="none" stroke="#64d8ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-06-02-energia-y-mision-cyan)"/><path d="M581 175L676 175" fill="none" stroke="#64d8ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-06-02-energia-y-mision-cyan)"/><path d="M581 203L676 203" fill="none" stroke="#64d8ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-06-02-energia-y-mision-cyan)"/><text x="318" y="227" fill="#f2c46d" font-size="16" text-anchor="middle" font-weight="400">Trabajo de eje</text><text x="608" y="245" fill="#64d8ec" font-size="16" text-anchor="middle" font-weight="400">Estela</text><path d="M40 265V278H383V265" fill="none" stroke="#f2c46d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="211" y="306" fill="#f2c46d" font-size="19" text-anchor="middle" font-weight="600">Rendimiento térmico</text><path d="M410 265V278H687V265" fill="none" stroke="#64d8ec" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="549" y="306" fill="#64d8ec" font-size="18" text-anchor="middle" font-weight="600">Rendimiento propulsivo</text><text x="42" y="337" fill="#b4c3d5" font-size="17" text-anchor="start" font-weight="400">Cuánta energía se convierte</text><text x="42" y="361" fill="#b4c3d5" font-size="17" text-anchor="start" font-weight="400">en energía mecánica útil.</text><text x="408" y="337" fill="#b4c3d5" font-size="17" text-anchor="start" font-weight="400">Cuánta ayuda al vuelo y</text><text x="408" y="361" fill="#b4c3d5" font-size="17" text-anchor="start" font-weight="400">cuánta queda en el chorro.</text><text x="24" y="403" fill="#b4c3d5" font-size="14" text-anchor="start" font-weight="400">Diagrama original · relaciones funcionales, no a escala.</text></g></svg>