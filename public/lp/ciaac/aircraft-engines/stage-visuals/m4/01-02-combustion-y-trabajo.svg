<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="aem4-stage-01-02-combustion-y-trabajo-title aem4-stage-01-02-combustion-y-trabajo-desc"><title id="aem4-stage-01-02-combustion-y-trabajo-title">La llama calienta; la turbina mueve</title><desc id="aem4-stage-01-02-combustion-y-trabajo-desc">Corte esquemático: aire hacia llama, aire alrededor del revestimiento que refrigera y diluye, gas caliente hacia guías y rotor. Un eje devuelve trabajo desde el rotor al compresor.</desc><defs><marker id="aem4-stage-01-02-combustion-y-trabajo-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64d8ec"/></marker><marker id="aem4-stage-01-02-combustion-y-trabajo-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f2c46d"/></marker><marker id="aem4-stage-01-02-combustion-y-trabajo-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ff9291"/></marker><marker id="aem4-stage-01-02-combustion-y-trabajo-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8393a9"/></marker><marker id="aem4-stage-01-02-combustion-y-trabajo-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8be2bd"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="420" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="34" fill="#edf3fa" font-size="23" text-anchor="start" font-weight="600">La llama calienta; la turbina mueve</text><text x="34" y="74" fill="#64d8ec" font-size="17" text-anchor="start" font-weight="400">Aire del núcleo</text><text x="203" y="74" fill="#edf3fa" font-size="17" text-anchor="start" font-weight="400">Revestimiento</text><text x="478" y="74" fill="#edf3fa" font-size="17" text-anchor="start" font-weight="400">Guías</text><text x="575" y="74" fill="#edf3fa" font-size="17" text-anchor="start" font-weight="400">Rotor</text><path d="M45 105H650M45 250H650" fill="none" stroke="#8393a9" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M155 139H421L463 157M155 218H421L463 203" fill="none" stroke="#8393a9" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M38 178L158 178" fill="none" stroke="#64d8ec" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-01-02-combustion-y-trabajo-cyan)"/><path d="M173 178Q193 147 213 171Q235 145 267 178Q235 209 213 186Q193 208 173 178" fill="#f2c46d" stroke="#f2c46d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="156" y="167" width="16" height="22" rx="2" fill="#8393a9" stroke="none" stroke-width="2"/><path d="M164 124L164 166" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-01-02-combustion-y-trabajo-gold)"/><text x="121" y="96" fill="#f2c46d" font-size="14" text-anchor="start" font-weight="400">Combustible</text><path d="M201 121L401 121" fill="none" stroke="#64d8ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-01-02-combustion-y-trabajo-cyan)"/><path d="M201 234L401 234" fill="none" stroke="#64d8ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-01-02-combustion-y-trabajo-cyan)"/><path d="M310 121L323 158" fill="none" stroke="#64d8ec" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-01-02-combustion-y-trabajo-cyan)"/><path d="M310 234L323 201" fill="none" stroke="#64d8ec" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-01-02-combustion-y-traba