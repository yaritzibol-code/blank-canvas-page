text x="293" y="306" fill="#f2c46d" font-size="18" text-anchor="start" font-weight="400">Trabajo por el eje</text><text x="35" y="365" fill="#b4c3d5" font-size="17" text-anchor="start" font-weight="400">Combustión continua</text><text x="35" y="388" fill="#b4c3d5" font-size="17" text-anchor="start" font-weight="400">El gas entrega energía al rotor.</text><text x="24" y="403" fill="#b4c3d5" font-size="14" text-anchor="start" font-weight="400">Diagrama original · relaciones funcionales, no a escala.</text></g></svg>