<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="aem4-stage-02-03-calor-y-balance-title aem4-stage-02-03-calor-y-balance-desc"><title id="aem4-stage-02-03-calor-y-balance-title">Calor ideal y trabajo que queda</title><desc id="aem4-stage-02-03-calor-y-balance-desc">Dos gráficos presión-volumen muestran solo el aporte de calor: Otto vertical a volumen constante y Brayton horizontal a presión constante. Dos barras de 100 unidades separan 65 de compresor y 35 restantes, o 75 de compresor y 25 restantes.</desc><defs><marker id="aem4-stage-02-03-calor-y-balance-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64d8ec"/></marker><marker id="aem4-stage-02-03-calor-y-balance-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f2c46d"/></marker><marker id="aem4-stage-02-03-calor-y-balance-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ff9291"/></marker><marker id="aem4-stage-02-03-calor-y-balance-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8393a9"/></marker><marker id="aem4-stage-02-03-calor-y-balance-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8be2bd"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="420" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="34" fill="#edf3fa" font-size="23" text-anchor="start" font-weight="600">Calor ideal y trabajo que queda</text><text x="24" y="67" fill="#b4c3d5" font-size="17" text-anchor="start" font-weight="400">Aporte de calor ideal · gráficos cualitativos</text><path d="M75 190L75 96" fill="none" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-02-03-calor-y-balance-gray)"/><path d="M75 190L307 190" fill="none" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-02-03-calor-y-balance-gray)"/><text x="54" y="110" fill="#b4c3d5" font-size="17" text-anchor="start" font-weight="400">p</text><text x="308" y="209" fill="#b4c3d5" font-size="17" text-anchor="start" font-weight="400">v</text><text x="180" y="102" fill="#edf3fa" font-size="20" text-anchor="middle" font-weight="600">Otto</text><path d="M403 190L403 96" fill="none" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-02-03-calor-y-balance-gray)"/><path d="M403 190L635 190" fill="none" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-02-03-calor-y-balance-gray)"/><text x="382" y="110" fill="#b4c3d5" font-size="17" text-anchor="start" font-weight="400">p</text><text x="636" y="209" fill="#b4c3d5" font-size="17" text-anchor="start" font-weight="400">v</text><text x="508" y="102" fill="#edf3fa" font-size="20" text-anchor="middle" font-weight="600">Brayton</text><path d="M164 168L164 120" fill="none" stroke="#f2c46d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-02-03-calor-y-balance-gold)"/><text x="194" y="155" fill="#f2c46d" font-size="16" text-anchor="start" font-weight="400">V constante</text><path d="M438 145L597 145" fill="none" stroke="#f2c46d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-02-03-calor-y-balance-gold)"/><text x="515" y="176" fill="#f2c46d" font-size="16" text-anchor="middle" font-weight="400">p constante</text><text x="24" y="240" fill="#edf3fa" font-size="19" text-anchor="start" font-weight="600">Turbina: 100 unidades didácticas</text><rect x="126" y="263" width="325" height="34" rx="0" fill="#8393a9" stroke="none" stroke-width="2"/><rect x="451" y="263" width="175" height="34" rx="0" fill="#64d8ec" stroke="none" stroke-width="2"/><text x="24" y="287" fill="#edf3fa" font-size="18" text-anchor="start" font-weight="400">Caso A</text><text x="288.5" y="286" fill="#0b1728" font-size="18" text-anchor="middle" font-weight="600">65</text><text x="538.5" y="286" fill="#0b1728" font-size="18" text-anchor="middle" font-weight="600">35</text><rect x="126" y="317" width="375" height="34" rx="0" fill="#8393a9" stroke="none" stroke-width="2"/><rect x="501" y="317" width="125" height="34" rx="0" fill="#64d8ec" stroke="none" stroke-width="2"/><text x="24" y="341" fill="#edf3fa" font-size="18" text-anchor="start" font-weight="400">Caso B</text><text x="313.5" y="340" fill="#0b1728" font-size="18" text-anchor="middle" font-weight="600">75</text><text x="563.5" y="340" fill="#0b1728" font-size="18" text-anchor="middle" font-weight="600">25</text><rect x="131" y="371" width="13" height="13" rx="0" fill="#8393a9" stroke="none" stroke-width="2"/><text x="151" y="383" fill="#b4c3d5" font-size="16" text-anchor="start" font-weight="400">Compresor</text><rect x="354" y="371" width="13" height="13" rx="0" fill="#64d8ec" stroke="none" stroke-width="2"/><text x="374" y="383" fill="#b4c3d5" font-size="16" text-anchor="start" font-weight="400">Resto antes de otras pérdidas</text><text x="24" y="403" fill="#b4c3d5" font-size="14" text-anchor="start" font-weight="400">Diagrama original · relaciones funcionales, no a escala.</text></g></svg>