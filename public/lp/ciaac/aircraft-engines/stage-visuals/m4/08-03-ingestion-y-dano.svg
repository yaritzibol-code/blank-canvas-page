ke-linecap="round"/><text x="626" y="289" fill="#ff9291" font-size="17" text-anchor="middle" font-weight="400">Melladura</text><text x="25" y="368" fill="#b4c3d5" font-size="17" text-anchor="start" font-weight="400">Prevención: entrada limpia, herramientas controladas e inspección.</text><text x="24" y="403" fill="#b4c3d5" font-size="14" text-anchor="start" font-weight="400">Diagrama original · relaciones funcionales, no a escala.</text></g></svg>