<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="aem4-stage-08-03-ingestion-y-dano-title aem4-stage-08-03-ingestion-y-dano-desc"><title id="aem4-stage-08-03-ingestion-y-dano-title">FOD: seguir girando no descarta daño</title><desc id="aem4-stage-08-03-ingestion-y-dano-desc">Un trapo, un tornillo y una piedra representan tres agrupaciones didácticas de objetos extraños. Flechas llevan hacia una entrada de compresor y un álabe con una melladura ampliada. El rotor conserva una flecha de giro, que no demuestra ausencia de daño.</desc><defs><marker id="aem4-stage-08-03-ingestion-y-dano-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64d8ec"/></marker><marker id="aem4-stage-08-03-ingestion-y-dano-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f2c46d"/></marker><marker id="aem4-stage-08-03-ingestion-y-dano-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ff9291"/></marker><marker id="aem4-stage-08-03-ingestion-y-dano-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8393a9"/></marker><marker id="aem4-stage-08-03-ingestion-y-dano-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8be2bd"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="420" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="34" fill="#edf3fa" font-size="23" text-anchor="start" font-weight="600">FOD: seguir girando no descarta daño</text><text x="24" y="71" fill="#b4c3d5" font-size="17" text-anchor="start" font-weight="400">Agrupación didáctica por origen o material</text><path d="M45 106Q63 94 78 111L66 144Q47 132 36 143L45 106Z" fill="#64d8ec" stroke="#64d8ec" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="98" y="112" fill="#edf3fa" font-size="16" text-anchor="start" font-weight="400">Artificial no metálico</text><text x="98" y="135" fill="#edf3fa" font-size="16" text-anchor="start" font-weight="400">Trapo o plástico</text><path d="M46 178H66V188H60V226H52V188H46Z" fill="#8393a9" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M48 193L64 196" fill="none" stroke="#0b1728" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M48 201L64 204" fill="none" stroke="#0b1728" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M48 209L64 212" fill="none" stroke="#0b1728" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M48 217L64 220" fill="none" stroke="#0b1728" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="98" y="194" fill="#edf3fa" font-size="16" text-anchor="start" font-weight="400">Metálico</text><text x="98" y="217" fill="#edf3fa" font-size="16" text-anchor="start" font-weight="400">Tornillo o alambre</text><path d="M42 287L48 269L67 266L81 287L70 307L48 304Z" fill="#f2c46d" stroke="#f2c46d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="98" y="282" fill="#edf3fa" font-size="16" text-anchor="start" font-weight="400">Natural</text><text x="98" y="305" fill="#edf3fa" font-size="16" text-anchor="start" font-weight="400">Piedra, ave o hielo</text><path d="M300 119H335L386 177" fill="none" stroke="#ff9291" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-08-03-ingestion-y-dano-red)"/><path d="M288 203H374" fill="none" stroke="#ff9291" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-08-03-ingestion-y-dano-red)"/><path d="M288 290H335L386 230" fill="none"