<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="aem4-stage-07-01-cantidad-de-movimiento-title aem4-stage-07-01-cantidad-de-movimiento-desc"><title id="aem4-stage-07-01-cantidad-de-movimiento-title">Empuje: importa cuánto cambia el flujo</title><desc id="aem4-stage-07-01-cantidad-de-movimiento-desc">En el marco del motor, aire entra hacia la derecha y sale más rápido en ese sentido; el empuje sobre el motor apunta a la izquierda. Fórmula simplificada caudal por diferencia de velocidades. Paneles inferiores distinguen menor densidad y los efectos que compiten al cambiar velocidad de vuelo.</desc><defs><marker id="aem4-stage-07-01-cantidad-de-movimiento-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64d8ec"/></marker><marker id="aem4-stage-07-01-cantidad-de-movimiento-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f2c46d"/></marker><marker id="aem4-stage-07-01-cantidad-de-movimiento-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ff9291"/></marker><marker id="aem4-stage-07-01-cantidad-de-movimiento-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8393a9"/></marker><marker id="aem4-stage-07-01-cantidad-de-movimiento-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8be2bd"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="420" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="34" fill="#edf3fa" font-size="23" text-anchor="start" font-weight="600">Empuje: importa cuánto cambia el flujo</text><text x="25" y="68" fill="#b4c3d5" font-size="17" text-anchor="start" font-weight="400">Marco del motor · una corriente ideal</text><path d="M198 105H456L498 130M198 202H456L498 178" fill="none" stroke="#8393a9" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M33 155L176 155" fill="none" stroke="#64d8ec" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-07-01-cantidad-de-movimiento-cyan)"/><path d="M506 155L686 155" fill="none" stroke="#f2c46d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-07-01-cantidad-de-movimiento-gold)"/><text x="74" y="131" fill="#64d8ec" font-size="17" text-anchor="start" font-weight="400">Ventrada</text><text x="539" y="131" fill="#f2c46d" font-size="17" text-anchor="start" font-weight="400">Vsalida</text><path d="M410 92L248 92" fill="none" stroke="#8be2bd" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-07-01-cantidad-de-movimiento-green)"/><text x="330" y="79" fill="#8be2bd" font-size="17" text-anchor="middle" font-weight="400">Empuje</text><text x="360" y="240" fill="#edf3fa" font-size="21" text-anchor="middle" font-weight="600">F ≈ caudal másico × (Vsalida − Ventrada)</text><text x="360" y="268" fill="#b4c3d5" font-size="14" text-anchor="middle" font-weight="400">Presión de salida = ambiente · masa del combustible despreciada</text><rect x="24" y="286" width="235" height="97" rx="9" fill="#112239" stroke="none" stroke-width="2"/><text x="39" y="311" fill="#edf3fa" font-size="16" text-anchor="start" font-weight="400">Menor densidad</text><text x="39" y="337" fill="#edf3fa" font-size="16" text-anchor="start" font-weight="400">Menos masa disponible</text><text x="39" y="363" fill="#edf3fa" font-size="16" text-anchor="start" font-weight="400">Tendencia: empuje ↓</text><rect x="276" y="286" width="420" height="97" rx="9" fill="#112239" stroke="none" stroke-width="2"/><text x="291" y="309" fill="#edf3fa" font-size="16" text-anchor="start" font-weight="600">Al aumentar velocidad de vuelo:</text><text x="291" y="337" fill="#ff9291" font-size="17" text-anchor="start" font-weight="400">ΔV puede bajar</text><text x="478" y="337" fill="#64d8ec" font-size="15" text-anchor="start" font-weight="400">Recuperación puede subir</text><text x="291" y="367" fill="#b4c3d5" font-size="16" text-anchor="start" font-weight="400">El resultado depende del conjunto.</text><text x="24" y="403" fill="#b4c3d5" font-size="14" text-anchor="start" font-weight="400">Diagrama original · relaciones funcionales, no a escala.</text></g></svg>