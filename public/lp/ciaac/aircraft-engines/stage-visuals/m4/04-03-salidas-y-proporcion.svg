<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="aem4-stage-04-03-salidas-y-proporcion-title aem4-stage-04-03-salidas-y-proporcion-desc"><title id="aem4-stage-04-03-salidas-y-proporcion-title">Mezclar al salir no elimina la derivación</title><desc id="aem4-stage-04-03-salidas-y-proporcion-desc">Dos cortes comparan salidas separadas y una salida mezclada. En ambos, el aire de derivación rodea el núcleo y evita la cámara. Dos repartos proporcionales de 72 y 12, o 144 y 24 kilogramos por segundo, conservan relación seis a uno.</desc><defs><marker id="aem4-stage-04-03-salidas-y-proporcion-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64d8ec"/></marker><marker id="aem4-stage-04-03-salidas-y-proporcion-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f2c46d"/></marker><marker id="aem4-stage-04-03-salidas-y-proporcion-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ff9291"/></marker><marker id="aem4-stage-04-03-salidas-y-proporcion-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8393a9"/></marker><marker id="aem4-stage-04-03-salidas-y-proporcion-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8be2bd"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="420" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="34" fill="#edf3fa" font-size="23" text-anchor="start" font-weight="600">Mezclar al salir no elimina la derivación</text><text x="174" y="76" fill="#edf3fa" font-size="19" text-anchor="middle" font-weight="600">Salidas separadas</text><path d="M44 104H315M44 238H315" fill="none" stroke="#8393a9" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="92" y="141" width="136" height="60" rx="8" fill="#112239" stroke="#8393a9" stroke-width="2"/><text x="160" y="177" fill="#edf3fa" font-size="18" text-anchor="middle" font-weight="400">Núcleo</text><path d="M61 132L61 210" fill="none" stroke="#64d8ec" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M100 188L218 188" fill="none" stroke="#f2c46d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-04-03-salidas-y-proporcion-gold)"/><path d="M88 119L325 119" fill="none" stroke="#64d8ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-04-03-salidas-y-proporcion-cyan)"/><path d="M88 223L325 223" fill="none" stroke="#64d8ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-04-03-salidas-y-proporcion-cyan)"/><path d="M239 172L329 172" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-04-03-salidas-y-proporcion-gold)"/><text x="525" y="76" fill="#edf3fa" font-size="19" text-anchor="middle" font-weight="600">Salida mezclada</text><path d="M395 104H581L666 129M395 238H581L666 213" fill="none" stroke="#8393a9" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="443" y="141" width="136" height="60" rx="8" fill="#112239" stroke="#8393a9" stroke-width="2"/><text x="511" y="177" fill="#edf3fa" font-size="18" text-anchor="middle" font-weight="400">Núcleo</text><path d="M412 132L412 210" fill="none" stroke="#64d8ec" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M451 188L569 188" fill="none" stroke="#f2c46d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-04-03-salidas-y-proporcion-gold)"/><path d="M439 119H578L641 156" fill="none" stroke="#64d8ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-04-03-salidas-y-proporcion-cyan)"/><path d="M439 223H578L641 189" fill="none" stroke="#64d8ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-04-03-salidas-y-proporcion-cyan)"/><path d="M590 172L680 172" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aem4-stage-04-03-salidas-y-proporcion-gold)"/><text x="24" y="275" fill="#b4c3d5" font-size="17" text-anchor="start" font-weight="400">Azul: evita la cámara · Dorado: atraviesa el núcleo</text><text x="24" y="309" fill="#edf3fa" font-size="18" text-anchor="start" font-weight="600">Misma proporción, distinto caudal</text><rect x="24" y="326" width="330" height="26" rx="0" fill="#64d8ec" stroke="none" stroke-width="2"/><rect x="354" y="326" width="55" height="26" rx="0" fill="#f2c46d" stroke="none" stroke-width="2"/><text x="184" y="346" fill="#0b1728" font-size="16" text-anchor="middle" font-weight="600">72 kg/s</text><text x="381" y="345" fill="#0b1728" font-size="16" text-anchor="middle" font-weight="600">12</text><text x="442" y="346" fill="#edf3fa" font-size="18" text-anchor="start" font-weight="400">72 ÷ 12 = 6:1</text><rect x="24" y="361" width="330" height="26" rx="0" fill="#64d8ec" stroke="none" stroke-width="2"/><rect x="354" y="361" width="55" height="26" rx="0" fill="#f2c46d" stroke="none" stroke-width="2"/><text x="184" y="381" fill="#0b1728" font-size="16" text-anchor="middle" font-weight="600">144 kg/s</text><text x="381" y="380" fill="#0b1728" font-size="16" text-anchor="middle" font-weight="600">24</text><text x="442" y="381" fill="#edf3fa" font-size="18" text-anchor="start" font-weight="400">144 ÷ 24 = 6:1</text><text x="24" y="403" fill="#b4c3d5" font-size="14" text-anchor="start" font-weight="400">Diagrama original · relaciones funcionales, no a escala.</text></g></svg>