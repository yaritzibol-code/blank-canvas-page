t-anchor="middle" font-weight="400">≠</text><text x="24" y="270" fill="#edf3fa" font-size="18" text-anchor="start" font-weight="600">Dos aplicaciones alternativas</text><rect x="47" y="295" width="156" height="46" rx="10" fill="#112239" stroke="#f2c46d" stroke-width="2"/><text x="125" y="324" fill="#edf3fa" font-size="18" text-anchor="middle" font-weight="400">Reductora</text><path d="M204 319L250 319" fill="none" stroke="#f2c46d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="269" cy="319" r="12" fill="#f2c46d" stroke="#f2c46d" stroke-width="2"/><path d="M269 306Q241 273 264 278L277 307M269 331Q297 365 274 361L261 331" fill="#64d8ec" stroke="#64d8ec" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="244" y="382" fill="#64d8ec" font-size="16" text-anchor="start" font-weight="400">Hélice</text><rect x="393" y="295" width="169" height="46" rx="10" fill="#112239" stroke="#f2c46d" stroke-width="2"/><text x="477" y="324" fill="#edf3fa" font-size="18" text-anchor="middle" font-weight="400">Transmisión</text><path d="M562 319H626V293" fill="none" stroke="#f2c46d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M581 285L670 278L670 285L581 292Z" fill="#64d8ec" stroke="#64d8ec" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="593" y="375" fill="#64d8ec" font-size="16" text-anchor="start" font-weight="400">Rotor</text><text x="24" y="403" fill="#b4c3d5" font-size="14" text-anchor="start" font-weight="400">Diagrama original · relaciones funcionales, no a escala.</text></g></svg>