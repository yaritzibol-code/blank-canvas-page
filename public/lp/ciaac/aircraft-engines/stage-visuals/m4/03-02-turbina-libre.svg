<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="aem4-stage-03-02-turbina-libre-title aem4-stage-03-02-turbina-libre-desc"><title id="aem4-stage-03-02-turbina-libre-title">Turbina libre: energía sin unir los ejes</title><desc id="aem4-stage-03-02-turbina-libre-desc">Un generador de gas contiene compresor, combustión y su turbina unidos por un eje. El gas acciona después una turbina libre con eje independiente. Dos aplicaciones alternativas conectan la potencia a reductora y hélice o a transmisión y rotor.</desc><defs><marker id="aem4-stage-03-02-turbina-libre-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64d8ec"/></marker><marker id="aem4-stage-03-02-turbina-libre-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f2c46d"/></marker><marker id="aem4-stage-03-02-turbina-libre-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ff9291"/></marker><marker id="aem4-stage-03-02-turbina-libre-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8393a9"/></marker><marker id="aem4-stage-03-02-turbina-libre-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8be2bd"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="420" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="34" fill="#edf3fa" font-size="23" text-anchor="start" font-weight="600">Turbina libre: energía sin unir los ejes</text><text x="37" y="74" fill="#edf3fa" font-size="18" text-anchor="start" font-weight="600">Generador de gas</text><text x="472" y="74" fill="#edf3fa" font-siz