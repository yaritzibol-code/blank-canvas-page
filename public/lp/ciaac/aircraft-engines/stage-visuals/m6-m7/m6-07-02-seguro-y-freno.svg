<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="ae-stage-m6-07-02-seguro-y-freno-title ae-stage-m6-07-02-seguro-y-freno-desc"><title id="ae-stage-m6-07-02-seguro-y-freno-title">Mover y asegurar; frenar y disipar calor</title><desc id="ae-stage-m6-07-02-seguro-y-freno-desc">A la izquierda, un actuador mueve un tren articulado, un seguro mantiene la posición y un sensor comunica su estado. A la derecha, dos balatas presionan las caras de un disco unido a la rueda; la fricción transforma movimiento en calor.</desc><defs><marker id="ae-stage-m6-07-02-seguro-y-freno-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64d8ec"/></marker><marker id="ae-stage-m6-07-02-seguro-y-freno-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f2c46d"/></marker><marker id="ae-stage-m6-07-02-seguro-y-freno-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ff9291"/></marker><marker id="ae-stage-m6-07-02-seguro-y-freno-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8393a9"/></marker><marker id="ae-stage-m6-07-02-seguro-y-freno-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8be2bd"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="440" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="34" fill="#edf3fa" font-size="23" text-anchor="start" font-weight="600">Mover y asegurar; frenar y disipar calor</text><rect x="24" y="88" width="322" height="274" rx="12" fill="#112239" stroke="none" stroke-width="2"/><rect x="374" y="88" width="322" height="274" rx="12" fill="#112239" stroke="none" stroke-width="2"/><text x="47" y="120" fill="#edf3fa" font-size="17" text-anchor="start" font-weight="600">Tren: funciones distintas</text><path d="M74 146L303 146" fill="none" stroke="#8393a9" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="176" cy="150" r="9" fill="#112239" stroke="#f2c46d" stroke-width="2"/><path d="M180 158L213 275" fill="none" stroke="#8393a9" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/><circle cx="221" cy="298" r="26" fill="#0b1728" stroke="#8393a9" stroke-width="5"/><path d="M87 153L171 229" fill="none" stroke="#64d8ec" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/><path d="M161 220L200 256" fill="none" stroke="#f2c46d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="43" y="252" fill="#64d8ec" font-size="16" text-anchor="start" font-weight="400">Actuador</text><path d="M208 171L282 219L211 267" fill="none" stroke="#f2c46d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="268" y="206" width="28" height="26" rx="3" fill="#112239" stroke="#f2c46d" stroke-width="2"/><text x="261" y="193" fill="#f2c46d" font-size="16" text-anchor="start" font-weight="400">Seguro</text><rect x="233" y="266" width="18" height="15" rx="2" fill="#64d8ec" stroke="none" stroke-width="2"/><path d="M253 274H311V325" fill="none" stroke="#64d8ec" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="235" y="345" fill="#64d8ec" font-size="16" text-anchor="start" font-weight="400">Sensor</text><text x="405" y="120" fill="#edf3fa" font-size="16" text-anchor="start" font-weight="600">Disco y material de fricción</text><rect x="528" y="158" width="29" height="163" rx="3" fill="#8393a9" stroke="none" stroke-width="2"/><path d="M558 242L650 242" fill="none" stroke="#8393a9" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><rect x="501" y="192" width="18" height="84" rx="3" fill="#f2c46d" stroke="none" stroke-width="2"/><rect x="566" y="192" width="18" height="84" rx="3" fill="#f2c46d" stroke="none" stroke-width="2"/><path d="M483 283V174H606V283" fill="none" stroke="#8393a9" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M428 224L492 224" fill="none" stroke="#64d8ec" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-07-02-seguro-y-freno-cyan)"/><path d="M649 224L593 224" fill="none" stroke="#64d8ec" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-07-02-seguro-y-freno-cyan)"/><path d="M522 149Q532 136 523 129M556 149Q566 136 557 129" fill="none" stroke="#ff9291" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="600" y="162" fill="#ff9291" font-size="16" text-anchor="start" font-weight="400">Calor</text><text x="429" y="342" fill="#b4c3d5" font-size="16" text-anchor="start" font-weight="400">Pinza fija / disco giratorio</text><text x="24" y="388" fill="#b4c3d5" font-size="16" text-anchor="start" font-weight="400">Seleccionar ≠ confirmar posición · fricción convierte energía en calor.</text><text x="24" y="423" fill="#b4c3d5" font-size="14" text-anchor="start" font-weight="400">Diagrama original · relaciones funcionales, no a escala.</text></g></svg>