<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="ae-stage-m6-02-01-reserva-y-caudal-title ae-stage-m6-02-01-reserva-y-caudal-desc"><title id="ae-stage-m6-02-01-reserva-y-caudal-title">Presión almacenada; flujo que trabaja</title><desc id="ae-stage-m6-02-01-reserva-y-caudal-desc">Dos estados conceptuales de un depósito neumático. Con la válvula cerrada hay aire almacenado y presión, pero no caudal. Con una trayectoria abierta el aire entra en un cilindro, ejerce fuerza en el pistón y produce movimiento, consumiendo reserva.</desc><defs><marker id="ae-stage-m6-02-01-reserva-y-caudal-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64d8ec"/></marker><marker id="ae-stage-m6-02-01-reserva-y-caudal-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f2c46d"/></marker><marker id="ae-stage-m6-02-01-reserva-y-caudal-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ff9291"/></marker><marker id="ae-stage-m6-02-01-reserva-y-caudal-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8393a9"/></marker><marker id="ae-stage-m6-02-01-reserva-y-caudal-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8be2bd"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="440" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="34" fill="#edf3fa" font-size="23" text-anchor="start" font-weight="600">Presión almacenada; flujo que trabaja</text><text x="174" y="81" fill="#edf3fa" font-size="18" text-anchor="middle" font-weight="600">Trayectoria cerrada</text><rect x="46" y="108" width="112" height="151" rx="24" fill="#112239" stroke="#8393a9" stroke-width="2"/><circle cx="66" cy="140" r="4" fill="#64d8ec" stroke="#64d8ec" stroke-width="1"/><circle cx="103" cy="136" r="4" fill="#64d8ec" stroke="#64d8ec" stroke-width="1"/><circle cx="129" cy="156" r="4" fill="#64d8ec" stroke="#64d8ec" stroke-width="1"/><circle cx="73" cy="192" r="4" fill="#64d8ec" stroke="#64d8ec" stroke-width="1"/><circle cx="119" cy="205" r="4" fill="#64d8ec" stroke="#64d8ec" stroke-width="1"/><circle cx="85" cy="232" r="4" fill="#64d8ec" stroke="#64d8ec" stroke-width="1"/><circle cx="120" cy="236" r="4" fill="#64d8ec" stroke="#64d8ec" stroke-width="1"/><circle cx="105" cy="107" r="24" fill="#112239" stroke="#8393a9" stroke-width="2"/><path d="M105 107L118 91" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="527" y="81" fill="#edf3fa" font-size="18" text-anchor="middle" font-weight="600">Trayectoria abierta</text><rect x="399" y="108" width="112" height="151" rx="24" fill="#112239" stroke="#8393a9" stroke-width="2"/><circle cx="419" cy="140" r="4" fill="#64d8ec" stroke="#64d8ec" stroke-width="1"/><circle cx="456" cy="136" r="4" fill="#64d8ec" stroke="#64d8ec" stroke-width="1"/><circle cx="482" cy="156" r="4" fill="#64d8ec" stroke="#64d8ec" stroke-width="1"/><circle cx="426" cy="192" r="4" fill="#64d8ec" stroke="#64d8ec" stroke-width="1"/><circle cx="472" cy="205" r="4" fill="#64d8ec" stroke="#64d8ec" stroke-width="1"/><circle cx="438" cy="232" r="4" fill="#64d8ec" stroke="#64d8ec" stroke-width="1"/><circle cx="473" cy="236" r="4" fill="#64d8ec" stroke="#64d8ec" stroke-width="1"/><circle cx="458" cy="107" r="24" fill="#112239" stroke="#8393a9" stroke-width="2"/><path d="M458 107L471 91" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M158 198L319 198" fill="none" stroke="#64d8ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M201 184L224 210M224 184L201 210" fill="none" stroke="#ff9291" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="206" y="244" fill="#ff9291" font-size="17" text-anchor="start" font-weight="400">Sin caudal</text><path d="M511 197L546 197" fill="none" stroke="#64d8ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-02-01-reserva-y-caudal-cyan)"/><rect x="559" y="162" width="117" height="71" rx="4" fill="#112239" stroke="#8393a9" stroke-width="2"/><path d="M618 165L618 230" fill="none" stroke="#f2c46d" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M621 197L696 197" fill="none" stroke="#f2c46d" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M582 185L610 185" fill="none" stroke="#64d8ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-02-01-reserva-y-caudal-cyan)"/><path d="M647 150L687 150" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-02-01-reserva-y-caudal-gold)"/><text x="38" y="308" fill="#b4c3d5" font-size="17" text-anchor="start" font-weight="400">La botella conserva presión.</text><text x="38" y="334" fill="#b4c3d5" font-size="17" text-anchor="start" font-weight="400">No hay trayectoria de salida.</text><text x="385" y="308" fill="#b4c3d5" font-size="17" text-anchor="start" font-weight="400">El gas empuja el pistón.</text><text x="385" y="334" fill="#b4c3d5" font-size="17" text-anchor="start" font-weight="400">La reserva se consume.</text><text x="24" y="379" fill="#edf3fa" font-size="17" text-anchor="start" font-weight="400">Botella, compresor o sangrado: identifica la fuente del modelo.</text><text x="24" y="423" fill="#b4c3d5" font-size="14" text-anchor="start" font-weight="400">Diagrama original · relaciones funcionales, no a escala.</text></g></svg>