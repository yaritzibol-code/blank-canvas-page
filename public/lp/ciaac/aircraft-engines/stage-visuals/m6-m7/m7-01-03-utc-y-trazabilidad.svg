<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="ae-stage-m7-01-03-utc-y-trazabilidad-title ae-stage-m7-01-03-utc-y-trazabilidad-desc"><title id="ae-stage-m7-01-03-utc-y-trazabilidad-title">Un tiempo común y un registro trazable</title><desc id="ae-stage-m7-01-03-utc-y-trazabilidad-desc">El grupo fecha-hora 051430 se separa en día 05, hora 14 y minuto 30, todos referidos a UTC. Un reloj ilustra 14:30. Un registro conserva un dato anterior y una corrección identificada para mostrar trazabilidad, sin afirmar un formulario obligatorio universal.</desc><defs><marker id="ae-stage-m7-01-03-utc-y-trazabilidad-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64d8ec"/></marker><marker id="ae-stage-m7-01-03-utc-y-trazabilidad-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f2c46d"/></marker><marker id="ae-stage-m7-01-03-utc-y-trazabilidad-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ff9291"/></marker><marker id="ae-stage-m7-01-03-utc-y-trazabilidad-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8393a9"/></marker><marker id="ae-stage-m7-01-03-utc-y-trazabilidad-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8be2bd"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="440" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="34" fill="#edf3fa" font-size="23" text-anchor="start" font-weight="600">Un tiempo común y un registro trazable</text><text x="24" y="73" fill="#edf3fa" font-size="18" text-anchor="start" font-weight="600">Grupo fecha-hora de seis cifras</text><rect x="39" y="100" width="145" height="79" rx="12" fill="#112239" stroke="#64d8ec" stroke-width="2"/><text x="111" y="155" fill="#64d8ec" font-size="43" text-anchor="middle" font-weight="600">05</text><text x="111" y="208" fill="#edf3fa" font-size="18" text-anchor="middle" font-weight="400">Día</text><rect x="225" y="100" width="145" height="79" rx="12" fill="#112239" stroke="#f2c46d" stroke-width="2"/><text x="297" y="155" fill="#f2c46d" font-size="43" text-anchor="middle" font-weight="600">14</text><text x="297" y="208" fill="#edf3fa" font-size="18" text-anchor="middle" font-weight="400">Hora</text><rect x="411" y="100" width="145" height="79" rx="12" fill="#112239" stroke="#8be2bd" stroke-width="2"/><text x="483" y="155" fill="#8be2bd" font-size="43" text-anchor="middle" font-weight="600">30</text><text x="483" y="208" fill="#edf3fa" font-size="18" text-anchor="middle" font-weight="400">Minuto</text><circle cx="635" cy="139" r="43" fill="#112239" stroke="#8393a9" stroke-width="3"/><path d="M635 139L657 133" fill="none" stroke="#f2c46d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M635 139L635 172" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="635" y="207" fill="#edf3fa" font-size="20" text-anchor="middle" font-weight="600">UTC</text><text x="24" y="247" fill="#b4c3d5" font-size="19" text-anchor="start" font-weight="400">051430 = día 05, 14:30 UTC · no incluye mes ni año.</text><rect x="29" y="278" width="656" height="100" rx="10" fill="#112239" stroke="none" stroke-width="2"/><path d="M52 296H89V359H52Z" fill="none" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 310L81 310" fill="none" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 325L81 325" fill="none" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 339L81 339" fill="none" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="116" y="309" fill="#edf3fa" font-size="18" text-anchor="start" font-weight="600">Registro claro</text><text x="116" y="342" fill="#b4c3d5" font-size="17" text-anchor="start" font-weight="400">Dato anterior</text><path d="M116 336L225 336" fill="none" stroke="#ff9291" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M251 337L313 337" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m7-01-03-utc-y-trazabilidad-gold)"/><text x="329" y="344" fill="#f2c46d" font-size="17" text-anchor="start" font-weight="400">Corrección identificable</text><text x="24" y="423" fill="#b4c3d5" font-size="14" text-anchor="start" font-weight="400">Diagrama original · relaciones funcionales, no a escala.</text></g></svg>