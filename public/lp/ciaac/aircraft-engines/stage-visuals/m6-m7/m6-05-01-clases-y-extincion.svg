<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="ae-stage-m6-05-01-clases-y-extincion-title ae-stage-m6-05-01-clases-y-extincion-desc"><title id="ae-stage-m6-05-01-clases-y-extincion-title">Identificar el fuego y el mecanismo</title><desc id="ae-stage-m6-05-01-clases-y-extincion-desc">Tres símbolos explican la convención FAA estudiada: papel para sólidos ordinarios A, recipiente de líquido inflamable para B y un circuito energizado para C. Abajo, combustible, oxidante y calor sostienen la combustión; la extinción puede actuar sobre esas condiciones o interrumpir la reacción.</desc><defs><marker id="ae-stage-m6-05-01-clases-y-extincion-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64d8ec"/></marker><marker id="ae-stage-m6-05-01-clases-y-extincion-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f2c46d"/></marker><marker id="ae-stage-m6-05-01-clases-y-extincion-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ff9291"/></marker><marker id="ae-stage-m6-05-01-clases-y-extincion-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8393a9"/></marker><marker id="ae-stage-m6-05-01-clases-y-extincion-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8be2bd"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="440" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="34" fill="#edf3fa" font-size="23" text-anchor="start" font-weight="600">Identificar el fuego y el mecanismo</text><text x="24" y="70" fill="#b4c3d5" font-size="17" text-anchor="start" font-weight="400">Convención FAA de la fuente estudiada</text><rect x="30" y="90" width="196" height="123" rx="12" fill="#112239" stroke="none" stroke-width="2"/><text x="128" y="193" fill="#edf3fa" font-size="17" text-anchor="middle" font-weight="600">A · Sólidos</text><rect x="264" y="90" width="196" height="123" rx="12" fill="#112239" stroke="none" stroke-width="2"/><text x="362" y="193" fill="#edf3fa" font-size="17" text-anchor="middle" font-weight="600">B · Líquidos</text><rect x="498" y="90" width="196" height="123" rx="12" fill="#112239" stroke="none" stroke-width="2"/><text x="596" y="193" fill="#edf3fa" font-size="17" text-anchor="middle" font-weight="600">C · Energizado</text><path d="M83 112H157V155H83Z" fill="none" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M98 122L143 122" fill="none" stroke="#b4c3d5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M98 133L138 133" fill="none" stroke="#b4c3d5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M98 144L145 144" fill="none" stroke="#b4c3d5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="327" y="109" width="58" height="49" rx="6" fill="#112239" stroke="#8393a9" stroke-width="2"/><rect x="340" y="99" width="31" height="9" rx="1" fill="#8393a9" stroke="none" stroke-width="2"/><path d="M329 137Q346 129 355 138T383 138V156H329Z" fill="#f2c46d" stroke="#f2c46d" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M562 111H630V157H562Z" fill="none" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M603 106L583 138H600L590 164L617 126H599Z" fill="#f2c46d" stroke="#f2c46d" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="360" y="244" fill="#edf3fa" font-size="20" text-anchor="middle" font-weight="600">¿Qué sostiene la combustión?</text><path d="M193 319L359 274L523 319Z" fill="none" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="194" cy="320" r="11" fill="#f2c46d" stroke="#f2c46d" stroke-width="2"/><circle cx="359" cy="275" r="11" fill="#64d8ec" stroke="#64d8ec" stroke-width="2"/><circle cx="524" cy="320" r="11" fill="#ff9291" stroke="#ff9291" stroke-width="2"/><text x="91" y="358" fill="#f2c46d" font-size="18" text-anchor="start" font-weight="400">Combustible</text><text x="360" y="309" fill="#64d8ec" font-size="18" text-anchor="middle" font-weight="400">Oxidante</text><text x="554" y="358" fill="#ff9291" font-size="18" text-anchor="start" font-weight="400">Calor</text><text x="360" y="386" fill="#b4c3d5" font-size="17" text-anchor="middle" font-weight="400">Enfriar, reducir oxidante o interrumpir la reacción.</text><text x="24" y="423" fill="#b4c3d5" font-size="14" text-anchor="start" font-weight="400">Diagrama original · relaciones funcionales, no a escala.</text></g></svg>