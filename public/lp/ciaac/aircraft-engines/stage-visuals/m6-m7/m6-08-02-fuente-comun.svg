<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="ae-stage-m6-08-02-fuente-comun-title ae-stage-m6-08-02-fuente-comun-desc"><title id="ae-stage-m6-08-02-fuente-comun-title">Dos indicaciones pueden compartir una falla</title><desc id="ae-stage-m6-08-02-fuente-comun-desc">Dos instrumentos, actitud y giro direccional, reciben aire y descargan hacia una misma bomba de vacío. Las dos ramas convergen antes de la bomba. Si esa fuente pierde capacidad, puede disminuir el giro de ambos; sus indicaciones no son comprobaciones independientes.</desc><defs><marker id="ae-stage-m6-08-02-fuente-comun-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64d8ec"/></marker><marker id="ae-stage-m6-08-02-fuente-comun-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f2c46d"/></marker><marker id="ae-stage-m6-08-02-fuente-comun-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ff9291"/></marker><marker id="ae-stage-m6-08-02-fuente-comun-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8393a9"/></marker><marker id="ae-stage-m6-08-02-fuente-comun-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8be2bd"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="440" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="34" fill="#edf3fa" font-size="23" text-anchor="start" font-weight="600">Dos indicaciones pueden compartir una falla</text><text x="92" y="79" fill="#edf3fa" font-size="20" text-anchor="start" font-weight="600">Actitud</text><text x="430" y="79" fill="#edf3fa" font-size="20" text-anchor="start" font-weight="600">Giro direccional</text><circle cx="181" cy="162" r="63" fill="#112239" stroke="#8393a9" stroke-width="3"/><path d="M120 162A61 61 0 0 1 242 162Z" fill="#195061" stroke="#64d8ec" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M120 162A61 61 0 0 0 242 162Z" fill="#69512d" stroke="#f2c46d" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><path d="M129 162L233 162" fill="none" stroke="#edf3fa" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M151 160H174L181 165L188 160H211" fill="none" stroke="#f2c46d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="527" cy="162" r="63" fill="#112239" stroke="#8393a9" stroke-width="3"/><text x="527" y="128" fill="#b4c3d5" font-size="17" text-anchor="middle" font-weight="400">N</text><text x="527" y="211" fill="#b4c3d5" font-size="17" text-anchor="middle" font-weight="400">S</text><text x="483" y="169" fill="#b4c3d5" font-size="17" text-anchor="middle" font-weight="400">O</text><text x="571" y="169" fill="#b4c3d5" font-size="17" text-anchor="middle" font-weight="400">E</text><path d="M527 184L527 142" fill="none" stroke="#f2c46d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-08-02-fuente-comun-gold)"/><path d="M181 90L181 102" fill="none" stroke="#64d8ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-08-02-fuente-comun-cyan)"/><path d="M181 226V274H354V300" fill="none" stroke="#64d8ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-08-02-fuente-comun-cyan)"/><path d="M527 90L527 102" fill="none" stroke="#64d8ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-08-02-fuente-comun-cyan)"/><path d="M527 226V274H354V300" fill="none" stroke="#64d8ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-08-02-fuente-comun-cyan)"/><circle cx="354" cy="331" r="29" fill="#112239" stroke="#8393a9" stroke-width="3"/><path d="M341 350L341 312L369 331Z" fill="#64d8ec" stroke="#64d8ec" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M384 331L430 331" fill="none" stroke="#64d8ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-08-02-fuente-comun-cyan)"/><text x="24" y="307" fill="#64d8ec" font-size="16" text-anchor="start" font-weight="400">Flujo hacia la bomba</text><text x="434" y="329" fill="#edf3fa" font-size="18" text-anchor="start" font-weight="400">Bomba común</text><text x="434" y="354" fill="#ff9291" font-size="16" text-anchor="start" font-weight="400">Pérdida de succión → giro ↓</text><text x="24" y="389" fill="#b4c3d5" font-size="18" text-anchor="start" font-weight="400">Coincidir no demuestra independencia ni fiabilidad.</text><text x="24" y="423" fill="#b4c3d5" font-size="14" text-anchor="start" font-weight="400">Diagrama original · relaciones funcionales, no a escala.</text></g></svg>