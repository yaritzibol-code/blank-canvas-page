<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="ae-stage-m6-03-02-barras-y-proteccion-title ae-stage-m6-03-02-barras-y-proteccion-desc"><title id="ae-stage-m6-03-02-barras-y-proteccion-title">La barra reparte; la protección interrumpe</title><desc id="ae-stage-m6-03-02-barras-y-proteccion-desc">Una fuente alimenta un amperímetro en serie y una barra de distribución. Dos ramas tienen protección: una está abierta y deja su carga aislada; otra permanece conectada. Un voltímetro se conecta entre barra y retorno para medir diferencia de potencial.</desc><defs><marker id="ae-stage-m6-03-02-barras-y-proteccion-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64d8ec"/></marker><marker id="ae-stage-m6-03-02-barras-y-proteccion-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f2c46d"/></marker><marker id="ae-stage-m6-03-02-barras-y-proteccion-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ff9291"/></marker><marker id="ae-stage-m6-03-02-barras-y-proteccion-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8393a9"/></marker><marker id="ae-stage-m6-03-02-barras-y-proteccion-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8be2bd"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="440" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="34" fill="#edf3fa" font-size="23" text-anchor="start" font-weight="600">La barra reparte; la protección interrumpe</text><rect x="28" y="142" width="122" height="65" rx="10" fill="#112239" stroke="#8393a9" stroke-width="2"/><text x="89" y="180" fill="#edf3fa" font-size="19" text-anchor="middle" font-weight="400">Fuente</text><path d="M150 174L187 174" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="214" cy="174" r="26" fill="#112239" stroke="#f2c46d" stroke-width="2"/><text x="214" y="182" fill="#f2c46d" font-size="21" text-anchor="middle" font-weight="400">A</text><path d="M240 174L293 174" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M293 99L293 292" fill="none" stroke="#f2c46d" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><text x="278" y="76" fill="#f2c46d" font-size="18" text-anchor="start" font-weight="400">Barra</text><path d="M296 115L382 115" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M383 115L413 96M421 115H516" fill="none" stroke="#ff9291" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="532" y="91" width="146" height="47" rx="10" fill="#112239" stroke="#8393a9" stroke-width="2"/><text x="605" y="121" fill="#b4c3d5" font-size="16" text-anchor="middle" font-weight="400">Carga aislada</text><text x="351" y="157" fill="#ff9291" font-size="16" text-anchor="start" font-weight="400">Protección abierta</text><path d="M297 223L393 223" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="397" y="215" width="34" height="16" rx="1" fill="#112239" stroke="#f2c46d" stroke-width="2"/><path d="M432 223L516 223" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="532" y="199" width="146" height="47" rx="10" fill="#112239" stroke="#f2c46d" stroke-width="2"/><text x="605" y="229" fill="#edf3fa" font-size="14" text-anchor="middle" font-weight="400">Carga alimentada</text><path d="M293 276H363V303" fill="none" stroke="#f2c46d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="363" cy="328" r="24" fill="#112239" stroke="#64d8ec" stroke-width="2"/><text x="363" y="336" fill="#64d8ec" font-size="21" text-anchor="middle" font-weight="400">V</text><path d="M363 353V370H89V209" fill="none" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M604 248V370H363" fill="none" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="111" y="291" fill="#b4c3d5" font-size="15" text-anchor="start" font-weight="400">A: corriente</text><text x="111" y="313" fill="#b4c3d5" font-size="15" text-anchor="start" font-weight="400">en ese punto</text><text x="408" y="336" fill="#b4c3d5" font-size="16" text-anchor="start" font-weight="400">V: diferencia de potencial</text><text x="459" y="385" fill="#8393a9" font-size="14" text-anchor="start" font-weight="400">Retorno</text><text x="24" y="423" fill="#b4c3d5" font-size="14" text-anchor="start" font-weight="400">Diagrama original · relaciones funcionales, no a escala.</text></g></svg>