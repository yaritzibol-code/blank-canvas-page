<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="ae-stage-m6-07-01-configuraciones-tren-title ae-stage-m6-07-01-configuraciones-tren-desc"><title id="ae-stage-m6-07-01-configuraciones-tren-title">La posición de apoyos define la disposición</title><desc id="ae-stage-m6-07-01-configuraciones-tren-desc">Tres vistas laterales de una aeronave comparan tren convencional con rueda de cola, triciclo con rueda de nariz, y tándem con apoyos principales en línea longitudinal. La disposición de apoyos es independiente de que el tren sea fijo o retráctil.</desc><defs><marker id="ae-stage-m6-07-01-configuraciones-tren-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64d8ec"/></marker><marker id="ae-stage-m6-07-01-configuraciones-tren-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f2c46d"/></marker><marker id="ae-stage-m6-07-01-configuraciones-tren-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ff9291"/></marker><marker id="ae-stage-m6-07-01-configuraciones-tren-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8393a9"/></marker><marker id="ae-stage-m6-07-01-configuraciones-tren-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8be2bd"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="440" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="34" fill="#edf3fa" font-size="23" text-anchor="start" font-weight="600">La posición de apoyos define la disposición</text><path d="M52 113Q39 105 65 97L263 97L287 61H304L303 104L338 108L324 117H75Z" fill="#112239" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M136 107L199 79H218L185 117Z" fill="#112239" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M194 114L194 120" fill="none" stroke="#8393a9" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="194" cy="135" r="15" fill="#112239" stroke="#f2c46d" stroke-width="3"/><path d="M308 114L308 134" fill="none" stroke="#8393a9" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="308" cy="142" r="8" fill="#112239" stroke="#f2c46d" stroke-width="3"/><path d="M35 150L343 150" fill="none" stroke="#8393a9" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="404" y="126" fill="#edf3fa" font-size="22" text-anchor="start" font-weight="600">Convencional</text><path d="M52 218Q39 210 65 202L263 202L287 166H304L303 209L338 213L324 222H75Z" fill="#112239" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M136 212L199 184H218L185 222Z" fill="#112239" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M87 219L87 235" fill="none" stroke="#8393a9" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="87" cy="245" r="10" fill="#112239" stroke="#f2c46d" stroke-width="3"/><path d="M212 219L212 225" fill="none" stroke="#8393a9" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="212" cy="240" r="15" fill="#112239" stroke="#f2c46d" stroke-width="3"/><path d="M35 255L343 255" fill="none" stroke="#8393a9" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="404" y="231" fill="#edf3fa" font-size="22" text-anchor="start" font-weight="600">Triciclo</text><path d="M52 323Q39 315 65 307L263 307L287 271H304L303 314L338 318L324 327H75Z" fill="#112239" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M136 317L199 289H218L185 327Z" fill="#112239" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M125 324L125 334" fill="none" stroke="#8393a9" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="125" cy="347" r="13" fill="#112239" stroke="#f2c46d" stroke-width="3"/><path d="M278 324L278 334" fill="none" stroke="#8393a9" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="278" cy="347" r="13" fill="#112239" stroke="#f2c46d" stroke-width="3"/><path d="M35 360L343 360" fill="none" stroke="#8393a9" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="404" y="336" fill="#edf3fa" font-size="22" text-anchor="start" font-weight="600">Tándem</text><text x="24" y="389" fill="#b4c3d5" font-size="16" text-anchor="start" font-weight="400">Fijo o retráctil es otra clasificación · vista lateral simplificada.</text><text x="24" y="423" fill="#b4c3d5" font-size="14" text-anchor="start" font-weight="400">Diagrama original · relaciones funcionales, no a escala.</text></g></svg>