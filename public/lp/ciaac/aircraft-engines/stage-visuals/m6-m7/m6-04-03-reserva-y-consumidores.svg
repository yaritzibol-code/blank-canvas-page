<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="ae-stage-m6-04-03-reserva-y-consumidores-title ae-stage-m6-04-03-reserva-y-consumidores-desc"><title id="ae-stage-m6-04-03-reserva-y-consumidores-title">Guardar líquido no equivale a bombearlo</title><desc id="ae-stage-m6-04-03-reserva-y-consumidores-desc">Un depósito guarda líquido; la bomba lo envía a una línea que alimenta un actuador de tren, un freno y un mando como aplicaciones posibles. Una fuga en la línea común pierde fluido de la reserva. El retorno vuelve al depósito.</desc><defs><marker id="ae-stage-m6-04-03-reserva-y-consumidores-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64d8ec"/></marker><marker id="ae-stage-m6-04-03-reserva-y-consumidores-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f2c46d"/></marker><marker id="ae-stage-m6-04-03-reserva-y-consumidores-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ff9291"/></marker><marker id="ae-stage-m6-04-03-reserva-y-consumidores-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8393a9"/></marker><marker id="ae-stage-m6-04-03-reserva-y-consumidores-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8be2bd"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="440" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="34" fill="#edf3fa" font-size="23" text-anchor="start" font-weight="600">Guardar líquido no equivale a bombearlo</text><rect x="42" y="130" width="132" height="160" rx="5" fill="#112239" stroke="#8393a9" stroke-width="2"/><rect x="46" y="210" width="124" height="76" rx="0" fill="#64d8ec" stroke="none" stroke-width="2"/><path d="M48 185L166 185" fill="none" stroke="#b4c3d5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><text x="108" y="112" fill="#edf3fa" font-size="19" text-anchor="middle" font-weight="400">Depósito</text><text x="108" y="250" fill="#0b1728" font-size="17" text-anchor="middle" font-weight="600">Reserva</text><path d="M174 258H228V198H250" fill="none" stroke="#64d8ec" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-04-03-reserva-y-consumidores-cyan)"/><circle cx="285" cy="198" r="29" fill="#112239" stroke="#64d8ec" stroke-width="2"/><path d="M273 215L273 181L299 198Z" fill="#64d8ec" stroke="#64d8ec" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="285" y="251" fill="#edf3fa" font-size="18" text-anchor="middle" font-weight="400">Bomba</text><path d="M316 198L405 198" fill="none" stroke="#64d8ec" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M405 100L405 296" fill="none" stroke="#64d8ec" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M408 112L485 112" fill="none" stroke="#64d8ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-04-03-reserva-y-consumidores-cyan)"/><path d="M408 200L485 200" fill="none" stroke="#64d8ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-04-03-reserva-y-consumidores-cyan)"/><path d="M408 288L485 288" fill="none" stroke="#64d8ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-04-03-reserva-y-consumidores-cyan)"/><rect x="507" y="87" width="78" height="42" rx="3" fill="#112239" stroke="#8393a9" stroke-width="2"/><path d="M554 91L554 125" fill="none" stroke="#f2c46d" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M557 109L615 109" fill="none" stroke="#f2c46d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="624" y="117" fill="#edf3fa" font-size="17" text-anchor="start" font-weight="400">Tren</text><circle cx="548" cy="199" r="26" fill="#112239" stroke="#8393a9" stroke-width="4"/><rect x="518" y="181" width="13" height="37" rx="2" fill="#f2c46d" stroke="none" stroke-width="2"/><text x="590" y="206" fill="#edf3fa" font-size="17" text-anchor="start" font-weight="400">Frenos</text><path d="M511 275L614 288L511 304Z" fill="#112239" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M557 272L578 299" fill="none" stroke="#f2c46d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="593" y="327" fill="#edf3fa" font-size="17" text-anchor="start" font-weight="400">Mandos</text><path d="M583 342H109V293" fill="none" stroke="#8393a9" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-04-03-reserva-y-consumidores-gray)"/><text x="246" y="367" fill="#8393a9" font-size="16" text-anchor="start" font-weight="400">Retorno del circuito</text><path d="M369 198L379 218L366 243Q350 234 360 222Z" fill="#ff9291" stroke="#ff9291" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="228" y="319" fill="#ff9291" font-size="16" text-anchor="start" font-weight="400">Fuga: pierde reserva</text><text x="24" y="390" fill="#b4c3d5" font-size="16" text-anchor="start" font-weight="400">Aplicaciones posibles · dependencias según el circuito real.</text><text x="24" y="423" fill="#b4c3d5" font-size="14" text-anchor="start" font-weight="400">Diagrama original · relaciones funcionales, no a escala.</text></g></svg>