<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="ae-stage-m6-09-03-anemometro-variometro-title ae-stage-m6-09-03-anemometro-variometro-desc"><title id="ae-stage-m6-09-03-anemometro-variometro-title">Dos comparaciones de presión diferentes</title><desc id="ae-stage-m6-09-03-anemometro-variometro-desc">En el anemómetro, Pitot lleva presión total a una cápsula y la estática llega a la caja. En el variómetro, la estática llega a una vía directa y a otra mediante una restricción calibrada que demora su respuesta. No hay conexión Pitot al variómetro.</desc><defs><marker id="ae-stage-m6-09-03-anemometro-variometro-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64d8ec"/></marker><marker id="ae-stage-m6-09-03-anemometro-variometro-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f2c46d"/></marker><marker id="ae-stage-m6-09-03-anemometro-variometro-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ff9291"/></marker><marker id="ae-stage-m6-09-03-anemometro-variometro-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8393a9"/></marker><marker id="ae-stage-m6-09-03-anemometro-variometro-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8be2bd"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="440" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="34" fill="#edf3fa" font-size="23" text-anchor="start" font-weight="600">Dos comparaciones de presión diferentes</text><rect x="23" y="91" width="320" height="252" rx="12" fill="#112239" stroke="none" stroke-width="2"/><text x="183" y="122" fill="#edf3fa" font-size="20" text-anchor="middle" font-weight="600">Anemómetro</text><rect x="378" y="91" width="320" height="252" rx="12" fill="#112239" stroke="none" stroke-width="2"/><text x="538" y="122" fill="#edf3fa" font-size="20" text-anchor="middle" font-weight="600">Variómetro</text><rect x="129" y="157" width="186" height="121" rx="10" fill="#0b1728" stroke="#8393a9" stroke-width="2"/><rect x="165" y="185" width="96" height="43" rx="18" fill="#112239" stroke="#f2c46d" stroke-width="2"/><path d="M36 194H161" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-09-03-anemometro-variometro-gold)"/><text x="36" y="180" fill="#f2c46d" font-size="15" text-anchor="start" font-weight="400">Pitot: total</text><path d="M37 306H226V283" fill="none" stroke="#64d8ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-09-03-anemometro-variometro-cyan)"/><text x="36" y="329" fill="#64d8ec" font-size="15" text-anchor="start" font-weight="400">Estática a la caja</text><path d="M263 206L294 175" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="206" y="256" fill="#b4c3d5" font-size="15" text-anchor="middle" font-weight="400">Diferencia</text><rect x="505" y="157" width="174" height="121" rx="10" fill="#0b1728" stroke="#8393a9" stroke-width="2"/><rect x="540" y="184" width="98" height="44" rx="18" fill="#112239" stroke="#64d8ec" stroke-width="2"/><path d="M391 195H536" fill="none" stroke="#64d8ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-09-03-anemometro-variometro-cyan)"/><text x="391" y="180" fill="#64d8ec" font-size="15" text-anchor="start" font-weight="400">Estática</text><path d="M440 195V304H591V283" fill="none" stroke="#64d8ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-09-03-anemometro-variometro-cyan)"/><rect x="518" y="295" width="34" height="18" rx="0" fill="#0b1728" stroke="#f2c46d" stroke-width="2"/><path d="M535 294L535 305" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="545" y="333" fill="#f2c46d" font-size="15" text-anchor="middle" font-weight="400">Restricción</text><path d="M639 206L663 178" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="592" y="253" fill="#b4c3d5" font-size="14" text-anchor="middle" font-weight="400">Vía directa</text><text x="402" y="271" fill="#b4c3d5" font-size="13" text-anchor="start" font-weight="400">Vía retardada</text><text x="360" y="372" fill="#edf3fa" font-size="16" text-anchor="middle" font-weight="400">En el variómetro, al estabilizarse la presión la diferencia tiende a cero.</text><text x="360" y="394" fill="#b4c3d5" font-size="15" text-anchor="middle" font-weight="400">Una obstrucción o fuga altera las presiones comunicadas.</text><text x="24" y="423" fill="#b4c3d5" font-size="14" text-anchor="start" font-weight="400">Diagrama original · relaciones funcionales, no a escala.</text></g></svg>