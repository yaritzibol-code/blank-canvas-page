<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="ae-stage-m6-09-02-capsula-aneroide-title ae-stage-m6-09-02-capsula-aneroide-desc"><title id="ae-stage-m6-09-02-capsula-aneroide-title">La presión deforma una cápsula aneroide</title><desc id="ae-stage-m6-09-02-capsula-aneroide-desc">Dos estados cualitativos de una cápsula aneroide muestran mayor presión exterior con cápsula más comprimida y menor presión con cápsula expandida. Una conexión mecánica mueve la aguja del altímetro. El ajuste barométrico cambia la referencia; la indicación no mide distancia al terreno.</desc><defs><marker id="ae-stage-m6-09-02-capsula-aneroide-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64d8ec"/></marker><marker id="ae-stage-m6-09-02-capsula-aneroide-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f2c46d"/></marker><marker id="ae-stage-m6-09-02-capsula-aneroide-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ff9291"/></marker><marker id="ae-stage-m6-09-02-capsula-aneroide-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8393a9"/></marker><marker id="ae-stage-m6-09-02-capsula-aneroide-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8be2bd"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="440" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="34" fill="#edf3fa" font-size="23" text-anchor="start" font-weight="600">La presión deforma una cápsula aneroide</text><rect x="25" y="89" width="318" height="246" rx="12" fill="#112239" stroke="none" stroke-width="2"/><text x="184" y="121" fill="#edf3fa" font-size="17" text-anchor="middle" font-weight="600">Mayor presión estática</text><path d="M75 183Q130 171 185 183V229Q130 241 75 229Z" fill="#0b1728" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M76 192.2Q130 202.2 184 192.2" fill="none" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M76 201.4Q130 211.4 184 201.4" fill="none" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M76 210.6Q130 220.6 184 210.6" fill="none" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M76 219.8Q130 229.8 184 219.8" fill="none" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M130 137L130 176" fill="none" stroke="#64d8ec" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-09-02-capsula-aneroide-cyan)"/><path d="M130 291L130 242" fill="none" stroke="#64d8ec" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-09-02-capsula-aneroide-cyan)"/><path d="M185 207H227" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="278" cy="207" r="44" fill="#0b1728" stroke="#8393a9" stroke-width="3"/><path d="M278 207L256 225" fill="none" stroke="#f2c46d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-09-02-capsula-aneroide-gold)"/><text x="184" y="319" fill="#b4c3d5" font-size="17" text-anchor="middle" font-weight="400">Cápsula comprimida</text><rect x="377" y="89" width="318" height="246" rx="12" fill="#112239" stroke="none" stroke-width="2"/><text x="536" y="121" fill="#edf3fa" font-size="17" text-anchor="middle" font-weight="600">Menor presión estática</text><path d="M427 156Q482 144 537 156V255Q482 267 427 255Z" fill="#0b1728" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M428 175.8Q482 185.8 536 175.8" fill="none" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M428 195.6Q482 205.6 536 195.6" fill="none" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M428 215.4Q482 225.4 536 215.4" fill="none" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M428 235.2Q482 245.2 536 235.2" fill="none" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M482 137L482 149" fill="none" stroke="#64d8ec" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-09-02-capsula-aneroide-cyan)"/><path d="M482 291L482 268" fill="none" stroke="#64d8ec" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-09-02-capsula-aneroide-cyan)"/><path d="M537 207H579" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="630" cy="207" r="44" fill="#0b1728" stroke="#8393a9" stroke-width="3"/><path d="M630 207L647 181" fill="none" stroke="#f2c46d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-09-02-capsula-aneroide-gold)"/><text x="536" y="319" fill="#b4c3d5" font-size="17" text-anchor="middle" font-weight="400">Cápsula expandida</text><text x="360" y="368" fill="#edf3fa" font-size="18" text-anchor="middle" font-weight="400">El ajuste barométrico cambia la referencia de altitud.</text><text x="360" y="390" fill="#b4c3d5" font-size="15" text-anchor="middle" font-weight="400">Esquema cualitativo · no es una medición de altura sobre el suelo.</text><text x="24" y="423" fill="#b4c3d5" font-size="14" text-anchor="start" font-weight="400">Diagrama original · relaciones funcionales, no a escala.</text></g></svg>