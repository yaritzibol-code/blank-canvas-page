<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="ae-stage-m6-01-01-tres-funciones-title ae-stage-m6-01-01-tres-funciones-desc"><title id="ae-stage-m6-01-01-tres-funciones-title">Temperatura, renovación y presión</title><desc id="ae-stage-m6-01-01-tres-funciones-desc">Cabina esquemática con aire que pasa por un acondicionador antes de entrar, circulación interior para ventilación y válvula de salida que regula presión. Tres instrumentos conceptuales separan temperatura, renovación de aire y presión.</desc><defs><marker id="ae-stage-m6-01-01-tres-funciones-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64d8ec"/></marker><marker id="ae-stage-m6-01-01-tres-funciones-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f2c46d"/></marker><marker id="ae-stage-m6-01-01-tres-funciones-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ff9291"/></marker><marker id="ae-stage-m6-01-01-tres-funciones-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8393a9"/></marker><marker id="ae-stage-m6-01-01-tres-funciones-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8be2bd"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="440" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="34" fill="#edf3fa" font-size="23" text-anchor="start" font-weight="600">Temperatura, renovación y presión</text><rect x="249" y="101" width="314" height="168" rx="42" fill="#112239" stroke="#8393a9" stroke-width="2"/><rect x="321" y="127" width="58" height="43" rx="8" fill="#0b1728" stroke="#8393a9" stroke-width="2"/><rect x="411" y="127" width="58" height="43" rx="8" fill="#0b1728" stroke="#8393a9" stroke-width="2"/><rect x="33" y="130" width="163" height="61" rx="10" fill="#112239" stroke="#64d8ec" stroke-width="2"/><text x="114" y="155" fill="#edf3fa" font-size="18" text-anchor="middle" font-weight="400">Acondicionar</text><text x="114" y="178" fill="#edf3fa" font-size="18" text-anchor="middle" font-weight="400">el aire</text><path d="M195 160L266 160" fill="none" stroke="#64d8ec" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-01-01-tres-funciones-cyan)"/><path d="M315 201H486Q516 225 487 241H341" fill="none" stroke="#64d8ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-01-01-tres-funciones-cyan)"/><text x="356" y="220" fill="#64d8ec" font-size="17" text-anchor="start" font-weight="400">Ventilar</text><path d="M562 210L661 210" fill="none" stroke="#f2c46d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-01-01-tres-funciones-gold)"/><path d="M601 189L616 232" fill="none" stroke="#f2c46d" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><text x="606" y="163" fill="#f2c46d" font-size="17" text-anchor="middle" font-weight="400">Salida</text><text x="76" y="314" fill="#64d8ec" font-size="18" text-anchor="start" font-weight="400">Temperatura</text><text x="76" y="341" fill="#64d8ec" font-size="18" text-anchor="start" font-weight="400">¿Frío o calor?</text><text x="289" y="314" fill="#64d8ec" font-size="18" text-anchor="start" font-weight="400">Ventilación</text><text x="289" y="341" fill="#64d8ec" font-size="18" text-anchor="start" font-weight="400">¿Se renueva aire?</text><text x="513" y="314" fill="#f2c46d" font-size="18" text-anchor="start" font-weight="400">Presurización</text><text x="513" y="341" fill="#f2c46d" font-size="18" text-anchor="start" font-weight="400">¿Presión adecuada?</text><text x="24" y="378" fill="#b4c3d5" font-size="18" text-anchor="start" font-weight="400">Aire frío no confirma una presión de cabina correcta.</text><text x="24" y="423" fill="#b4c3d5" font-size="14" text-anchor="start" font-weight="400">Diagrama original · relaciones funcionales, no a escala.</text></g></svg>