<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="ae-stage-m6-06-03-lluvia-y-condensacion-title ae-stage-m6-06-03-lluvia-y-condensacion-desc"><title id="ae-stage-m6-06-03-lluvia-y-condensacion-title">Lluvia exterior y condensación interior</title><desc id="ae-stage-m6-06-03-lluvia-y-condensacion-desc">Dos parabrisas comparan lluvia exterior, retirada por una escobilla, y condensación interior, atendida por el sistema contra empañamiento según el diseño. La selección de un mando se distingue de verificar el efecto real y la condición de la superficie.</desc><defs><marker id="ae-stage-m6-06-03-lluvia-y-condensacion-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64d8ec"/></marker><marker id="ae-stage-m6-06-03-lluvia-y-condensacion-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f2c46d"/></marker><marker id="ae-stage-m6-06-03-lluvia-y-condensacion-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ff9291"/></marker><marker id="ae-stage-m6-06-03-lluvia-y-condensacion-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8393a9"/></marker><marker id="ae-stage-m6-06-03-lluvia-y-condensacion-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8be2bd"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="440" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="34" fill="#edf3fa" font-size="23" text-anchor="start" font-weight="600">Lluvia exterior y condensación interior</text><text x="177" y="78" fill="#edf3fa" font-size="18" text-anchor="mi