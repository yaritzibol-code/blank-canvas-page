be la entrega</text><text x="369" y="137" fill="#f2c46d" font-size="16" text-anchor="start" font-weight="400">Red fija</text><rect x="28" y="278" width="662" height="95" rx="12" fill="#112239" stroke="none" stroke-width="2"/><circle cx="84" cy="326" r="27" fill="#0b1728" stroke="#8393a9" stroke-width="2"/><path d="M84 326L84 308" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M84 326L102 326" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="133" y="311" fill="#edf3fa" font-size="18" text-anchor="start" font-weight="600">Antes del cierre de una estación</text><text x="133" y="340" fill="#b4c3d5" font-size="16" text-anchor="start" font-weight="400">Coordinar necesidad de continuidad con otras estaciones.</text><text x="24" y="423" fill="#b4c3d5" font-size="14" text-anchor="start" font-weight="400">Diagrama original · relaciones funcionales, no a escala.</text></g></svg>