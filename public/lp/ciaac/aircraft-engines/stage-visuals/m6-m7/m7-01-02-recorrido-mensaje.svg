<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="ae-stage-m7-01-02-recorrido-mensaje-title ae-stage-m7-01-02-recorrido-mensaje-desc"><title id="ae-stage-m7-01-02-recorrido-mensaje-title">Recibir un mensaje no termina su recorrido</title><desc id="ae-stage-m7-01-02-recorrido-mensaje-desc">Una aeronave transmite a una estación aeronáutica, que remite el mensaje por red fija a la dependencia destinataria. Admisión, prioridad y entrega pertenecen a partes distintas del recorrido. Abajo dos estaciones coordinan continuidad antes de cerrar, según la edición estudiada.</desc><defs><marker id="ae-stage-m7-01-02-recorrido-mensaje-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64d8ec"/></marker><marker id="ae-stage-m7-01-02-recorrido-mensaje-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f2c46d"/></marker><marker id="ae-stage-m7-01-02-recorrido-mensaje-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ff9291"/></marker><marker id="ae-stage-m7-01-02-recorrido-mensaje-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8393a9"/></marker><marker id="ae-stage-m7-01-02-recorrido-mensaje-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8be2bd"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="440" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="34" fill="#edf3fa" font-size="23" text-anchor="start" font-weight="600">Recibir un mensaje no termina su recorrido</text><text x="24" y="71" fill="#b4c3d5" font-size="16" text-anchor="start" 