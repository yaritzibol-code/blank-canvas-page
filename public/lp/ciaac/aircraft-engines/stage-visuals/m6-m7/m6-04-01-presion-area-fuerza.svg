<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="ae-stage-m6-04-01-presion-area-fuerza-title ae-stage-m6-04-01-presion-area-fuerza-desc"><title id="ae-stage-m6-04-01-presion-area-fuerza-title">Más área da más fuerza, no energía gratis</title><desc id="ae-stage-m6-04-01-presion-area-fuerza-desc">Dos cilindros comunicados reciben la misma presión. Un pistón de área A produce fuerza F; uno de área 2A produce fuerza 2F. Si ambos se desplazan la misma distancia, el segundo requiere doble volumen de líquido. Se separa fuerza de velocidad de actuación.</desc><defs><marker id="ae-stage-m6-04-01-presion-area-fuerza-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64d8ec"/></marker><marker id="ae-stage-m6-04-01-presion-area-fuerza-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f2c46d"/></marker><marker id="ae-stage-m6-04-01-presion-area-fuerza-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ff9291"/></marker><marker id="ae-stage-m6-04-01-presion-area-fuerza-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8393a9"/></marker><marker id="ae-stage-m6-04-01-presion-area-fuerza-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8be2bd"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="440" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="34" fill="#edf3fa" font-size="23" text-anchor="start" font-weight="600">Más área da más fuerza, no energía gratis</text><text x="24" y="73" fill="#b4c3d5" font-size="17" text-anchor="start" font-weight="400">Misma presión p · esquema de áreas efectivas</text><rect x="126" y="137" width="100" height="158" rx="3" fill="#112239" stroke="#8393a9" stroke-width="2"/><rect x="129" y="205" width="94" height="86" rx="0" fill="#64d8ec" stroke="none" stroke-width="2"/><path d="M130 205L222 205" fill="none" stroke="#f2c46d" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><path d="M176.0 205L176.0 135" fill="none" stroke="#f2c46d" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><text x="176.0" y="264" fill="#0b1728" font-size="27" text-anchor="middle" font-weight="600">A</text><rect x="428" y="137" width="182" height="158" rx="3" fill="#112239" stroke="#8393a9" stroke-width="2"/><rect x="431" y="205" width="176" height="86" rx="0" fill="#64d8ec" stroke="none" stroke-width="2"/><path d="M432 205L606 205" fill="none" stroke="#f2c46d" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><path d="M519.0 205L519.0 135" fill="none" stroke="#f2c46d" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><text x="519.0" y="264" fill="#0b1728" font-size="27" text-anchor="middle" font-weight="600">2A</text><path d="M178 295V322H520V295" fill="none" stroke="#64d8ec" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><path d="M176 125L176 95" fill="none" stroke="#f2c46d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-04-01-presion-area-fuerza-gold)"/><path d="M518 125L518 70" fill="none" stroke="#f2c46d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-04-01-presion-area-fuerza-gold)"/><text x="144" y="112" fill="#f2c46d" font-size="20" text-anchor="start" font-weight="400">F</text><text x="551" y="102" fill="#f2c46d" font-size="20" text-anchor="start" font-weight="400">2F</text><text x="75" y="356" fill="#b4c3d5" font-size="17" text-anchor="start" font-weight="400">Mismo recorrido: volumen V</text><text x="403" y="356" fill="#b4c3d5" font-size="16" text-anchor="start" font-weight="400">Mismo recorrido: volumen 2V</text><text x="360" y="388" fill="#edf3fa" font-size="20" text-anchor="middle" font-weight="600">F = p × A · El caudal influye en la rapidez.</text><text x="24" y="423" fill="#b4c3d5" font-size="14" text-anchor="start" font-weight="400">Diagrama original · relaciones funcionales, no a escala.</text></g></svg>