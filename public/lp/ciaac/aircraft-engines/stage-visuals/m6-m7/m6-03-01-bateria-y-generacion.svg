<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="ae-stage-m6-03-01-bateria-y-generacion-title ae-stage-m6-03-01-bateria-y-generacion-desc"><title id="ae-stage-m6-03-01-bateria-y-generacion-title">Almacenar energía o generar electricidad</title><desc id="ae-stage-m6-03-01-bateria-y-generacion-desc">La batería entrega energía química almacenada mediante sus terminales a una carga eléctrica. En otra rama, un eje accionado hace girar un generador que alimenta una carga. El esquema separa reserva finita y conversión continua mientras exista energía mecánica.</desc><defs><marker id="ae-stage-m6-03-01-bateria-y-generacion-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64d8ec"/></marker><marker id="ae-stage-m6-03-01-bateria-y-generacion-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f2c46d"/></marker><marker id="ae-stage-m6-03-01-bateria-y-generacion-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ff9291"/></marker><marker id="ae-stage-m6-03-01-bateria-y-generacion-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8393a9"/></marker><marker id="ae-stage-m6-03-01-bateria-y-generacion-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8be2bd"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="440" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="34" fill="#edf3fa" font-size="23" text-anchor="start" font-weight="600">Almacenar energía o generar electricidad</text><rect x="26" y="93" width="667" height="114" rx="14" fill="#112239" stroke="none" stroke-width="2"/><rect x="61" y="119" width="142" height="60" rx="8" fill="#0b1728" stroke="#8393a9" stroke-width="2"/><rect x="106" y="110" width="50" height="10" rx="1" fill="#8393a9" stroke="none" stroke-width="2"/><path d="M84 136L84 165" fill="none" stroke="#f2c46d" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M117 136L117 165" fill="none" stroke="#f2c46d" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M150 136L150 165" fill="none" stroke="#f2c46d" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><text x="239" y="126" fill="#edf3fa" font-size="20" text-anchor="start" font-weight="600">Batería</text><text x="239" y="155" fill="#b4c3d5" font-size="17" text-anchor="start" font-weight="400">Energía química almacenada</text><text x="239" y="183" fill="#f2c46d" font-size="17" text-anchor="start" font-weight="400">Reserva limitada</text><path d="M507 148L590 148" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-03-01-bateria-y-generacion-gold)"/><circle cx="634" cy="148" r="29" fill="#0b1728" stroke="#f2c46d" stroke-width="2"/><path d="M619 133L650 163M650 133L619 163" fill="none" stroke="#f2c46d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="26" y="228" width="667" height="136" rx="14" fill="#112239" stroke="none" stroke-width="2"/><path d="M57 293L106 293" fill="none" stroke="#64d8ec" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-03-01-bateria-y-generacion-cyan)"/><circle cx="147" cy="293" r="39" fill="#0b1728" stroke="#8393a9" stroke-width="3"/><text x="147" y="302" fill="#64d8ec" font-size="27" text-anchor="middle" font-weight="600">G</text><path d="M117 260Q151 237 179 268" fill="none" stroke="#64d8ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-03-01-bateria-y-generacion-cyan)"/><text x="239" y="263" fill="#edf3fa" font-size="20" text-anchor="start" font-weight="600">Generador / alternador</text><text x="239" y="295" fill="#b4c3d5" font-size="17" text-anchor="start" font-weight="400">Recibe trabajo de un eje</text><text x="239" y="326" fill="#64d8ec" font-size="17" text-anchor="start" font-weight="400">No crea energía por sí solo</text><path d="M507 292L590 292" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-03-01-bateria-y-generacion-gold)"/><circle cx="634" cy="292" r="29" fill="#0b1728" stroke="#f2c46d" stroke-width="2"/><path d="M619 277L650 307M650 277L619 307" fill="none" stroke="#f2c46d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="25" y="385" fill="#b4c3d5" font-size="16" text-anchor="start" font-weight="400">Tipo de corriente, tensión y frecuencia dependen de la instalación.</text><text x="24" y="423" fill="#b4c3d5" font-size="14" text-anchor="start" font-weight="400">Diagrama original · relaciones funcionales, no a escala.</text></g></svg>