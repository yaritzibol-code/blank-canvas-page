<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="ae-stage-m6-01-03-ciclos-enfriamiento-title ae-stage-m6-01-03-ciclos-enfriamiento-desc"><title id="ae-stage-m6-01-03-ciclos-enfriamiento-title">Dos ciclos para retirar calor</title><desc id="ae-stage-m6-01-03-ciclos-enfriamiento-desc">Arriba, aire comprimido cede calor en un intercambiador y se enfría al expandirse en una turbina antes de la cabina. Abajo, un circuito cerrado de refrigerante pasa por evaporador, compresor, condensador y expansión; intercambia calor con cabina y exterior sin ser aire respirable.</desc><defs><marker id="ae-stage-m6-01-03-ciclos-enfriamiento-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64d8ec"/></marker><marker id="ae-stage-m6-01-03-ciclos-enfriamiento-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f2c46d"/></marker><marker id="ae-stage-m6-01-03-ciclos-enfriamiento-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ff9291"/></marker><marker id="ae-stage-m6-01-03-ciclos-enfriamiento-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8393a9"/></marker><marker id="ae-stage-m6-01-03-ciclos-enfriamiento-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8be2bd"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="440" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="34" fill="#edf3fa" font-size="23" text-anchor="start" font-weight="600">Dos ciclos para retirar calor</text><text x="24" y="70" fill="#edf3fa" font-size="18" text-anchor="start" font-w