32.0" y="305" fill="#edf3fa" font-size="17" text-anchor="middle" font-weight="400">Evaporador</text><rect x="271" y="243" width="164" height="42" rx="10" fill="#112239" stroke="#8393a9" stroke-width="2"/><text x="353.0" y="270" fill="#edf3fa" font-size="17" text-anchor="middle" font-weight="400">Compresor</text><rect x="499" y="278" width="169" height="42" rx="10" fill="#112239" stroke="#8393a9" stroke-width="2"/><text x="583.5" y="305" fill="#edf3fa" font-size="17" text-anchor="middle" font-weight="400">Condensador</text><rect x="271" y="339" width="164" height="42" rx="10" fill="#112239" stroke="#8393a9" stroke-width="2"/><text x="353.0" y="366" fill="#edf3fa" font-size="17" text-anchor="middle" font-weight="400">Expansión</text><path d="M132 277V262H260" fill="none" stroke="#64d8ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-01-03-ciclos-enfriamiento-cyan)"/><path d="M435 263H582V273" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-01-03-ciclos-enfriamiento-gold)"/><path d="M584 321V361H446" fill="none" stroke="#f2c46d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-01-03-ciclos-enfriamiento-gold)"/><path d="M269 361H132V326" fill="none" stroke="#64d8ec" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-01-03-ciclos-enfriamiento-cyan)"/><path d="M29 300L60 300" fill="none" stroke="#ff9291" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-01-03-ciclos-enfriamiento-red)"/><text x="25" y="345" fill="#ff9291" font-size="14" text-anchor="start" font-weight="400">Calor de cabina</text><path d="M669 300L696 300" fill="none" stroke="#ff9291" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ae-stage-m6-01-03-ciclos-enfriamiento-red)"/><text x="509" y="254" fill="#ff9291" font-size="14" text-anchor="start" font-weight="400">Calor al exterior</text><text x="24" y="423" fill="#b4c3d5" font-size="14" text-anchor="start" font-weight="400">Diagrama original · relaciones funcionales, no a escala.</text></g></svg>