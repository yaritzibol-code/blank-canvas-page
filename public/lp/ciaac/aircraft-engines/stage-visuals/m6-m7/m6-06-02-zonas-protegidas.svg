<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="ae-stage-m6-06-02-zonas-protegidas-title ae-stage-m6-06-02-zonas-protegidas-desc"><title id="ae-stage-m6-06-02-zonas-protegidas-title">Una zona protegida no protege las demás</title><desc id="ae-stage-m6-06-02-zonas-protegidas-desc">Vista superior esquemática de una aeronave con llamadas independientes a Pitot, parabrisas, ala, motor y empenaje. Los ejemplos de fuentes muestran calor, electricidad, fluido y neumática, sin asignar una cobertura universal ni garantizar que estén instalados.</desc><defs><marker id="ae-stage-m6-06-02-zonas-protegidas-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64d8ec"/></marker><marker id="ae-stage-m6-06-02-zonas-protegidas-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f2c46d"/></marker><marker id="ae-stage-m6-06-02-zonas-protegidas-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ff9291"/></marker><marker id="ae-stage-m6-06-02-zonas-protegidas-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8393a9"/></marker><marker id="ae-stage-m6-06-02-zonas-protegidas-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8be2bd"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="440" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="34" fill="#edf3fa" font-size="23" text-anchor="start" font-weight="600">Una zona protegida no protege las demás</text><path d="M358 91Q385 102 386 152L405 170L633 235L627 256L387 218L382 285L455 320L451 333L362 312L271 333L267 320L341 285L336 218L96 256L90 235L318 170L334 152Q335 102 358 91Z" fill="#112239" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M345 129Q360 115 375 132L375 151H344Z" fill="#64d8ec" stroke="#64d8ec" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="251" y="189" width="34" height="74" rx="14" fill="#112239" stroke="#f2c46d" stroke-width="2"/><rect x="438" y="189" width="34" height="74" rx="14" fill="#112239" stroke="#f2c46d" stroke-width="2"/><path d="M331 153L309 126" fill="none" stroke="#64d8ec" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M330 179L151 230" fill="none" stroke="#f2c46d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M389 179L570 230" fill="none" stroke="#f2c46d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="65" y="107" fill="#64d8ec" font-size="18" text-anchor="start" font-weight="400">Pitot</text><path d="M118 110H253L306 126" fill="none" stroke="#64d8ec" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="456" y="108" fill="#64d8ec" font-size="18" text-anchor="start" font-weight="400">Parabrisas</text><path d="M453 113L380 139" fill="none" stroke="#64d8ec" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="542" y="183" fill="#f2c46d" font-size="18" text-anchor="start" font-weight="400">Ala</text><path d="M550 190L543 222" fill="none" stroke="#f2c46d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="68" y="292" fill="#f2c46d" font-size="18" text-anchor="start" font-weight="400">Motor</text><path d="M130 288L247 238" fill="none" stroke="#f2c46d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="506" y="319" fill="#edf3fa" font-size="18" text-anchor="start" font-weight="400">Empenaje</text><path d="M503 322L456 324" fill="none" stroke="#8393a9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="25" y="363" fill="#edf3fa" font-size="18" text-anchor="start" font-weight="600">Identifica en cada zona: fuente + función + limitaciones.</text><text x="25" y="388" fill="#b4c3d5" font-size="16" text-anchor="start" font-weight="400">Fuentes posibles: aire caliente, electricidad, fluido o neumática.</text><text x="24" y="423" fill="#b4c3d5" font-size="14" text-anchor="start" font-weight="400">Diagrama original · relaciones funcionales, no a escala.</text></g></svg>