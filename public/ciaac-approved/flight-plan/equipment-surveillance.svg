<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title desc"><title id="title">10b: vigilancia</title><desc id="desc">L en 10b es Modo S con identificación, altitud de presión, vigilancia mejorada y ADS-B. B1 es ADS-B out 1090 MHz; ambas claves pueden combinarse según equipos instalados.</desc><rect width="360" height="360" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="24" y="43" font-size="26" fill="#e8be73" text-anchor="start" font-weight="500">10b · VIGILANCIA</text><rect x="24" y="65" width="76" height="48" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="62.0" y="98" font-size="27" fill="#82c7e5" text-anchor="middle" font-weight="600">L</text><text x="24" y="152" font-size="23" fill="#f8f1df" text-anchor="start" font-weight="500">Modo S</text><text x="24" y="186" font-size="23" fill="#f8f1df" text-anchor="start" font-weight="500">ID · altitud de presión</text><text x="24" y="220" font-size="23" fill="#f8f1df" text-anchor="start" font-weight="500">Vigilancia mejorada</text><text x="24" y="254" font-size="23" fill="#f8f1df" text-anchor="start" font-weight="500">ADS-B</text><rect x="24" y="279" width="76" height="48" rx="12" fill="#173149" stroke="#91d4c6" stroke-width="2"/><text x="62.0" y="312" font-size="27" fill="#91d4c6" text-anchor="middle" font-weight="600">B1</text><text x="117" y="310" font-size="25" fill="#91d4c6" text-anchor="start" font-weight="500">ADS-B out</text><text x="117" y="342" font-size="23" fill="#91d4c6" text-anchor="start" font-weight="500">1090 MHz</text></g></svg>