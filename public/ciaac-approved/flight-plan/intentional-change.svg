<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title desc"><title id="title">Cambios intencionales y emergencia</title><desc id="desc">Cambio intencional en vuelo controlado exige solicitar y obtener autorización previa. Excepción: emergencia con medidas inmediatas e informe posterior cuando las circunstancias lo permitan.</desc><rect width="360" height="360" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="24" y="43" font-size="25" fill="#e8be73" text-anchor="start" font-weight="500">CAMBIO INTENCIONAL</text><rect x="24" y="66" width="312" height="48" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="180.0" y="99" font-size="24" fill="#82c7e5" text-anchor="middle" font-weight="600">Solicitar autorización</text><line x1="180" y1="117" x2="180" y2="141" stroke="#e8be73" stroke-width="3" /><path d="M184.79425538604204 132.22417438109628 L180 141 L175.20574461395796 132.22417438109628" fill="none" stroke="#e8be73" stroke-width="3"/><rect x="24" y="153" width="312" height="48" rx="12" fill="#173149" stroke="#91d4c6" stroke-width="2"/><text x="180.0" y="186" font-size="27" fill="#91d4c6" text-anchor="middle" font-weight="600">Conseguirla antes</text><text x="24" y="250" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Excepción: emergencia</text><text x="24" y="289" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Medidas inmediatas</text><text x="24" y="328" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Informar cuando sea posible</text></g></svg>