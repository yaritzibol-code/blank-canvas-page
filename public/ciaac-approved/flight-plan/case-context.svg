<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="title desc"><title id="title">Escenario integrador ficticio</title><desc id="desc">Se conservan todos los datos del caso MMTO a MMGL, AMX501, XB-ABC, 6,200 kg, IFR FL 240, 280 a 260 kt, cinco minutos y motor derecho. No se inventan horas, ruta detallada, modelo ni aeródromos alternativos.</desc><rect width="720" height="380" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="28" y="43" font-size="27" fill="#e8be73" text-anchor="start" font-weight="500">CASO FICTICIO · TOLUCA A GUADALAJARA</text><rect x="28" y="73" width="250" height="48" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="153.0" y="106" font-size="27" fill="#82c7e5" text-anchor="middle" font-weight="600">MMTO</text><rect x="442" y="73" width="250" height="48" rx="12" fill="#173149" stroke="#91d4c6" stroke-width="2"/><text x="567.0" y="106" font-size="27" fill="#91d4c6" text-anchor="middle" font-weight="600">MMGL</text><line x1="289" y1="97" x2="430" y2="97" stroke="#e8be73" stroke-width="3" /><path d="M421.22417438109625 92.20574461395798 L430 97 L421.22417438109625 101.79425538604202" fill="none" stroke="#e8be73" stroke-width="3"/><text x="360" y="175" font-size="31" fill="#f8f1df" text-anchor="middle" font-weight="500">IFR · FL 240 · AMX501</text><text x="360" y="227" font-size="30" fill="#82c7e5" text-anchor="middle" font-weight="500">XB-ABC · 6,200 kg</text><text x="360" y="289" font-size="26" fill="#e8be73" text-anchor="middle" font-weight="500">TAS 280 → 260 kt · retraso estimado 5 min</text><text x="360" y="344" font-size="25" fill="#c7d3de" text-anchor="middle" font-weight="500">Presión de aceite anormal · motor derecho</text></g></svg>