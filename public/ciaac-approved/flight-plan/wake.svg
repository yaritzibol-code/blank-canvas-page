<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title desc"><title id="title">Casilla 9: estela turbulenta</title><desc id="desc">H desde 136,000 kg inclusive; M estrictamente entre 7,000 y 136,000 kg; L hasta 7,000 kg inclusive. SUPER/J depende de la publicación ATS aplicable.</desc><rect width="360" height="360" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="24" y="43" font-size="26" fill="#e8be73" text-anchor="start" font-weight="500">9 · ESTELA</text><rect x="24" y="65" width="68" height="48" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="58.0" y="98" font-size="27" fill="#82c7e5" text-anchor="middle" font-weight="600">H</text><text x="111" y="98" font-size="27" fill="#f8f1df" text-anchor="start" font-weight="500">≥ 136,000 kg</text><rect x="24" y="132" width="68" height="48" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="58.0" y="165" font-size="27" fill="#82c7e5" text-anchor="middle" font-weight="600">M</text><text x="111" y="164" font-size="26" fill="#f8f1df" text-anchor="start" font-weight="500">&gt; 7,000 kg</text><text x="111" y="195" font-size="26" fill="#f8f1df" text-anchor="start" font-weight="500">&lt; 136,000 kg</text><rect x="24" y="218" width="68" height="48" rx="12" fill="#173149" stroke="#91d4c6" stroke-width="2"/><text x="58.0" y="251" font-size="27" fill="#91d4c6" text-anchor="middle" font-weight="600">L</text><text x="111" y="250" font-size="27" fill="#f8f1df" text-anchor="start" font-weight="500">≤ 7,000 kg</text><text x="24" y="308" font-size="23" fill="#f8f1df" text-anchor="start" font-weight="500">J / SUPER: según</text><text x="24" y="339" font-size="23" fill="#f8f1df" text-anchor="start" font-weight="500">publicación aplicable</text></g></svg>