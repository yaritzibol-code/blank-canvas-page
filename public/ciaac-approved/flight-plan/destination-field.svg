<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title desc"><title id="title">Casilla 16: destino, EET y alternativos</title><desc id="desc">Indicador OACI del destino, tiempo estimado transcurrido total EET HHMM e indicadores OACI de los alternativos. EET no es una hora UTC de salida.</desc><rect width="360" height="360" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="24" y="43" font-size="26" fill="#e8be73" text-anchor="start" font-weight="500">16 · DESTINO</text><rect x="24" y="66" width="312" height="48" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="180.0" y="99" font-size="27" fill="#82c7e5" text-anchor="middle" font-weight="600">Destino · OACI</text><rect x="24" y="153" width="312" height="48" rx="12" fill="#173149" stroke="#91d4c6" stroke-width="2"/><text x="180.0" y="186" font-size="27" fill="#91d4c6" text-anchor="middle" font-weight="600">EET · HHMM</text><text x="24" y="226" font-size="24" fill="#f8f1df" text-anchor="start" font-weight="500">Tiempo transcurrido</text><rect x="24" y="274" width="312" height="48" rx="12" fill="#173149" stroke="#e8be73" stroke-width="2"/><text x="180.0" y="307" font-size="27" fill="#e8be73" text-anchor="middle" font-weight="600">Alternativos · OACI</text></g></svg>