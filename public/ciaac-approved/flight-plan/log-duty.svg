<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-labelledby="title desc"><title id="title">Obligación del comandante</title><desc id="desc">Artículo 119.II: asentar todas las fallas o anormalidades que note o presuma y avisar a la empresa. Artículo 110.I: responsabilidad del operador por libros aprobados por AFAC.</desc><rect width="720" height="340" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="28" y="43" font-size="29" fill="#e8be73" text-anchor="start" font-weight="500">REGISTRAR Y COMUNICAR</text><rect x="28" y="91" width="284" height="48" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="170.0" y="124" font-size="23" fill="#82c7e5" text-anchor="middle" font-weight="600">Falla o anormalidad</text><line x1="323" y1="115" x2="382" y2="115" stroke="#e8be73" stroke-width="3" /><path d="M373.22417438109625 110.20574461395798 L382 115 L373.22417438109625 119.79425538604202" fill="none" stroke="#e8be73" stroke-width="3"/><rect x="398" y="91" width="294" height="48" rx="12" fill="#173149" stroke="#91d4c6" stroke-width="2"/><text x="545.0" y="124" font-size="25" fill="#91d4c6" text-anchor="middle" font-weight="600">Libro de bitácora</text><line x1="545" y1="153" x2="545" y2="227" stroke="#e8be73" stroke-width="3" /><path d="M549.794255386042 218.22417438109628 L545 227 L540.205744613958 218.22417438109628" fill="none" stroke="#e8be73" stroke-width="3"/><rect x="350" y="245" width="342" height="48" rx="12" fill="#173149" stroke="#e8be73" stroke-width="2"/><text x="521.0" y="278" font-size="26" fill="#e8be73" text-anchor="middle" font-weight="600">Empresa operadora</text><text x="28" y="217" font-size="27" fill="#f8f1df" text-anchor="start" font-weight="500">Notada o presumida</text><text x="28" y="259" font-size="27" fill="#f8f1df" text-anchor="start" font-weight="500">por el comandante</text></g></svg>