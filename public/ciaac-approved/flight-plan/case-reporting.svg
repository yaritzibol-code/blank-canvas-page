<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title desc"><title id="title">Caso: velocidad y estimado</title><desc id="desc">Caso ficticio: TAS promedio 280 a 260 kt, 7.14% de reducción; demora estimada cinco minutos. Se deben aplicar las condiciones completas de vuelo controlado y comparación con la TAS del FPL; 280 kt no se inventa como valor presentado.</desc><rect width="360" height="360" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="24" y="43" font-size="26" fill="#e8be73" text-anchor="start" font-weight="500">CASO · TAS Y ETA</text><rect x="24" y="65" width="312" height="48" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="180.0" y="98" font-size="27" fill="#82c7e5" text-anchor="middle" font-weight="600">280 → 260 kt</text><text x="180" y="151" font-size="43" fill="#82c7e5" text-anchor="middle" font-weight="600">−7.14%</text><rect x="24" y="185" width="312" height="48" rx="12" fill="#173149" stroke="#91d4c6" stroke-width="2"/><text x="180.0" y="218" font-size="27" fill="#91d4c6" text-anchor="middle" font-weight="600">Demora: 5 min</text><text x="24" y="275" font-size="23" fill="#f8f1df" text-anchor="start" font-weight="500">Aplicar condiciones</text><text x="24" y="307" font-size="23" fill="#f8f1df" text-anchor="start" font-weight="500">de TAS / ETA completas</text><text x="24" y="339" font-size="23" fill="#f8f1df" text-anchor="start" font-weight="500">TAS comparada con FPL</text></g></svg>