<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title desc"><title id="title">Casilla 7 y matrícula</title><desc id="desc">Casilla 7 identifica la aeronave. Si el distintivo de llamada difiere de la matrícula, la matrícula completa se declara en 18 bajo REG/.</desc><rect width="360" height="360" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="24" y="43" font-size="26" fill="#e8be73" text-anchor="start" font-weight="500">IDENTIFICACIÓN</text><rect x="24" y="70" width="312" height="48" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="180.0" y="103" font-size="27" fill="#82c7e5" text-anchor="middle" font-weight="600">7 · ACID</text><text x="24" y="162" font-size="23" fill="#f8f1df" text-anchor="start" font-weight="500">Máximo 7 caracteres</text><text x="24" y="202" font-size="23" fill="#f8f1df" text-anchor="start" font-weight="500">Sin guiones ni símbolos</text><line x1="180" y1="222" x2="180" y2="260" stroke="#e8be73" stroke-width="3" /><path d="M184.79425538604204 251.22417438109628 L180 260 L175.20574461395796 251.22417438109628" fill="none" stroke="#e8be73" stroke-width="3"/><rect x="24" y="276" width="312" height="48" rx="12" fill="#173149" stroke="#91d4c6" stroke-width="2"/><text x="180.0" y="309" font-size="27" fill="#91d4c6" text-anchor="middle" font-weight="600">18 · REG/</text></g></svg>