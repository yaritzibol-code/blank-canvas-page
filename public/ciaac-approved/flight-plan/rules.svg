<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title desc"><title id="title">Casilla 8: reglas</title><desc id="desc">Las reglas se codifican I para IFR, V para VFR, Y para IFR que cambia a VFR y Z para VFR que cambia a IFR.</desc><rect width="360" height="360" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="24" y="43" font-size="26" fill="#e8be73" text-anchor="start" font-weight="500">8 · REGLAS</text><rect x="24" y="66" width="138" height="48" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="93.0" y="99" font-size="27" fill="#82c7e5" text-anchor="middle" font-weight="600">I · IFR</text><rect x="198" y="66" width="138" height="48" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="267.0" y="99" font-size="27" fill="#82c7e5" text-anchor="middle" font-weight="600">V · VFR</text><rect x="24" y="150" width="76" height="48" rx="12" fill="#173149" stroke="#91d4c6" stroke-width="2"/><text x="62.0" y="183" font-size="27" fill="#91d4c6" text-anchor="middle" font-weight="600">Y</text><text x="120" y="182" font-size="27" fill="#f8f1df" text-anchor="start" font-weight="500">IFR → VFR</text><rect x="24" y="235" width="76" height="48" rx="12" fill="#173149" stroke="#91d4c6" stroke-width="2"/><text x="62.0" y="268" font-size="27" fill="#91d4c6" text-anchor="middle" font-weight="600">Z</text><text x="120" y="267" font-size="27" fill="#f8f1df" text-anchor="start" font-weight="500">VFR → IFR</text><text x="24" y="335" font-size="25" fill="#c7d3de" text-anchor="start" font-weight="500">Un carácter</text></g></svg>