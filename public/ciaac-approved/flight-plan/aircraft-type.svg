<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title desc"><title id="title">Casilla 9: número y tipo</title><desc id="desc">Cantidad solo si hay más de una aeronave. Tipo: designador OACI; si no existe, ZZZZ enlaza con TYP/ en 18.</desc><rect width="360" height="360" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="24" y="43" font-size="26" fill="#e8be73" text-anchor="start" font-weight="500">9 · NÚMERO Y TIPO</text><text x="24" y="103" font-size="25" fill="#f8f1df" text-anchor="start" font-weight="500">Número: si &gt; 1</text><text x="24" y="146" font-size="25" fill="#f8f1df" text-anchor="start" font-weight="500">Tipo: código OACI</text><text x="24" y="189" font-size="25" fill="#f8f1df" text-anchor="start" font-weight="500">2 a 4 caracteres</text><rect x="24" y="215" width="312" height="48" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="180.0" y="248" font-size="24" fill="#82c7e5" text-anchor="middle" font-weight="600">Sin designador: ZZZZ</text><line x1="180" y1="265" x2="180" y2="288" stroke="#e8be73" stroke-width="3" /><path d="M184.79425538604204 279.22417438109625 L180 288 L175.20574461395796 279.22417438109625" fill="none" stroke="#e8be73" stroke-width="3"/><rect x="24" y="301" width="312" height="48" rx="12" fill="#173149" stroke="#91d4c6" stroke-width="2"/><text x="180.0" y="334" font-size="27" fill="#91d4c6" text-anchor="middle" font-weight="600">18 · TYP/</text></g></svg>