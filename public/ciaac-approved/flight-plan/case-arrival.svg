<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title desc"><title id="title">Caso: llegada y bitácora</title><desc id="desc">Caso ficticio: aterrizaje en Guadalajara, cierre de pleno derecho y aviso ARR según reglas y servicio. Anotar la fluctuación de presión de aceite del motor derecho y avisar a la empresa, sin diagnóstico ni instrucción de mantenimiento.</desc><rect width="360" height="360" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="24" y="43" font-size="26" fill="#e8be73" text-anchor="start" font-weight="500">CASO · LLEGADA</text><rect x="24" y="66" width="312" height="48" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="180.0" y="99" font-size="27" fill="#82c7e5" text-anchor="middle" font-weight="600">MMGL · destino</text><text x="24" y="155" font-size="23" fill="#f8f1df" text-anchor="start" font-weight="500">Cierre legal + aviso ARR</text><text x="24" y="191" font-size="23" fill="#f8f1df" text-anchor="start" font-weight="500">Según reglas y servicio</text><rect x="24" y="223" width="312" height="48" rx="12" fill="#173149" stroke="#91d4c6" stroke-width="2"/><text x="180.0" y="256" font-size="27" fill="#91d4c6" text-anchor="middle" font-weight="600">Motor derecho</text><text x="24" y="307" font-size="25" fill="#f8f1df" text-anchor="start" font-weight="500">Anotar anormalidad</text><text x="24" y="340" font-size="25" fill="#f8f1df" text-anchor="start" font-weight="500">Avisar a la empresa</text></g></svg>