<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title desc"><title id="title">Demora respecto a EOBT</title><desc id="desc">Más de 30 minutos para vuelo controlado; una hora para no controlado con plan presentado. Enmendar o nuevo plan cancelando el antiguo según proceda.</desc><rect width="360" height="360" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="24" y="43" font-size="26" fill="#e8be73" text-anchor="start" font-weight="500">DEMORA · EOBT</text><text x="24" y="105" font-size="24" fill="#f8f1df" text-anchor="start" font-weight="500">Controlado: &gt; 30 min</text><text x="24" y="147" font-size="24" fill="#f8f1df" text-anchor="start" font-weight="500">No controlado: &gt; 1 h</text><text x="24" y="189" font-size="24" fill="#f8f1df" text-anchor="start" font-weight="500">con FPL presentado</text><line x1="180" y1="224" x2="180" y2="250" stroke="#e8be73" stroke-width="3" /><path d="M184.79425538604204 241.22417438109628 L180 250 L175.20574461395796 241.22417438109628" fill="none" stroke="#e8be73" stroke-width="3"/><rect x="24" y="262" width="312" height="48" rx="12" fill="#173149" stroke="#91d4c6" stroke-width="2"/><text x="180.0" y="295" font-size="23" fill="#91d4c6" text-anchor="middle" font-weight="600">Enmendar / nuevo FPL</text><text x="24" y="342" font-size="24" fill="#c7d3de" text-anchor="start" font-weight="500">Según proceda</text></g></svg>