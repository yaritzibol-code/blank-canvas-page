<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title desc"><title id="title">Variación de ETA en vuelo controlado</title><desc id="desc">Más de 3 minutos o período prescrito: próximo punto aplicable, límite FIR o destino, el primero. Notificar nueva hora lo antes posible.</desc><rect width="360" height="360" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="24" y="43" font-size="26" fill="#e8be73" text-anchor="start" font-weight="500">ETA · CONTROLADO</text><text x="180" y="110" font-size="44" fill="#82c7e5" text-anchor="middle" font-weight="600">&gt; 3 min*</text><text x="24" y="170" font-size="24" fill="#f8f1df" text-anchor="start" font-weight="500">Próximo punto / FIR /</text><text x="24" y="212" font-size="24" fill="#f8f1df" text-anchor="start" font-weight="500">destino · el primero</text><text x="24" y="254" font-size="24" fill="#f8f1df" text-anchor="start" font-weight="500">Hora revisada a ATS</text><text x="24" y="311" font-size="21" fill="#c7d3de" text-anchor="start" font-weight="500">*O período prescrito</text><text x="24" y="338" font-size="21" fill="#c7d3de" text-anchor="start" font-weight="500">por autoridad / acuerdos</text></g></svg>