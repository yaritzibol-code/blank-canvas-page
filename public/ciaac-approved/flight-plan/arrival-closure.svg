<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-labelledby="title desc"><title id="title">Cierre legal y aviso de llegada</title><desc id="desc">Aterrizar en la estación o punto de destino previsto produce cierre de pleno derecho, sin trámite presencial duplicado obligatorio por cada llegada normal; subsiste el aviso ARR según reglas y servicio, y comprobación física si procede.</desc><rect width="720" height="390" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="28" y="43" font-size="28" fill="#e8be73" text-anchor="start" font-weight="500">ARRIBO · DOS ASPECTOS RELACIONADOS</text><rect x="28" y="82" width="306" height="48" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="181.0" y="115" font-size="24" fill="#82c7e5" text-anchor="middle" font-weight="600">Aterrizaje en destino</text><rect x="388" y="82" width="304" height="48" rx="12" fill="#173149" stroke="#91d4c6" stroke-width="2"/><text x="540.0" y="115" font-size="22" fill="#91d4c6" text-anchor="middle" font-weight="600">Aviso operacional ARR</text><text x="28" y="197" font-size="25" fill="#f8f1df" text-anchor="start" font-weight="500">Cierre de pleno derecho</text><text x="28" y="237" font-size="25" fill="#f8f1df" text-anchor="start" font-weight="500">RLAC · artículo 160</text><text x="388" y="197" font-size="25" fill="#f8f1df" text-anchor="start" font-weight="500">Según reglas de tránsito</text><text x="388" y="237" font-size="25" fill="#f8f1df" text-anchor="start" font-weight="500">y servicio recibido</text><line x1="360" y1="82" x2="360" y2="272" stroke="#c7d3de" stroke-width="2" /><text x="28" y="315" font-size="23" fill="#c7d3de" text-anchor="start" font-weight="500">Comprobación física cuando las disposiciones lo exijan</text><text x="28" y="355" font-size="24" fill="#e8be73" text-anchor="start" font-weight="500">PIA/DTA vigente: medios y formatos pendientes</text></g></svg>