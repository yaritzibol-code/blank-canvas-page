<svg xmlns="http://www.w3.org/2000/svg" width="720" height="385" viewBox="0 0 720 385" role="img" aria-labelledby="title desc"><title id="title">Ejemplo aritmético 280 a 260 kt</title><desc id="desc">La reducción de 20 kt sobre 280 kt es 7.14%, mayor al umbral de 5%. Se conserva el ejemplo aceptado sin alterar valores.</desc><rect width="720" height="385" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="28" y="44" font-size="28" fill="#e8be73" text-anchor="start" font-weight="500">CASO ARITMÉTICO · TAS PROMEDIO</text><rect x="28" y="75" width="250" height="48" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="153.0" y="108" font-size="27" fill="#82c7e5" text-anchor="middle" font-weight="600">280 kt</text><rect x="442" y="75" width="250" height="48" rx="12" fill="#173149" stroke="#91d4c6" stroke-width="2"/><text x="567.0" y="108" font-size="27" fill="#91d4c6" text-anchor="middle" font-weight="600">260 kt</text><line x1="289" y1="99" x2="430" y2="99" stroke="#e8be73" stroke-width="3" /><path d="M421.22417438109625 94.20574461395798 L430 99 L421.22417438109625 103.79425538604202" fill="none" stroke="#e8be73" stroke-width="3"/><text x="360" y="211" font-size="34" fill="#f8f1df" text-anchor="middle" font-weight="500">|260 − 280| / 280 = 0.0714</text><text x="360" y="284" font-size="48" fill="#e8be73" text-anchor="middle" font-weight="600">7.14% &gt; 5%</text><text x="360" y="348" font-size="29" fill="#82c7e5" text-anchor="middle" font-weight="500">Notificación del cambio a ATC</text></g></svg>