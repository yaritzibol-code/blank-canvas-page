<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title desc"><title id="title">Casilla 18: especificaciones PBN</title><desc id="desc">Dentro de PBN/, B2 es RNAV 5 GNSS y B1 es RNAV 5 con todos los sensores permitidos. No se confunde con B1 de vigilancia en 10b.</desc><rect width="360" height="360" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="24" y="43" font-size="26" fill="#e8be73" text-anchor="start" font-weight="500">18 · PBN/</text><rect x="24" y="70" width="312" height="48" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="180.0" y="103" font-size="27" fill="#82c7e5" text-anchor="middle" font-weight="600">B2 · RNAV 5 GNSS</text><rect x="24" y="165" width="312" height="48" rx="12" fill="#173149" stroke="#91d4c6" stroke-width="2"/><text x="180.0" y="198" font-size="27" fill="#91d4c6" text-anchor="middle" font-weight="600">B1 · RNAV 5</text><text x="24" y="253" font-size="26" fill="#f8f1df" text-anchor="start" font-weight="500">Todos los sensores</text><text x="24" y="293" font-size="26" fill="#f8f1df" text-anchor="start" font-weight="500">permitidos</text><text x="24" y="339" font-size="25" fill="#e8be73" text-anchor="start" font-weight="500">Importa la casilla</text></g></svg>