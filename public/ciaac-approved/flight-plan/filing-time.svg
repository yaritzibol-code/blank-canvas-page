<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title desc"><title id="title">Anticipación respecto a ETD</title><desc id="desc">Según el MGTAM 2019 histórico, el vuelo controlado se presenta al menos 30 minutos antes de ETD. La fuente PIA/DTA vigente está pendiente.</desc><rect width="360" height="360" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="24" y="43" font-size="26" fill="#e8be73" text-anchor="start" font-weight="500">PRESENTACIÓN</text><text x="180" y="112" font-size="45" fill="#82c7e5" text-anchor="middle" font-weight="600">≥ 30 min</text><line x1="45" y1="160" x2="305" y2="160" stroke="#e8be73" stroke-width="3" /><path d="M296.22417438109625 155.20574461395796 L305 160 L296.22417438109625 164.79425538604204" fill="none" stroke="#e8be73" stroke-width="3"/><text x="45" y="205" font-size="27" fill="#f8f1df" text-anchor="start" font-weight="500">FPL</text><text x="264" y="205" font-size="27" fill="#f8f1df" text-anchor="start" font-weight="500">ETD</text><text x="24" y="264" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Vuelo controlado</text><text x="24" y="296" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">MGTAM 2019 histórico</text><text x="24" y="328" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">PIA/DTA actual pendiente</text></g></svg>