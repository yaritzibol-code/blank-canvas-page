<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title desc"><title id="title">Casilla 8: tipo de vuelo</title><desc id="desc">S regular, N no regular, G aviación general, M militar, X otros; X no se omite ni se redefine.</desc><rect width="360" height="360" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="24" y="43" font-size="26" fill="#e8be73" text-anchor="start" font-weight="500">8 · TIPO DE VUELO</text><text x="24" y="99" font-size="25" fill="#f8f1df" text-anchor="start" font-weight="500">S  Servicio regular</text><text x="24" y="148" font-size="25" fill="#f8f1df" text-anchor="start" font-weight="500">N  No regular</text><text x="24" y="197" font-size="25" fill="#f8f1df" text-anchor="start" font-weight="500">G  Aviación general</text><text x="24" y="246" font-size="25" fill="#f8f1df" text-anchor="start" font-weight="500">M  Militar</text><text x="24" y="295" font-size="25" fill="#f8f1df" text-anchor="start" font-weight="500">X  Otros</text></g></svg>