<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title desc"><title id="title">Bitácora de la aeronave</title><desc id="desc">Historial legal de celda y motor; el comandante asienta las fallas y anormalidades observadas o presumidas y notifica a la empresa operadora. No se inventan campos ni firma de liberación.</desc><rect width="360" height="360" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="24" y="43" font-size="27" fill="#e8be73" text-anchor="start" font-weight="500">AERONAVE</text><rect x="42" y="76" width="277" height="150" rx="12" fill="#f8f1df" /><text x="64" y="118" font-size="27" fill="#081b31" text-anchor="start" font-weight="500">BITÁCORA</text><line x1="64" y1="149" x2="292" y2="149" stroke="#081b31" stroke-width="3" /><line x1="64" y1="182" x2="259" y2="182" stroke="#081b31" stroke-width="3" /><text x="24" y="285" font-size="23" fill="#f8f1df" text-anchor="start" font-weight="500">Historial de celda / motor</text><text x="24" y="327" font-size="23" fill="#f8f1df" text-anchor="start" font-weight="500">Fallas y anormalidades</text></g></svg>