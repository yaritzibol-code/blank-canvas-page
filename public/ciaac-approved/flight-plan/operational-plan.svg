<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title desc"><title id="title">Plan operacional de vuelo</title><desc id="desc">OFP: documento técnico de despacho, combustible, peso y balance. Es distinto de ambas bitácoras.</desc><rect width="360" height="360" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="24" y="43" font-size="27" fill="#e8be73" text-anchor="start" font-weight="500">PLAN OPERACIONAL</text><rect x="42" y="76" width="277" height="150" rx="12" fill="#f8f1df" /><text x="64" y="118" font-size="35" fill="#081b31" text-anchor="start" font-weight="500">OFP</text><line x1="64" y1="149" x2="292" y2="149" stroke="#081b31" stroke-width="3" /><line x1="64" y1="182" x2="259" y2="182" stroke="#081b31" stroke-width="3" /><text x="24" y="285" font-size="24" fill="#f8f1df" text-anchor="start" font-weight="500">Despacho · combustible</text><text x="24" y="327" font-size="24" fill="#f8f1df" text-anchor="start" font-weight="500">Peso y balance</text></g></svg>