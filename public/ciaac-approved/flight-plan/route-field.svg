<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title desc"><title id="title">Casilla 15: velocidad, nivel y ruta</title><desc id="desc">Casilla 15 relaciona TAS N o M, nivel A, F o VFR y ruta mediante puntos, fijas, radioayudas y vías aéreas. Resumen básico no exhaustivo.</desc><rect width="360" height="360" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="24" y="43" font-size="26" fill="#e8be73" text-anchor="start" font-weight="500">15 · RUTA</text><rect x="24" y="66" width="312" height="48" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="180.0" y="99" font-size="27" fill="#82c7e5" text-anchor="middle" font-weight="600">TAS · N / M</text><line x1="180" y1="117" x2="180" y2="141" stroke="#e8be73" stroke-width="3" /><path d="M184.79425538604204 132.22417438109628 L180 141 L175.20574461395796 132.22417438109628" fill="none" stroke="#e8be73" stroke-width="3"/><rect x="24" y="153" width="312" height="48" rx="12" fill="#173149" stroke="#91d4c6" stroke-width="2"/><text x="180.0" y="186" font-size="27" fill="#91d4c6" text-anchor="middle" font-weight="600">Nivel · A / F / VFR</text><line x1="180" y1="204" x2="180" y2="228" stroke="#e8be73" stroke-width="3" /><path d="M184.79425538604204 219.22417438109628 L180 228 L175.20574461395796 219.22417438109628" fill="none" stroke="#e8be73" stroke-width="3"/><rect x="24" y="240" width="312" height="48" rx="12" fill="#173149" stroke="#e8be73" stroke-width="2"/><text x="180.0" y="273" font-size="27" fill="#e8be73" text-anchor="middle" font-weight="600">Puntos y vías</text><text x="24" y="336" font-size="23" fill="#c7d3de" text-anchor="start" font-weight="500">Resumen no exhaustivo</text></g></svg>