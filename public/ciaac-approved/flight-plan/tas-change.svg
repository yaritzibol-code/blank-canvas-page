<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title desc"><title id="title">Variación de TAS en vuelo controlado</title><desc id="desc">Promedio TAS al nivel de crucero entre puntos: variación real o prevista de 5% en más o en menos respecto al plan; notificar a ATS.</desc><rect width="360" height="360" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="24" y="43" font-size="26" fill="#e8be73" text-anchor="start" font-weight="500">TAS · CONTROLADO</text><text x="180" y="122" font-size="54" fill="#82c7e5" text-anchor="middle" font-weight="600">± 5%</text><text x="24" y="189" font-size="24" fill="#f8f1df" text-anchor="start" font-weight="500">Promedio en crucero</text><text x="24" y="230" font-size="24" fill="#f8f1df" text-anchor="start" font-weight="500">entre puntos de reporte</text><text x="24" y="271" font-size="24" fill="#f8f1df" text-anchor="start" font-weight="500">Real o prevista</text><rect x="24" y="305" width="312" height="48" rx="12" fill="#173149" stroke="#91d4c6" stroke-width="2"/><text x="180.0" y="338" font-size="27" fill="#91d4c6" text-anchor="middle" font-weight="600">Notificar a ATS</text></g></svg>