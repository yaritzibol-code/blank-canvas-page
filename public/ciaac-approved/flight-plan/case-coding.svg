<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title desc"><title id="title">Caso: identificación y codificación</title><desc id="desc">Caso ficticio: AMX501; reglas I y tipo G; estela L por 6,200 kg; equipos SDGR/S; REG/XBABC y PBN/B2 en 18. El modelo no está declarado: no se inventa un designador ni se impone ZZZZ.</desc><rect width="360" height="360" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="24" y="43" font-size="25" fill="#e8be73" text-anchor="start" font-weight="500">CASO · CODIFICACIÓN</text><text x="24" y="98" font-size="26" fill="#f8f1df" text-anchor="start" font-weight="500">7 · AMX501</text><text x="24" y="141" font-size="26" fill="#f8f1df" text-anchor="start" font-weight="500">8 · I / G</text><text x="24" y="184" font-size="26" fill="#f8f1df" text-anchor="start" font-weight="500">9 · L · 6,200 kg</text><text x="24" y="227" font-size="26" fill="#f8f1df" text-anchor="start" font-weight="500">10 · SDGR/S</text><text x="24" y="292" font-size="25" fill="#91d4c6" text-anchor="start" font-weight="500">18 · REG/XBABC</text><text x="24" y="332" font-size="25" fill="#91d4c6" text-anchor="start" font-weight="500">18 · PBN/B2</text></g></svg>