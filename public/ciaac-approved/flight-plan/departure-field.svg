<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title desc"><title id="title">Casilla 13: salida y EOBT</title><desc id="desc">Indicador OACI de salida y EOBT UTC en cuatro dígitos. Si el lugar carece de indicador, ZZZZ con el nombre en 18/DEP. Este DEP/ es un indicador, distinto del mensaje DEP.</desc><rect width="360" height="360" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="24" y="43" font-size="26" fill="#e8be73" text-anchor="start" font-weight="500">13 · SALIDA</text><rect x="24" y="66" width="312" height="48" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="180.0" y="99" font-size="27" fill="#82c7e5" text-anchor="middle" font-weight="600">Indicador OACI</text><rect x="24" y="137" width="312" height="48" rx="12" fill="#173149" stroke="#91d4c6" stroke-width="2"/><text x="180.0" y="170" font-size="27" fill="#91d4c6" text-anchor="middle" font-weight="600">EOBT · UTC</text><text x="24" y="222" font-size="25" fill="#f8f1df" text-anchor="start" font-weight="500">Hora · 4 dígitos</text><text x="24" y="267" font-size="24" fill="#f8f1df" text-anchor="start" font-weight="500">Si no hay indicador:</text><rect x="24" y="287" width="312" height="48" rx="12" fill="#173149" stroke="#e8be73" stroke-width="2"/><text x="180.0" y="320" font-size="27" fill="#e8be73" text-anchor="middle" font-weight="600">ZZZZ → 18 · DEP/</text></g></svg>