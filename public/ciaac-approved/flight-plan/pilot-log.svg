<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title desc"><title id="title">Bitácora del piloto</title><desc id="desc">Registro personal de las horas de vuelo del aviador, vinculado a MI03 y OP01. Se distingue del registro de la aeronave y del OFP.</desc><rect width="360" height="360" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="24" y="43" font-size="27" fill="#e8be73" text-anchor="start" font-weight="500">PILOTO</text><rect x="42" y="76" width="277" height="150" rx="12" fill="#f8f1df" /><text x="64" y="118" font-size="23" fill="#081b31" text-anchor="start" font-weight="500">HORAS DE VUELO</text><line x1="64" y1="149" x2="292" y2="149" stroke="#081b31" stroke-width="3" /><line x1="64" y1="182" x2="259" y2="182" stroke="#081b31" stroke-width="3" /><text x="24" y="285" font-size="25" fill="#f8f1df" text-anchor="start" font-weight="500">Registro personal</text><text x="24" y="327" font-size="25" fill="#f8f1df" text-anchor="start" font-weight="500">MI03 / OP01</text></g></svg>