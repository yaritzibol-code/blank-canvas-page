A185,185 0 0 0 573.274,276.157 Z" fill="url(#shoe)" stroke="#193a50" stroke-width="3"/><path d="M591.059,227.293 A237,237 0 0 1 591.059,672.707 L586.613,660.491 A224,224 0 0 0 586.613,239.509 Z" fill="#ddab47" stroke="#89601c" stroke-width="2"/><path d="M380 450 L290 450" stroke="#a34021" stroke-width="7" marker-end="url(#forceArrow)"/><path d="M640 450 L730 450" stroke="#a34021" stroke-width="7" marker-end="url(#forceArrow)"/><path d="M225 256 A344 344 0 0 1 821 302" fill="none" stroke="#08798b" stroke-width="7" marker-end="url(#blueArrow)"/><g fill="none" stroke="#435f74" stroke-width="3"><path d="M781 560 L907 560 L950 530"/><path d="M708 402 L902 402 L950 357"/><path d="M742 467 L902 467 L950 443"/></g><g font-family="DejaVu Sans,sans-serif" fill="#17344b"><text x="963" y="539" font-size="29">Tambor</text><text x="963" y="578" font-size="23">gira junto con la rueda</text><text x="963" y="365" font-size="29">Zapatas</text><text x="963" y="400" font-size="23">interiores</text><text x="963" y="450" font-size="29">Forros o balatas</text></g></svg>