<svg xmlns="http://www.w3.org/2000/svg" width="680" height="423" viewBox="0 0 680 423" role="img" aria-labelledby="title desc"><title id="title">Caso IFR: 4,200 → 5,200 → 6,000 ft</title><desc id="desc">Caso hipotético: obstáculo de 4,200 ft MSL dentro del radio de 8 km; margen 1,000 ft; mínima 5,200 ft MSL. Derrota 210°: altitud IFR de 6,000 pies QNH. Transición 18,500 ft es solo dato del ejercicio.</desc><rect width="680" height="423" rx="18" fill="#091d32"/><g font-family="DejaVu Sans, sans-serif"><text x="340.0" y="38" font-size="22" fill="#ecc680" text-anchor="middle" font-weight="650">CASO IFR · QNH</text><line x1="24" y1="56" x2="656" y2="56" stroke="#37536a" stroke-width="1"/><line x1="65" y1="351" x2="621" y2="351" stroke="#bfcedc" stroke-width="2"/><rect x="138" y="215" width="40" height="136" rx="0" fill="#597587"/><text x="109" y="393" font-size="25" fill="#faf3e5" text-anchor="middle" font-weight="500">4,200 ft</text><line x1="46" y1="173" x2="632" y2="173" stroke="#ecc680" stroke-width="3" stroke-dasharray="10 7"/><text x="346" y="160" font-size="26" fill="#ecc680" text-anchor="middle" font-weight="500">5,200 ft MSL · mínima</text><line x1="46" y1="100" x2="632" y2="100" stroke="#99d8c5" stroke-width="3"/><path d="M0 -35 L6 -18 L7 -2 L38 15 L38 23 L7 13 L6 32 L17 40 L17 46 L0 40 L-17 46 L-17 40 L-6 32 L-7 13 L-38 23 L-38 15 L-7 -2 L-6 -18Z" transform="translate(470 88) rotate(90) scale(0.56)" fill="#99d8c5"/><text x="331" y="84" font-size="29" fill="#99d8c5" text-anchor="middle" font-weight="500">6,000 pies QNH</text><line x1="585" y1="213" x2="585" y2="178" stroke="#ecc680" stroke-width="3"/><path d="M578.7277532528321 188.23029426471408 L585 178 L591.2722467471679 188.23029426471408" fill="none" stroke="#ecc680" stroke-width="3"/><text x="457" y="233" font-size="25" fill="#ecc680" text-anchor="middle" font-weight="500">+ 1,000 ft</text><text x="344" y="290" font-size="27" fill="#faf3e5" text-anchor="middle" font-weight="500">Derrota 210° · miles pares</text></g></svg>