<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="title desc"><title id="title">Planeadores en operación</title><desc id="desc">Planeadores en Operación (§4.2.8): Una doble cruz blanca, colocada horizontalmente en el área de señales, indica que el aeródromo es utilizado por planeadores y que se están realizando vuelos de esa naturaleza.</desc><rect width="360" height="350" rx="18" fill="#091d32"/><g font-family="DejaVu Sans, sans-serif"><text x="180.0" y="38" font-size="18" fill="#ecc680" text-anchor="middle" font-weight="650">PLANEADORES EN OPERACIÓN</text><line x1="24" y1="56" x2="336" y2="56" stroke="#37536a" stroke-width="1"/><rect x="78" y="176" width="210" height="24" rx="0" fill="#faf3e5"/><rect x="117" y="118" width="24" height="140" rx="0" fill="#faf3e5"/><rect x="226" y="118" width="24" height="140" rx="0" fill="#faf3e5"/></g></svg>