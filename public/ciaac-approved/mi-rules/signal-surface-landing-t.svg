<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="title desc"><title id="title">T de aterrizaje</title><desc id="desc">Instrucciones para Aterrizaje y Despegue — T de Aterrizaje (§4.2.5.1): Una T de aterrizaje horizontal, de color blanco o anaranjado, indica la dirección que ha de seguir la aeronave para aterrizar y despegar, haciéndolo en dirección paralela al brazo de la T y hacia su travesaño.</desc><rect width="360" height="350" rx="18" fill="#091d32"/><g font-family="DejaVu Sans, sans-serif"><text x="180.0" y="38" font-size="22" fill="#ecc680" text-anchor="middle" font-weight="650">T DE ATERRIZAJE</text><line x1="24" y1="56" x2="336" y2="56" stroke="#37536a" stroke-width="1"/><rect x="91" y="99" width="178" height="28" rx="0" fill="#faf3e5"/><rect x="166" y="99" width="28" height="182" rx="0" fill="#faf3e5"/><line x1="306" y1="274" x2="306" y2="142" stroke="#9ad2ed" stroke-width="4"/><path d="M299.7277532528321 152.23029426471408 L306 142 L312.2722467471679 152.23029426471408" fill="none" stroke="#9ad2ed" stroke-width="4"/><text x="180" y="326" font-size="25" fill="#faf3e5" text-anchor="middle" font-weight="500">Hacia el travesaño</text></g></svg>