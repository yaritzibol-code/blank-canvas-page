<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="title desc"><title id="title">Pesas blancas</title><desc id="desc">Pesas Blancas (§4.2.3.1): Una señal blanca y horizontal en forma de pesas indica que las aeronaves deben aterrizar, despegar y rodar únicamente en las pistas y en las calles de rodaje.</desc><rect width="360" height="350" rx="18" fill="#091d32"/><g font-family="DejaVu Sans, sans-serif"><text x="180.0" y="38" font-size="22" fill="#ecc680" text-anchor="middle" font-weight="650">PESAS BLANCAS</text><line x1="24" y1="56" x2="336" y2="56" stroke="#37536a" stroke-width="1"/><rect x="109" y="171" width="141" height="30" rx="0" fill="#faf3e5"/><circle cx="101" cy="186" r="44" stroke="#faf3e5" fill="#faf3e5" stroke-width="0"/><circle cx="258" cy="186" r="44" stroke="#faf3e5" fill="#faf3e5" stroke-width="0"/></g></svg>