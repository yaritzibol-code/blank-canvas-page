<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="title desc"><title id="title">Prohibición de aterrizaje</title><desc id="desc">Prohibición de Aterrizaje (§4.2.1): Un panel cuadrado, rojo y horizontal, con diagonales amarillas indica que están prohibidos los aterrizajes y que es posible que dure dicha prohibición.</desc><rect width="360" height="350" rx="18" fill="#091d32"/><g font-family="DejaVu Sans, sans-serif"><text x="180.0" y="38" font-size="19" fill="#ecc680" text-anchor="middle" font-weight="650">PROHIBICIÓN DE ATERRIZAJE</text><line x1="24" y1="56" x2="336" y2="56" stroke="#37536a" stroke-width="1"/><rect x="89" y="99" width="182" height="182" rx="0" fill="#b83d35"/><line x1="107" y1="119" x2="253" y2="261" stroke="#f8d765" stroke-width="15"/><line x1="253" y1="119" x2="107" y2="261" stroke="#f8d765" stroke-width="15"/></g></svg>