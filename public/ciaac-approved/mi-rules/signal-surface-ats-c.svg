<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="title desc"><title id="title">Oficina de notificación ATS</title><desc id="desc">Oficina de Notificación ATS (§4.2.7): La letra C, en negro, colocada verticalmente sobre un fondo amarillo, indica el lugar en que se encuentra la oficina de notificación de los servicios de tránsito aéreo.</desc><rect width="360" height="350" rx="18" fill="#091d32"/><g font-family="DejaVu Sans, sans-serif"><text x="180.0" y="38" font-size="21" fill="#ecc680" text-anchor="middle" font-weight="650">Oficina de notificación ATS</text><line x1="24" y1="56" x2="336" y2="56" stroke="#37536a" stroke-width="1"/><rect x="95" y="96" width="170" height="184" rx="0" fill="#efcd67"/><text x="180" y="232" font-size="128" fill="#101820" text-anchor="middle" font-weight="700">C</text></g></svg>