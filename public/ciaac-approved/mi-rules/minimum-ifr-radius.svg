<svg xmlns="http://www.w3.org/2000/svg" width="680" height="438" viewBox="0 0 680 438" role="img" aria-labelledby="title desc"><title id="title">IFR: radio de obstáculos</title><desc id="desc">Círculo de radio 8 km centrado en la posición estimada de la aeronave. Solo a falta de mínima estatal fijada: 2,000 ft sobre el obstáculo más alto en montaña y 1,000 ft en cualquier otra parte. No es una franja de ruta.</desc><rect width="680" height="438" rx="18" fill="#091d32"/><g font-family="DejaVu Sans, sans-serif"><text x="340.0" y="38" font-size="22" fill="#ecc680" text-anchor="middle" font-weight="650">IFR · POSICIÓN ESTIMADA</text><line x1="24" y1="56" x2="656" y2="56" stroke="#37536a" stroke-width="1"/><circle cx="202" cy="220" r="131" stroke="#ecc680" fill="none" stroke-width="3"/><path d="M0 -35 L6 -18 L7 -2 L38 15 L38 23 L7 13 L6 32 L17 40 L17 46 L0 40 L-17 46 L-17 40 L-6 32 L-7 13 L-38 23 L-38 15 L-7 -2 L-6 -18Z" transform="translate(202 220) rotate(0) scale(0.65)" fill="#faf3e5"/><line x1="209" y1="220" x2="328" y2="220" stroke="#ecc680" stroke-width="4"/><path d="M317.7697057352859 213.7277532528321 L328 220 L317.7697057352859 226.2722467471679" fill="none" stroke="#ecc680" stroke-width="4"/><text x="266" y="205" font-size="25" fill="#ecc680" text-anchor="middle" font-weight="500">8 km</text><rect x="117" y="134" width="22" height="27" rx="0" fill="#7b93a0"/><rect x="254" y="139" width="32" height="43" rx="0" fill="#7b93a0"/><rect x="132" y="279" width="28" height="39" rx="0" fill="#7b93a0"/><text x="507" y="125" font-size="29" fill="#99d8c5" text-anchor="middle" font-weight="500">Mínima estatal</text><text x="506" y="172" font-size="26" fill="#ecc680" text-anchor="middle" font-weight="500">A falta de ella:</text><text x="506" y="222" font-size="25" fill="#faf3e5" text-anchor="middle" font-weight="500">Montaña: 2,000 ft</text><text x="507" y="268" font-size="25" fill="#faf3e5" text-anchor="middle" font-weight="500">Otra: 1,000 ft</text><text x="507" y="313" font-size="24" fill="#faf3e5" text-anchor="middle" font-weight="500">sobre el obstáculo</text><text x="339" y="404" font-size="29" fill="#ecc680" text-anchor="middle" font-weight="500">RADIO DE 8 km</text></g></svg>