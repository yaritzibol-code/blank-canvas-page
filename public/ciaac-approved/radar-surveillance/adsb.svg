<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="title desc"><title id="title">ADS-B: radiodifusión automática</title><desc id="desc">La aeronave transmite espontáneamente su posición derivada de navegación a bordo. 1090 ES es una modalidad de ADS-B; no es una definición universal del sistema.</desc><rect width="360" height="350" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif"><path d="M-38 8 L32 8 Q48 5 35 0 L9 -2 L-11 -22 L-19 -22 L-11 -1 L-27 -1 L-36 -10 L-42 -10 Z" transform="translate(180,100) scale(1.1)" fill="#f8f1df"/><rect x="111" y="28" width="138" height="40" rx="12" fill="#163249" stroke="#e9bd70" stroke-width="2"/><text x="180.0" y="58.08" font-size="28" fill="#e9bd70" text-anchor="middle" font-weight="600">GNSS</text><line x1="150" y1="132" x2="64" y2="199" stroke="#80c5e5" stroke-width="3" /><path d="M73.8693123030337 197.38857992280484 L64 199 L67.97644895536527 189.82460607355878" fill="none" stroke="#80c5e5" stroke-width="3"/><line x1="184" y1="134" x2="184" y2="206" stroke="#80c5e5" stroke-width="3" /><path d="M188.79425538604204 197.22417438109628 L184 206 L179.20574461395796 197.22417438109628" fill="none" stroke="#80c5e5" stroke-width="3"/><line x1="218" y1="131" x2="306" y2="198" stroke="#80c5e5" stroke-width="3" /><path d="M301.92182871299775 188.86936371582624 L306 198 L296.11338914394105 196.4983589707067" fill="none" stroke="#80c5e5" stroke-width="3"/><g transform="translate(62,236) scale(0.55)"><path d="M-24 30 L0 -35 L24 30 M-14 5 H14 M-21 24 H21" fill="none" stroke="#80c5e5" stroke-width="5"/><circle cx="0" cy="-35" r="5" fill="#80c5e5" stroke="#80c5e5" stroke-width="3"/></g><g transform="translate(184,236) scale(0.55)"><path d="M-24 30 L0 -35 L24 30 M-14 5 H14 M-21 24 H21" fill="none" stroke="#80c5e5" stroke-width="5"/><circle cx="0" cy="-35" r="5" fill="#80c5e5" stroke="#80c5e5" stroke-width="3"/></g><g transform="translate(307,236) scale(0.55)"><path d