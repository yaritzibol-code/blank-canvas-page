<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="title desc"><title id="title">Código 7500</title><desc id="desc">Interferencia ilícita; seleccionado exclusivamente por la persona piloto al mando en el supuesto de la fuente.</desc><rect width="360" height="350" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif"><rect x="27" y="40" width="306" height="105" rx="12" fill="#10273d" stroke="#edada1" stroke-width="2"/><text x="180" y="114" font-size="70" fill="#edada1" text-anchor="middle" font-weight="600">7500</text><text x="180" y="211" font-size="32" fill="#f8f1df" text-anchor="middle" font-weight="500">Interferencia</text><text x="180" y="255" font-size="32" fill="#f8f1df" text-anchor="middle" font-weight="500">ilícita</text><text x="180" y="319" font-size="25" fill="#bfcede" text-anchor="middle" font-weight="500">Código no discreto</text></g></svg>