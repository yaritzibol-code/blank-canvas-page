<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="title desc"><title id="title">Final: estela, información y AIP</title><desc id="desc">Condiciones 5, 7 y 8: no aplican mínimas de estela superiores; operadores y pilotos informados oficialmente de desalojar la pista con máxima celeridad; procedimientos y requisitos específicos publicados en AIP. La flecha ordena la lectura, no establece un plazo procedimental.</desc><rect width="360" height="350" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif"><text x="180" y="69" font-size="27" fill="#e9bd70" text-anchor="middle" font-weight="500">Estela: sin mínima</text><text x="180" y="111" font-size="27" fill="#e9bd70" text-anchor="middle" font-weight="500">superior aplicable</text><rect x="29" y="147" width="302" height="49" rx="12" fill="#163249" stroke="#93d5c3" stroke-width="2"/><text x="180.0" y="180.86" font-size="26" fill="#93d5c3" text-anchor="middle" font-weight="600">Pilotos informados</text><line x1="180" y1="210" x2="180" y2="244" stroke="#93d5c3" stroke-width="3" /><path d="M184.79425538604204 235.22417438109628 L180 244 L175.20574461395796 235.22417438109628" fill="none" stroke="#93d5c3" stroke-width="3"/><rect x="29" y="256" width="302" height="49" rx="12" fill="#163249" stroke="#80c5e5" stroke-width="2"/><text x="180.0" y="290.94" font-size="29" fill="#80c5e5" text-anchor="middle" font-weight="600">Publicado en AIP</text></g></svg>