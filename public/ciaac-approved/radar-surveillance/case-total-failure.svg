<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="title desc"><title id="title">Caso: procedimiento y excepción</title><desc id="desc">La pregunta distingue la separación por procedimientos como respuesta de base y la medida excepcional de emergencia temporal cuando no puede establecerse inmediatamente.</desc><rect width="360" height="350" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif"><rect x="19" y="29" width="322" height="46" rx="12" fill="#163249" stroke="#80c5e5" stroke-width="2"/><text x="180.0" y="62.44" font-size="29" fill="#80c5e5" text-anchor="middle" font-weight="600">Separación por</text><rect x="19" y="91" width="322" height="46" rx="12" fill="#163249" stroke="#80c5e5" stroke-width="2"/><text x="180.0" y="124.44" font-size="29" fill="#80c5e5" text-anchor="middle" font-weight="600">procedimientos</text><text x="180" y="189" font-size="26" fill="#edada1" text-anchor="middle" font-weight="500">Si no es inmediata:</text><line x1="180" y1="206" x2="180" y2="233" stroke="#edada1" stroke-width="3" /><path d="M184.79425538604204 224.22417438109628 L180 233 L175.20574461395796 224.22417438109628" fill="none" stroke="#edada1" stroke-width="3"/><text x="180" y="281" font-size="28" fill="#e9bd70" text-anchor="middle" font-weight="500">Excepción temporal</text><text x="180" y="329" font-size="28" fill="#e9bd70" text-anchor="middle" font-weight="500">½ mínima aplicable</text></g></svg>