<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="title desc"><title id="title">Falla total: establecer separación por procedimientos</title><desc id="desc">Falla total del sistema de vigilancia en tierra con radio persistente: trazar posiciones de aeronaves ya identificadas, tomar medidas para establecer separación basada en procedimientos y limitar nuevas entradas si es necesario. Las acciones no se convierten en una secuencia temporal más estricta que la fuente.</desc><rect width="360" height="350" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif"><rect x="25" y="26" width="310" height="48" rx="12" fill="#163249" stroke="#edada1" stroke-width="2"/><text x="180.0" y="59.36" font-size="26" fill="#edada1" text-anchor="middle" font-weight="600">Falla total en tierra</text><text x="180" y="118" font-size="29" fill="#93d5c3" text-anchor="middle" font-weight="500">Radio persiste</text><text x="180" y="178" font-size="28" fill="#f8f1df" text-anchor="middle" font-weight="500">Trazar posiciones</text><line x1="180" y1="196" x2="180" y2="226" stroke="#80c5e5" stroke-width="3" /><path d="M184.79425538604204 217.22417438109628 L180 226 L175.20574461395796 217.22417438109628" fill="none" stroke="#80c5e5" stroke-width="3"/><text x="180" y="268" font-size="29" fill="#80c5e5" text-anchor="middle" font-weight="500">Separación por</text><text x="180" y="311" font-size="29" fill="#80c5e5" text-anchor="middle" font-weight="500">procedimientos</text></g></svg>