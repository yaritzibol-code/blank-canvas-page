<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="title desc"><title id="title">Final: vigilancia y velocidad</title><desc id="desc">Condiciones 3, 4 y 6: actualización no mayor de 5 segundos con resolución adecuada; observación de la pista y calles de entrada y salida mediante los medios permitidos; vigilancia estrecha y ajuste de velocidades cuando sea necesario. Los medios y el propósito completos se conservan en las tarjetas.</desc><rect width="360" height="350" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif"><circle cx="83" cy="106" r="48" fill="none" stroke="#80c5e5" stroke-width="3"/><circle cx="83" cy="106" r="24.0" fill="none" stroke="#80c5e5" stroke-width="1"/><line x1="35" y1="106" x2="131" y2="106" stroke="#80c5e5" stroke-width="1" /><line x1="83" y1="58" x2="83" y2="154" stroke="#80c5e5" stroke-width="1" /><line x1="83" y1="106" x2="116.6" y2="72.4" stroke="#e9bd70" stroke-width="3" /><text x="232" y="93" font-size="34" fill="#80c5e5" text-anchor="middle" font-weight="500">≤ 5 s</text><text x="233" y="134" font-size="23" fill="#80c5e5" text-anchor="middle" font-weight="500">Actualización</text><text x="180" y="201" font-size="25" fill="#f8f1df" text-anchor="middle" font-weight="500">Resolución adecuada</text><text x="180" y="245" font-size="29" fill="#93d5c3" text-anchor="middle" font-weight="500">Observar pista</text><text x="180" y="286" font-size="27" fill="#93d5c3" text-anchor="middle" font-weight="500">y calles de rodaje</text><text x="180" y="330" font-size="26" fill="#e9bd70" text-anchor="middle" font-weight="500">Vigilar velocidades</text></g></svg>