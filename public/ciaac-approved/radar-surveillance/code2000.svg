<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="title desc"><title id="title">2000: alcance histórico</title><desc id="desc">MGTAM 2019: IFR procedente de espacio aéreo no radar sin código individual asignado. La aplicación actual debe verificarse en la publicación operacional pertinente.</desc><rect width="360" height="350" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif"><rect x="27" y="30" width="306" height="100" rx="12" fill="#10273d" stroke="#80c5e5" stroke-width="2"/><text x="180" y="103" font-size="66" fill="#80c5e5" text-anchor="middle" font-weight="600">2000</text><text x="180" y="170" font-size="27" fill="#f8f1df" text-anchor="middle" font-weight="500">IFR desde no radar</text><text x="180" y="215" font-size="26" fill="#f8f1df" text-anchor="middle" font-weight="500">Sin código individual</text><rect x="25" y="246" width="310" height="45" rx="12" fill="#163249" stroke="#e9bd70" stroke-width="2"/><text x="180.0" y="278.58" font-size="28" fill="#e9bd70" text-anchor="middle" font-weight="600">MGTAM 2019</text><text x="180" y="330" font-size="27" fill="#e9bd70" text-anchor="middle" font-weight="500">Verificar vigencia</text></g></svg>