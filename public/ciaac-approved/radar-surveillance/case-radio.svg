<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="title desc"><title id="title">Caso alternativo: radio y recepción</title><desc id="desc">La tercera pregunta es contrafactual: si fallara la radio bidireccional pero la vigilancia permaneciera activa. Código 7600; confirmación por maniobra observada o IDENT si el receptor de la aeronave sigue funcionando.</desc><rect width="360" height="350" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif"><text x="180" y="92" font-size="67" fill="#e9bd70" text-anchor="middle" font-weight="600">7600</text><text x="180" y="148" font-size="27" fill="#f8f1df" text-anchor="middle" font-weight="500">Si receptor funciona</text><line x1="180" y1="166" x2="180" y2="195" stroke="#80c5e5" stroke-width="3" /><path d="M184.79425538604204 186.22417438109628 L180 195 L175.20574461395796 186.22417438109628" fill="none" stroke="#80c5e5" stroke-width="3"/><text x="180" y="242" font-size="27" fill="#80c5e5" text-anchor="middle" font-weight="500">Maniobra observada</text><text x="180" y="288" font-size="34" fill="#93d5c3" text-anchor="middle" font-weight="500">o IDENT</text><text x="180" y="334" font-size="25" fill="#bfcede" text-anchor="middle" font-weight="500">Supuesto alternativo</text></g></svg>