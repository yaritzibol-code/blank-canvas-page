<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="title desc"><title id="title">5 NM: mínima básica histórica</title><desc id="desc">En el alcance histórico de la fuente, la base es 5 NM, equivalente a 9.2 km, a menos que se prescriba otra separación específica. La posición relativa de los símbolos es ilustrativa y no mide distancia.</desc><rect width="360" height="350" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif"><text x="180" y="66" font-size="26" fill="#e9bd70" text-anchor="middle" font-weight="500">MGTAM 2019</text><circle cx="180" cy="153" r="69" fill="none" stroke="#80c5e5" stroke-width="3"/><circle cx="180" cy="153" r="34.5" fill="none" stroke="#80c5e5" stroke-width="1"/><line x1="111" y1="153" x2="249" y2="153" stroke="#80c5e5" stroke-width="1" /><line x1="180" y1="84" x2="180" y2="222" stroke="#80c5e5" stroke-width="1" /><line x1="180" y1="153" x2="228.3" y2="104.7" stroke="#e9bd70" stroke-width="3" /><circle cx="143" cy="141" r="8" fill="#93d5c3" stroke="#93d5c3" stroke-width="3"/><circle cx="211" cy="172" r="8" fill="#93d5c3" stroke="#93d5c3" stroke-width="3"/><text x="180" y="278" font-size="49" fill="#f8f1df" text-anchor="middle" font-weight="600">5 NM</text><text x="180" y="324" font-size="25" fill="#e9bd70" text-anchor="middle" font-weight="500">Salvo otra específica</text></g></svg>