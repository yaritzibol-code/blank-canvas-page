<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="title desc"><title id="title">Bordes de símbolos de posición</title><desc id="desc">Los bordes no se tocan ni superponen, salvo que se aplique separación vertical. Esta regla se representa por dos símbolos separados; su tamaño y separación no representan mínimos.</desc><rect width="360" height="350" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif"><text x="180" y="55" font-size="29" fill="#e9bd70" text-anchor="middle" font-weight="500">SÍMBOLOS</text><rect x="30" y="87" width="300" height="120" rx="12" fill="#0e273d" stroke="#80c5e5" stroke-width="2"/><circle cx="127" cy="146" r="22" fill="#93d5c3" stroke="#93d5c3" stroke-width="3"/><circle cx="235" cy="146" r="22" fill="#93d5c3" stroke="#93d5c3" stroke-width="3"/><line x1="157" y1="146" x2="203" y2="146" stroke="#e9bd70" stroke-width="3" /><text x="180" y="248" font-size="25" fill="#f8f1df" text-anchor="middle" font-weight="500">No tocar / superponer</text><text x="180" y="291" font-size="27" fill="#93d5c3" text-anchor="middle" font-weight="500">Salvo separación</text><text x="180" y="333" font-size="27" fill="#93d5c3" text-anchor="middle" font-weight="500">vertical aplicada</text></g></svg>