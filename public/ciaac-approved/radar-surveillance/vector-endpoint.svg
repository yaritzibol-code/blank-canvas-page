<svg xmlns="http://www.w3.org/2000/svg" width="680" height="482" viewBox="0 0 680 482" role="img" aria-labelledby="title desc"><title id="title">Identificación, vectores y reanudación</title><desc id="desc">Primero identificación e información al piloto. La trayectoria dorada simboliza guía vectorial fuera de una ruta publicada; no asigna rumbos ni altitudes. La responsabilidad ATC por franqueamiento de obstáculos se prolonga hasta el punto donde el piloto reanuda efectivamente su propia navegación, marcado en verde. Terminar de emitir vectores no adelanta ese punto. Siempre que sea necesario, en la altitud mínima pertinente para guía vectorial se incluirá una corrección para tener en cuenta el efecto de bajas temperaturas.</desc><rect width="680" height="482" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif"><rect x="24" y="23" width="278" height="46" rx="12" fill="#163249" stroke="#80c5e5" stroke-width="2"/><text x="163.0" y="56.08" font-size="28" fill="#80c5e5" text-anchor="middle" font-weight="600">IDENTIFICAR</text><line x1="304" y1="46" x2="352" y2="46" stroke="#e9bd70" stroke-width="3" /><path d="M343.22417438109625 41.20574461395797 L352 46 L343.22417438109625 50.79425538604203" fill="none" stroke="#e9bd70" stroke-width="3"/><rect x="361" y="23" width="295" height="46" rx="12" fill="#163249" stroke="#80c5e5" stroke-width="2"/><text x="508.5" y="55.72" font-size="27" fill="#80c5e5" text-anchor="middle" font-weight="600">Informar al piloto</text><line x1="35" y1="169" x2="640" y2="169" stroke="#bfcede" stroke-width="4" stroke-dasharray="13 11"/><text x="35" y="151" font-size="28" fill="#bfcede" text-anchor="start" font-weight="500">Ruta publicada</text><line x1="105" y1="169" x2="240" y2="256" stroke="#e9bd70" stroke-width="5" /><path d="M235.22034971256375 247.21621134533564 L240 256 L230.02624063887 255.2760357700328" fill="none" stroke="#e9bd70" stroke-width="5"/><line x1="240" y1="256" x2="444" y2="256" stroke="#e9bd70" stroke-width="5" /><path d="M435.22417438109625 251.20574461395796 L444 256 L435.22417438109625 260.79425538604204" fill="none" stroke="#e9bd70" stroke-width="5"/><line x1="444" y1="256" x2="559" y2="169" stroke="#e9bd70" stroke-width="5" /><path d="M549.1088223440407 170.47125952104068 L559 169 L554.8937961028118 178.1180639148186" fill="none" stroke="#e9bd70" stroke-width="5"/><line x1="559" y1="169" x2="646" y2="169" stroke="#93d5c3" stroke-width="5" /><path d="M637.2241743810963 164.20574461395796 L646 169 L637.2241743810963 173.79425538604204" fill="none" stroke="#93d5c3" stroke-width="5"/><path d="M-38 8 L32 8 Q48 5 35 0 L9 -2 L-11 -22 L-19 -22 L-11 -1 L-27 -1 L-36 -10 L-42 -10 Z" transform="translate(283,248) scale(0.65)" fill="#e9bd70"/><circle cx="559" cy="169" r="10" fill="#93d5c3" stroke="#93d5c3" stroke-width="3"/><line x1="559" y1="184" x2="559" y2="339" stroke="#93d5c3" stroke-width="2" stroke-dasharray="6 6"/><path d="M95 340 L150 274 L200 335 L259 299 L304 340Z" fill="#314d5f"/><text x="40" y="370" font-size="29" fill="#e9bd70" text-anchor="start" font-weight="500">Rumbos + altitudes / MVA</text><line x1="38" y1="415" x2="557" y2="415" stroke="#e9bd70" stroke-width="9" /><line x1="557" y1="405" x2="557" y2="427" stroke="#93d5c3" stroke-width="4" /><text x="39" y="456" font-size="28" fill="#e9bd70" text-anchor="start" font-weight="500">Responsabilidad ATC hasta este punto</text><text x="365" y="307" font-size="27" fill="#93d5c3" text-anchor="start" font-weight="500">Reanuda su</text><text x="365" y="341" font-size="27" fill="#93d5c3" text-anchor="start" font-weight="500">navegación</text><text x="40" y="400" font-size="20" fill="#e9bd70">Bajas temperaturas: corrección si es necesaria</text></g></svg>