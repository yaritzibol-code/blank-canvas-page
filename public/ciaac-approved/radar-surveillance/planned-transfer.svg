<svg xmlns="http://www.w3.org/2000/svg" width="680" height="436" viewBox="0 0 680 436" role="img" aria-labelledby="title desc"><title id="title">Transferencia planificada: condición temporal</title><desc id="desc">Para una transferencia planificada hacia un sector con separación basada en procedimientos, el transferidor establece esa separación antes del límite de responsabilidad o de salir de la cobertura pertinente, antes de transferir. No generaliza esa anticipación a toda falla súbita o terminación de vigilancia.</desc><rect width="680" height="436" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif"><text x="340" y="46" font-size="25" fill="#e9bd70" text-anchor="middle" font-weight="500">TRANSFERENCIA PLANIFICADA A PROCEDIMIENTOS</text><rect x="25" y="85" width="630" height="53" rx="12" fill="#163249" stroke="#80c5e5" stroke-width="2"/><text x="340.0" y="120.14" font-size="24" fill="#80c5e5" text-anchor="middle" font-weight="600">Separación por procedimientos establecida</text><line x1="340" y1="140" x2="340" y2="177" stroke="#80c5e5" stroke-width="2" /><line x1="179" y1="177" x2="501" y2="177" stroke="#80c5e5" stroke-width="2" /><line x1="179" y1="177" x2="179" y2="205" stroke="#80c5e5" stroke-width="2" /><line x1="501" y1="177" x2="501" y2="205" stroke="#80c5e5" stroke-width="2" /><rect x="24" y="208" width="310" height="155" rx="12" fill="#163249" stroke="#80c5e5" stroke-width="2"/><rect x="349" y="208" width="307" height="155" rx="12" fill="#163249" stroke="#e9bd70" stroke-width="2"/><text x="179" y="246" font-size="27" fill="#f8f1df" text-anchor="middle" font-weight="500">Antes del límite</text><text x="179" y="284" font-size="26" fill="#f8f1df" text-anchor="middle" font-weight="500">o de salir de la</text><text x="179" y="324" font-size="25" fill="#f8f1df" text-anchor="middle" font-weight="500">cobertura pertinente</text><text x="502" y="266" font-size="28" fill="#e9bd70" text-anchor="middle" font-weight="500">Antes de la</text><text x="502" y="311" font-size="28" fill="#e9bd70" text-anchor="middle" font-weight="500">transferencia</text><text x="340" y="409" font-size="23" fill="#bfcede" text-anchor="middle" font-weight="500">Condiciones concurrentes de la transferencia planificada</text></g></svg>