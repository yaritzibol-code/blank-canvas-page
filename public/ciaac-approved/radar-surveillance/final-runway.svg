<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="title desc"><title id="title">Final: pista y ocupación demostrada</title><desc id="desc">Condiciones 1 y 2: promedio demostrado de ocupación de pista no mayor de 50 segundos; frenado bueno notificado y tiempos de ocupación no afectados por contaminantes. 50 segundos no es un límite estricto individual para cada avión.</desc><rect width="360" height="350" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif"><rect x="58" y="40" width="244" height="64" rx="4" fill="#41566a" /><line x1="72" y1="72" x2="288" y2="72" stroke="#f8f1df" stroke-width="3" stroke-dasharray="16 9"/><text x="180" y="155" font-size="30" fill="#e9bd70" text-anchor="middle" font-weight="500">Promedio ≤ 50 s</text><text x="180" y="200" font-size="29" fill="#f8f1df" text-anchor="middle" font-weight="500">Frenado bueno</text><text x="180" y="241" font-size="25" fill="#93d5c3" text-anchor="middle" font-weight="500">Ocupación de pista:</text><text x="180" y="283" font-size="27" fill="#93d5c3" text-anchor="middle" font-weight="500">sin efecto de</text><text x="180" y="325" font-size="27" fill="#93d5c3" text-anchor="middle" font-weight="500">contaminantes</text></g></svg>