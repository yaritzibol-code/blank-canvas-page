<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="title desc"><title id="title">1200: VFR y prescripción local</title><desc id="desc">Operaciones VFR en áreas no controladas o según la prescripción de la publicación ATS local; no se presenta como código universal para todo vuelo VFR.</desc><rect width="360" height="350" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif"><rect x="27" y="30" width="306" height="100" rx="12" fill="#10273d" stroke="#93d5c3" stroke-width="2"/><text x="180" y="103" font-size="66" fill="#93d5c3" text-anchor="middle" font-weight="600">1200</text><text x="180" y="173" font-size="36" fill="#f8f1df" text-anchor="middle" font-weight="500">VFR</text><text x="180" y="218" font-size="28" fill="#f8f1df" text-anchor="middle" font-weight="500">Área no controlada</text><text x="180" y="266" font-size="28" fill="#e9bd70" text-anchor="middle" font-weight="500">o prescripción</text><text x="180" y="310" font-size="28" fill="#e9bd70" text-anchor="middle" font-weight="500">ATS local</text></g></svg>