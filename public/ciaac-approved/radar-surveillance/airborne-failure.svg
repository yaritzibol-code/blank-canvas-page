<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="title desc"><title id="title">Falla a bordo: alternativa PSR condicionada</title><desc id="desc">Ante pérdida de respuesta SSR o transmisión ADS-B, se puede intentar PSR únicamente si la traza es adecuada; en defecto de ello se pierde identificación. No se promete que el primario esté siempre disponible.</desc><rect width="360" height="350" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif"><rect x="20" y="24" width="320" height="47" rx="12" fill="#163249" stroke="#edada1" stroke-width="2"/><text x="180.0" y="57.58" font-size="28" fill="#edada1" text-anchor="middle" font-weight="600">SSR / ADS-B</text><line x1="168" y1="98" x2="192" y2="122" stroke="#edada1" stroke-width="5" /><line x1="168" y1="122" x2="192" y2="98" stroke="#edada1" stroke-width="5" /><line x1="180" y1="131" x2="180" y2="154" stroke="#80c5e5" stroke-width="3" /><path d="M184.79425538604204 145.22417438109628 L180 154 L175.20574461395796 145.22417438109628" fill="none" stroke="#80c5e5" stroke-width="3"/><rect x="20" y="166" width="320" height="47" rx="12" fill="#163249" stroke="#80c5e5" stroke-width="2"/><text x="180.0" y="197.78" font-size="23" fill="#80c5e5" text-anchor="middle" font-weight="600">PSR: si traza adecuada</text><text x="180" y="268" font-size="28" fill="#e9bd70" text-anchor="middle" font-weight="500">Si no es adecuada:</text><text x="180" y="318" font-size="26" fill="#edada1" text-anchor="middle" font-weight="500">pierde identificación</text></g></svg>