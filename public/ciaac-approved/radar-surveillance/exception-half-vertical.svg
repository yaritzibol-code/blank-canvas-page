<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="title desc"><title id="title">Medida excepcional y temporal</title><desc id="desc">Únicamente si no es posible establecer de inmediato separación por procedimientos normalizada, la medida de emergencia temporal es la mitad de la mínima vertical aplicable: 500 pies donde normalmente corresponden 1,000 y 1,000 donde corresponden 2,000. No es una alternativa general elegible por conveniencia.</desc><rect width="360" height="350" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif"><text x="180" y="38" font-size="28" fill="#edada1" text-anchor="middle" font-weight="500">Si separación por</text><text x="180" y="76" font-size="26" fill="#edada1" text-anchor="middle" font-weight="500">procedimientos no es</text><text x="180" y="114" font-size="26" fill="#edada1" text-anchor="middle" font-weight="500">posible de inmediato</text><rect x="22" y="139" width="316" height="43" rx="12" fill="#163249" stroke="#e9bd70" stroke-width="2"/><text x="180.0" y="167.7" font-size="20" fill="#e9bd70" text-anchor="middle" font-weight="600">TEMPORAL · EMERGENCIA</text><text x="180" y="232" font-size="29" fill="#e9bd70" text-anchor="middle" font-weight="500">½ mínima vertical</text><text x="180" y="286" font-size="28" fill="#f8f1df" text-anchor="middle" font-weight="500">1,000 → 500 pies</text><text x="180" y="330" font-size="27" fill="#f8f1df" text-anchor="middle" font-weight="500">2,000 → 1,000 pies</text></g></svg>