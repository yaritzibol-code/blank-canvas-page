<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="title desc"><title id="title">Falla de radio: vigilancia puede persistir</title><desc id="desc">La falla de comunicaciones bidireccionales es distinta de una pérdida de vigilancia. Si persisten señales de vigilancia, el controlador puede usar cambios de código o IDENT para confirmar recepción; no se garantiza que toda falla admita continuación.</desc><rect width="360" height="350" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif"><rect x="27" y="25" width="306" height="48" rx="12" fill="#163249" stroke="#edada1" stroke-width="2"/><text x="180.0" y="59.08" font-size="28" fill="#edada1" text-anchor="middle" font-weight="600">RADIO</text><line x1="168" y1="100" x2="192" y2="124" stroke="#edada1" stroke-width="5" /><line x1="168" y1="124" x2="192" y2="100" stroke="#edada1" stroke-width="5" /><rect x="27" y="150" width="306" height="48" rx="12" fill="#163249" stroke="#93d5c3" stroke-width="2"/><text x="180.0" y="182.64" font-size="24" fill="#93d5c3" text-anchor="middle" font-weight="600">Si persiste vigilancia</text><line x1="180" y1="212" x2="180" y2="240" stroke="#93d5c3" stroke-width="3" /><path d="M184.79425538604204 231.22417438109628 L180 240 L175.20574461395796 231.22417438109628" fill="none" stroke="#93d5c3" stroke-width="3"/><text x="180" y="287" font-size="32" fill="#f8f1df" text-anchor="middle" font-weight="500">Código / IDENT</text><text x="180" y="331" font-size="26" fill="#e9bd70" text-anchor="middle" font-weight="500">Confirmar recepción</text></g></svg>