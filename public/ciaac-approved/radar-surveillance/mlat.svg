<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="title desc"><title id="title">MLAT: diferencias de llegada</title><desc id="desc">Múltiples receptores terrestres reciben señales del transpondedor. La multilateración obtiene posición usando diferencias de tiempo de llegada, TDOA. Las longitudes y relojes son conceptuales.</desc><rect width="360" height="350" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif"><path d="M-38 8 L32 8 Q48 5 35 0 L9 -2 L-11 -22 L-19 -22 L-11 -1 L-27 -1 L-36 -10 L-42 -10 Z" transform="translate(180,75) scale(0.95)" fill="#f8f1df"/><line x1="154" y1="106" x2="57" y2="168" stroke="#80c5e5" stroke-width="3" /><path d="M66.97639168595299 167.31326211081083 L57 168 L61.812397424243244 159.2341097981359" fill="none" stroke="#80c5e5" stroke-width="3"/><line x1="180" y1="106" x2="180" y2="202" stroke="#93d5c3" stroke-width="3" /><path d="M184.79425538604204 193.22417438109628 L180 202 L175.20574461395796 193.22417438109628" fill="none" stroke="#93d5c3" stroke-width="3"/><line x1="207" y1="106" x2="303" y2="164" stroke="#e9bd70" stroke-width="3" /><path d="M297.96781890129404 155.35840562223459 L303 164 L293.00945001745447 163.56536101617598" fill="none" stroke="#e9bd70" stroke-width="3"/><g transform="translate(53,202) scale(0.6)"><path d="M-24 30 L0 -35 L24 30 M-14 5 H14 M-21 24 H21" fill="none" stroke="#80c5e5" stroke-width="5"/><circle cx="0" cy="-35" r="5" fill="#80c5e5" stroke="#80c5e5" stroke-width="3"/></g><g transform="translate(180,233) scale(0.6)"><path d="M-24 30 L0 -35 L24 30 M-14 5 H14 M-21 24 H21" fill="none" stroke="#93d5c3" stroke-width="5"/><circle cx="0" cy="-35" r="5" fill="#93d5c3" stroke="#93d5c3" stroke-width="3"/></g><g transform="translate(307,199) scale(0.6)"><path d="M-24 30 L0 -35 L24 30 M-14 5 H14 M-21 24 H21" fill="none" stroke="#e9bd70" stroke-width="5"/><circle cx="0" cy="-35" r="5" fill="#e9bd70" stroke="#e9bd70" stroke-width="3"/></g><t