<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="title desc"><title id="title">SSR: interrogación y respuesta</title><desc id="desc">El SSR interroga desde tierra y recibe una respuesta activa del transpondedor a bordo. Se conserva la distinción Modo A/C o Modo S.</desc><rect width="360" height="350" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif"><g transform="translate(60,163) scale(1)"><path d="M-24 30 L0 -35 L24 30 M-14 5 H14 M-21 24 H21" fill="none" stroke="#80c5e5" stroke-width="5"/><circle cx="0" cy="-35" r="5" fill="#80c5e5" stroke="#80c5e5" stroke-width="3"/></g><path d="M-38 8 L32 8 Q48 5 35 0 L9 -2 L-11 -22 L-19 -22 L-11 -1 L-27 -1 L-36 -10 L-42 -10 Z" transform="translate(291,125) scale(0.85)" fill="#f8f1df"/><line x1="87" y1="129" x2="248" y2="99" stroke="#80c5e5" stroke-width="3" /><path d="M238.49444738218648 95.89444539091994 L248 99 L240.25089390676712 105.32070840616944" fill="none" stroke="#80c5e5" stroke-width="3"/><line x1="247" y1="151" x2="87" y2="181" stroke="#93d5c3" stroke-width="3" /><path d="M96.5090412199563 184.09485622883713 L87 181 L94.74198861645601 174.67057567683557" fill="none" stroke="#93d5c3" stroke-width="3"/><text x="21" y="69" font-size="29" fill="#80c5e5" text-anchor="start" font-weight="500">Interrogación</text><text x="90" y="217" font-size="29" fill="#93d5c3" text-anchor="start" font-weight="500">Respuesta</text><rect x="20" y="251" width="320" height="45" rx="12" fill="#163249" stroke="#e9bd70" stroke-width="2"/><text x="180.0" y="283.22" font-size="27" fill="#e9bd70" text-anchor="middle" font-weight="600">TRANSPONDEDOR</text><text x="180" y="334" font-size="29" fill="#f8f1df" text-anchor="middle" font-weight="500">Modo A/C o S</text></g></svg>