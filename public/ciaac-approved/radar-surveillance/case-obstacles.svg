<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="title desc"><title id="title">Caso: hasta el punto de reanudación</title><desc id="desc">La solución conserva la responsabilidad por obstáculos hasta llegar al punto de reanudación de navegación propia; el tramo y el punto son conceptuales. Siempre que sea necesario, en la altitud mínima pertinente para guía vectorial se incluirá una corrección para tener en cuenta el efecto de bajas temperaturas.</desc><rect width="360" height="350" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif"><line x1="39" y1="107" x2="302" y2="107" stroke="#e9bd70" stroke-width="6" /><path d="M293.22417438109625 102.20574461395798 L302 107 L293.22417438109625 111.79425538604202" fill="none" stroke="#e9bd70" stroke-width="6"/><circle cx="302" cy="107" r="11" fill="#93d5c3" stroke="#93d5c3" stroke-width="3"/><line x1="302" y1="121" x2="302" y2="185" stroke="#93d5c3" stroke-width="2" stroke-dasharray="6 5"/><text x="180" y="233" font-size="31" fill="#93d5c3" text-anchor="middle" font-weight="500">Hasta reanudar</text><text x="180" y="278" font-size="31" fill="#93d5c3" text-anchor="middle" font-weight="500">su navegación</text><text x="180" y="329" font-size="25" fill="#e9bd70" text-anchor="middle" font-weight="500">Franqueamiento / MVA</text><text x="180" y="40" font-size="20" fill="#e9bd70" text-anchor="middle">Bajas temperaturas:</text><text x="180" y="68" font-size="20" fill="#e9bd70" text-anchor="middle">corrección si es necesaria</text></g></svg>