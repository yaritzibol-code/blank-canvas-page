<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="title desc"><title id="title">3 NM: reducción condicionada</title><desc id="desc">La reducción a 3 NM depende de autorización de la autoridad ATS, capacidad local y cobertura. La fuente histórica añade para PSR una distancia inferior a 40 NM del transmisor. No se declara disponible actualmente en ningún sector.</desc><rect width="360" height="350" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif"><text x="180" y="62" font-size="27" fill="#e9bd70" text-anchor="middle" font-weight="500">AUTORIDAD ATS</text><line x1="180" y1="80" x2="180" y2="116" stroke="#e9bd70" stroke-width="3" /><path d="M184.79425538604204 107.22417438109628 L180 116 L175.20574461395796 107.22417438109628" fill="none" stroke="#e9bd70" stroke-width="3"/><text x="180" y="168" font-size="51" fill="#f8f1df" text-anchor="middle" font-weight="600">3 NM</text><text x="180" y="218" font-size="25" fill="#93d5c3" text-anchor="middle" font-weight="500">Capacidad + cobertura</text><rect x="24" y="245" width="312" height="44" rx="12" fill="#163249" stroke="#80c5e5" stroke-width="2"/><text x="180.0" y="277.08" font-size="28" fill="#80c5e5" text-anchor="middle" font-weight="600">PSR: &lt; 40 NM</text><text x="180" y="331" font-size="25" fill="#bfcede" text-anchor="middle" font-weight="500">Del transmisor radar</text></g></svg>