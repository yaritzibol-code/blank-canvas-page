<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="title desc"><title id="title">Código 7700</title><desc id="desc">Emergencia general. No equivale automáticamente a INCERFA; las fases SAR responden a su evaluación y plazos.</desc><rect width="360" height="350" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif"><rect x="27" y="40" width="306" height="105" rx="12" fill="#10273d" stroke="#edada1" stroke-width="2"/><text x="180" y="114" font-size="70" fill="#edada1" text-anchor="middle" font-weight="600">7700</text><text x="180" y="211" font-size="32" fill="#f8f1df" text-anchor="middle" font-weight="500">Emergencia</text><text x="180" y="255" font-size="32" fill="#f8f1df" text-anchor="middle" font-weight="500">general</text><text x="180" y="319" font-size="26" fill="#e9bd70" text-anchor="middle" font-weight="500">No es fase SAR</text></g></svg>