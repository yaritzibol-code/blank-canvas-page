<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="title desc"><title id="title">2.5 NM: todas las condiciones</title><desc id="desc">Reducción histórica, autorizada por la autoridad ATS, entre aeronaves sucesivas en la misma derrota de aproximación final a menos de 10 NM del umbral. Se requieren las ocho condiciones completas de la fuente, sin omitir ninguna.</desc><rect width="360" height="350" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif"><text x="180" y="53" font-size="26" fill="#e9bd70" text-anchor="middle" font-weight="500">AUTORIZACIÓN ATS</text><text x="180" y="120" font-size="51" fill="#f8f1df" text-anchor="middle" font-weight="600">2.5 NM</text><text x="180" y="166" font-size="29" fill="#93d5c3" text-anchor="middle" font-weight="500">8 condiciones</text><text x="180" y="207" font-size="29" fill="#93d5c3" text-anchor="middle" font-weight="500">acumulativas</text><text x="180" y="258" font-size="27" fill="#f8f1df" text-anchor="middle" font-weight="500">Misma derrota final</text><text x="180" y="302" font-size="27" fill="#e9bd70" text-anchor="middle" font-weight="500">&lt; 10 NM del umbral</text></g></svg>