<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="title desc"><title id="title">PSR: señal reflejada</title><desc id="desc">El PSR recibe la señal reflejada por la estructura de la aeronave. La aeronave no necesita equipo a bordo para este principio de detección.</desc><rect width="360" height="350" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif"><g transform="translate(60,163) scale(1)"><path d="M-24 30 L0 -35 L24 30 M-14 5 H14 M-21 24 H21" fill="none" stroke="#80c5e5" stroke-width="5"/><circle cx="0" cy="-35" r="5" fill="#80c5e5" stroke="#80c5e5" stroke-width="3"/></g><path d="M-38 8 L32 8 Q48 5 35 0 L9 -2 L-11 -22 L-19 -22 L-11 -1 L-27 -1 L-36 -10 L-42 -10 Z" transform="translate(290,125) scale(0.85)" fill="#f8f1df"/><line x1="86" y1="130" x2="250" y2="100" stroke="#80c5e5" stroke-width="3" /><path d="M240.50473555764646 96.86313003620225 L250 100 L242.23010166931743 106.29513144667021" fill="none" stroke="#80c5e5" stroke-width="3"/><line x1="250" y1="150" x2="86" y2="177" stroke="#e9bd70" stroke-width="3" /><path d="M95.43807226646348 180.30496473400441 L86 177 L93.88044413799842 170.84381610184636" fill="none" stroke="#e9bd70" stroke-width="3"/><text x="91" y="84" font-size="28" fill="#80c5e5" text-anchor="start" font-weight="500">Señal</text><text x="107" y="204" font-size="28" fill="#e9bd70" text-anchor="start" font-weight="500">Reflejo</text><text x="180" y="283" font-size="25" fill="#f8f1df" text-anchor="middle" font-weight="500">Sin equipo de respuesta</text><text x="180" y="327" font-size="27" fill="#f8f1df" text-anchor="middle" font-weight="500">a bordo para el PSR</text></g></svg>