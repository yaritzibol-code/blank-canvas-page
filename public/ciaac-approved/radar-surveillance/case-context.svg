<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" role="img" aria-labelledby="title desc"><title id="title">Caso integrador: mal tiempo, vectores y falla</title><desc id="desc">Escenario ficticio exacto: vuelo IFR bajo vigilancia, desviación vectorial ante CB hacia terreno montañoso y posterior falla total de presentación en tierra manteniendo radio VHF. Diagrama sin escala, rumbos dibujados ni altitudes inventadas; los datos precisos del caso permanecen en el texto.</desc><rect width="680" height="490" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif"><rect x="25" y="22" width="630" height="50" rx="12" fill="#163249" stroke="#e9bd70" stroke-width="2"/><text x="340.0" y="56.36" font-size="26" fill="#e9bd70" text-anchor="middle" font-weight="600">CASO FICTICIO · IFR CON VIGILANCIA ATS</text><line x1="35" y1="154" x2="640" y2="154" stroke="#bfcede" stroke-width="4" stroke-dasharray="12 9"/><path d="M-38 8 L32 8 Q48 5 35 0 L9 -2 L-11 -22 L-19 -22 L-11 -1 L-27 -1 L-36 -10 L-42 -10 Z" transform="translate(104,145) scale(0.8)" fill="#f8f1df"/><path d="M322 158 C284 139 294 105 327 105 C336 71 375 76 390 99 C429 92 438 132 416 150Z" fill="#4b6478"/><text x="353" y="138" font-size="26" fill="#f8f1df" text-anchor="middle" font-weight="500">CB</text><line x1="168" y1="156" x2="263" y2="232" stroke="#e9bd70" stroke-width="4" /><path d="M259.1421790934586 222.77410070220512 L263 232 L253.15228390071542 230.26146969313407" fill="none" stroke="#e9bd70" stroke-width="4"/><line x1="263" y1="232" x2="482" y2="232" stroke="#e9bd70" stroke-width="4" /><path d="M473.22417438109625 227.20574461395796 L482 232 L473.22417438109625 236.79425538604204" fill="none" stroke="#e9bd70" stroke-width="4"/><path d="M312 309 L356 251 L409 309 L451 266 L493 309Z" fill="#355267"/><text x="46" y="288" font-size="28" fill="#e9bd70" text-anchor="start" font-weight="500">Vectores</text><text x="43" y="328" font-size="27" fill="#e9bd70" text-anchor="start" font-weight="500">Fuera de aerovía</text><rect x="44" y="366" width="190" height="99" rx="12" fill="#163249" stroke="#edada1" stroke-width="2"/><line x1="58" y1="388" x2="220" y2="443" stroke="#edada1" stroke-width="5" /><line x1="58" y1="443" x2="220" y2="388" stroke="#edada1" stroke-width="5" /><text x="283" y="394" font-size="28" fill="#edada1" text-anchor="start" font-weight="500">Falla de vigilancia</text><text x="283" y="443" font-size="28" fill="#93d5c3" text-anchor="start" font-weight="500">Radio VHF operativa</text></g></svg>