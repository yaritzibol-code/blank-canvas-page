<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="title desc"><title id="title">Pérdida de identificación</title><desc id="desc">El controlador informa inmediatamente al piloto y emite instrucciones de altitud y ruta para mantener la seguridad. La interrupción o terminación del servicio de vigilancia también se notifica inmediatamente.</desc><rect width="360" height="350" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif"><circle cx="180" cy="107" r="65" fill="none" stroke="#80c5e5" stroke-width="3"/><circle cx="180" cy="107" r="32.5" fill="none" stroke="#80c5e5" stroke-width="1"/><line x1="115" y1="107" x2="245" y2="107" stroke="#80c5e5" stroke-width="1" /><line x1="180" y1="42" x2="180" y2="172" stroke="#80c5e5" stroke-width="1" /><line x1="180" y1="107" x2="225.5" y2="61.5" stroke="#e9bd70" stroke-width="3" /><line x1="153" y1="80" x2="207" y2="134" stroke="#edada1" stroke-width="5" /><line x1="153" y1="134" x2="207" y2="80" stroke="#edada1" stroke-width="5" /><text x="180" y="224" font-size="25" fill="#edada1" text-anchor="middle" font-weight="500">Identificación perdida</text><text x="180" y="269" font-size="26" fill="#e9bd70" text-anchor="middle" font-weight="500">Informar de inmediato</text><text x="180" y="317" font-size="30" fill="#f8f1df" text-anchor="middle" font-weight="500">Altitud + ruta</text></g></svg>