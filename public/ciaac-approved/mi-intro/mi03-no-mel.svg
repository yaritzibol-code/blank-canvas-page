<svg xmlns="http://www.w3.org/2000/svg" width="440" height="640" viewBox="0 0 440 640" role="img" aria-labelledby="title desc"><title id="title">Sin MEL: equipo requerido y condición de vuelo</title><desc id="desc">Sin MEL: equipo requerido y condición de vuelo · Esquema educativo original. No es una publicación operacional.</desc><rect width="100%" height="100%" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif"><text x="24" y="38" font-size="25" fill="#e8be73" text-anchor="start" font-weight="700">Sin MEL aprobada aplicable</text><rect x="38" y="69" width="364" height="91" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="52" y="100" font-size="23" fill="#82c7e5" text-anchor="start" font-weight="700">Diseño de tipo · AFM</text><text x="52" y="129" font-size="23" fill="#82c7e5" text-anchor="start" font-weight="700">Reglas de vuelo</text><path d="M220 164 L220 201 M215.20574461395796 192.22417438109628 L220 201 L224.79425538604204 192.22417438109628" fill="none" stroke="#e8be73" stroke-width="3"/><path d="M220 210 L393 275 L220 340 L47 275 Z" fill="#173149" stroke="#e8be73" stroke-width="2"/><text x="220" y="268" font-size="24" fill="#f8f1df" text-anchor="middle" font-weight="500">Equipo requerido</text><text x="220" y="301" font-size="24" fill="#f8f1df" text-anchor="middle" font-weight="500">e inoperativo</text><path d="M220 341 L220 390 M215.20574461395796 381.22417438109625 L220 390 L224.79425538604204 381.22417438109625" fill="none" stroke="#e8be73" stroke-width="3"/><rect x="38" y="401" width="364" height="62" rx="12" fill="#173149" stroke="#edb2a6" stroke-width="2"/><text x="52" y="432" font-size="23" fill="#edb2a6" text-anchor="start" font-weight="700">No iniciar el vuelo</text><text x="35" y="510" font-size="24" fill="#e8be73" text-anchor="start" font-weight="500">Sin una solución o exención</text><text x="35" y="541" font-size="24" fill="#e8be73" text-anchor="start" font-weight="500">oficialmente autorizada.</text></g></svg>