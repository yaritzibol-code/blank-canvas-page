<svg xmlns="http://www.w3.org/2000/svg" width="440" height="690" viewBox="0 0 440 690" role="img" aria-labelledby="title desc"><title id="title">MEL aplicable: evaluación del componente</title><desc id="desc">MEL aplicable: evaluación del componente · Esquema educativo original. No es una publicación operacional.</desc><rect width="100%" height="100%" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif"><text x="24" y="38" font-size="25" fill="#e8be73" text-anchor="start" font-weight="700">MEL aprobada aplicable</text><rect x="68" y="66" width="304" height="91" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="82" y="97" font-size="23" fill="#82c7e5" text-anchor="start" font-weight="700">MMEL → MEL</text><text x="82" y="126" font-size="23" fill="#82c7e5" text-anchor="start" font-weight="700">Variante específica</text><path d="M220 161 L220 207 M215.20574461395796 198.22417438109628 L220 207 L224.79425538604204 198.22417438109628" fill="none" stroke="#e8be73" stroke-width="3"/><path d="M220 214 L367 277 L220 340 L73 277 Z" fill="#173149" stroke="#e8be73" stroke-width="2"/><text x="220" y="271" font-size="24" fill="#f8f1df" text-anchor="middle" font-weight="500">¿Componente</text><text x="220" y="304" font-size="24" fill="#f8f1df" text-anchor="middle" font-weight="500">listado?</text><path d="M73 277 L30 277 M38.775825618903724 272.20574461395796 L30 277 L38.775825618903724 281.79425538604204" fill="none" stroke="#e8be73" stroke-width="3"/><path d="M30 277 L30 384 M25.205744613957968 375.22417438109625 L30 384 L34.79425538604203 375.22417438109625" fill="none" stroke="#e8be73" stroke-width="3"/><text x="35" y="365" font-size="23" fill="#91d4c6" text-anchor="start" font-weight="500">Sí</text><path d="M367 277 L410 277 M401.22417438109625 281.79425538604204 L410 277 L401.22417438109625 272.20574461395796" fill="none" stroke="#e8be73" stroke-width="3"/><path d="M410 277 L410 384 M405.20574461395796 375.22417438109625 L410 384 L414.79425538604204 375.22417438109625" fill="none" stroke="#e8be73" stroke-width="3"/><text x="366" y="365" font-size="23" fill="#edb2a6" text-anchor="start" font-weight="500">No</text><rect x="16" y="392" width="196" height="149" rx="12" fill="#173149" stroke="#91d4c6" stroke-width="2"/><text x="30" y="423" font-size="23" fill="#91d4c6" text-anchor="start" font-weight="700">A · B · C · D</text><text x="30" y="452" font-size="23" fill="#91d4c6" text-anchor="start" font-weight="700">Plazos</text><text x="30" y="481" font-size="23" fill="#91d4c6" text-anchor="start" font-weight="700">Limitaciones</text><text x="30" y="510" font-size="23" fill="#91d4c6" text-anchor="start" font-weight="700">O / M</text><rect x="228" y="392" width="196" height="178" rx="12" fill="#173149" stroke="#edb2a6" stroke-width="2"/><text x="242" y="423" font-size="23" fill="#edb2a6" text-anchor="start" font-weight="700">No diferible</text><text x="242" y="452" font-size="23" fill="#edb2a6" text-anchor="start" font-weight="700">bajo la MEL</text><text x="242" y="481" font-size="23" fill="#edb2a6" text-anchor="start" font-weight="700">Diseño base</text><text x="242" y="510" font-size="23" fill="#edb2a6" text-anchor="start" font-weight="700">o corrección</text><text x="242" y="539" font-size="23" fill="#edb2a6" text-anchor="start" font-weight="700">técnica</text><text x="24" y="655" font-size="22" fill="#e8be73" text-anchor="start" font-weight="500">No implica automáticamente AOG</text></g></svg>