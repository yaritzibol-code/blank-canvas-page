<svg xmlns="http://www.w3.org/2000/svg" width="450" height="520" viewBox="0 0 450 520" role="img" aria-labelledby="title desc"><title id="title">AIRAC: preaviso y ciclo</title><desc id="desc">AIRAC: preaviso y ciclo · Esquema educativo original. No es una publicación operacional.</desc><rect width="100%" height="100%" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif"><text x="28" y="42" font-size="30" fill="#e8be73" text-anchor="start" font-weight="700">AIRAC</text><rect x="58" y="87" width="360" height="76" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="72" y="120" font-size="26" fill="#82c7e5" text-anchor="start" font-weight="700">≥42 días antes</text><text x="72" y="148" font-size="19" fill="#f8f1df" text-anchor="start" font-weight="500">Notificación previa</text><circle cx="30" cy="117" r="7" fill="#e8be73"/><path d="M30 129 L30 192 M25.205744613957968 183.22417438109628 L30 192 L34.79425538604203 183.22417438109628" fill="none" stroke="#e8be73" stroke-width="3"/><rect x="58" y="203" width="360" height="76" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="72" y="236" font-size="26" fill="#82c7e5" text-anchor="start" font-weight="700">≥28 días antes</text><text x="72" y="264" font-size="19" fill="#f8f1df" text-anchor="start" font-weight="500">Recepción por el usuario</text><circle cx="30" cy="233" r="7" fill="#e8be73"/><path d="M30 245 L30 308 M25.205744613957968 299.22417438109625 L30 308 L34.79425538604203 299.22417438109625" fill="none" stroke="#e8be73" stroke-width="3"/><rect x="58" y="319" width="360" height="76" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="72" y="352" font-size="26" fill="#82c7e5" text-anchor="start" font-weight="700">Efectividad</text><text x="72" y="380" font-size="19" fill="#f8f1df" text-anchor="start" font-weight="500">Fecha coordinada</text><circle cx="30" cy="349" r="7" fill="#e8be73"/><text x="28" y="453" font-size="25" fill="#f8f1df" text-anchor="start" font-