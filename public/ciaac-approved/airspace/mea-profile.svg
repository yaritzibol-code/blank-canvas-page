<svg xmlns="http://www.w3.org/2000/svg" width="360" height="444" viewBox="0 0 360 444" role="img" aria-labelledby="title desc"><title id="title">MEA: referencia y alcance</title><desc id="desc">Perfil conceptual sin escala, cifras de altitud ni jerarquía entre mínimos. La distancia de franqueamiento se muestra sobre el obstáculo; la altitud se referencia al nivel medio del mar. MEA: franqueamiento y recepción NAVAID aceptable en todo el segmento; no implica garantía universal de comunicaciones.</desc><rect width="360" height="444" rx="16" fill="#091b30"/><g font-family="DejaVu Sans,sans-serif" fill="#f8f1df"><text x="22" y="41" font-size="35" fill="#eac475" text-anchor="start" font-weight="500">MEA</text><line x1="24" y1="113" x2="336" y2="113" stroke="#89c7e2" stroke-width="4"/><text x="23" y="95" font-size="27" fill="#89c7e2" text-anchor="start" font-weight="500">Mínimo publicado</text><g transform="translate(290 102) scale(0.7)"><path d="M-25 5 L25 5 Q35 1 25 -3 L5 -4 L-10 -20 L-17 -20 L-11 -4 L-21 -4 L-28 -12 L-33 -12Z" fill="#f8f1df"/></g><path d="M24 227 L84 201 L125 213 L180 166 L248 218 L285 192 L336 228Z" fill="#355066"/><line x1="193" y1="118" x2="193" y2="166" stroke="#eac475" stroke-width="3"/><path d="M198.0,126.0 L193,118 L188.0,126.0 M198.0,158.0 L193,166 L188.0,158.0" fill="none" stroke="#eac475" stroke-width="2"/><text x="23" y="268" font-size="26" fill="#eac475" text-anchor="start" font-weight="500">Franqueamiento</text><line x1="24" y1="304" x2="336" y2="304" stroke="#f8f1df" stroke-width="3"/><text x="25" y="335" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">MSL · referencia de altitud</text><text x="22" y="376" font-size="24" fill="#89c7e2" text-anchor="start" font-weight="500">NAV: todo el segmento</text><text x="22" y="413" font-size="21" fill="#cad6e1" text-anchor="start" font-weight="500">No se infiere garantía COM</text></g></svg>