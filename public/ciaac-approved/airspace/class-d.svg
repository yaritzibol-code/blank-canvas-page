<svg xmlns="http://www.w3.org/2000/svg" width="360" height="415" viewBox="0 0 360 415" role="img" aria-labelledby="title desc"><title id="title">Clase D: servicio y radio</title><desc id="desc">Clase D. El resumen visual acompaña íntegra su explicación. Radio: tabla histórica mexicana MGTAM 2019, no tabla común OACI. Las condiciones completas de autorización, separación, información y asesoramiento están junto a esta figura. Las marcas ** heredadas permanecen sin inventar una nueva restricción.</desc><rect width="360" height="415" rx="16" fill="#091b30"/><g font-family="DejaVu Sans,sans-serif" fill="#f8f1df"><text x="22" y="41" font-size="34" fill="#eac475" text-anchor="start" font-weight="500">CLASE D</text><text x="22" y="79" font-size="22" fill="#89c7e2" text-anchor="start" font-weight="500">MÉXICO · MGTAM 2019</text><text x="22" y="123" font-size="27" fill="#f8f1df" text-anchor="start" font-weight="500">Separación IFR / IFR</text><text x="22" y="161" font-size="22" fill="#eac475" text-anchor="start" font-weight="500">Separación de aeródromo</text><text x="22" y="197" font-size="24" fill="#f8f1df" text-anchor="start" font-weight="500">IFR / IFR · IFR / VFR</text><text x="22" y="231" font-size="26" fill="#f8f1df" text-anchor="start" font-weight="500">VFR / VFR</text><text x="22" y="265" font-size="24" fill="#cad6e1" text-anchor="start" font-weight="500">Aeródromo controlado</text><text x="22" y="301" font-size="23" fill="#cad6e1" text-anchor="start" font-weight="500">Circuito e inmediaciones</text><line x1="22" y1="319" x2="338" y2="319" stroke="#cad6e1" stroke-width="1"/><text x="22" y="351" font-size="25" fill="#89c7e2" text-anchor="start" font-weight="500">RADIO: IFR + VFR **</text><text x="22" y="388" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Continua · ambos sentidos</text></g></svg>