<svg xmlns="http://www.w3.org/2000/svg" width="360" height="380" viewBox="0 0 360 380" role="img" aria-labelledby="title desc"><title id="title">Clase B: servicio y radio</title><desc id="desc">Clase B según OACI Anexo 11, 14.ª edición 2016, Apéndice 4, AP 4-1/PDF 105: separación entre todas las aeronaves, comunicación continua en ambos sentidos y autorización ATC para IFR y VFR. La discrepancia entre la prosa y las celdas A/B de la tabla MGTAM 2019 se explica por separado en el texto; esta figura no corrige silenciosamente esa tabla histórica mexicana.</desc><rect width="360" height="380" rx="16" fill="#091b30"/><g font-family="DejaVu Sans,sans-serif" fill="#f8f1df"><text x="22" y="41" font-size="34" fill="#eac475" text-anchor="start" font-weight="500">CLASE B</text><text x="22" y="87" font-size="23" fill="#89c7e2" text-anchor="start" font-weight="500">SEPARACIÓN</text><text x="22" y="126" font-size="29" fill="#f8f1df" text-anchor="start" font-weight="500">IFR / IFR</text><text x="22" y="164" font-size="29" fill="#f8f1df" text-anchor="start" font-weight="500">IFR / VFR</text><text x="22" y="202" font-size="29" fill="#f8f1df" text-anchor="start" font-weight="500">VFR / VFR</text><line x1="22" y1="225" x2="338" y2="225" stroke="#cad6e1" stroke-width="1"/><text x="22" y="261" font-size="22" fill="#89c7e2" text-anchor="start" font-weight="500">RADIO · OACI 2016</text><text x="22" y="299" font-size="28" fill="#f8f1df" text-anchor="start" font-weight="500">IFR + VFR</text><text x="22" y="335" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Continua · ambos sentidos</text></g></svg>