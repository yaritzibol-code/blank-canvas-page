<svg xmlns="http://www.w3.org/2000/svg" width="360" height="380" viewBox="0 0 360 380" role="img" aria-labelledby="title desc"><title id="title">Clase A: servicio y radio</title><desc id="desc">Clase A. El resumen visual acompaña íntegra su explicación. Radio: tabla histórica mexicana MGTAM 2019, no tabla común OACI. Las condiciones completas de autorización, separación, información y asesoramiento están junto a esta figura. Las marcas ** heredadas permanecen sin inventar una nueva restricción.</desc><rect width="360" height="380" rx="16" fill="#091b30"/><g font-family="DejaVu Sans,sans-serif" fill="#f8f1df"><text x="22" y="41" font-size="34" fill="#eac475" text-anchor="start" font-weight="500">CLASE A</text><text x="22" y="89" font-size="30" fill="#f8f1df" text-anchor="start" font-weight="500">Sólo IFR</text><text x="22" y="138" font-size="23" fill="#89c7e2" text-anchor="start" font-weight="500">SEPARACIÓN</text><text x="22" y="182" font-size="33" fill="#f8f1df" text-anchor="start" font-weight="500">IFR / IFR</text><line x1="22" y1="208" x2="338" y2="208" stroke="#cad6e1" stroke-width="1"/><text x="22" y="250" font-size="22" fill="#89c7e2" text-anchor="start" font-weight="500">RADIO · MGTAM 2019</text><text x="22" y="290" font-size="28" fill="#f8f1df" text-anchor="start" font-weight="500">IFR continua</text><text x="22" y="326" font-size="26" fill="#f8f1df" text-anchor="start" font-weight="500">en ambos sentidos</text></g></svg>