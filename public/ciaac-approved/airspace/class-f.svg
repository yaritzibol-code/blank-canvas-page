<svg xmlns="http://www.w3.org/2000/svg" width="360" height="380" viewBox="0 0 360 380" role="img" aria-labelledby="title desc"><title id="title">Clase F: servicio y radio</title><desc id="desc">Clase F. El resumen visual acompaña íntegra su explicación. Radio: tabla histórica mexicana MGTAM 2019, no tabla común OACI. Las condiciones completas de autorización, separación, información y asesoramiento están junto a esta figura. Las marcas ** heredadas permanecen sin inventar una nueva restricción.</desc><rect width="360" height="380" rx="16" fill="#091b30"/><g font-family="DejaVu Sans,sans-serif" fill="#f8f1df"><text x="22" y="41" font-size="34" fill="#eac475" text-anchor="start" font-weight="500">CLASE F</text><text x="22" y="87" font-size="27" fill="#eac475" text-anchor="start" font-weight="500">Sugerencia entre IFR</text><text x="22" y="125" font-size="26" fill="#f8f1df" text-anchor="start" font-weight="500">Cuando sea factible</text><text x="22" y="173" font-size="27" fill="#89c7e2" text-anchor="start" font-weight="500">FIS · IFR y VFR</text><text x="22" y="209" font-size="28" fill="#f8f1df" text-anchor="start" font-weight="500">A solicitud</text><line x1="22" y1="234" x2="338" y2="234" stroke="#cad6e1" stroke-width="1"/><text x="22" y="268" font-size="22" fill="#89c7e2" text-anchor="start" font-weight="500">RADIO · MGTAM 2019</text><text x="22" y="306" font-size="26" fill="#f8f1df" text-anchor="start" font-weight="500">IFR + VFR continua</text><text x="22" y="342" font-size="26" fill="#f8f1df" text-anchor="start" font-weight="500">en ambos sentidos</text></g></svg>