<svg xmlns="http://www.w3.org/2000/svg" width="600" height="337" viewBox="0 0 600 337" role="img" aria-labelledby="title desc"><title id="title">Margen vertical de MORA y datum MSL</title><desc id="desc">Dos relaciones conceptuales sin escala: mínimo por encima del obstáculo, elevación del obstáculo referenciada a MSL. Margen de 1,000 ft para obstáculos de 5,000 ft MSL o inferiores. Route MORA: 2,000 ft para superiores a 5,000 ft MSL; Grid MORA: 2,000 ft desde 5,001 ft MSL. Se mantienen las formulaciones literales distintas. No son altitudes publicadas ni una carta.</desc><rect width="600" height="337" rx="16" fill="#091b30"/><g font-family="DejaVu Sans,sans-serif" fill="#f8f1df"><text x="23" y="40" font-size="27" fill="#eac475" text-anchor="start" font-weight="500">MARGEN VERTICAL · REFERENCIA MSL</text><line x1="25" y1="101" x2="283" y2="101" stroke="#89c7e2" stroke-width="3"/><line x1="321" y1="79" x2="577" y2="79" stroke="#89c7e2" stroke-width="3"/><path d="M32 219 L140 161 L276 219Z M325 219 L444 150 L572 219Z" fill="#355066"/><line x1="155" y1="107" x2="155" y2="156" stroke="#eac475" stroke-width="3"/><path d="M160.0,115.0 L155,107 L150.0,115.0 M160.0,148.0 L155,156 L150.0,148.0" fill="none" stroke="#eac475" stroke-width="2"/><line x1="459" y1="85" x2="459" y2="146" stroke="#eac475" stroke-width="3"/><path d="M464.0,93.0 L459,85 L454.0,93.0 M464.0,138.0 L459,146 L454.0,138.0" fill="none" stroke="#eac475" stroke-width="2"/><text x="182" y="137" font-size="24" fill="#eac475" text-anchor="start" font-weight="500">1,000 ft</text><text x="474" y="118" font-size="22" fill="#eac475" text-anchor="start" font-weight="500">2,000 ft</text><text x="143" y="254" font-size="25" fill="#94d7c0" text-anchor="middle" font-weight="500">≤ 5,000 ft MSL</text><text x="450" y="254" font-size="25" fill="#94d7c0" text-anchor="middle" font-weight="500">&gt; 5,000 ft MSL</text><line x1="25" y1="278" x2="577" y2="278" stroke="#f8f1df" stroke-width="3"/><text x="30" y="310" font-size="26" fill="#f8f1df" text-anchor="start" font-weight="500">MSL</text><text x="117" y="309" font-size="23" fill="#cad6e1" text-anchor="start" font-weight="500">Grid MORA: desde 5,001 ft MSL</text></g></svg>