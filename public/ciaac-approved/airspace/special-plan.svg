<svg xmlns="http://www.w3.org/2000/svg" width="600" height="690" viewBox="0 0 600 690" role="img" aria-labelledby="title desc"><title id="title">Zonas de uso especial y ATZ en planta</title><desc id="desc">Planta de aprendizaje ficticia, sin escala ni simbología aeronáutica normalizada. Zonas separadas MMP prohibida, MMR restringida y MMD peligrosa; ATZ alrededor de un aeródromo. Las posiciones y contornos no definen clases, altitudes ni coexistencias universales. Consultar ENR 5.1 aplicable para condiciones vigentes.</desc><rect width="600" height="690" rx="16" fill="#091b30"/><g font-family="DejaVu Sans,sans-serif" fill="#f8f1df"><text x="22" y="41" font-size="32" fill="#eac475" text-anchor="start" font-weight="500">PLANTA FICTICIA</text><text x="22" y="78" font-size="24" fill="#cad6e1" text-anchor="start" font-weight="500">Clasifica por naturaleza de la zona</text><rect x="22" y="111" width="556" height="462" rx="12" fill="none" stroke="#eac475" stroke-width="3" stroke-dasharray="9 7"/><path d="M48 148 L224 136 L236 264 L75 279Z" fill="#423142" stroke="#edaa99" stroke-width="3"/><text x="88" y="202" font-size="34" fill="#edaa99" text-anchor="start" font-weight="500">MMP</text><text x="77" y="245" font-size="25" fill="#f8f1df" text-anchor="start" font-weight="500">Prohibida</text><path d="M331 135 L543 166 L519 299 L315 272Z" fill="#3c3b35" stroke="#eac475" stroke-width="3"/><text x="365" y="206" font-size="34" fill="#eac475" text-anchor="start" font-weight="500">MMR</text><text x="337" y="250" font-size="25" fill="#f8f1df" text-anchor="start" font-weight="500">Restringida</text><path d="M53 359 L212 327 L258 474 L100 506Z" fill="#1d475a" stroke="#89c7e2" stroke-width="3" stroke-dasharray="9 5"/><text x="103" y="396" font-size="34" fill="#89c7e2" text-anchor="start" font-weight="500">MMD</text><text x="83" y="441" font-size="25" fill="#f8f1df" text-anchor="start" font-weight="500">Peligrosa</text><ellipse cx="430" cy="441" rx="114" ry="90" fill="none" stroke="#94d7c0" stroke-width="3"/><rect x="405" y="431" width="58" height="12" rx="0" fill="#f8f1df"/><text x="430" y="400" font-size="32" fill="#94d7c0" text-anchor="middle" font-weight="500">ATZ</text><text x="430" y="484" font-size="22" fill="#f8f1df" text-anchor="middle" font-weight="500">Aeródromo</text><text x="29" y="617" font-size="27" fill="#eac475" text-anchor="start" font-weight="500">FIR · contorno de referencia</text><text x="29" y="657" font-size="22" fill="#cad6e1" text-anchor="start" font-weight="500">Sin coordenadas, rutas ni dimensiones reales</text></g></svg>