<svg xmlns="http://www.w3.org/2000/svg" width="360" height="380" viewBox="0 0 360 380" role="img" aria-labelledby="title desc"><title id="title">Clase G: servicio y radio</title><desc id="desc">Clase G. El resumen visual acompaña íntegra su explicación. Radio: tabla histórica mexicana MGTAM 2019, no tabla común OACI. Las condiciones completas de autorización, separación, información y asesoramiento están junto a esta figura. Las marcas ** heredadas permanecen sin inventar una nueva restricción.</desc><rect width="360" height="380" rx="16" fill="#091b30"/><g font-family="DejaVu Sans,sans-serif" fill="#f8f1df"><text x="22" y="41" font-size="34" fill="#eac475" text-anchor="start" font-weight="500">CLASE G</text><text x="22" y="88" font-size="29" fill="#eac475" text-anchor="start" font-weight="500">Sin separación</text><text x="22" y="129" font-size="27" fill="#f8f1df" text-anchor="start" font-weight="500">FIS a solicitud</text><text x="22" y="166" font-size="27" fill="#f8f1df" text-anchor="start" font-weight="500">AFIS si aplica</text><line x1="22" y1="190" x2="338" y2="190" stroke="#cad6e1" stroke-width="1"/><text x="22" y="228" font-size="22" fill="#89c7e2" text-anchor="start" font-weight="500">RADIO · MGTAM 2019</text><text x="22" y="269" font-size="26" fill="#f8f1df" text-anchor="start" font-weight="500">IFR + VFR continua</text><text x="22" y="309" font-size="25" fill="#f8f1df" text-anchor="start" font-weight="500">Por lo menos a 15 NM</text><text x="22" y="343" font-size="27" fill="#f8f1df" text-anchor="start" font-weight="500">del aeródromo **</text></g></svg>