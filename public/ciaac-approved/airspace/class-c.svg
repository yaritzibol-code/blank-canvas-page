<svg xmlns="http://www.w3.org/2000/svg" width="360" height="380" viewBox="0 0 360 380" role="img" aria-labelledby="title desc"><title id="title">Clase C: servicio y radio</title><desc id="desc">Clase C. El resumen visual acompaña íntegra su explicación. Radio: tabla histórica mexicana MGTAM 2019, no tabla común OACI. Las condiciones completas de autorización, separación, información y asesoramiento están junto a esta figura. Las marcas ** heredadas permanecen sin inventar una nueva restricción.</desc><rect width="360" height="380" rx="16" fill="#091b30"/><g font-family="DejaVu Sans,sans-serif" fill="#f8f1df"><text x="22" y="41" font-size="34" fill="#eac475" text-anchor="start" font-weight="500">CLASE C</text><text x="22" y="84" font-size="22" fill="#89c7e2" text-anchor="start" font-weight="500">SEPARACIÓN</text><text x="22" y="121" font-size="26" fill="#f8f1df" text-anchor="start" font-weight="500">IFR / IFR · IFR / VFR</text><text x="22" y="166" font-size="28" fill="#eac475" text-anchor="start" font-weight="500">VFR / VFR</text><text x="22" y="203" font-size="23" fill="#f8f1df" text-anchor="start" font-weight="500">Información de tránsito</text><line x1="22" y1="225" x2="338" y2="225" stroke="#cad6e1" stroke-width="1"/><text x="22" y="261" font-size="22" fill="#89c7e2" text-anchor="start" font-weight="500">RADIO · MGTAM 2019</text><text x="22" y="299" font-size="28" fill="#f8f1df" text-anchor="start" font-weight="500">IFR + VFR **</text><text x="22" y="335" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Continua · ambos sentidos</text></g></svg>