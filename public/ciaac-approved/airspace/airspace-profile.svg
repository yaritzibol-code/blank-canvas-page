<svg xmlns="http://www.w3.org/2000/svg" width="600" height="596" viewBox="0 0 600 596" role="img" aria-labelledby="title desc"><title id="title">FIR, CTA/UTA, TMA y CTR</title><desc id="desc">Perfil puramente conceptual. La FIR engloba espacios controlados y no controlados. CTA/UTA tiene base sobre el terreno; TMA es un área de control terminal; CTR parte de superficie. ADA es no controlada. Geometría, solapes y posiciones son ilustrativos: no dimensiones ni relaciones universales. ATZ se muestra en la planta del tablero siguiente.</desc><rect width="600" height="596" rx="16" fill="#091b30"/><g font-family="DejaVu Sans,sans-serif" fill="#f8f1df"><text x="26" y="40" font-size="34" fill="#eac475" text-anchor="start" font-weight="500">FIR · FIS + alerta</text><rect x="22" y="69" width="556" height="379" rx="16" fill="none" stroke="#eac475" stroke-width="3" stroke-dasharray="9 7"/><rect x="49" y="108" width="502" height="100" rx="0" fill="#17374b" stroke="#89c7e2" stroke-width="3"/><text x="74" y="147" font-size="34" fill="#89c7e2" text-anchor="start" font-weight="500">CTA / UTA</text><text x="74" y="187" font-size="28" fill="#f8f1df" text-anchor="start" font-weight="500">Base sobre terreno</text><rect x="235" y="233" width="302" height="82" rx="0" fill="#245066" stroke="#89c7e2" stroke-width="3"/><text x="256" y="268" font-size="32" fill="#89c7e2" text-anchor="start" font-weight="500">TMA</text><text x="256" y="302" font-size="27" fill="#f8f1df" text-anchor="start" font-weight="500">Confluencia ATS</text><rect x="297" y="336" width="236" height="104" rx="0" fill="#315b64" stroke="#94d7c0" stroke-width="3"/><text x="320" y="373" font-size="32" fill="#94d7c0" text-anchor="start" font-weight="500">CTR</text><text x="320" y="409" font-size="25" fill="#f8f1df" text-anchor="start" font-weight="500">Desde superficie</text><rect x="43" y="257" width="167" height="118" rx="0" fill="#262f42" stroke="#eac475" stroke-width="3" stroke-dasharray="6 5"/><text x="65" y="292" font-size="30" fill="#eac475" text-anchor="start" font-weight="500">ADA</text><text x="63" y="329" font-size="28" fill="#f8f1df" text-anchor="start" font-weight="500">Clase F</text><text x="51" y="362" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">No controlado</text><line x1="32" y1="440" x2="568" y2="440" stroke="#f8f1df" stroke-width="4"/><text x="31" y="484" font-size="28" fill="#f8f1df" text-anchor="start" font-weight="500">SUPERFICIE</text><text x="31" y="527" font-size="28" fill="#eac475" text-anchor="start" font-weight="500">FIR: controlado + no controlado</text><text x="31" y="567" font-size="25" fill="#cad6e1" text-anchor="start" font-weight="500">Geometría ilustrativa · sin escala</text></g></svg>