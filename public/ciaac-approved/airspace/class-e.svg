<svg xmlns="http://www.w3.org/2000/svg" width="360" height="380" viewBox="0 0 360 380" role="img" aria-labelledby="title desc"><title id="title">Clase E: servicio y radio</title><desc id="desc">Clase E. El resumen visual acompaña íntegra su explicación. Radio: tabla histórica mexicana MGTAM 2019, no tabla común OACI. Las condiciones completas de autorización, separación, información y asesoramiento están junto a esta figura. Las marcas ** heredadas permanecen sin inventar una nueva restricción.</desc><rect width="360" height="380" rx="16" fill="#091b30"/><g font-family="DejaVu Sans,sans-serif" fill="#f8f1df"><text x="22" y="41" font-size="34" fill="#eac475" text-anchor="start" font-weight="500">CLASE E</text><text x="22" y="79" font-size="22" fill="#89c7e2" text-anchor="start" font-weight="500">MÉXICO · MGTAM 2019</text><text x="22" y="123" font-size="27" fill="#f8f1df" text-anchor="start" font-weight="500">Separación IFR / IFR</text><text x="22" y="166" font-size="23" fill="#eac475" text-anchor="start" font-weight="500">Información de tránsito</text><text x="22" y="201" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">En la medida de lo posible</text><line x1="22" y1="225" x2="338" y2="225" stroke="#cad6e1" stroke-width="1"/><text x="22" y="261" font-size="22" fill="#89c7e2" text-anchor="start" font-weight="500">RADIO HISTÓRICA</text><text x="22" y="299" font-size="28" fill="#f8f1df" text-anchor="start" font-weight="500">IFR continua</text><text x="22" y="335" font-size="27" fill="#f8f1df" text-anchor="start" font-weight="500">VFR no requerida</text></g></svg>