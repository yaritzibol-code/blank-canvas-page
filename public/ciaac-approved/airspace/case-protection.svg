<svg xmlns="http://www.w3.org/2000/svg" width="600" height="652" viewBox="0 0 600 652" role="img" aria-labelledby="title desc"><title id="title">Caso ficticio: fuera del área de protección</title><desc id="desc">Vista conceptual del caso. Aeronave situada fuera de las zonas primaria y secundaria, dato explícito del escenario. Grid MORA de 11,000 ft MSL simulada para el cuadrante; no garantía NAV/COM ni autorización automática para cambiar altitud. La respuesta se limita al vuelo IFR controlado planteado y no desarrolla emergencias.</desc><rect width="600" height="652" rx="16" fill="#091b30"/><g font-family="DejaVu Sans,sans-serif" fill="#f8f1df"><text x="22" y="42" font-size="25" fill="#eac475" text-anchor="start" font-weight="500">CASO FICTICIO · FUERA DE PROTECCIÓN</text><rect x="27" y="97" width="546" height="264" rx="0" fill="none" stroke="#89c7e2" stroke-width="3"/><rect x="28" y="98" width="545" height="83" rx="0" fill="#203b50"/><rect x="28" y="181" width="545" height="78" rx="0" fill="#385367"/><rect x="28" y="259" width="545" height="80" rx="0" fill="#203b50"/><line x1="31" y1="220" x2="569" y2="220" stroke="#f8f1df" stroke-width="3" stroke-dasharray="9 7"/><text x="42" y="136" font-size="25" fill="#cad6e1" text-anchor="start" font-weight="500">Zona secundaria</text><text x="42" y="207" font-size="25" fill="#f8f1df" text-anchor="start" font-weight="500">Zona primaria</text><text x="42" y="297" font-size="25" fill="#cad6e1" text-anchor="start" font-weight="500">Zona secundaria</text><text x="42" y="387" font-size="27" fill="#edaa99" text-anchor="start" font-weight="500">Fuera de ambas zonas</text><g transform="translate(489 385) scale(1.0)"><path d="M-25 5 L25 5 Q35 1 25 -3 L5 -4 L-10 -20 L-17 -20 L-11 -4 L-21 -4 L-28 -12 L-33 -12Z" fill="#f8f1df"/></g><text x="26" y="445" font-size="28" fill="#eac475" text-anchor="start" font-weight="500">Grid MORA simulada: 11,000 ft MSL</text><text x="26" y="487" font-size="24" fill="#f8f1df" text-anchor="start" font-weight="500">Dato de franqueamiento del cuadrante</text><text x="26" y="533" font-size="25" fill="#edaa99" text-anchor="start" font-weight="500">Sin garantía de NAV / COM</text><text x="26" y="578" font-size="23" fill="#cad6e1" text-anchor="start" font-weight="500">Cambio de ruta / altitud en vuelo controlado:</text><text x="26" y="618" font-size="26" fill="#94d7c0" text-anchor="start" font-weight="500">autorización ATC modificada previa</text></g></svg>