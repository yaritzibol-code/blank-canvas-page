<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc"><title id="title">Grid MORA: cuadrícula geográfica</title><desc id="desc">Planta conceptual sin coordenadas ni altitudes operacionales. Sector delimitado por latitud y longitud; franqueamiento del terreno y estructuras elevadas dentro del sector. Jeppesen o autoridad estatal, sin garantía NAV ni COM.</desc><rect width="360" height="420" rx="16" fill="#091b30"/><g font-family="DejaVu Sans,sans-serif" fill="#f8f1df"><text x="22" y="43" font-size="30" fill="#eac475" text-anchor="start" font-weight="500">GRID MORA</text><text x="22" y="82" font-size="24" fill="#cad6e1" text-anchor="start" font-weight="500">Latitud / longitud</text><line x1="35" y1="106" x2="35" y2="290" stroke="#89c7e2" stroke-width="2"/><line x1="180" y1="106" x2="180" y2="290" stroke="#89c7e2" stroke-width="2"/><line x1="325" y1="106" x2="325" y2="290" stroke="#89c7e2" stroke-width="2"/><line x1="35" y1="106" x2="325" y2="106" stroke="#89c7e2" stroke-width="2"/><line x1="35" y1="198" x2="325" y2="198" stroke="#89c7e2" stroke-width="2"/><line x1="35" y1="290" x2="325" y2="290" stroke="#89c7e2" stroke-width="2"/><rect x="36" y="107" width="143" height="90" rx="0" fill="#315662"/><text x="107" y="163" font-size="24" fill="#94d7c0" text-anchor="middle" font-weight="500">Sector</text><path d="M201 271 L223 222 L242 249 L280 207 L316 271Z" fill="#516071"/><text x="22" y="328" font-size="24" fill="#eac475" text-anchor="start" font-weight="500">Terreno + estructuras</text><text x="22" y="370" font-size="23" fill="#cad6e1" text-anchor="start" font-weight="500">Sin garantía NAV / COM</text></g></svg>