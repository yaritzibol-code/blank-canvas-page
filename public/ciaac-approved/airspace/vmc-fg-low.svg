<svg xmlns="http://www.w3.org/2000/svg" width="360" height="468" viewBox="0 0 360 468" role="img" aria-labelledby="title desc"><title id="title">F/G · por debajo de · mínimos VMC históricos</title><desc id="desc">Tabla mexicana histórica MGTAM 2019 PDF100. AMSL es la referencia de la banda 10,000 ft para visibilidad; AGL es la referencia de 1,000 ft para F/G. Valores y condiciones no se universalizan. El valor 1 SM aquí es visibilidad, libre de nubes y superficie a la vista; sólo por debajo de 1,000 ft AGL.</desc><rect width="360" height="468" rx="16" fill="#091b30"/><g font-family="DejaVu Sans,sans-serif" fill="#f8f1df"><text x="22" y="42" font-size="25" fill="#eac475" text-anchor="start" font-weight="500">F/G · por debajo de</text><text x="22" y="76" font-size="28" fill="#eac475" text-anchor="start" font-weight="500">1,000 ft AGL</text><text x="22" y="118" font-size="21" fill="#89c7e2" text-anchor="start" font-weight="500">VISIBILIDAD DE VUELO</text><text x="22" y="161" font-size="28" fill="#f8f1df" text-anchor="start" font-weight="500">1,600 m (1 SM)</text><line x1="22" y1="201" x2="338" y2="201" stroke="#cad6e1" stroke-width="1"/><g transform="translate(84 258) scale(0.9)"><path d="M-25 5 L25 5 Q35 1 25 -3 L5 -4 L-10 -20 L-17 -20 L-11 -4 L-21 -4 L-28 -12 L-33 -12Z" fill="#f8f1df"/></g><path d="M247 237 q-18-21 8-30 q7-22 28-12 q25-12 32 13 q22 2 13 25Z" fill="#cad6e1" opacity=".9"/><text x="22" y="319" font-size="27" fill="#94d7c0" text-anchor="start" font-weight="500">Libre de nubes</text><line x1="22" y1="356" x2="338" y2="356" stroke="#94d7c0" stroke-width="3"/><text x="22" y="394" font-size="25" fill="#94d7c0" text-anchor="start" font-weight="500">Superficie a la vista</text><text x="22" y="442" font-size="21" fill="#cad6e1" text-anchor="start" font-weight="500">Histórico · MGTAM 2019</text></g></svg>