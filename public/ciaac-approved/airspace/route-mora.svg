<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc"><title id="title">Route MORA: corredor y extremos</title><desc id="desc">Planta conceptual Jeppesen: 10 NM a cada lado del eje y radio de 10 NM alrededor de los fijos extremos. No es el ancho universal de protección de una aerovía. Garantiza franqueamiento según el margen citado, sin garantía NAV ni COM.</desc><rect width="360" height="420" rx="16" fill="#091b30"/><g font-family="DejaVu Sans,sans-serif" fill="#f8f1df"><text x="22" y="43" font-size="30" fill="#eac475" text-anchor="start" font-weight="500">ROUTE MORA</text><rect x="30" y="100" width="300" height="160" rx="80" fill="#17374b" stroke="#89c7e2" stroke-width="3"/><line x1="64" y1="180" x2="296" y2="180" stroke="#f8f1df" stroke-width="3" stroke-dasharray="8 5"/><circle cx="110" cy="180" r="7" fill="#f8f1df"/><circle cx="250" cy="180" r="7" fill="#f8f1df"/><line x1="180" y1="100" x2="180" y2="178" stroke="#eac475" stroke-width="3"/><path d="M185.0,108.0 L180,100 L175.0,108.0 M185.0,170.0 L180,178 L175.0,170.0" fill="none" stroke="#eac475" stroke-width="2"/><line x1="180" y1="183" x2="180" y2="260" stroke="#eac475" stroke-width="3"/><path d="M185.0,191.0 L180,183 L175.0,191.0 M185.0,252.0 L180,260 L175.0,252.0" fill="none" stroke="#eac475" stroke-width="2"/><text x="191" y="147" font-size="24" fill="#eac475" text-anchor="start" font-weight="500">10 NM</text><text x="191" y="233" font-size="24" fill="#eac475" text-anchor="start" font-weight="500">10 NM</text><text x="22" y="306" font-size="24" fill="#eac475" text-anchor="start" font-weight="500">Extremos: radio 10 NM</text><text x="22" y="350" font-size="28" fill="#94d7c0" text-anchor="start" font-weight="500">Franqueamiento</text><text x="22" y="390" font-size="23" fill="#cad6e1" text-anchor="start" font-weight="500">Sin garantía NAV / COM</text></g></svg>