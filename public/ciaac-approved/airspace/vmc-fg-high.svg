<svg xmlns="http://www.w3.org/2000/svg" width="360" height="452" viewBox="0 0 360 452" role="img" aria-labelledby="title desc"><title id="title">F/G · por encima de · mínimos VMC históricos</title><desc id="desc">Tabla mexicana histórica MGTAM 2019 PDF100. AMSL es la referencia de la banda 10,000 ft para visibilidad; AGL es la referencia de 1,000 ft para F/G. Valores y condiciones no se universalizan. La distancia horizontal de nubes es distinta de visibilidad.</desc><rect width="360" height="452" rx="16" fill="#091b30"/><g font-family="DejaVu Sans,sans-serif" fill="#f8f1df"><text x="22" y="37" font-size="27" fill="#eac475" text-anchor="start" font-weight="500">F/G · por encima de</text><text x="22" y="73" font-size="27" fill="#eac475" text-anchor="start" font-weight="500">1,000 ft AGL</text><text x="22" y="111" font-size="22" fill="#89c7e2" text-anchor="start" font-weight="500">VISIBILIDAD DE VUELO</text><text x="22" y="149" font-size="24" fill="#f8f1df" text-anchor="start" font-weight="500">8 km ≥ 10,000 ft AMSL</text><text x="22" y="185" font-size="24" fill="#f8f1df" text-anchor="start" font-weight="500">5 km &lt; 10,000 ft AMSL</text><line x1="22" y1="204" x2="338" y2="204" stroke="#cad6e1" stroke-width="1"/><text x="22" y="238" font-size="23" fill="#89c7e2" text-anchor="start" font-weight="500">DISTANCIA DE NUBES</text><g transform="translate(55 278) scale(0.8)"><path d="M-25 5 L25 5 Q35 1 25 -3 L5 -4 L-10 -20 L-17 -20 L-11 -4 L-21 -4 L-28 -12 L-33 -12Z" fill="#f8f1df"/></g><path d="M270 276 q-18-21 8-30 q7-22 28-12 q25-12 32 13 q22 2 13 25Z" fill="#cad6e1" opacity=".9"/><line x1="90" y1="271" x2="250" y2="271" stroke="#eac475" stroke-width="3"/><path d="M98.0,266.0 L90,271 L98.0,276.0 M242.0,266.0 L250,271 L242.0,276.0" fill="none" stroke="#eac475" stroke-width="2"/><text x="22" y="319" font-size="23" fill="#eac475" text-anchor="start" font-weight="500">Horizontal: 1,600 m (1 SM)</text><path d="M36 368 q-18-21 8-30 q7-22 28-12 q25-12 32 13 q22 2 13 25Z" fill="