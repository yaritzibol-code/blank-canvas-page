<svg xmlns="http://www.w3.org/2000/svg" width="360" height="730" viewBox="0 0 360 730" role="img" aria-labelledby="message-order-title message-order-desc"><title id="message-order-title">Diez campos ordenados del mensaje</title><desc id="message-order-desc">Orden documental del mensaje de alerta: fase; servicio y persona; clase; FPL; último contacto; última posición; colores y marcas; mercancías peligrosas; medidas; observaciones. No es una escalera de fases.</desc><rect width="360" height="730" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="24" y="39" font-size="27" fill="#e8be73" text-anchor="start" font-weight="600">MENSAJE AL RCC</text><rect x="24" y="64" width="312" height="45" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="42" y="95" font-size="22" fill="#e8be73" text-anchor="start" font-weight="600">01</text><text x="83" y="95" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Fase de alarma</text><rect x="24" y="119" width="312" height="45" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="42" y="150" font-size="22" fill="#e8be73" text-anchor="start" font-weight="600">02</text><text x="83" y="150" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Servicio y persona</text><rect x="24" y="174" width="312" height="45" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="42" y="205" font-size="22" fill="#e8be73" text-anchor="start" font-weight="600">03</text><text x="83" y="205" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Clase de emergencia</text><rect x="24" y="229" width="312" height="45" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="42" y="260" font-size="22" fill="#e8be73" text-anchor="start" font-weight="600">04</text><text x="83" y="260" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Datos del FPL</text><rect x="24" y="284" width="312" height="45" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="42" y="315" font-size="22" fill="#e8be73" text-anchor="start" font-weight="600">05</text><text x="83" y="315" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Último contacto</text><rect x="24" y="339" width="312" height="45" rx="12" fill="#173149" stroke="#91d4c6" stroke-width="2"/><text x="42" y="370" font-size="22" fill="#e8be73" text-anchor="start" font-weight="600">06</text><text x="83" y="370" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Última posición</text><rect x="24" y="394" width="312" height="45" rx="12" fill="#173149" stroke="#91d4c6" stroke-width="2"/><text x="42" y="425" font-size="22" fill="#e8be73" text-anchor="start" font-weight="600">07</text><text x="83" y="425" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Colores y marcas</text><rect x="24" y="449" width="312" height="45" rx="12" fill="#173149" stroke="#91d4c6" stroke-width="2"/><text x="42" y="480" font-size="22" fill="#e8be73" text-anchor="start" font-weight="600">08</text><text x="83" y="480" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Mercancías peligrosas</text><rect x="24" y="504" width="312" height="45" rx="12" fill="#173149" stroke="#91d4c6" stroke-width="2"/><text x="42" y="535" font-size="22" fill="#e8be73" text-anchor="start" font-weight="600">09</text><text x="83" y="535" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Medidas tomadas</text><rect x="24" y="559" width="312" height="45" rx="12" fill="#173149" stroke="#91d4c6" stroke-width="2"/><text x="42" y="590" font-size="22" fill="#e8be73" text-anchor="start" font-weight="600">10</text><text x="83" y="590" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Observaciones</text><text x="24" y="645.0" font-size="22" fill="#c7d3de" text-anchor="start" font-weight="500">Información disponible, en</text><text x="24" y="674.04" font-size="22" fill="#c7d3de" text-anchor="start" font-weight="500">este orden. Detalle íntegro</text><text x="24" y="703.08" font-size="22" fill="#c7d3de" text-anchor="start" font-weight="500">junto al esquema.</text></g></svg>