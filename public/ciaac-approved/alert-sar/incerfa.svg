<svg xmlns="http://www.w3.org/2000/svg" width="360" height="580" viewBox="0 0 360 580" role="img" aria-labelledby="incerfa-title incerfa-desc"><title id="incerfa-title">INCERFA: dos disparadores y una excepción</title><desc id="incerfa-desc">30 minutos desde la comunicación prevista o primer intento infructuoso, lo primero; o 30 minutos desde la ETA anunciada o calculada, la más tardía. No se declara si no hay dudas sobre seguridad.</desc><rect width="360" height="580" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="24" y="39" font-size="30" fill="#82c7e5" text-anchor="start" font-weight="600">INCERFA</text><rect x="24" y="67" width="312" height="170" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="39" y="99" font-size="26" fill="#82c7e5" text-anchor="start" font-weight="600">Comunicación</text><text x="39" y="133.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">30 min: reporte previsto</text><text x="39" y="162.04" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">o primer intento fallido,</text><text x="39" y="191.08" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">el primero</text><rect x="24" y="262" width="312" height="170" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="39" y="294" font-size="26" fill="#82c7e5" text-anchor="start" font-weight="600">Llegada</text><text x="39" y="328.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">30 min tras ETA</text><text x="39" y="357.04" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">anunciada o calculada, la</text><text x="39" y="386.08" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">más tardía</text><text x="24" y="475.0" font-size="23" fill="#e8be73" text-anchor="start" font-weight="500">EXCEPCIÓN</text><text x="24" y="505.36" font-size="23" fill="#e8be73" text-anchor="start" font-weight="500">Sin dudas sobre seguridad</text><text x="24" y="535.72" font-size="23" fill="#e8be73" text-anchor="start" font-weight="500">de aeronave y ocupantes.</text></g></svg>