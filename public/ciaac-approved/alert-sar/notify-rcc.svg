<svg xmlns="http://www.w3.org/2000/svg" width="360" height="635" viewBox="0 0 360 635" role="img" aria-labelledby="notify-rcc-title notify-rcc-desc"><title id="notify-rcc-title">Notificación inmediata al RCC</title><desc id="notify-rcc-desc">Toda fase se comunica inmediatamente al RCC. ACC/FIC concentra datos. En INCERFA/ALERFA se notifica al explotador en cuanto sea posible antes del RCC; en DETRESFA, RCC inmediato y prioritario.</desc><rect width="360" height="635" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><rect x="24" y="28" width="312" height="127" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="39" y="60" font-size="26" fill="#82c7e5" text-anchor="start" font-weight="600">Cualquier fase</text><text x="39" y="94.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">INCERFA · ALERFA ·</text><text x="39" y="123.04" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">DETRESFA</text><line x1="180" y1="167" x2="180" y2="202" stroke="#e8be73" stroke-width="3" /><path d="M184.79425538604204 193.22417438109628 L180 202 L175.20574461395796 193.22417438109628" fill="none" stroke="#e8be73" stroke-width="3"/><rect x="24" y="219" width="312" height="108" rx="12" fill="#173149" stroke="#e8be73" stroke-width="2"/><text x="39" y="251" font-size="26" fill="#e8be73" text-anchor="start" font-weight="600">ATS → RCC</text><text x="39" y="285.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Notificación inmediata</text><line x1="24" y1="356" x2="336" y2="356" stroke="#e8be73" stroke-width="3" /><text x="24" y="393.0" font-size="23" fill="#f8f1df" text-anchor="start" font-weight="500">ACC / FIC: centro</text><text x="24" y="423.36" font-size="23" fill="#f8f1df" text-anchor="start" font-weight="500">concentrador dentro de la</text><text x="24" y="453.72" font-size="23" fill="#f8f1df" text-anchor="start" font-weight="500">FIR.</text><text x="24" y="483.0" font-size="22" fill="#c7d3de" text-anchor="start" font-weight="500">Explotador: en cuanto sea</text><text x="24" y="512.04" font-size="22" fill="#c7d3de" text-anchor="start" font-weight="500">posible antes del RCC en</text><text x="24" y="541.08" font-size="22" fill="#c7d3de" text-anchor="start" font-weight="500">INCERFA / ALERFA. En</text><text x="24" y="570.12" font-size="22" fill="#c7d3de" text-anchor="start" font-weight="500">DETRESFA, RCC prioritario.</text></g></svg>