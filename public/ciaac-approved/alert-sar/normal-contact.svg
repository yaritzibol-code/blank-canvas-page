<svg xmlns="http://www.w3.org/2000/svg" width="360" height="492" viewBox="0 0 360 492" role="img" aria-labelledby="normal-contact-title normal-contact-desc"><title id="normal-contact-title">20–40 min desde el último contacto</title><desc id="normal-contact-desc">La ventana parte del último contacto, cualquiera que sea su objeto, con radio adecuada en ambos sentidos. Los procedimientos ATC/asesoramiento reemplazan los de alerta, salvo cuando sólo exigen informes horarios de posición.</desc><rect width="360" height="492" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="24" y="38" font-size="26" fill="#e8be73" text-anchor="start" font-weight="600">VUELO NORMAL</text><rect x="24" y="65" width="312" height="118" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="39" y="97" font-size="26" fill="#82c7e5" text-anchor="start" font-weight="600">Último contacto</text><text x="39" y="131.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Cualquiera que sea su</text><text x="39" y="160.04" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">objeto</text><line x1="180" y1="190" x2="180" y2="222" stroke="#e8be73" stroke-width="3" /><path d="M184.79425538604204 213.22417438109628 L180 222 L175.20574461395796 213.22417438109628" fill="none" stroke="#e8be73" stroke-width="3"/><rect x="24" y="234" width="312" height="132" rx="12" fill="#173149" stroke="#91d4c6" stroke-width="2"/><text x="39" y="266" font-size="26" fill="#91d4c6" text-anchor="start" font-weight="600">20–40 minutos</text><text x="39" y="300.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Identificación + “vuelo</text><text x="39" y="329.04" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">normal” o QRU</text><text x="24" y="403.0" font-size="22" fill="#c7d3de" text-anchor="start" font-weight="500">Radio adecuada en ambos</text><text x="24" y="432.04" font-size="22" fill="#c7d3de" text-anchor="start" font-weight="500">sentidos; aplicar la</text><text x="24" y="461.08" font-size="22" fill="#c7d3de" text-anchor="start" font-weight="500">condición normativa</text><text x="24" y="490.12" font-size="22" fill="#c7d3de" text-anchor="start" font-weight="500">adjunta.</text></g></svg>