<svg xmlns="http://www.w3.org/2000/svg" width="360" height="486" viewBox="0 0 360 486" role="img" aria-labelledby="legal-closure-title legal-closure-desc"><title id="legal-closure-title">Cierre del FPL y requerimiento AFAC</title><desc id="legal-closure-desc">El cierre de pleno derecho corresponde al aterrizaje en destino previsto. AFAC puede requerir la presentación física del cierre; eso se refiere al documento, no a prueba física de llegada.</desc><rect width="360" height="486" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><rect x="24" y="32" width="312" height="106" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="39" y="64" font-size="26" fill="#82c7e5" text-anchor="start" font-weight="600">Aterrizaje</text><text x="39" y="98.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">En el destino previsto</text><line x1="180" y1="149" x2="180" y2="181" stroke="#e8be73" stroke-width="3" /><path d="M184.79425538604204 172.22417438109628 L180 181 L175.20574461395796 172.22417438109628" fill="none" stroke="#e8be73" stroke-width="3"/><rect x="24" y="196" width="312" height="106" rx="12" fill="#173149" stroke="#91d4c6" stroke-width="2"/><text x="39" y="228" font-size="26" fill="#91d4c6" text-anchor="start" font-weight="600">Cierre del FPL</text><text x="39" y="262.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">De pleno derecho</text><rect x="24" y="332" width="312" height="133" rx="12" fill="#173149" stroke="#e8be73" stroke-width="2"/><text x="39" y="364" font-size="24" fill="#e8be73" text-anchor="start" font-weight="600">AFAC puede requerir</text><text x="39" y="398.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Presentación física del</text><text x="39" y="427.04" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">cierre</text></g></svg>