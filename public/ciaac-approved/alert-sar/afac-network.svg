<svg xmlns="http://www.w3.org/2000/svg" width="360" height="590" viewBox="0 0 360 590" role="img" aria-labelledby="afac-network-title afac-network-desc"><title id="afac-network-title">AFAC: RSC y SMC según Bases 2026</title><desc id="afac-network-desc">RSC: Comandancias Regionales Mazatlán, Monterrey y Mérida y Comandancia del AICM. Otras Comandancias de Aeropuerto actúan como SMC, coordinando brigadas locales según Plan SAR. El esquema no asigna límites SRR.</desc><rect width="360" height="590" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><rect x="24" y="30" width="312" height="132" rx="12" fill="#173149" stroke="#e8be73" stroke-width="2"/><text x="39" y="62" font-size="26" fill="#e8be73" text-anchor="start" font-weight="600">AFAC</text><text x="39" y="96.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Coadyuva mediante</text><text x="39" y="125.04" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Comandancias</text><line x1="180" y1="163" x2="180" y2="194" stroke="#e8be73" stroke-width="3" /><line x1="93" y1="194" x2="267" y2="194" stroke="#e8be73" stroke-width="3" /><line x1="93" y1="194" x2="93" y2="227" stroke="#82c7e5" stroke-width="3" /><path d="M97.79425538604202 218.22417438109628 L93 227 L88.20574461395798 218.22417438109628" fill="none" stroke="#82c7e5" stroke-width="3"/><line x1="267" y1="194" x2="267" y2="227" stroke="#91d4c6" stroke-width="3" /><path d="M271.79425538604204 218.22417438109628 L267 227 L262.20574461395796 218.22417438109628" fill="none" stroke="#91d4c6" stroke-width="3"/><rect x="24" y="243" width="145" height="71" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="96" y="289" font-size="30" fill="#82c7e5" text-anchor="middle" font-weight="600">RSC</text><rect x="191" y="243" width="145" height="71" rx="12" fill="#173149" stroke="#91d4c6" stroke-width="2"/><text x="264" y="289" font-size="30" fill="#91d4c6" text-anchor="middle" font-weight="600">SMC</text><text x="24" y="354.0" font-size="23" fill="#82c7e5" text-anchor="start" font-weight="500">RSC: MZT, MTY, MID y</text><text x="24" y="384.36" font-size="23" fill="#82c7e5" text-anchor="start" font-weight="500">Comandancia AICM (MEX).</text><text x="24" y="453.0" font-size="23" fill="#91d4c6" text-anchor="start" font-weight="500">SMC: demás</text><text x="24" y="483.36" font-size="23" fill="#91d4c6" text-anchor="start" font-weight="500">Comandancias de</text><text x="24" y="513.72" font-size="23" fill="#91d4c6" text-anchor="start" font-weight="500">Aeropuerto; coordinan</text><text x="24" y="544.08" font-size="23" fill="#91d4c6" text-anchor="start" font-weight="500">unidades o brigadas</text><text x="24" y="574.44" font-size="23" fill="#91d4c6" text-anchor="start" font-weight="500">locales.</text></g></svg>