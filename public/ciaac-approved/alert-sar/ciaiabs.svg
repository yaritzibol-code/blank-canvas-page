<svg xmlns="http://www.w3.org/2000/svg" width="360" height="542" viewBox="0 0 360 542" role="img" aria-labelledby="ciaiabs-title ciaiabs-desc"><title id="ciaiabs-title">Adscripción y atribuciones CIAIABS</title><desc id="ciaiabs-desc">Según Bases SICT-AFAC de 1 septiembre 2026, CIAIABS está adscrita a la Subsecretaría de Comunicaciones y Transportes SICT y coordina SAR nacional, plan de operaciones y programa de vigilancia.</desc><rect width="360" height="542" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><rect x="24" y="35" width="312" height="155" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="39" y="67" font-size="26" fill="#82c7e5" text-anchor="start" font-weight="600">SICT</text><text x="39" y="101.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Subsecretaría de</text><text x="39" y="130.04" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Comunicaciones y</text><text x="39" y="159.08" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Transportes</text><line x1="180" y1="203" x2="180" y2="239" stroke="#e8be73" stroke-width="3" /><path d="M184.79425538604204 230.22417438109628 L180 239 L175.20574461395796 230.22417438109628" fill="none" stroke="#e8be73" stroke-width="3"/><rect x="24" y="257" width="312" height="167" rx="12" fill="#173149" stroke="#e8be73" stroke-width="2"/><text x="39" y="289" font-size="26" fill="#e8be73" text-anchor="start" font-weight="600">CIAIABS</text><text x="39" y="323.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Coordina SAR nacional,</text><text x="39" y="352.04" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Plan de Operaciones y</text><text x="39" y="381.08" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">vigilancia SAR</text><text x="24" y="468.0" font-size="23" fill="#c7d3de" text-anchor="start" font-weight="500">Bases SICT–AFAC</text><text x="24" y="498.36" font-size="23" fill="#c7d3de" text-anchor="start" font-weight="500">01 septiembre 2026</text></g></svg>