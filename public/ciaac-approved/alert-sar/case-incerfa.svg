<svg xmlns="http://www.w3.org/2000/svg" width="360" height="492" viewBox="0 0 360 492" role="img" aria-labelledby="case-incerfa-title case-incerfa-desc"><title id="case-incerfa-title">Caso: cuenta desde 14:00</title><desc id="case-incerfa-desc">min(14:00, 14:02) + 30 min = 14:30. No se toma automáticamente la última transmisión previa. Se conserva la incertidumbre sobre seguridad y notificación inmediata RCC.</desc><rect width="360" height="492" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><rect x="24" y="30" width="312" height="117" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="39" y="62" font-size="26" fill="#82c7e5" text-anchor="start" font-weight="600">14:00 · 14:02</text><text x="39" y="96.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Se toma la primera hora</text><line x1="180" y1="159" x2="180" y2="195" stroke="#e8be73" stroke-width="3" /><path d="M184.79425538604204 186.22417438109628 L180 195 L175.20574461395796 186.22417438109628" fill="none" stroke="#e8be73" stroke-width="3"/><rect x="24" y="211" width="312" height="145" rx="12" fill="#173149" stroke="#e8be73" stroke-width="2"/><text x="39" y="243" font-size="26" fill="#e8be73" text-anchor="start" font-weight="600">14:30 · INCERFA</text><text x="39" y="277.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">30 minutos desde el</text><text x="39" y="306.04" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">reporte debido a las</text><text x="39" y="335.08" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">14:00</text><text x="24" y="405.0" font-size="24" fill="#91d4c6" text-anchor="start" font-weight="500">ACC notifica al RCC</text><text x="24" y="436.68" font-size="24" fill="#91d4c6" text-anchor="start" font-weight="500">inmediatamente.</text></g></svg>