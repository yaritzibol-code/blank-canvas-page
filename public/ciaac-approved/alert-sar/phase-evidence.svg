<svg xmlns="http://www.w3.org/2000/svg" width="600" height="376" viewBox="0 0 600 376" role="img" aria-labelledby="phase-evidence-title phase-evidence-desc"><title id="phase-evidence-title">La evidencia determina directamente la fase</title><desc id="phase-evidence-desc">La fase aplicable se declara por evidencia. Tres flechas independientes parten de la evidencia; no hay flechas INCERFA a ALERFA ni ALERFA a DETRESFA.</desc><rect width="600" height="376" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><rect x="24" y="20" width="552" height="118" rx="12" fill="#173149" stroke="#e8be73" stroke-width="2"/><text x="39" y="52" font-size="26" fill="#e8be73" text-anchor="start" font-weight="600">Evidencia disponible</text><text x="39" y="86.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">La gravedad determina la fase</text><line x1="300" y1="139" x2="300" y2="166" stroke="#e8be73" stroke-width="3" /><line x1="98" y1="166" x2="502" y2="166" stroke="#e8be73" stroke-width="3" /><line x1="98" y1="166" x2="98" y2="205" stroke="#82c7e5" stroke-width="3" /><path d="M102.79425538604202 196.22417438109628 L98 205 L93.20574461395798 196.22417438109628" fill="none" stroke="#82c7e5" stroke-width="3"/><rect x="13" y="214" width="170" height="52" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="98" y="248" font-size="25" fill="#82c7e5" text-anchor="middle" font-weight="600">INCERFA</text><line x1="300" y1="166" x2="300" y2="205" stroke="#e8be73" stroke-width="3" /><path d="M304.79425538604204 196.22417438109628 L300 205 L295.20574461395796 196.22417438109628" fill="none" stroke="#e8be73" stroke-width="3"/><rect x="215" y="214" width="170" height="52" rx="12" fill="#173149" stroke="#e8be73" stroke-width="2"/><text x="300" y="248" font-size="25" fill="#e8be73" text-anchor="middle" font-weight="600">ALERFA</text><line x1="502" y1="166" x2="502" y2="205" stroke="#edb2a6" stroke-width="3" /><path d="M506.79425538604204 196.22417438109628 L502 205 L497.20574461395796 196.22417438109628" fill="none" stroke="#edb2a6" stroke-width="3"/><rect x="417" y="214" width="170" height="52" rx="12" fill="#173149" stroke="#edb2a6" stroke-width="2"/><text x="502" y="248" font-size="25" fill="#edb2a6" text-anchor="middle" font-weight="600">DETRESFA</text><text x="300" y="311" font-size="28" fill="#f8f1df" text-anchor="middle" font-weight="600">Sin escalera obligatoria</text><text x="300" y="347" font-size="22" fill="#c7d3de" text-anchor="middle" font-weight="500">Cada rama conserva sus criterios y excepciones.</text></g></svg>