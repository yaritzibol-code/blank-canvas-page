<svg xmlns="http://www.w3.org/2000/svg" width="360" height="450" viewBox="0 0 360 450" role="img" aria-labelledby="scope-title scope-desc"><title id="scope-title">¿A qué aeronaves se presta alerta?</title><desc id="scope-desc">Tres ámbitos paralelos: todas las aeronaves con ATC; en la medida de lo posible otras con FPL o conocidas; todas las de interferencia ilícita conocida o sospechada.</desc><rect width="360" height="450" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="24" y="38" font-size="25" fill="#e8be73" text-anchor="start" font-weight="600">ÁMBITO DE ALERTA</text><rect x="24" y="65" width="312" height="94" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="39" y="97" font-size="26" fill="#82c7e5" text-anchor="start" font-weight="600">Servicio ATC</text><text x="39" y="131.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Todas las aeronaves</text><rect x="24" y="182" width="312" height="124" rx="12" fill="#173149" stroke="#91d4c6" stroke-width="2"/><text x="39" y="214" font-size="26" fill="#91d4c6" text-anchor="start" font-weight="600">FPL / conocidas</text><text x="39" y="248.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">En la medida de lo</text><text x="39" y="277.04" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">posible</text><rect x="24" y="329" width="312" height="102" rx="12" fill="#173149" stroke="#edb2a6" stroke-width="2"/><text x="39" y="361" font-size="26" fill="#edb2a6" text-anchor="start" font-weight="600">Interferencia ilícita</text><text x="39" y="395.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Conocida o sospechada</text></g></svg>