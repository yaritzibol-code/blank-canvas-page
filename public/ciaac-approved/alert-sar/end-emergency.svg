<svg xmlns="http://www.w3.org/2000/svg" width="360" height="470" viewBox="0 0 360 470" role="img" aria-labelledby="end-emergency-title end-emergency-desc"><title id="end-emergency-title">Fin de alarma: ATS informa; RCC cancela</title><desc id="end-emergency-desc">ATS comunica sin tardanza al RCC el fin de alarma y anuncia terminación según circunstancias. Sólo RCC cancela las medidas de salvamento que ese centro inició.</desc><rect width="360" height="470" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><rect x="24" y="35" width="312" height="125" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="39" y="67" font-size="26" fill="#82c7e5" text-anchor="start" font-weight="600">ATS</text><text x="39" y="101.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Comunica el fin de</text><text x="39" y="130.04" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">alarma</text><line x1="180" y1="174" x2="180" y2="206" stroke="#e8be73" stroke-width="3" /><path d="M184.79425538604204 197.22417438109628 L180 206 L175.20574461395796 197.22417438109628" fill="none" stroke="#e8be73" stroke-width="3"/><rect x="24" y="222" width="312" height="145" rx="12" fill="#173149" stroke="#e8be73" stroke-width="2"/><text x="39" y="254" font-size="26" fill="#e8be73" text-anchor="start" font-weight="600">RCC</text><text x="39" y="288.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Cancela las medidas que</text><text x="39" y="317.04" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">él haya iniciado</text><text x="24" y="410.0" font-size="22" fill="#c7d3de" text-anchor="start" font-weight="500">Son responsabilidades</text><text x="24" y="439.04" font-size="22" fill="#c7d3de" text-anchor="start" font-weight="500">diferentes.</text></g></svg>