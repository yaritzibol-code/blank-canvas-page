<svg xmlns="http://www.w3.org/2000/svg" width="360" height="505" viewBox="0 0 360 505" role="img" aria-labelledby="pending-operational-title pending-operational-desc"><title id="pending-operational-title">PIA GEN 3.6: cotejo operativo pendiente</title><desc id="pending-operational-desc">Datos operacionales de SRR, RCC, contactos y frecuencias deben comprobarse en PIA/AIP México GEN 3.6 vigente y NOTAM aplicables. Anexo 11 julio 2018 no está disponible; base histórica julio 2016.</desc><rect width="360" height="505" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><rect x="24" y="30" width="312" height="143" rx="12" fill="#173149" stroke="#e8be73" stroke-width="2"/><text x="39" y="62" font-size="26" fill="#e8be73" text-anchor="start" font-weight="600">PIA / AIP GEN 3.6</text><text x="39" y="96.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Vigente + NOTAM</text><text x="39" y="125.04" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">aplicables</text><rect x="24" y="205" width="312" height="141" rx="12" fill="#173149" stroke="#edb2a6" stroke-width="2"/><text x="39" y="237" font-size="26" fill="#edb2a6" text-anchor="start" font-weight="600">Por comprobar</text><text x="39" y="271.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">SRR · contactos ·</text><text x="39" y="300.04" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">frecuencias</text><text x="24" y="396.0" font-size="23" fill="#c7d3de" text-anchor="start" font-weight="500">Anexo 11 (2018):</text><text x="24" y="426.36" font-size="23" fill="#c7d3de" text-anchor="start" font-weight="500">pendiente. Base histórica</text><text x="24" y="456.72" font-size="23" fill="#c7d3de" text-anchor="start" font-weight="500">disponible: 2016.</text></g></svg>