<svg xmlns="http://www.w3.org/2000/svg" width="360" height="885" viewBox="0 0 360 885" role="img" aria-labelledby="detresfa-title detresfa-desc"><title id="detresfa-title">DETRESFA: criterios directos y excepción</title><desc id="detresfa-desc">Peligro deducido de indagaciones tras ALERFA, combustible agotado o insuficiente, o aterrizaje forzoso probable/inminente/realizado. Excepción: casi certeza de que no existe peligro grave ni inminente ni necesidad de ayuda inmediata. No se impone espera arbitraria extra.</desc><rect width="360" height="885" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="24" y="39" font-size="30" fill="#edb2a6" text-anchor="start" font-weight="600">DETRESFA</text><rect x="24" y="66" width="312" height="164" rx="12" fill="#173149" stroke="#edb2a6" stroke-width="2"/><text x="39" y="98" font-size="23" fill="#edb2a6" text-anchor="start" font-weight="600">Peligro por evidencia</text><text x="39" y="132.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Indagaciones extensas</text><text x="39" y="161.04" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">tras ALERFA hacen</text><text x="39" y="190.08" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">suponer peligro</text><rect x="24" y="253" width="312" height="164" rx="12" fill="#173149" stroke="#edb2a6" stroke-width="2"/><text x="39" y="285" font-size="26" fill="#edb2a6" text-anchor="start" font-weight="600">Combustible</text><text x="39" y="319.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Considerado agotado o</text><text x="39" y="348.04" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">insuficiente para lugar</text><text x="39" y="377.08" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">seguro</text><rect x="24" y="440" width="312" height="164" rx="12" fill="#173149" stroke="#edb2a6" stroke-width="2"/><text x="39" y="472" font-size="26" fill="#edb2a6" text-anchor="start" font-weight="600">Aterrizaje forzoso</text><text x="39" y="506.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Probable por</text><text x="39" y="535.04" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">anormalidad extrema,</text><text x="39" y="564.08" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">inminente o ya</text><text x="39" y="593.12" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">efectuado</text><text x="24" y="645.0" font-size="22" fill="#91d4c6" text-anchor="start" font-weight="500">Excepción: casi certeza de</text><text x="24" y="674.04" font-size="22" fill="#91d4c6" text-anchor="start" font-weight="500">ausencia de peligro</text><text x="24" y="703.08" font-size="22" fill="#91d4c6" text-anchor="start" font-weight="500">grave/inminente y de</text><text x="24" y="732.12" font-size="22" fill="#91d4c6" text-anchor="start" font-weight="500">necesidad de ayuda</text><text x="24" y="761.16" font-size="22" fill="#91d4c6" text-anchor="start" font-weight="500">inmediata.</text><text x="24" y="810.0" font-size="23" fill="#e8be73" text-anchor="start" font-weight="500">Sin 30 min extra ante</text><text x="24" y="840.36" font-size="23" fill="#e8be73" text-anchor="start" font-weight="500">evidencia directa.</text></g></svg>