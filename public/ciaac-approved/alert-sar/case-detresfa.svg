<svg xmlns="http://www.w3.org/2000/svg" width="360" height="500" viewBox="0 0 360 500" role="img" aria-labelledby="case-detresfa-title case-detresfa-desc"><title id="case-detresfa-title">Caso: DETRESFA por peligro grave</title><desc id="case-detresfa-desc">A las 14:50 la falla catastrófica y fuego justifican DETRESFA directa y RCC sin demora. No se impone ALERFA previa ni se espera vencimiento teórico del combustible.</desc><rect width="360" height="500" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><rect x="24" y="30" width="312" height="143" rx="12" fill="#173149" stroke="#edb2a6" stroke-width="2"/><text x="39" y="62" font-size="26" fill="#edb2a6" text-anchor="start" font-weight="600">14:50 · evidencia</text><text x="39" y="96.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Falla catastrófica de</text><text x="39" y="125.04" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">motor y fuego a bordo</text><line x1="180" y1="187" x2="180" y2="226" stroke="#edb2a6" stroke-width="3" /><path d="M184.79425538604204 217.22417438109628 L180 226 L175.20574461395796 217.22417438109628" fill="none" stroke="#edb2a6" stroke-width="3"/><rect x="24" y="243" width="312" height="109" rx="12" fill="#173149" stroke="#edb2a6" stroke-width="2"/><text x="39" y="275" font-size="26" fill="#edb2a6" text-anchor="start" font-weight="600">DETRESFA directa</text><text x="39" y="309.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">RCC sin demora</text><text x="24" y="395.0" font-size="23" fill="#e8be73" text-anchor="start" font-weight="500">Sin ALERFA previa forzada;</text><text x="24" y="425.36" font-size="23" fill="#e8be73" text-anchor="start" font-weight="500">sin esperar la autonomía</text><text x="24" y="455.72" font-size="23" fill="#e8be73" text-anchor="start" font-weight="500">teórica.</text></g></svg>