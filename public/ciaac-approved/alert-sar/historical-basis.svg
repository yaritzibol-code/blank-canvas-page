<svg xmlns="http://www.w3.org/2000/svg" width="360" height="520" viewBox="0 0 360 520" role="img" aria-labelledby="historical-basis-title historical-basis-desc"><title id="historical-basis-title">Dos capas de fuente fechadas</title><desc id="historical-basis-desc">Manuales históricos sostienen estudio teórico. Las Bases SICT-AFAC de septiembre 2026 aportan la organización que se ha documentado. No sustituyen PIA GEN 3.6 operacional vigente.</desc><rect width="360" height="520" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><rect x="24" y="30" width="312" height="169" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="39" y="62" font-size="26" fill="#82c7e5" text-anchor="start" font-weight="600">Estudio teórico</text><text x="39" y="96.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">MGTAM 2019</text><text x="39" y="125.04" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Anexo 11 de 2016</text><text x="39" y="154.08" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Manual CIAAC</text><line x1="24" y1="232" x2="336" y2="232" stroke="#e8be73" stroke-width="3" /><rect x="24" y="264" width="312" height="139" rx="12" fill="#173149" stroke="#e8be73" stroke-width="2"/><text x="39" y="296" font-size="23" fill="#e8be73" text-anchor="start" font-weight="600">Organización fechada</text><text x="39" y="330.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Bases SICT–AFAC</text><text x="39" y="359.04" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">01 septiembre 2026</text><text x="24" y="449.0" font-size="23" fill="#c7d3de" text-anchor="start" font-weight="500">Contexto y alcance</text><text x="24" y="479.36" font-size="23" fill="#c7d3de" text-anchor="start" font-weight="500">documental explícitos.</text></g></svg>