<svg xmlns="http://www.w3.org/2000/svg" width="360" height="794" viewBox="0 0 360 794" role="img" aria-labelledby="alerfa-title alerfa-desc"><title id="alerfa-title">ALERFA: cuatro supuestos</title><desc id="alerfa-desc">Tres primeros supuestos: sin noticias después de INCERFA; autorizada a aterrizar y 5 minutos después de hora prevista sin aterrizar ni comunicación; funcionamiento anormal sin aterrizaje forzoso probable. Salvedad de indicios favorables sólo para esos tres. Interferencia ilícita conocida o sospechada es cuarto supuesto.</desc><rect width="360" height="794" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="24" y="39" font-size="30" fill="#e8be73" text-anchor="start" font-weight="600">ALERFA</text><rect x="24" y="66" width="312" height="132" rx="12" fill="#173149" stroke="#e8be73" stroke-width="2"/><text x="39" y="98" font-size="26" fill="#e8be73" text-anchor="start" font-weight="600">Tras INCERFA</text><text x="39" y="132.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Sin noticias tras</text><text x="39" y="161.04" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">tentativas o</text><text x="39" y="190.08" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">indagaciones</text><rect x="24" y="221" width="312" height="163" rx="12" fill="#173149" stroke="#e8be73" stroke-width="2"/><text x="39" y="253" font-size="26" fill="#e8be73" text-anchor="start" font-weight="600">Aterrizaje</text><text x="39" y="287.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Autorizada: 5 min</text><text x="39" y="316.04" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">después de la hora</text><text x="39" y="345.08" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">prevista sin aterrizar +</text><text x="39" y="374.12" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">sin comunicación</text><rect x="24" y="407" width="312" height="133" rx="12" fill="#173149" stroke="#e8be73" stroke-width="2"/><text x="39" y="439" font-size="26" fill="#e8be73" text-anchor="start" font-weight="600">Funcionamiento</text><text x="39" y="473.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Anormal; no hace</text><text x="39" y="502.04" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">probable un aterrizaje</text><text x="39" y="531.08" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">forzoso</text><text x="24" y="580.0" font-size="22" fill="#91d4c6" text-anchor="start" font-weight="500">Salvedad para estos 3:</text><text x="24" y="609.04" font-size="22" fill="#91d4c6" text-anchor="start" font-weight="500">indicios favorables de</text><text x="24" y="638.08" font-size="22" fill="#91d4c6" text-anchor="start" font-weight="500">seguridad.</text><rect x="24" y="668" width="312" height="104" rx="12" fill="#173149" stroke="#edb2a6" stroke-width="2"/><text x="39" y="700" font-size="26" fill="#edb2a6" text-anchor="start" font-weight="600">Interferencia ilícita</text><text x="39" y="734.0" font-size="22" fill="#f8f1df" text-anchor="start" font-weight="500">Conocida o sospechada</text></g></svg>