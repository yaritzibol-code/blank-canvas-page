<svg xmlns="http://www.w3.org/2000/svg" width="360" height="335" viewBox="0 0 360 335" role="img" aria-labelledby="st01-app-title st01-app-desc"><title id="st01-app-title">APP · ámbitos citados</title><desc id="st01-app-desc">Ámbitos de servicio citados para APP: llegadas y salidas en TMA o CTR. La ramificación relaciona funciones, no trayectorias de vuelo ni puntos de transferencia o competencia exclusiva.</desc><rect width="360" height="335" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f6f0df"><text x="180" y="42" font-size="29" fill="#edc574" text-anchor="middle" font-weight="500">APROXIMACIÓN</text><rect x="100" y="65" width="160" height="58" rx="12" fill="#163349"/><text x="180" y="105" font-size="35" fill="#f6f0df" text-anchor="middle" font-weight="500">APP</text><line x1="180" y1="130" x2="180" y2="155" stroke="#7ac9ec" stroke-width="3" /><line x1="90" y1="155" x2="270" y2="155" stroke="#7ac9ec" stroke-width="3" /><line x1="90" y1="155" x2="90" y2="179" stroke="#7ac9ec" stroke-width="3" /><line x1="270" y1="155" x2="270" y2="179" stroke="#7ac9ec" stroke-width="3" /><text x="90" y="216" font-size="27" fill="#f6f0df" text-anchor="middle" font-weight="500">Llegadas</text><text x="270" y="216" font-size="27" fill="#f6f0df" text-anchor="middle" font-weight="500">Salidas</text><text x="180" y="273" font-size="32" fill="#7ac9ec" text-anchor="middle" font-weight="500">TMA / CTR</text><text x="180" y="315" font-size="28" fill="#c4ceda" text-anchor="middle" font-weight="500">Ámbitos citados</text></g></svg>