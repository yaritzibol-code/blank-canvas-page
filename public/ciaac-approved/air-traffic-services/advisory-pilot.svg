<svg xmlns="http://www.w3.org/2000/svg" width="360" height="335" viewBox="0 0 360 335" role="img" aria-labelledby="st01-advisory-pilot-title st01-advisory-pilot-desc"><title id="st01-advisory-pilot-title">Piloto al mando · decisión y comunicación</title><desc id="st01-advisory-pilot-desc">El piloto evalúa y decide si acepta la sugerencia o adopta una alternativa; comunica su decisión sin demora. Se conservan aparte el plan de vuelo, sus cambios cuando sea factible y la escucha continua.</desc><rect width="360" height="335" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f6f0df"><text x="180" y="43" font-size="29" fill="#edc574" text-anchor="middle" font-weight="500">PILOTO AL MANDO</text><text x="180" y="97" font-size="32" fill="#f6f0df" text-anchor="middle" font-weight="500">Evalúa y decide</text><line x1="180" y1="119" x2="180" y2="158" stroke="#edc574" stroke-width="3" /><path d="M174.72631907535376 148.3465918192059 L180 158 L185.27368092464624 148.3465918192059" fill="none" stroke="#edc574" stroke-width="3"/><text x="180" y="195" font-size="29" fill="#9bd4b8" text-anchor="middle" font-weight="500">Comunica decisión</text><text x="180" y="239" font-size="31" fill="#9bd4b8" text-anchor="middle" font-weight="500">sin demora</text><line x1="180" y1="256" x2="180" y2="282" stroke="#edc574" stroke-width="3" /><path d="M174.72631907535376 272.3465918192059 L180 282 L185.27368092464624 272.3465918192059" fill="none" stroke="#edc574" stroke-width="3"/><text x="180" y="315" font-size="30" fill="#7ac9ec" text-anchor="middle" font-weight="500">ATS</text></g></svg>