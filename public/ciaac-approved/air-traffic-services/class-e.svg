<svg xmlns="http://www.w3.org/2000/svg" width="360" height="400" viewBox="0 0 360 400" role="img" aria-labelledby="st01-class-e-title st01-class-e-desc"><title id="st01-class-e-title">Clase E: prosa condicional y tabla histórica</title><desc id="st01-class-e-desc">MGTAM 2019 Clase E. Prosa: separación reglamentaria IFR del IFR; VFR del IFR en la medida de lo posible, siempre y cuando el VFR establezca comunicación con ATC. Tabla: separación IFR del IFR. El asterisco sencillo es una llamada visual a estas condiciones, distinta de las marcas ** originales de Clase D.</desc><rect width="360" height="400" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f6f0df"><text x="24" y="42" font-size="29" fill="#edc574" text-anchor="start" font-weight="500">E · MGTAM 2019</text><rect x="18" y="62" width="324" height="157" rx="12" fill="#163349"/><text x="180" y="99" font-size="30" fill="#edc574" text-anchor="middle" font-weight="500">PROSA</text><text x="180" y="145" font-size="32" fill="#7ac9ec" text-anchor="middle" font-weight="500">IFR / IFR</text><text x="180" y="188" font-size="32" fill="#9bd4b8" text-anchor="middle" font-weight="500">VFR / IFR *</text><rect x="18" y="236" width="324" height="104" rx="12" fill="#163349"/><text x="180" y="275" font-size="30" fill="#edc574" text-anchor="middle" font-weight="500">TABLA</text><text x="180" y="316" font-size="32" fill="#7ac9ec" text-anchor="middle" font-weight="500">IFR / IFR</text><text x="180" y="378" font-size="27" fill="#c4ceda" text-anchor="middle" font-weight="500">* Condiciones abajo</text></g></svg>