<svg xmlns="http://www.w3.org/2000/svg" width="360" height="320" viewBox="0 0 360 320" role="img" aria-labelledby="st01-alert-chain-title st01-alert-chain-desc"><title id="st01-alert-chain-title">Alerta · notificar y auxiliar</title><desc id="st01-alert-chain-desc">El servicio de alerta notifica a los organismos pertinentes, RCC, respecto a aeronaves que necesitan ayuda SAR y auxilia a dichos organismos. El ámbito obligatorio conserva las tres categorías de la fuente; las fases y sus disparadores corresponden a ST06.</desc><rect width="360" height="320" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f6f0df"><text x="180" y="43" font-size="28" fill="#edc574" text-anchor="middle" font-weight="500">SERVICIO DE ALERTA</text><rect x="30" y="68" width="300" height="57" rx="12" fill="#163349"/><text x="180" y="107" font-size="28" fill="#f6f0df" text-anchor="middle" font-weight="500">Aeronave necesita</text><text x="180" y="151" font-size="31" fill="#f6f0df" text-anchor="middle" font-weight="500">ayuda SAR</text><line x1="180" y1="166" x2="180" y2="213" stroke="#edc574" stroke-width="3" /><path d="M174.72631907535376 203.3465918192059 L180 213 L185.27368092464624 203.3465918192059" fill="none" stroke="#edc574" stroke-width="3"/><rect x="55" y="230" width="250" height="59" rx="12" fill="#163349"/><text x="180" y="270" font-size="32" fill="#7ac9ec" text-anchor="middle" font-weight="500">ATS → RCC</text></g></svg>