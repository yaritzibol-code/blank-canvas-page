<svg xmlns="http://www.w3.org/2000/svg" width="360" height="320" viewBox="0 0 360 320" role="img" aria-labelledby="st01-acc-title st01-acc-desc"><title id="st01-acc-title">ACC · ámbitos citados</title><desc id="st01-acc-desc">Ámbitos de servicio citados para ACC: control de área a vuelos controlados en CTA/UTA. El esquema relaciona el servicio con los ámbitos de la fuente; no representa trayectorias, límites ni competencia exclusiva.</desc><rect width="360" height="320" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f6f0df"><text x="180" y="42" font-size="29" fill="#edc574" text-anchor="middle" font-weight="500">CONTROL DE ÁREA</text><rect x="100" y="70" width="160" height="62" rx="12" fill="#163349"/><text x="180" y="112" font-size="35" fill="#f6f0df" text-anchor="middle" font-weight="500">ACC</text><line x1="180" y1="140" x2="180" y2="164" stroke="#7ac9ec" stroke-width="3" /><line x1="83" y1="164" x2="278" y2="164" stroke="#7ac9ec" stroke-width="3" /><line x1="83" y1="164" x2="83" y2="190" stroke="#7ac9ec" stroke-width="3" /><line x1="278" y1="164" x2="278" y2="190" stroke="#7ac9ec" stroke-width="3" /><rect x="30" y="199" width="112" height="65" rx="12" fill="#163349"/><rect x="220" y="199" width="112" height="65" rx="12" fill="#163349"/><text x="86" y="242" font-size="32" fill="#7ac9ec" text-anchor="middle" font-weight="500">CTA</text><text x="276" y="242" font-size="32" fill="#7ac9ec" text-anchor="middle" font-weight="500">UTA</text><text x="180" y="307" font-size="29" fill="#c4ceda" text-anchor="middle" font-weight="500">Ámbitos citados</text></g></svg>