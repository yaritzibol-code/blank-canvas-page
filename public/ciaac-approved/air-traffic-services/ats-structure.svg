<svg xmlns="http://www.w3.org/2000/svg" width="640" height="370" viewBox="0 0 640 370" role="img" aria-labelledby="st01-ats-structure-title st01-ats-structure-desc"><title id="st01-ats-structure-title">Tres servicios en §2.3, marco genérico ATS más amplio</title><desc id="st01-ats-structure-desc">El recuadro superior agrupa control, información de vuelo y alerta conforme a la división formal del Anexo 11 §2.3. El asesoramiento queda diferenciado como modalidad dentro del marco genérico ATS, aplicada a IFR participantes en Clase F.</desc><rect width="640" height="370" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f6f0df"><text x="320" y="40" font-size="32" fill="#edc574" text-anchor="middle" font-weight="700">ATS · marco genérico</text><rect x="20" y="61" width="600" height="177" rx="12" fill="#163349"/><text x="320" y="100" font-size="30" fill="#f6f0df" text-anchor="middle" font-weight="500">Anexo 11 · §2.3 · tres servicios</text><rect x="28" y="127" width="184" height="62" rx="12" fill="#234558"/><text x="120" y="168" font-size="29" fill="#f6f0df" text-anchor="middle" font-weight="600">CONTROL</text><rect x="228" y="127" width="184" height="62" rx="12" fill="#234558"/><text x="320" y="168" font-size="29" fill="#f6f0df" text-anchor="middle" font-weight="600">FIS</text><rect x="428" y="127" width="184" height="62" rx="12" fill="#234558"/><text x="520" y="168" font-size="29" fill="#f6f0df" text-anchor="middle" font-weight="600">ALERTA</text><rect x="20" y="258" width="600" height="90" rx="12" fill="#163349"/><text x="320" y="295" font-size="31" fill="#edc574" text-anchor="middle" font-weight="500">ASESORAMIENTO · Clase F</text><text x="320" y="331" font-size="28" fill="#c4ceda" text-anchor="middle" font-weight="500">Modalidad dentro del marco ATS</text></g></svg>