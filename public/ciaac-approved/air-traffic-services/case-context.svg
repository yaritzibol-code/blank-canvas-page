<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="st01-case-context-title st01-case-context-desc"><title id="st01-case-context-title">Caso de asesoramiento: escenario original</title><desc id="st01-case-context-desc">Caso académico, no instrucción operativa: XA-TYZ recibe una sugerencia de rumbo 040° y ascenso FL160 por tráfico IFR estimado en ocho minutos. El gráfico no prescribe una trayectoria, un margen de separación ni aceptación automática.</desc><rect width="640" height="340" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f6f0df"><text x="320" y="43" font-size="32" fill="#edc574" text-anchor="middle" font-weight="500">CASO ACADÉMICO · CLASE F</text><circle cx="112" cy="144" r="42" fill="#163349" stroke="#7ac9ec" stroke-width="2"/><text x="112" y="155" font-size="31" fill="#7ac9ec" text-anchor="middle" font-weight="600">IFR</text><circle cx="528" cy="144" r="42" fill="#163349" stroke="#7ac9ec" stroke-width="2"/><text x="528" y="155" font-size="31" fill="#7ac9ec" text-anchor="middle" font-weight="600">IFR</text><line x1="155" y1="144" x2="484" y2="144" stroke="#edc574" stroke-width="3" stroke-dasharray="10 7"/><text x="320" y="121" font-size="29" fill="#c4ceda" text-anchor="middle" font-weight="500">Tránsito estimado</text><text x="320" y="214" font-size="31" fill="#f6f0df" text-anchor="middle" font-weight="500">Mensaje ATS: «SUGIERO»</text><text x="320" y="266" font-size="31" fill="#7ac9ec" text-anchor="middle" font-weight="500">040° · FL160 · 8 minutos</text><text x="320" y="312" font-size="27" fill="#c4ceda" text-anchor="middle" font-weight="500">Datos del caso, sin trayectoria prescrita</text></g></svg>