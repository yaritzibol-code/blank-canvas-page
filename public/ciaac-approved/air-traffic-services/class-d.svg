<svg xmlns="http://www.w3.org/2000/svg" width="360" height="390" viewBox="0 0 360 390" role="img" aria-labelledby="st01-class-d-title st01-class-d-desc"><title id="st01-class-d-title">Clase D: prosa y tabla históricas diferenciadas</title><desc id="st01-class-d-desc">MGTAM 2019 Clase D: la prosa describe separación de aeródromo, visual y de pista, en el circuito y dentro de aeródromos controlados. La tabla enumera IFR del IFR y separación de aeródromo IFR/VFR en las inmediaciones; ** marca diferencias explícitas respecto al Apéndice 4 de Anexo 11. Los textos íntegros acompañan el diagrama.</desc><rect width="360" height="390" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f6f0df"><text x="24" y="42" font-size="29" fill="#edc574" text-anchor="start" font-weight="500">D · MGTAM 2019</text><rect x="18" y="62" width="324" height="142" rx="12" fill="#163349"/><text x="180" y="99" font-size="30" fill="#edc574" text-anchor="middle" font-weight="500">PROSA</text><text x="180" y="139" font-size="27" fill="#f6f0df" text-anchor="middle" font-weight="500">Circuito / aeródromo</text><text x="180" y="180" font-size="32" fill="#7ac9ec" text-anchor="middle" font-weight="500">IFR · VFR</text><rect x="18" y="219" width="324" height="151" rx="12" fill="#163349"/><text x="180" y="257" font-size="30" fill="#edc574" text-anchor="middle" font-weight="500">TABLA</text><text x="180" y="298" font-size="32" fill="#7ac9ec" text-anchor="middle" font-weight="500">IFR / IFR **</text><text x="180" y="343" font-size="32" fill="#7ac9ec" text-anchor="middle" font-weight="500">IFR / VFR **</text></g></svg>