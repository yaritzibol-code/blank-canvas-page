<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="st01-advisory-contrast-title st01-advisory-contrast-desc"><title id="st01-advisory-contrast-title">Asesoramiento · alcance y emisión</title><desc id="st01-advisory-contrast-desc">Asesoramiento: Clase F, vuelos IFR participantes; aconseja o sugiere maniobras para evitar conflictos IFR. No otorga autorizaciones.</desc><rect width="360" height="350" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f6f0df"><text x="180" y="42" font-size="29" fill="#edc574" text-anchor="middle" font-weight="500">ASESORAMIENTO</text><rect x="24" y="62" width="312" height="86" rx="12" fill="#163349"/><text x="180" y="98" font-size="31" fill="#f6f0df" text-anchor="middle" font-weight="500">Clase F</text><text x="180" y="133" font-size="29" fill="#7ac9ec" text-anchor="middle" font-weight="500">IFR participantes</text><line x1="180" y1="160" x2="180" y2="196" stroke="#edc574" stroke-width="3" /><path d="M174.72631907535376 186.3465918192059 L180 196 L185.27368092464624 186.3465918192059" fill="none" stroke="#edc574" stroke-width="3"/><text x="180" y="234" font-size="28" fill="#f6f0df" text-anchor="middle" font-weight="500">Sugiere / aconseja</text><text x="180" y="284" font-size="27" fill="#c4ceda" text-anchor="middle" font-weight="500">El servicio no otorga</text><text x="180" y="326" font-size="30" fill="#c4ceda" text-anchor="middle" font-weight="500">autorizaciones</text></g></svg>