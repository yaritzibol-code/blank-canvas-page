<svg xmlns="http://www.w3.org/2000/svg" width="360" height="320" viewBox="0 0 360 320" role="img" aria-labelledby="st01-fis-network-title st01-fis-network-desc"><title id="st01-fis-network-title">FIS · dependencias e información</title><desc id="st01-fis-network-desc">El FIS puede prestarse por OSIV, FIC y dependencias de control. El control tiene prioridad sobre FIS. Los textos distinguen asesoría y seguimiento OSIV, FIC en una FIR, AFIS en aeródromos no controlados y vigilancia ATS para FIS.</desc><rect width="360" height="320" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f6f0df"><text x="180" y="41" font-size="31" fill="#edc574" text-anchor="middle" font-weight="500">INFORMACIÓN</text><rect x="22" y="68" width="316" height="60" rx="12" fill="#163349"/><text x="180" y="109" font-size="31" fill="#f6f0df" text-anchor="middle" font-weight="500">OSIV · FIC · ATC</text><line x1="180" y1="140" x2="180" y2="175" stroke="#7ac9ec" stroke-width="3" /><path d="M174.72631907535376 165.3465918192059 L180 175 L185.27368092464624 165.3465918192059" fill="none" stroke="#7ac9ec" stroke-width="3"/><rect x="22" y="191" width="316" height="65" rx="12" fill="#163349"/><text x="180" y="234" font-size="27" fill="#f6f0df" text-anchor="middle" font-weight="500">Aeronaves conocidas</text><text x="180" y="300" font-size="29" fill="#c4ceda" text-anchor="middle" font-weight="500">Prioridad: control</text></g></svg>