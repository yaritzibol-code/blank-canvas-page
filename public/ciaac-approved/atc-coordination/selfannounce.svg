<svg xmlns="http://www.w3.org/2000/svg" width="360" height="330" viewBox="0 0 360 330" role="img" aria-labelledby="title desc"><title id="title">Prácticas didácticas sin torre</title><desc id="desc">Momentos didácticos de autoanuncio: antes del rodaje y entrada a pista, incorporación al circuito y pista desalojada. El gráfico no fija distancias, cadencias ni un procedimiento mexicano universal.</desc><rect width="360" height="330" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="22" y="37" font-size="25" fill="#e8be73" text-anchor="start" font-weight="500">AUTO-ANUNCIOS</text><rect x="18" y="61" width="324" height="44" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="180.0" y="91" font-size="26" fill="#82c7e5" text-anchor="middle" font-weight="600">Antes del rodaje</text><rect x="18" y="131" width="324" height="44" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="180.0" y="161" font-size="26" fill="#82c7e5" text-anchor="middle" font-weight="600">Ingreso al circuito</text><rect x="18" y="201" width="324" height="44" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="180.0" y="231" font-size="26" fill="#82c7e5" text-anchor="middle" font-weight="600">Pista desalojada</text><text x="22" y="290" font-size="24" fill="#c7d3de" text-anchor="start" font-weight="500">Prácticas didácticas</text><text x="22" y="319" font-size="24" fill="#91d4c6" text-anchor="start" font-weight="500">Vigilancia visual</text></g></svg>