<svg xmlns="http://www.w3.org/2000/svg" width="360" height="330" viewBox="0 0 360 330" role="img" aria-labelledby="title desc"><title id="title">Caso: ¿autorización de aterrizaje?</title><desc id="desc">AFIS no autoriza aterrizaje, despegue ni rodaje. En el caso ficticio, la selección de pista y decisión de aterrizar corresponden al piloto al mando.</desc><rect width="360" height="330" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><g transform="translate(68,74) scale(0.8)"><rect x="-31" y="-22" width="62" height="50" rx="7" fill="#284658" stroke="#e8be73" stroke-width="2"/><line x1="16" y1="-22" x2="29" y2="-54" stroke="#e8be73" stroke-width="4" /><rect x="-23" y="-14" width="34" height="10" rx="2" fill="#081b31" /><line x1="-20" y1="7" x2="18" y2="7" stroke="#c7d3de" stroke-width="3" /><line x1="-20" y1="17" x2="18" y2="17" stroke="#c7d3de" stroke-width="3" /></g><line x1="115" y1="74" x2="254" y2="74" stroke="#82c7e5" stroke-width="3" /><path d="M245.22417438109628 69.20574461395798 L254 74 L245.22417438109628 78.79425538604202" fill="none" stroke="#82c7e5" stroke-width="3"/><path d="M-38 8 L32 8 Q48 5 35 0 L9 -2 L-11 -22 L-19 -22 L-11 -1 L-27 -1 L-36 -10 L-42 -10 Z" transform="translate(294,82) scale(0.65)" fill="#f8f1df"/><text x="22" y="151" font-size="28" fill="#82c7e5" text-anchor="start" font-weight="500">AFIS informa</text><text x="22" y="196" font-size="27" fill="#e8be73" text-anchor="start" font-weight="500">Piloto al mando</text><text x="22" y="236" font-size="28" fill="#e8be73" text-anchor="start" font-weight="500">decide</text><line x1="22" y1="261" x2="338" y2="261" stroke="#e8be73" stroke-width="3" /><text x="22" y="302" font-size="23" fill="#f8f1df" text-anchor="start" font-weight="500">No autoriza aterrizaje</text></g></svg>