<svg xmlns="http://www.w3.org/2000/svg" width="600" height="385" viewBox="0 0 600 385" role="img" aria-labelledby="title desc"><title id="title">Colación: confirmar y comprobar</title><desc id="desc">La tripulación colaciona elementos de seguridad: ruta, instrucciones de pista y datos de vuelo. ATC escucha, comprueba y corrige discrepancias.</desc><rect width="600" height="385" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><rect x="27" y="40" width="190" height="44" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="122.0" y="70" font-size="26" fill="#82c7e5" text-anchor="middle" font-weight="600">ATC</text><rect x="383" y="40" width="190" height="44" rx="12" fill="#173149" stroke="#91d4c6" stroke-width="2"/><text x="478.0" y="70" font-size="26" fill="#91d4c6" text-anchor="middle" font-weight="600">Tripulación</text><line x1="223" y1="53" x2="376" y2="53" stroke="#e8be73" stroke-width="3" /><path d="M367.22417438109625 48.20574461395797 L376 53 L367.22417438109625 57.79425538604203" fill="none" stroke="#e8be73" stroke-width="3"/><text x="300" y="30" font-size="23" fill="#e8be73" text-anchor="middle" font-weight="500">Instrucción</text><line x1="483" y1="119" x2="113" y2="119" stroke="#91d4c6" stroke-width="3" /><path d="M121.77582561890372 123.79425538604202 L113 119 L121.77582561890372 114.20574461395798" fill="none" stroke="#91d4c6" stroke-width="3"/><text x="300" y="149" font-size="25" fill="#91d4c6" text-anchor="middle" font-weight="500">Colación</text><line x1="113" y1="90" x2="113" y2="120" stroke="#82c7e5" stroke-width="3" /><line x1="483" y1="90" x2="483" y2="120" stroke="#91d4c6" stroke-width="3" /><rect x="25" y="196" width="168" height="89" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><rect x="215" y="196" width="170" height="89" rx="12" fill="#173149" stroke="#e8be73" stroke-width="2"/><rect x="407" y="196" width="168" height="89" rx="12" fill="#173149" stroke="#91d4c6" stroke-width="2"/><text x="109" y="233" font-size="27" fill="#82c7e5" text-anchor="middle" font-weight="500">Ruta</text><text x="109" y="270" font-size="25" fill="#82c7e5" text-anchor="middle" font-weight="500">ATC</text><text x="300" y="250" font-size="29" fill="#e8be73" text-anchor="middle" font-weight="500">Pista</text><text x="491" y="232" font-size="25" fill="#91d4c6" text-anchor="middle" font-weight="500">Datos de</text><text x="491" y="269" font-size="27" fill="#91d4c6" text-anchor="middle" font-weight="500">vuelo</text><text x="300" y="345" font-size="25" fill="#f8f1df" text-anchor="middle" font-weight="500">ATC comprueba y corrige discrepancias</text></g></svg>