<svg xmlns="http://www.w3.org/2000/svg" width="360" height="330" viewBox="0 0 360 330" role="img" aria-labelledby="title desc"><title id="title">MANTENGA ESCUCHA</title><desc id="desc">El piloto sintoniza y escucha sin llamada inicial, hasta que la estación llame o los reportes obligatorios o la situación operacional exijan transmitir.</desc><rect width="360" height="330" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><path d="M-38 8 L32 8 Q48 5 35 0 L9 -2 L-11 -22 L-19 -22 L-11 -1 L-27 -1 L-36 -10 L-42 -10 Z" transform="translate(80,105) scale(0.9)" fill="#f8f1df"/><g transform="translate(281,110) scale(0.95)"><rect x="-31" y="-22" width="62" height="50" rx="7" fill="#284658" stroke="#e8be73" stroke-width="2"/><line x1="16" y1="-22" x2="29" y2="-54" stroke="#e8be73" stroke-width="4" /><rect x="-23" y="-14" width="34" height="10" rx="2" fill="#081b31" /><line x1="-20" y1="7" x2="18" y2="7" stroke="#c7d3de" stroke-width="3" /><line x1="-20" y1="17" x2="18" y2="17" stroke="#c7d3de" stroke-width="3" /></g><text x="29" y="163" font-size="25" fill="#f8f1df" text-anchor="start" font-weight="500">Piloto</text><text x="230" y="163" font-size="24" fill="#f8f1df" text-anchor="start" font-weight="500">Estación</text><line x1="235" y1="94" x2="127" y2="94" stroke="#82c7e5" stroke-width="4" /><path d="M135.77582561890372 98.79425538604202 L127 94 L135.77582561890372 89.20574461395798" fill="none" stroke="#82c7e5" stroke-width="4"/><text x="20" y="218" font-size="25" fill="#e8be73" text-anchor="start" font-weight="500">Sintoniza y escucha</text><text x="20" y="262" font-size="25" fill="#f8f1df" text-anchor="start" font-weight="500">Sin llamada inicial</text><text x="20" y="306" font-size="24" fill="#c7d3de" text-anchor="start" font-weight="500">Con excepciones*</text></g></svg>