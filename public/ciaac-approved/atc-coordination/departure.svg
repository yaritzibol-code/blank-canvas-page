<svg xmlns="http://www.w3.org/2000/svg" width="360" height="330" viewBox="0 0 360 330" role="img" aria-labelledby="title desc"><title id="title">Salida: secuencia orientativa</title><desc id="desc">Delivery, Ground, TWR, APP y ACC son una secuencia típica de comunicaciones; no es universal. Puestos y transferencias dependen de la organización y acuerdos locales.</desc><rect width="360" height="330" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="22" y="37" font-size="25" fill="#e8be73" text-anchor="start" font-weight="500">SALIDA TÍPICA</text><rect x="98" y="52" width="168" height="44" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="182.0" y="82" font-size="26" fill="#82c7e5" text-anchor="middle" font-weight="600">Delivery</text><line x1="182" y1="96" x2="182" y2="100" stroke="#82c7e5" stroke-width="2" /><path d="M186.79425538604204 91.22417438109628 L182 100 L177.20574461395796 91.22417438109628" fill="none" stroke="#82c7e5" stroke-width="2"/><rect x="98" y="100" width="168" height="44" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="182.0" y="130" font-size="26" fill="#82c7e5" text-anchor="middle" font-weight="600">GND</text><line x1="182" y1="144" x2="182" y2="148" stroke="#82c7e5" stroke-width="2" /><path d="M186.79425538604204 139.22417438109628 L182 148 L177.20574461395796 139.22417438109628" fill="none" stroke="#82c7e5" stroke-width="2"/><rect x="98" y="148" width="168" height="44" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="182.0" y="178" font-size="26" fill="#82c7e5" text-anchor="middle" font-weight="600">TWR</text><line x1="182" y1="192" x2="182" y2="196" stroke="#82c7e5" stroke-width="2" /><path d="M186.79425538604204 187.22417438109628 L182 196 L177.20574461395796 187.22417438109628" fill="none" stroke="#82c7e5" stroke-width="2"/><rect x="98" y="196" width="168" height="44" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="182.0" y="226"