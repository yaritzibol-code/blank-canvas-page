<svg xmlns="http://www.w3.org/2000/svg" width="360" height="330" viewBox="0 0 360 330" role="img" aria-labelledby="title desc"><title id="title">Escenario ficticio: llegada a AFIS</title><desc id="desc">Bimotor IFR en VMC a 10 NM de un aeródromo no controlado. Frecuencia A es un marcador según PIA efectiva; 10 NM es un dato del caso, no un umbral de autoanuncio.</desc><rect width="360" height="330" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><text x="22" y="37" font-size="27" fill="#e8be73" text-anchor="start" font-weight="500">CASO FICTICIO</text><path d="M-38 8 L32 8 Q48 5 35 0 L9 -2 L-11 -22 L-19 -22 L-11 -1 L-27 -1 L-36 -10 L-42 -10 Z" transform="translate(65,92) scale(0.7)" fill="#f8f1df"/><line x1="220" y1="91" x2="110" y2="91" stroke="#82c7e5" stroke-width="3" /><path d="M118.77582561890372 95.79425538604202 L110 91 L118.77582561890372 86.20574461395798" fill="none" stroke="#82c7e5" stroke-width="3"/><g transform="translate(274,93) scale(0.7)"><rect x="-31" y="-22" width="62" height="50" rx="7" fill="#284658" stroke="#e8be73" stroke-width="2"/><line x1="16" y1="-22" x2="29" y2="-54" stroke="#e8be73" stroke-width="4" /><rect x="-23" y="-14" width="34" height="10" rx="2" fill="#081b31" /><line x1="-20" y1="7" x2="18" y2="7" stroke="#c7d3de" stroke-width="3" /><line x1="-20" y1="17" x2="18" y2="17" stroke="#c7d3de" stroke-width="3" /></g><text x="24" y="153" font-size="29" fill="#f8f1df" text-anchor="start" font-weight="500">10 NM · VMC</text><text x="24" y="196" font-size="24" fill="#c7d3de" text-anchor="start" font-weight="500">Dato del escenario</text><text x="24" y="238" font-size="28" fill="#82c7e5" text-anchor="start" font-weight="500">Frecuencia A</text><text x="24" y="278" font-size="23" fill="#f8f1df" text-anchor="start" font-weight="500">AFIS · pista sugerida 09</text><text x="24" y="313" font-size="22" fill="#c7d3de" text-anchor="start" font-weight="500">No es carta operacional</text></g></svg>