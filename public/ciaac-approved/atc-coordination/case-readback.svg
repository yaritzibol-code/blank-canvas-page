<svg xmlns="http://www.w3.org/2000/svg" width="360" height="330" viewBox="0 0 360 330" role="img" aria-labelledby="title desc"><title id="title">Caso: elementos de colación</title><desc id="desc">Se mantienen los elementos completos de la solución: ruta ATC, instrucciones de pista y datos de vuelo; el detalle íntegro aparece bajo la pregunta.</desc><rect width="360" height="330" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><rect x="20" y="31" width="320" height="44" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><text x="180.0" y="61" font-size="26" fill="#82c7e5" text-anchor="middle" font-weight="600">Ruta ATC</text><rect x="20" y="105" width="320" height="44" rx="12" fill="#173149" stroke="#e8be73" stroke-width="2"/><text x="180.0" y="135" font-size="24" fill="#e8be73" text-anchor="middle" font-weight="600">Instrucciones de pista</text><rect x="20" y="179" width="320" height="44" rx="12" fill="#173149" stroke="#91d4c6" stroke-width="2"/><text x="180.0" y="209" font-size="26" fill="#91d4c6" text-anchor="middle" font-weight="600">Datos de vuelo</text><text x="23" y="274" font-size="23" fill="#f8f1df" text-anchor="start" font-weight="500">Elementos de seguridad</text><text x="23" y="314" font-size="25" fill="#e8be73" text-anchor="start" font-weight="500">Colación obligatoria</text></g></svg>