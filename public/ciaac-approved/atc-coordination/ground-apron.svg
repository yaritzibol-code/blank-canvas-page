<svg xmlns="http://www.w3.org/2000/svg" width="360" height="330" viewBox="0 0 360 330" role="img" aria-labelledby="title desc"><title id="title">Rodaje y plataforma</title><desc id="desc">Ground y gestión de plataforma se distinguen. Se muestran dos funciones sin inventar un límite aeroportuario; la organización real es local.</desc><rect width="360" height="330" rx="18" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#f8f1df"><rect x="20" y="40" width="320" height="103" rx="12" fill="#173149" stroke="#82c7e5" stroke-width="2"/><line x1="45" y1="99" x2="315" y2="99" stroke="#82c7e5" stroke-width="12" /><path d="M-38 8 L32 8 Q48 5 35 0 L9 -2 L-11 -22 L-19 -22 L-11 -1 L-27 -1 L-36 -10 L-42 -10 Z" transform="translate(145,91) scale(0.7)" fill="#f8f1df"/><text x="31" y="75" font-size="25" fill="#82c7e5" text-anchor="start" font-weight="500">GND · RODAJE</text><rect x="20" y="166" width="320" height="103" rx="12" fill="#173149" stroke="#e8be73" stroke-width="2"/><rect x="232" y="193" width="81" height="50" rx="12" fill="#35506a" /><path d="M-38 8 L32 8 Q48 5 35 0 L9 -2 L-11 -22 L-19 -22 L-11 -1 L-27 -1 L-36 -10 L-42 -10 Z" transform="translate(80,220) scale(0.7)" fill="#f8f1df"/><text x="31" y="198" font-size="25" fill="#e8be73" text-anchor="start" font-weight="500">Plataforma</text><text x="31" y="246" font-size="24" fill="#e8be73" text-anchor="start" font-weight="500">Gestión local</text><text x="20" y="310" font-size="25" fill="#f8f1df" text-anchor="start" font-weight="500">Funciones distintas</text></g></svg>