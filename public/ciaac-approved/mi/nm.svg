<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img"><title>NM → km</title><rect width="480" height="300" rx="18" fill="#081b31"/><g font-family="DejaVu Sans,sans-serif"><text x="28" y="50" fill="#72c6ff" font-size="31" text-anchor="start">NM → km</text><text x="28" y="112" fill="#edf5ff" font-size="27" text-anchor="start">1 NM = 1.852 km</text><text x="28" y="177" fill="#edf5ff" font-size="27" text-anchor="start">50 NM × 1.852</text><text x="28" y="242" fill="#76dfc3" font-size="27" text-anchor="start">92.6 km</text></g></svg>