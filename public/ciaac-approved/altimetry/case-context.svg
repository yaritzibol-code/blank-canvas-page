<svg xmlns="http://www.w3.org/2000/svg" width="600" height="285" viewBox="0 0 600 285" role="img" aria-labelledby="title desc"><title id="title">Escenario ficticio: Alfa a Bravo</title><desc id="desc">Ruta didáctica del caso: plataforma de Alfa, crucero FL220 y descenso a Bravo. No es una ruta real ni un procedimiento publicado.</desc><rect width="600" height="285" rx="16" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#edf5ff"><text x="24" y="43" font-size="29" fill="#f1c772" text-anchor="start" font-weight="500">ESCENARIO FICTICIO</text><line x1="45" y1="189" x2="260" y2="96" stroke="#72c6ff" stroke-width="4" /><line x1="260" y1="96" x2="552" y2="189" stroke="#72c6ff" stroke-width="4" /><path d="M243 94 L311 94 Q325 91 314 86 L287 84 L267 64 L259 64 L267 85 L251 85 L242 76 L236 76 Z" fill="#edf5ff"/><text x="250" y="147" font-size="31" fill="#72c6ff" text-anchor="start" font-weight="500">FL220</text><text x="25" y="219" font-size="31" fill="#76dfc3" text-anchor="start" font-weight="500">ALFA</text><text x="25" y="259" font-size="26" fill="#76dfc3" text-anchor="start" font-weight="500">7,340 ft MSL</text><text x="417" y="219" font-size="31" fill="#76dfc3" text-anchor="start" font-weight="500">BRAVO</text><text x="401" y="259" font-size="26" fill="#76dfc3" text-anchor="start" font-weight="500">QNH 29.82</text></g></svg>