<svg xmlns="http://www.w3.org/2000/svg" width="360" height="320" viewBox="0 0 360 320" role="img" aria-labelledby="title desc"><title id="title">Altitud presión</title><desc id="desc">Presión atmosférica expresada como altitud ISA con reglaje estándar.</desc><rect width="360" height="320" rx="16" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#edf5ff"><text x="28" y="48" font-size="29" fill="#72c6ff" text-anchor="start" font-weight="500">PRESIÓN</text><text x="28" y="94" font-size="29" fill="#edf5ff" text-anchor="start" font-weight="500">atmosférica</text><line x1="180" y1="116" x2="180" y2="155" stroke="#f1c772" stroke-width="4" /><text x="28" y="194" font-size="31" fill="#f1c772" text-anchor="start" font-weight="500">Modelo ISA</text><text x="28" y="245" font-size="30" fill="#edf5ff" text-anchor="start" font-weight="500">1013.25 hPa</text><text x="28" y="290" font-size="30" fill="#edf5ff" text-anchor="start" font-weight="500">29.92 inHg</text></g></svg>