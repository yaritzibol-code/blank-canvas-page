<svg xmlns="http://www.w3.org/2000/svg" width="360" height="320" viewBox="0 0 360 320" role="img" aria-labelledby="title desc"><title id="title">Altitud densidad</title><desc id="desc">Altitud presión corregida por la desviación de temperatura respecto de ISA.</desc><rect width="360" height="320" rx="16" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#edf5ff"><text x="28" y="60" font-size="29" fill="#72c6ff" text-anchor="start" font-weight="500">Altitud presión</text><text x="180" y="115" font-size="40" fill="#f1c772" text-anchor="middle" font-weight="500">↓</text><text x="28" y="165" font-size="28" fill="#edf5ff" text-anchor="start" font-weight="500">Corrección por</text><text x="28" y="205" font-size="30" fill="#edf5ff" text-anchor="start" font-weight="500">temperatura</text><line x1="30" y1="236" x2="330" y2="236" stroke="#f1c772" stroke-width="3" /><text x="28" y="284" font-size="28" fill="#76dfc3" text-anchor="start" font-weight="500">Altitud densidad</text></g></svg>