<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="title desc"><title id="title">Cómo se forma la lectura</title><desc id="desc">La presión estática medida y el reglaje de referencia se relacionan mediante la calibración ISA del altímetro aneroide.</desc><rect width="600" height="300" rx="16" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#edf5ff"><text x="30" y="58" font-size="31" fill="#72c6ff" text-anchor="start" font-weight="500">Presión estática medida</text><text x="30" y="110" font-size="31" fill="#76dfc3" text-anchor="start" font-weight="500">Reglaje en subescala</text><line x1="410" y1="64" x2="535" y2="64" stroke="#f1c772" stroke-width="3" /><line x1="410" y1="102" x2="535" y2="102" stroke="#f1c772" stroke-width="3" /><line x1="535" y1="64" x2="535" y2="166" stroke="#f1c772" stroke-width="3" /><text x="30" y="207" font-size="34" fill="#f1c772" text-anchor="start" font-weight="500">Calibración ISA</text><text x="30" y="261" font-size="34" fill="#edf5ff" text-anchor="start" font-weight="500">Lectura del altímetro</text></g></svg>