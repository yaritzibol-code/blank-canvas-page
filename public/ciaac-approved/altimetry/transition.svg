<svg xmlns="http://www.w3.org/2000/svg" width="600" height="405" viewBox="0 0 600 405" role="img" aria-labelledby="title desc"><title id="title">Estructura de transición</title><desc id="desc">TL por encima de TA; capa de transición entre ambos. Niveles de vuelo arriba y altitudes abajo. Sin valores universales.</desc><rect width="600" height="405" rx="16" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#edf5ff"><text x="28" y="55" font-size="33" fill="#72c6ff" text-anchor="start" font-weight="500">NIVELES DE VUELO</text><line x1="25" y1="108" x2="575" y2="108" stroke="#72c6ff" stroke-width="4" /><text x="150" y="98" font-size="29" fill="#72c6ff" text-anchor="start" font-weight="500">Nivel de transición (TL)</text><rect x="25" y="111" width="550" height="140" fill="#233b50"/><text x="300" y="180" font-size="32" fill="#f1c772" text-anchor="middle" font-weight="500">Capa de transición</text><line x1="25" y1="255" x2="575" y2="255" stroke="#76dfc3" stroke-width="4" /><text x="150" y="294" font-size="29" fill="#76dfc3" text-anchor="start" font-weight="500">Altitud de transición (TA)</text><text x="28" y="365" font-size="33" fill="#76dfc3" text-anchor="start" font-weight="500">ALTITUDES</text></g></svg>