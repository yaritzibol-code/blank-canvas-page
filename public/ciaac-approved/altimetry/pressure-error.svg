<svg xmlns="http://www.w3.org/2000/svg" width="360" height="320" viewBox="0 0 360 320" role="img" aria-labelledby="title desc"><title id="title">Error de presión</title><desc id="desc">QNH sin reajustar; de alta a baja presión, mantener la misma indicación lleva a menor altitud real.</desc><rect width="360" height="320" rx="16" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#edf5ff"><text x="18" y="44" font-size="27" fill="#72c6ff" text-anchor="start" font-weight="500">Alta presión</text><text x="18" y="88" font-size="27" fill="#f1c772" text-anchor="start" font-weight="500">→ Baja presión</text><line x1="20" y1="130" x2="335" y2="130" stroke="#72c6ff" stroke-width="3" stroke-dasharray="7 5"/><text x="20" y="118" font-size="23" fill="#72c6ff" text-anchor="start" font-weight="500">Indicación mantenida</text><line x1="34" y1="155" x2="310" y2="245" stroke="#ffae9b" stroke-width="4" /><path d="M247 237 L315 237 Q329 234 318 229 L291 227 L271 207 L263 207 L271 228 L255 228 L246 219 L240 219 Z" fill="#edf5ff"/><text x="20" y="291" font-size="26" fill="#ffae9b" text-anchor="start" font-weight="500">Altitud real menor</text></g></svg>