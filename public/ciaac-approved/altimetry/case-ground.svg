<svg xmlns="http://www.w3.org/2000/svg" width="360" height="320" viewBox="0 0 360 320" role="img" aria-labelledby="title desc"><title id="title">Alfa: lectura en plataforma</title><desc id="desc">Caso ficticio: elevación 7,340 ft MSL, QNH 30.12 y QNE 29.92 inHg. Diferencia de menos 0.20 inHg, aproximación menos 200 ft; resultado 7,140 ft de altitud presión.</desc><rect width="360" height="320" rx="16" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#edf5ff"><text x="22" y="48" font-size="27" fill="#f1c772" text-anchor="start" font-weight="500">ALFA · FICTICIO</text><text x="22" y="100" font-size="30" fill="#edf5ff" text-anchor="start" font-weight="500">7,340 ft MSL</text><text x="22" y="151" font-size="29" fill="#72c6ff" text-anchor="start" font-weight="500">30.12 → 29.92</text><text x="22" y="197" font-size="30" fill="#72c6ff" text-anchor="start" font-weight="500">−0.20 inHg</text><text x="22" y="242" font-size="30" fill="#f1c772" text-anchor="start" font-weight="500">≈ −200 ft</text><text x="22" y="294" font-size="32" fill="#76dfc3" text-anchor="start" font-weight="500">≈ 7,140 ft</text></g></svg>