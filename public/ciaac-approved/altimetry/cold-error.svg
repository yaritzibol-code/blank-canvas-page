<svg xmlns="http://www.w3.org/2000/svg" width="360" height="320" viewBox="0 0 360 320" role="img" aria-labelledby="title desc"><title id="title">Error por aire frío</title><desc id="desc">A igual indicación barométrica, la columna de aire frío tiene menor altura real. Referencia común; esquema conceptual, no tabla de corrección.</desc><rect width="360" height="320" rx="16" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#edf5ff"><text x="18" y="40" font-size="29" fill="#72c6ff" text-anchor="start" font-weight="500">Misma indicación</text><text x="38" y="84" font-size="28" fill="#72c6ff" text-anchor="start" font-weight="500">ISA</text><text x="215" y="84" font-size="28" fill="#f1c772" text-anchor="start" font-weight="500">Frío</text><rect x="25" y="122" width="135" height="148" fill="#28465b"/><rect x="200" y="196" width="135" height="74" fill="#29566b"/><line x1="25" y1="122" x2="160" y2="122" stroke="#72c6ff" stroke-width="3" stroke-dasharray="6 4"/><line x1="200" y1="196" x2="335" y2="196" stroke="#72c6ff" stroke-width="3" stroke-dasharray="6 4"/><path d="M63 121 L131 121 Q145 118 134 113 L107 111 L87 91 L79 91 L87 112 L71 112 L62 103 L56 103 Z" fill="#edf5ff"/><path d="M234 195 L302 195 Q316 192 305 187 L278 185 L258 165 L250 165 L258 186 L242 186 L233 177 L227 177 Z" fill="#edf5ff"/><line x1="25" y1="270" x2="335" y2="270" stroke="#76dfc3" stroke-width="3" /><text x="20" y="312" font-size="27" fill="#76dfc3" text-anchor="start" font-weight="500">Referencia común</text></g></svg>