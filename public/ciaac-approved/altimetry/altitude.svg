<svg xmlns="http://www.w3.org/2000/svg" width="360" height="320" viewBox="0 0 360 320" role="img" aria-labelledby="title desc"><title id="title">Altitud</title><desc id="desc">Altitud: distancia vertical con la referencia rotulada. Esquema sin escala; el terreno cambia y la referencia especificada permanece fija.</desc><rect width="360" height="320" rx="16" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#edf5ff"><path d="M20 235 L80 202 L170 215 L230 185 L300 224 L340 213 L340 278 L20 278Z" fill="#28455a"/><line x1="20" y1="285" x2="340" y2="285" stroke="#72c6ff" stroke-width="3" /><text x="28" y="313" font-size="26" fill="#72c6ff" text-anchor="start" font-weight="500">MSL</text><path d="M235 111 L303 111 Q317 108 306 103 L279 101 L259 81 L251 81 L259 102 L243 102 L234 93 L228 93 Z" fill="#edf5ff"/><line x1="24" y1="112" x2="330" y2="112" stroke="#cad9ea" stroke-width="1" stroke-dasharray="5 5"/><line x1="72" y1="105" x2="72" y2="285" stroke="#f1c772" stroke-width="4" /><path d="M65,115 L72,105 L79,115 M65,275 L72,285 L79,275" fill="none" stroke="#f1c772" stroke-width="3"/><text x="112" y="163" font-size="32" fill="#f1c772" text-anchor="start" font-weight="500">Altitud</text></g></svg>