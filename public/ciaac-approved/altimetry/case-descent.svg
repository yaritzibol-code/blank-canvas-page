<svg xmlns="http://www.w3.org/2000/svg" width="360" height="320" viewBox="0 0 360 320" role="img" aria-labelledby="title desc"><title id="title">Descenso del caso</title><desc id="desc">Simulación académica: con QNE 29.92 se desciende por el TL histórico FL195; se cambia a QNH Bravo 29.82 para expresar altitudes.</desc><rect width="360" height="320" rx="16" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#edf5ff"><text x="24" y="46" font-size="25" fill="#f1c772" text-anchor="start" font-weight="500">CASO · DESCENSO</text><text x="24" y="94" font-size="29" fill="#72c6ff" text-anchor="start" font-weight="500">QNE 29.92</text><text x="24" y="143" font-size="27" fill="#f1c772" text-anchor="start" font-weight="500">↓ TL histórico</text><text x="24" y="189" font-size="33" fill="#f1c772" text-anchor="start" font-weight="500">FL195</text><line x1="24" y1="209" x2="336" y2="209" stroke="#76dfc3" stroke-width="3" /><text x="24" y="253" font-size="29" fill="#76dfc3" text-anchor="start" font-weight="500">QNH 29.82</text><text x="24" y="297" font-size="28" fill="#76dfc3" text-anchor="start" font-weight="500">BRAVO</text></g></svg>