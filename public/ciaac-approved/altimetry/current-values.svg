<svg xmlns="http://www.w3.org/2000/svg" width="360" height="320" viewBox="0 0 360 320" role="img" aria-labelledby="title desc"><title id="title">Verificación operacional pendiente</title><desc id="desc">Para la operación actual se requiere comprobar TA y TL aplicables en PIA/AIP ENR 1.7 y cartas vigentes. Este candidato no certifica esos valores.</desc><rect width="360" height="320" rx="16" fill="#081b31"/><g font-family="DejaVu Sans, sans-serif" fill="#edf5ff"><text x="24" y="51" font-size="30" fill="#f1c772" text-anchor="start" font-weight="500">VERIFICAR</text><text x="24" y="103" font-size="28" fill="#edf5ff" text-anchor="start" font-weight="500">TA y TL aplicables</text><line x1="24" y1="129" x2="336" y2="129" stroke="#cad9ea" stroke-width="3" /><text x="24" y="178" font-size="31" fill="#72c6ff" text-anchor="start" font-weight="500">PIA / AIP</text><text x="24" y="225" font-size="31" fill="#72c6ff" text-anchor="start" font-weight="500">ENR 1.7</text><text x="24" y="279" font-size="28" fill="#76dfc3" text-anchor="start" font-weight="500">Cartas vigentes</text></g></svg>