0" y1="130" x2="720" y2="642" stroke="#102238" stroke-width="1" stroke-linecap="round"/><line x1="768" y1="130" x2="768" y2="642" stroke="#102238" stroke-width="1" stroke-linecap="round"/><line x1="816" y1="130" x2="816" y2="642" stroke="#102238" stroke-width="1" stroke-linecap="round"/><line x1="864" y1="130" x2="864" y2="642" stroke="#102238" stroke-width="1" stroke-linecap="round"/><line x1="912" y1="130" x2="912" y2="642" stroke="#102238" stroke-width="1" stroke-linecap="round"/><line x1="960" y1="130" x2="960" y2="642" stroke="#102238" stroke-width="1" stroke-linecap="round"/><line x1="1008" y1="130" x2="1008" y2="642" stroke="#102238" stroke-width="1" stroke-linecap="round"/><line x1="1056" y1="130" x2="1056" y2="642" stroke="#102238" stroke-width="1" stroke-linecap="round"/><line x1="1104" y1="130" x2="1104" y2="642" stroke="#102238" stroke-width="1" stroke-linecap="round"/><line x1="1152" y1="130" x2="1152" y2="642" stroke="#102238" stroke-width="1" stroke-linecap="round"/><line x1="36" y1="150" x2="1164" y2="150" stroke="#102238" stroke-width="1" stroke-linecap="round"/><line x1="36" y1="198" x2="1164" y2="198" stroke="#102238" stroke-width="1" stroke-linecap="round"/><line x1="36" y1="246" x2="1164" y2="246" stroke="#102238" stroke-width="1" stroke-linecap="round"/><line x1="36" y1="294" x2="1164" y2="294" stroke="#102238" stroke-width="1" stroke-linecap="round"/><line x1="36" y1="342" x2="1164" y2="342" stroke="#102238" stroke-width="1" stroke-linecap="round"/><line x1="36" y1="390" x2="1164" y2="390" stroke="#102238" stroke-width="1" stroke-linecap="round"/><line x1="36" y1="438" x2="1164" y2="438" stroke="#102238" stroke-width="1" stroke-linecap="round"/><line x1="36" y1="486" x2="1164" y2="486" stroke="#102238" stroke-width="1" stroke-linecap="round"/><line x1="36" y1="534" x2="1164" y2="534" stroke="#102238" stroke-width="1" stroke-linecap="round"/><line x1="36" y1="582" x2="1164" y2="582" stroke="#102238" stroke-width="1" stroke-linecap="round"/><line x1="36" y1="630" x2="1164" y2="630" stroke="#102238" stroke-width="1" stroke-linecap="round"/><text x="44" y="42" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#69d4ee" text-anchor="start">OP03 · VMC / IMC · VFR / IFR</text><text x="44" y="91" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#edf5fa" text-anchor="start">El tiempo meteorológico y las reglas son ejes distintos</text><line x1="44" y1="119" x2="1156" y2="119" stroke="#38546a" stroke-width="1" stroke-linecap="round"/><line x1="44" y1="665" x2="1156" y2="665" stroke="#38546a" stroke-width="1" stroke-linecap="round"/><text x="44" y="693" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#a9c0d1" text-anchor="start">Fuente: matriz OP03 §2. En ruta, consultar mínimos por clase de espacio aéreo en MI06.</text><text x="460" y="172" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" fill="#69d4ee" text-anchor="middle">VMC</text><text x="900" y="172" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" fill="#baa8ee" text-anchor="middle">IMC</text><text x="136" y="302" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" fill="#79e0bd" text-anchor="middle">VFR</text><text x="136" y="492" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="700" fill="#f5c978" text-anchor="middle">IFR</text><rect x="240" y="205" width="430" height="178" rx="12" fill="#123b43"/><rect x="682" y="205" width="430" height="178" rx="12" fill="#402e38"/><rect x="240" y="395" width="430" height="178" rx="12" fill="#17344a"/><rect x="682" y="395" width="430" height="178" rx="12" fill="#282e4b"/><text x="268" y="249.0" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#edf5fa" text-anchor="start">Según mínimos y clase de</text><text x="268" y="281.2" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#edf5fa" text-anchor="start">espacio aéreo.</text><text x="268" y="313.4" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#edf5fa" text-anchor="start">Aeródromo civil: techo 1,500 ft</text><text x="268" y="345.6" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#edf5fa" text-anchor="start">y visibilidad 3 SM (≈5 km).</text><text x="710" y="249.0" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#edf5fa" text-anchor="start">VFR ordinario no procede por</text><text x="710" y="281.2" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#edf5fa" text-anchor="start">debajo de sus mínimos.</text><text x="710" y="313.4" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#edf5fa" text-anchor="start">VFR especial: condiciones y</text><text x="710" y="345.6" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#edf5fa" text-anchor="start">autorización propias.</text><text x="268" y="441.0" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#edf5fa" text-anchor="start">Permitido bajo plan IFR.</text><text x="268" y="473.2" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#edf5fa" text-anchor="start">Las referencias visuales</text><text x="268" y="505.4" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#edf5fa" text-anchor="start">externas pueden ser</text><text x="268" y="537.6" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#edf5fa" text-anchor="start">parte del vuelo.</text><text x="710" y="441.0" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#edf5fa" text-anchor="start">Procedimientos IFR,</text><text x="710" y="473.2" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#edf5fa" text-anchor="start">instrumentos y ayudas.</text><text x="710" y="505.4" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#edf5fa" text-anchor="start">Separación ATC según</text><text x="710" y="537.6" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#edf5fa" text-anchor="start">espacio aéreo y servicio.</text><text x="600" y="634" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#a9c0d1" text-anchor="middle">Volar IFR no significa usar exclusivamente instrumentos en todo momento.</text></svg>