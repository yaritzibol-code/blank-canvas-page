<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="ciaac-ae-m1-t6-title ciaac-ae-m1-t6-desc"><title id="ciaac-ae-m1-t6-title">El cerramiento de los ocupantes</title><desc id="ciaac-ae-m1-t6-desc">Observa la envolvente completa, no únicamente el parabrisas.</desc><rect width="1000" height="620" rx="20" fill="#f8fbfe"/><g font-family="Arial, sans-serif"><text x="34" y="47" font-size="29" fill="#172d43">El cerramiento de los ocupantes</text><path d="M34 68 L966 68" fill="none" stroke="#bdd0df" stroke-width="2" /><text x="85" y="130" font-size="24" fill="#172d43">Abierta</text><rect x="55" y="300" width="245" height="62" rx="12" fill="#e9f2fa" stroke="#abc2d5"/><text x="70" y="335" font-size="20" fill="#172d43">Cabina</text><circle cx="185" cy="260" r="22" fill="white" stroke="#172d43" stroke-width="3"/><path d="M185 282 L185 325" fill="none" stroke="#172d43" stroke-width="6" /><path d="M80 300 L110 215" fill="none" stroke="#1769aa" stroke-width="5" /><text x="400" y="130" font-size="24" fill="#172d43">Convertible</text><rect x="370" y="300" width="245" height="62" rx="12" fill="#e9f2fa" stroke="#abc2d5"/><text x="385" y="335" font-size="20" fill="#172d43">Cabina</text><circle cx="500" cy="260" r="22" fill="white" stroke="#172d43" stroke-width="3"/><path d="M500 282 L500 325" fill="none" stroke="#172d43" stroke-width="6" /><path d="M395 300 L425 215" fill="none" stroke="#1769aa" stroke-width="5" /><path d="M395 300 Q410 155 565 205 L595 300" fill="none" stroke="#1769aa" stroke-width="5" stroke-dasharray="9 6"/><text x="380" y="407" font-size="17" fill="#172d43">Alternativa según diseño</text><text x="715" y="130" font-size="24" fill="#172d43">Cerrada</text><rect x="685" y="300" width="245" height="62" rx="12" fill="#e9f2fa" stroke="#abc2d5"/><text x="700" y="335" font-size="20" fill="#172d43">Cabina</text><circle cx="815" cy="260" r="22" fill="white" stroke="#172d43" stroke-width="3"/><path d="M815 282 L815 325" fill="none" stroke="#172d43" stroke-width="6" /><path d="M710 300 L740 215" fill="none" stroke="#1769aa" stroke-width="5" /><path d="M710 300 Q725 155 880 205 L910 300" fill="none" stroke="#1769aa" stroke-width="5" /><text x="690" y="407" font-size="17" fill="#172d43">¿Presurizada? Faltan datos.</text><path d="M34 565 L966 565" fill="none" stroke="#bdd0df" stroke-width="2" /><text x="34" y="599" font-size="17" fill="#687b8b">Un parabrisas no cierra toda la cabina. Abrir una puerta no cambia por sí solo el tipo constructivo.</text></g></svg>