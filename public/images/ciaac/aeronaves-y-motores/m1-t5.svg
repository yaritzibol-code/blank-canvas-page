<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="ciaac-ae-m1-t5-title ciaac-ae-m1-t5-desc"><title id="ciaac-ae-m1-t5-title">El medio no es la trayectoria</title><desc id="ciaac-ae-m1-t5-desc">Separa los dibujos del medio de apoyo de las trayectorias de despegue.</desc><rect width="1000" height="620" rx="20" fill="#f8fbfe"/><g font-family="Arial, sans-serif"><text x="34" y="47" font-size="29" fill="#172d43">El medio no es la trayectoria</text><path d="M34 68 L966 68" fill="none" stroke="#bdd0df" stroke-width="2" /><polygon points="60,230 285,220 330,190 340,230 100,245" fill="#e9f2fa"/><path d="M60 230 L340 230" fill="none" stroke="#687b8b" stroke-width="3" /><path d="M160 230 L220 170" fill="none" stroke="#1769aa" stroke-width="8" /><path d="M200 240 L200 280" fill="none" stroke="#172d43" stroke-width="3" /><circle cx="200" cy="280" r="10" fill="white" stroke="#172d43" stroke-width="3"/><path d="M95 240 L95 275" fill="none" stroke="#172d43" stroke-width="3" /><circle cx="95" cy="275" r="10" fill="white" stroke="#172d43" stroke-width="3"/><text x="120" y="329" font-size="21" fill="#172d43">Tierra: ruedas</text><polygon points="405,210 635,210 604,245 440,245" fill="#1769aa"/><text x="447" y="329" font-size="21" fill="#172d43">Agua: casco</text><path d="M382 255 L659 255" fill="none" stroke="#1769aa" stroke-width="3" stroke-dasharray="8 5" /><polygon points="718,197 952,197 910,218 740,218" fill="#e9f2fa"/><path d="M764 215 L764 243" fill="none" stroke="#1769aa" stroke-width="4" /><path d="M895 215 L895 243" fill="none" stroke="#1769aa" stroke-width="4" /><rect x="715" y="245" width="100" height="23" rx="12" fill="#e9f2fa" stroke="#abc2d5"/><text x="730" y="280" font-size="20" fill="#172d43"></text><rect x="855" y="245" width="100" height="23" rx="12" fill="#e9f2fa" stroke="#abc2d5"/><text x="870" y="280" font-size="20" fill="#172d43"></text><text x="730" y="329" font-size="21" fill="#172d43">Agua: flotadores</text><text x="57" y="365" font-size="24" fill="#172d43">Capacidad de operación</text><path d="M75 460 L430 460" fill="none" stroke="#687b8b" stroke-width="3" /><path d="M95 443 L320 443" fill="none" stroke="#bb570c" stroke-width="4" /><polygon points="320,443 308.0,438.0 308.0,448.0" fill="#bb570c"/><path d="M320 443 L412 403" fill="none" stroke="#bb570c" stroke-width="4" /><polygon points="412,403 399.0015287678889,403.19936305570724 402.9887898820334,412.3700636182396" fill="#bb570c"/><text x="118" y="505" font-size="22" fill="#172d43">STOL: carrera corta</text><path d="M595 460 L920 460" fill="none" stroke="#687b8b" stroke-width="3" /><path d="M750 450 L750 375" fill="none" stroke="#bb570c" stroke-width="4" /><polygon points="750,375 745.0,387.0 755.0,387.0" fill="#bb570c"/><text x="646" y="505" font-size="22" fill="#172d43">VTOL: vertical</text><path d="M34 565 L966 565" fill="none" stroke="#bdd0df" stroke-width="2" /><text x="34" y="599" font-size="17" fill="#687b8b">Anfibio: capacidad terrestre y acuática prevista por diseño. Las distancias dibujadas no son performance.</text></g></svg>