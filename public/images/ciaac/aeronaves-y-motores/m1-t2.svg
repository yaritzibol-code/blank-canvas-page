<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="ciaac-ae-m1-t2-title ciaac-ae-m1-t2-desc"><title id="ciaac-ae-m1-t2-title">Dos maneras de mantener el giro</title><desc id="ciaac-ae-m1-t2-desc">Sigue la potencia mecánica naranja y separa el flujo de aire que mantiene el rotor del autogiro.</desc><rect width="1000" height="620" rx="20" fill="#f8fbfe"/><g font-family="Arial, sans-serif"><text x="34" y="47" font-size="29" fill="#172d43">Dos maneras de mantener el giro</text><path d="M34 68 L966 68" fill="none" stroke="#bdd0df" stroke-width="2" /><text x="165" y="118" font-size="26" fill="#172d43">Helicóptero</text><path d="M110 175 L410 175" fill="none" stroke="#1769aa" stroke-width="10" /><path d="M260 175 L260 285" fill="none" stroke="#172d43" stroke-width="4" /><rect x="185" y="285" width="150" height="65" rx="12" fill="#e9f2fa" stroke="#abc2d5"/><text x="200" y="320" font-size="20" fill="#172d43">Motor</text><text x="175" y="155" font-size="18" fill="#1769aa">Rotor sustentador</text><text x="640" y="118" font-size="26" fill="#172d43">Autogiro</text><path d="M585 175 L885 175" fill="none" stroke="#1769aa" stroke-width="10" /><rect x="660" y="285" width="150" height="65" rx="12" fill="#e9f2fa" stroke="#abc2d5"/><text x="675" y="320" font-size="20" fill="#172d43">Motor</text><text x="650" y="155" font-size="18" fill="#1769aa">Rotor sustentador</text><path d="M260 280 L260 185" fill="none" stroke="#bb570c" stroke-width="4" /><polygon points="260,185 255.0,197.0 265.0,197.0" fill="#bb570c"/><text x="80" y="243" font-size="19" fill="#bb570c">Potencia mecánica</text><path d="M810 310 L905 310" fill="none" stroke="#bb570c" stroke-width="4" /><polygon points="905,310 893.0,305.0 893.0,315.0" fill="#bb570c"/><path d="M920 262 L920 355" fill="none" stroke="#bb570c" stroke-width="8" /><text x="815" y="392" font-size="18" fill="#bb570c">Hélice de avance</text><path d="M650 255 L700 190" fill="none" stroke="#1769aa" stroke-width="4" /><polygon points="700,190 688.7203509242808,196.46293406500675 696.6465908153267,202.56004167350366" fill="#1769aa"/><path d="M745 255 L795 190" fill="none" stroke="#1769aa" stroke-width="4" /><polygon points="795,190 783.7203509242808,196.46293406500675 791.6465908153267,202.56004167350366" fill="#1769aa"/><text x="555" y="445" font-size="20" fill="#1769aa">El flujo mantiene el rotor en giro.</text><text x="63" y="490" font-size="21" fill="#172d43">Motor → transmisión → rotor</text><text x="557" y="490" font-size="21" fill="#172d43">Autorrotación en vuelo normal</text><path d="M34 565 L966 565" fill="none" stroke="#bdd0df" stroke-width="2" /><text x="34" y="599" font-size="17" fill="#687b8b">Naranja: potencia mecánica. Azul: rotor y flujo de aire. No es un procedimiento de vuelo.</text></g></svg>