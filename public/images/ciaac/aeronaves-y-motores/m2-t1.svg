<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="ciaac-ae-m2-t1-title ciaac-ae-m2-t1-desc"><title id="ciaac-ae-m2-t1-title">El modelo y el ejemplar son distintos</title><desc id="ciaac-ae-m2-t1-desc">El daño nuevo requiere evaluación aunque los pasos anteriores se hayan cumplido.</desc><rect width="1000" height="620" rx="20" fill="#f8fbfe"/><g font-family="Arial, sans-serif"><text x="34" y="47" font-size="29" fill="#172d43">El modelo y el ejemplar son distintos</text><path d="M34 68 L966 68" fill="none" stroke="#bdd0df" stroke-width="2" /><rect x="55" y="145" width="385" height="75" rx="12" fill="#e9f2fa" stroke="#abc2d5"/><text x="70" y="180" font-size="20" fill="#172d43">Diseño y límites</text><rect x="550" y="145" width="385" height="75" rx="12" fill="#e9f2fa" stroke="#abc2d5"/><text x="565" y="180" font-size="20" fill="#172d43">Cumplimiento</text><rect x="55" y="305" width="385" height="75" rx="12" fill="#e9f2fa" stroke="#abc2d5"/><text x="70" y="340" font-size="20" fill="#172d43">Ejemplar conforme</text><rect x="550" y="305" width="385" height="75" rx="12" fill="#e9f2fa" stroke="#abc2d5"/><text x="565" y="340" font-size="20" fill="#172d43">Condición mantenida</text><path d="M445 182 L540 182" fill="none" stroke="#1769aa" stroke-width="4" /><polygon points="540,182 528.0,177.0 528.0,187.0" fill="#1769aa"/><path d="M743 225 L249 295" fill="none" stroke="#1769aa" stroke-width="4" /><polygon points="249,295 261.5828047592017,298.266959502628 260.1798160157418,288.3658675130683" fill="#1769aa"/><path d="M445 342 L540 342" fill="none" stroke="#1769aa" stroke-width="4" /><polygon points="540,342 528.0,337.0 528.0,347.0" fill="#1769aa"/><path d="M745 384 L745 430" fill="none" stroke="#bb570c" stroke-width="4" /><polygon points="745,430 750.0,418.0 740.0,418.0" fill="#bb570c"/><rect x="550" y="438" width="385" height="66" rx="12" fill="#e9f2fa" stroke="#abc2d5"/><text x="565" y="473" font-size="20" fill="#172d43">Daño nuevo: evaluar</text><text x="57" y="477" font-size="20" fill="#172d43">El certificado no elimina una discrepancia.</text><path d="M34 565 L966 565" fill="none" stroke="#bdd0df" stroke-width="2" /><text x="34" y="599" font-size="17" fill="#687b8b">Secuencia conceptual; no representa el trámite de una autoridad ni sustituye la evaluación técnica.</text></g></svg>