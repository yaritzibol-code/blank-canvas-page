<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="ciaac-ae-m2-t2-title ciaac-ae-m2-t2-desc"><title id="ciaac-ae-m2-t2-title">Arquitectura estructural y material</title><desc id="ciaac-ae-m2-t2-desc">Localiza los triángulos, la piel y los refuerzos; después observa el material como otro criterio.</desc><rect width="1000" height="620" rx="20" fill="#f8fbfe"/><g font-family="Arial, sans-serif"><text x="34" y="47" font-size="29" fill="#172d43">Arquitectura estructural y material</text><path d="M34 68 L966 68" fill="none" stroke="#bdd0df" stroke-width="2" /><text x="67" y="128" font-size="23" fill="#172d43">Armadura</text><rect x="45" y="185" width="265" height="130" rx="50" fill="#e9f2fa" stroke="#687b8b" stroke-width="2" stroke-dasharray="5 5"/><text x="387" y="128" font-size="23" fill="#172d43">Monocoque</text><rect x="365" y="185" width="265" height="130" rx="50" fill="#e9f2fa" stroke="#1769aa" stroke-width="5"/><text x="707" y="128" font-size="23" fill="#172d43">Semimonocoque</text><rect x="685" y="185" width="265" height="130" rx="50" fill="#e9f2fa" stroke="#1769aa" stroke-width="5"/><path d="M60 210 L290 210" fill="none" stroke="#bb570c" stroke-width="4" /><path d="M60 292 L290 292" fill="none" stroke="#bb570c" stroke-width="4" /><path d="M60 210 L130 292" fill="none" stroke="#bb570c" stroke-width="4" /><path d="M60 292 L130 210" fill="none" stroke="#bb570c" stroke-width="4" /><path d="M140 210 L210 292" fill="none" stroke="#bb570c" stroke-width="4" /><path d="M140 292 L210 210" fill="none" stroke="#bb570c" stroke-width="4" /><path d="M220 210 L290 292" fill="none" stroke="#bb570c" stroke-width="4" /><path d="M220 292 L290 210" fill="none" stroke="#bb570c" stroke-width="4" /><ellipse cx="422" cy="250" rx="24" ry="65" fill="none" stroke="#687b8b" stroke-width="3"/><ellipse cx="516" cy="250" rx="24" ry="65" fill="none" stroke="#687b8b" stroke-width="3"/><ellipse cx="741" cy="250" rx="24" ry="65" fill="none" stroke="#687b8b" stroke-width="3"/><ellipse cx="841" cy="250" rx="24" ry="65" fill="none" stroke="#687b8b" stroke-width="3"/><path d="M710 215 L930 215" fill="none" stroke="#bb570c" stroke-width="5" /><path d="M710 250 L930 250" fill="none" stroke="#bb570c" stroke-width="5" /><path d="M710 285 L930 285" fill="none" stroke="#bb570c" stroke-width="5" /><text x="53" y="355" font-size="18" fill="#172d43">Triángulos resistentes</text><text x="383" y="355" font-size="18" fill="#172d43">Predomina la piel</text><text x="705" y="355" font-size="18" fill="#172d43">Piel + refuerzos</text><rect x="175" y="416" width="650" height="103" rx="12" fill="#e9f2fa" stroke="#abc2d5"/><text x="190" y="451" font-size="20" fill="#172d43">Material compuesto moderno: fibras + matriz</text><path d="M210 470 L450 470" fill="none" stroke="#1769aa" stroke-width="4" /><path d="M210 485 L450 485" fill="none" stroke="#1769aa" stroke-width="4" /><path d="M210 500 L450 500" fill="none" stroke="#1769aa" stroke-width="4" /><text x="495" y="491" font-size="18" fill="#172d43">Es otro criterio: el material.</text><path d="M34 565 L966 565" fill="none" stroke="#bdd0df" stroke-width="2" /><text x="34" y="599" font-size="17" fill="#687b8b">Compuesta o armada en el texto histórico = armadura. No equivale automáticamente a fibra y resina.</text></g></svg>