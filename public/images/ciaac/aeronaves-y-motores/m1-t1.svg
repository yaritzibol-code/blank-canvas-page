<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="ciaac-ae-m1-t1-title ciaac-ae-m1-t1-desc"><title id="ciaac-ae-m1-t1-title">Un criterio por observación</title><desc id="ciaac-ae-m1-t1-desc">Distingue la vista frontal de la vista superior antes de nombrar posición o planta.</desc><rect width="1000" height="620" rx="20" fill="#f8fbfe"/><g font-family="Arial, sans-serif"><text x="34" y="47" font-size="29" fill="#172d43">Un criterio por observación</text><path d="M34 68 L966 68" fill="none" stroke="#bdd0df" stroke-width="2" /><rect x="35" y="95" width="230" height="72" rx="12" fill="#e9f2fa" stroke="#abc2d5"/><text x="50" y="130" font-size="20" fill="#172d43">Flotación</text><rect x="35" y="197" width="230" height="72" rx="12" fill="#e9f2fa" stroke="#abc2d5"/><text x="50" y="232" font-size="20" fill="#172d43">Fuerza aerodinámica</text><text x="48" y="296" font-size="17" fill="#172d43">No depende de tener motor.</text><circle cx="395" cy="215" r="36" fill="#e9f2fa" stroke="#172d43" stroke-width="3"/><path d="M275 185 L515 185" fill="none" stroke="#1769aa" stroke-width="10" /><text x="350" y="310" font-size="20" fill="#172d43">Alta</text><circle cx="630" cy="215" r="36" fill="#e9f2fa" stroke="#172d43" stroke-width="3"/><path d="M510 238 L750 238" fill="none" stroke="#1769aa" stroke-width="10" /><text x="585" y="310" font-size="20" fill="#172d43">Baja</text><circle cx="865" cy="215" r="36" fill="#e9f2fa" stroke="#172d43" stroke-width="3"/><path d="M745 155 L985 155" fill="none" stroke="#1769aa" stroke-width="10" /><path d="M843 190 L835 155" fill="none" stroke="#687b8b" stroke-width="4" /><path d="M887 190 L895 155" fill="none" stroke="#687b8b" stroke-width="4" /><text x="820" y="310" font-size="20" fill="#172d43">Parasol</text><text x="310" y="110" font-size="23" fill="#172d43">Vista frontal: posición</text><text x="40" y="365" font-size="23" fill="#172d43">Vista superior: forma en planta</text><polygon points="55,411 230,411 230,472 55,472" fill="#1769aa"/><text x="65" y="517" font-size="18" fill="#172d43">Rectangular</text><polygon points="285,423 372,400 460,423 460,459 372,478 285,459" fill="#1769aa"/><text x="310" y="517" font-size="18" fill="#172d43">Estrechada</text><ellipse cx="594" cy="440" rx="80" ry="39" fill="#1769aa"/><text x="549" y="517" font-size="18" fill="#172d43">Elíptica</text><polygon points="750,453 838,415 927,453 927,478 838,458 750,478" fill="#1769aa"/><text x="790" y="517" font-size="18" fill="#172d43">En flecha</text><path d="M34 565 L966 565" fill="none" stroke="#bdd0df" stroke-width="2" /><text x="34" y="599" font-size="17" fill="#687b8b">Esquemas conceptuales. Número, posición y planta son criterios independientes.</text></g></svg>