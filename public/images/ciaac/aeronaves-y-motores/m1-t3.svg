ints="733,257 721.0,252.0 721.0,262.0" fill="#bb570c"/><rect x="740" y="225" width="200" height="64" rx="12" fill="#e9f2fa" stroke="#abc2d5"/><text x="755" y="260" font-size="20" fill="#172d43">Hélice</text><text x="40" y="360" font-size="22" fill="#172d43">Turborreactor</text><rect x="250" y="325" width="200" height="64" rx="12" fill="#e9f2fa" stroke="#abc2d5"/><text x="265" y="360" font-size="20" fill="#172d43">Núcleo</text><path d="M454 357 L488 357" fill="none" stroke="#bb570c" stroke-width="4" /><polygon points="488,357 476.0,352.0 476.0,362.0" fill="#bb570c"/><rect x="495" y="325" width="200" height="64" rx="12" fill="#e9f2fa" stroke="#abc2d5"/><text x="510" y="360" font-size="20" fill="#172d43">Escape</text><path d="M699 357 L733 357" fill="none" stroke="#bb570c" stroke-width="4" /><polygon points="733,357 721.0,352.0 721.0,362.0" fill="#bb570c"/><rect x="740" y="325" width="200" height="64" rx="12" fill="#e9f2fa" stroke="#abc2d5"/><text x="755" y="360" font-size="20" fill="#172d43">Empuje</text><text x="40" y="460" font-size="22" fill="#172d43">Turbofán</text><rect x="250" y="425" width="200" height="64" rx="12" fill="#e9f2fa" stroke="#abc2d5"/><text x="265" y="460" font-size="20" fill="#172d43">Núcleo</text><path d="M454 457 L488 457" fill="none" stroke="#bb570c" stroke-width="4" /><polygon points="488,457 476.0,452.0 476.0,462.0" fill="#bb570c"/><rect x="495" y="425" width="200" height="64" rx="12" fill="#e9f2fa" stroke="#abc2d5"/><text x="510" y="460" font-size="20" fill="#172d43">Ventilador</text><path d="M699 457 L733 457" fill="none" stroke="#bb570c" stroke-width="4" /><polygon points="733,457 721.0,452.0 721.0,462.0" fill="#bb570c"/><rect x="740" y="425" width="200" height="64" rx="12" fill="#e9f2fa" stroke="#abc2d5"/><text x="755" y="460" font-size="20" fill="#172d43">Dos flujos</text><path d="M34 565 L966 565" fill="none" stroke="#bdd0df" stroke-width="2" /><text x="34" y="599" font-size="17" fill="#687b8b">Identifica el principio antes de contar mo