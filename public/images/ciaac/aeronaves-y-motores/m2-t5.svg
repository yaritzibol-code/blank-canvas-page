<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="ciaac-ae-m2-t5-title ciaac-ae-m2-t5-desc"><title id="ciaac-ae-m2-t5-title">El fuselaje aloja y transmite cargas</title><desc id="ciaac-ae-m2-t5-desc">Sigue la carga desde el piso hacia los elementos resistentes.</desc><rect width="1000" height="620" rx="20" fill="#f8fbfe"/><g font-family="Arial, sans-serif"><text x="34" y="47" font-size="29" fill="#172d43">El fuselaje aloja y transmite cargas</text><path d="M34 68 L966 68" fill="none" stroke="#bdd0df" stroke-width="2" /><rect x="125" y="180" width="720" height="175" rx="85" fill="#e9f2fa" stroke="#1769aa" stroke-width="5"/><ellipse cx="240" cy="267" rx="24" ry="87" fill="none" stroke="#687b8b" stroke-width="3"/><ellipse cx="380" cy="267" rx="24" ry="87" fill="none" stroke="#687b8b" stroke-width="3"/><ellipse cx="530" cy="267" rx="24" ry="87" fill="none" stroke="#687b8b" stroke-width="3"/><ellipse cx="680" cy="267" rx="24" ry="87" fill="none" stroke="#687b8b" stroke-width="3"/><ellipse cx="770" cy="267" rx="24" ry="87" fill="none" stroke="#687b8b" stroke-width="3"/><path d="M160 217 L811 217" fill="none" stroke="#1769aa" stroke-width="3" /><path d="M160 267 L811 267" fill="none" stroke="#1769aa" stroke-width="3" /><path d="M160 317 L811 317" fill="none" stroke="#1769aa" stroke-width="3" /><path d="M170 309 L810 309" fill="none" stroke="#172d43" stroke-width="6" /><rect x="425" y="247" width="92" height="60" rx="12" fill="#e9f2fa" stroke="#abc2d5"/><text x="440" y="282" font-size="20" fill="#172d43">Carga</text><path d="M460 315 L380 340" fill="none" stroke="#bb570c" stroke-width="4" /><polygon points="380,340 392.94513470210006,341.1930999725438 389.96238477074064,331.64830019219346" fill="#bb570c"/><path d="M495 315 L532 340" fill="none" stroke="#bb570c" stroke-width="4" /><polygon points="532,340 524.856219432093,329.13876622120705 519.257645319313,337.4246559081212" fill="#bb570c"/><text x="100" y="132" font-size="22" fill="#172d43">Cuadernas</text><path d="M208 138 L240 180" fill="none" stroke="#687b8b" stroke-width="2" /><text x="680" y="132" font-size="22" fill="#172d43">Larguerillos</text><path d="M730 138 L730 218" fill="none" stroke="#1769aa" stroke-width="2" /><text x="370" y="423" font-size="23" fill="#172d43">Piso y sujeción transmiten la carga.</text><text x="123" y="501" font-size="23" fill="#172d43">El volumen disponible no demuestra capacidad estructural.</text><path d="M34 565 L966 565" fill="none" stroke="#bdd0df" stroke-width="2" /><text x="34" y="599" font-size="17" fill="#687b8b">Modelo semimonocoque simplificado. No muestra límites de carga ni instrucciones de mantenimiento.</text></g></svg>