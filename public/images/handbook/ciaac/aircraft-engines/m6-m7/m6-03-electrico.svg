<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="m6-03-electrico-title m6-03-electrico-desc"><title id="m6-03-electrico-title">Fuentes eléctricas y distribución</title><desc id="m6-03-electrico-desc">Batería, generador del motor, generador APU y GPU exterior tienen contactores propios hacia las barras. Contactores representados abiertos. Líneas doradas representan conexiones de energía, no electrones. Un bloque APU (turbina) separado muestra una posible salida neumática mediante una flecha azul discontinua; no está conectado al cableado.</desc><defs><marker id="m6-03-electrico-arrow-65d8ef" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#65d8ef"/></marker><marker id="m6-03-electrico-arrow-edc36b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#edc36b"/></marker><marker id="m6-03-electrico-arrow-ffa66b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#ffa66b"/></marker><marker id="m6-03-electrico-arrow-8795a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#8795a8"/></marker></defs><rect width="720" height="450" rx="20" fill="#0b1730"/><g font-family="DejaVu Sans, sans-serif"><text x="28" y="38" text-anchor="start" font-size="25" fill="#edc36b">Fuentes eléctricas y distribución</text><rect x="27" y="82" width="147" height="63" rx="12" fill="#142743" stroke="#edc36b" stroke-width="2"/><text x="100.5" y="120.5" text-anchor="middle" font-size="20" fill="#edf5ff">Batería</text><text x="100" y="172" text-anchor="middle" font-size="15" fill="#b4c5db">Energía almacenada</text><path d="M100 181 L100 206" fill="none" stroke="#edc36b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circ