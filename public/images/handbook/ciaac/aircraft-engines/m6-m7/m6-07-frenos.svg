<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="m6-07-frenos-title m6-07-frenos-desc"><title id="m6-07-frenos-title">Frenar: convertir movimiento en calor</title><desc id="m6-07-frenos-desc">Disco giratorio azul apretado por elementos fijos grises. Tambor histórico giratorio con tubo expansor interno dorado que empuja bloques radiales; no usa palanca automotriz. Las siluetas de tren convencional y triciclo ilustran disposición de ruedas, separada de fijo o retráctil.</desc><defs><marker id="m6-07-frenos-arrow-65d8ef" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#65d8ef"/></marker><marker id="m6-07-frenos-arrow-edc36b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#edc36b"/></marker><marker id="m6-07-frenos-arrow-ffa66b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#ffa66b"/></marker><marker id="m6-07-frenos-arrow-8795a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#8795a8"/></marker></defs><rect width="720" height="450" rx="20" fill="#0b1730"/><g font-family="DejaVu Sans, sans-serif"><text x="28" y="38" text-anchor="start" font-size="25" fill="#edc36b">Frenar: convertir movimiento en calor</text><text x="186" y="85" text-anchor="middle" font-size="21" fill="#edc36b">Disco + pinza</text><text x="529" y="85" text-anchor="middle" font-size="21" fill="#edc36b">Tambor histórico</text><rect x="171" y="115" width="29" height="135" rx="2" fill="#65d8ef" stroke="#65d8ef" stroke-width="2"/><rect x="134" y="130" width="25" height="94" rx="2" fill="#8795a8" stroke="#8795a8" stroke-width="2"/><rect x="212" y="130" width="25" height="94" rx="2" fill="#8795a8" stroke="#8795a8" stroke-width="2"/><pa