<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="m6-04-hidraulico-title m6-04-hidraulico-desc"><title id="m6-04-hidraulico-title">Líquido: un circuito con retorno</title><desc id="m6-04-hidraulico-desc">Depósito separado de bomba, válvula y actuador. La línea de presión alimenta una cara del actuador; el retorno se muestra funcionalmente simplificado hacia el depósito. A presión igual, duplicar el área duplica la fuerza. Presión y caudal son magnitudes diferentes.</desc><defs><marker id="m6-04-hidraulico-arrow-65d8ef" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#65d8ef"/></marker><marker id="m6-04-hidraulico-arrow-edc36b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#edc36b"/></marker><marker id="m6-04-hidraulico-arrow-ffa66b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#ffa66b"/></marker><marker id="m6-04-hidraulico-arrow-8795a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#8795a8"/></marker></defs><rect width="720" height="450" rx="20" fill="#0b1730"/><g font-family="DejaVu Sans, sans-serif"><text x="28" y="38" text-anchor="start" font-size="25" fill="#edc36b">Líquido: un circuito con retorno</text><rect x="30" y="100" width="142" height="63" rx="12" fill="#142743" stroke="#65d8ef" stroke-width="2"/><text x="101.0" y="138.5" text-anchor="middle" font-size="20" fill="#edf5ff">Depósito</text><circle cx="249" cy="130" r="34" fill="#142743" stroke="#65d8ef" stroke-width="3"/><path d="M235 145 L267 130 L235 115 Z" fill="none" stroke="#65d8ef" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="249" y="185" text-anchor="middle" font-size="18" fill="#edf5ff">Bomba</text><rect x="344" y="100" width="129" height="63" rx="12" fill="#142743" stroke="#65d8ef" stroke-width="2"/><text x="408.5" y="138.5" text-anchor="middle" font-size="20" fill="#edf5ff">Válvula</text><rect x="551" y="93" width="125" height="75" rx="12" fill="#142743" stroke="#65d8ef" stroke-width="2"/><path d="M588 98 L588 163" fill="none" stroke="#8795a8" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M588 130 L699 130" fill="none" stroke="#8795a8" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><text x="612" y="82" text-anchor="middle" font-size="18" fill="#edf5ff">Actuador</text><path d="M172 130 L214 130" fill="none" stroke="#65d8ef" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m6-04-hidraulico-arrow-65d8ef)"/><path d="M283 130 L344 130" fill="none" stroke="#65d8ef" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m6-04-hidraulico-arrow-65d8ef)"/><path d="M473 119 H551" fill="none" stroke="#65d8ef" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m6-04-hidraulico-arrow-65d8ef)"/><path d="M646 168 V214 H440 V163 M408 163 V223 H101 V163" fill="none" stroke="#edc36b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m6-04-hidraulico-arrow-edc36b)"/><text x="280" y="249" text-anchor="middle" font-size="19" fill="#edc36b">Retorno al depósito</text><rect x="30" y="278" width="300" height="106" rx="12" fill="#142743" stroke="#8795a8" stroke-width="2"/><text x="180" y="306" text-anchor="middle" font-size="19" fill="#edf5ff">A igual presión: F = P × A</text><text x="110" y="331" text-anchor="middle" font-size="17" fill="#65d8ef">A → F</text><text x="245" y="331" text-anchor="middle" font-size="17" fill="#65d8ef">2A → 2F</text><rect x="88" y="341" width="44" height="34" rx="1" fill="#142743" stroke="#65d8ef" stroke-width="2"/><rect x="201" y="341" width="88" height="34" rx="1" fill="#142743" stroke="#65d8ef" stroke-width="2"/><path d="M91 357 L129 357" fill="none" stroke="#8795a8" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M204 357 L286 357" fill="none" stroke="#8795a8" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M110 355 L110 340" fill="none" stroke="#edc36b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m6-04-hidraulico-arrow-edc36b)"/><path d="M245 355 L245 340" fill="none" stroke="#edc36b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m6-04-hidraulico-arrow-edc36b)"/><text x="525" y="309" text-anchor="middle" font-size="22" fill="#65d8ef">Presión → fuerza</text><text x="525" y="348" text-anchor="middle" font-size="22" fill="#edc36b">Caudal → velocidad</text><text x="525" y="379" text-anchor="middle" font-size="16" fill="#b4c5db">para un área dada</text><path d="M28 405 L692 405" fill="none" stroke="#142743" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="360" y="433" text-anchor="middle" font-size="17" fill="#b4c5db">Circuito funcional simplificado · No representa una válvula en detalle</text></g></svg>