<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="m6-01-cabina-title m6-01-cabina-desc"><title id="m6-01-cabina-title">Presión: balance entre entrada y salida</title><desc id="m6-01-cabina-desc">El aire acondicionado entra a cabina; la válvula outflow regula su salida. Un sensor informa al controlador por líneas discontinuas. La válvula de seguridad es independiente. Refrigerante y oxígeno no son el aire de presurización.</desc><defs><marker id="m6-01-cabina-arrow-65d8ef" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#65d8ef"/></marker><marker id="m6-01-cabina-arrow-edc36b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#edc36b"/></marker><marker id="m6-01-cabina-arrow-ffa66b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#ffa66b"/></marker><marker id="m6-01-cabina-arrow-8795a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#8795a8"/></marker></defs><rect width="720" height="450" rx="20" fill="#0b1730"/><g font-family="DejaVu Sans, sans-serif"><text x="28" y="38" text-anchor="start" font-size="25" fill="#edc36b">Presión: balance entre entrada y salida</text><rect x="195" y="118" width="320" height="174" rx="55" fill="#142743" stroke="#edf5ff" stroke-width="2"/><text x="355" y="215" text-anchor="middle" font-size="25" fill="#edf5ff">CABINA</text><text x="355" y="244" text-anchor="middle" font-size="18" fill="#b4c5db">Presión interior</text><text x="92" y="116" text-anchor="middle" font-size="20" fill="#65d8ef">Aire</text><text x="92" y="142" text-anchor="middle" font-size="17" fill="#65d8ef">acondicionado</text><path d="M35 175 L225 175" fill="none" stroke="#65d8ef" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m6-01-cabina-arrow-65d8ef)"/><path d="M480 250 L675 250" fill="none" stroke="#ffa66b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m6-01-cabina-arrow-ffa66b)"/><path d="M548 232 L566 268 M548 268 L566 232" fill="none" stroke="#ffa66b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="601" y="291" text-anchor="middle" font-size="17" fill="#ffa66b">Salida regulada</text><text x="600" y="317" text-anchor="middle" font-size="17" fill="#ffa66b">(outflow)</text><rect x="255" y="63" width="190" height="42" rx="12" fill="#142743" stroke="#edc36b" stroke-width="2"/><text x="350.0" y="91.0" text-anchor="middle" font-size="20" fill="#edf5ff">Controlador</text><path d="M320 160 V105" fill="none" stroke="#edc36b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m6-01-cabina-arrow-edc36b)" stroke-dasharray="7 7"/><text x="383" y="146" text-anchor="middle" font-size="16" fill="#edc36b">Sensor</text><path d="M445 83 H690 V215 H557 V224" fill="none" stroke="#edc36b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m6-01-cabina-arrow-edc36b)" stroke-dasharray="7 7"/><path d="M512 160 L662 160" fill="none" stroke="#ffa66b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m6-01-cabina-arrow-ffa66b)"/><path d="M560 147 L578 173 M560 173 L578 147" fill="none" stroke="#ffa66b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="605" y="126" text-anchor="middle" font-size="18" fill="#ffa66b">Seguridad</text><rect x="35" y="330" width="380" height="56" rx="12" fill="#142743" stroke="#8795a8" stroke-width="2"/><text x="225" y="353" text-anchor="middle" font-size="16" fill="#edf5ff">Refrigerante: circuito cerrado aparte</text><path d="M62 369 H378 V360 H62 Z" fill="none" stroke="#8795a8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="557" y="371" text-anchor="middle" font-size="18" fill="#b4c5db">O₂ ≠ presurización</text><path d="M28 405 L692 405" fill="none" stroke="#142743" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="360" y="433" text-anchor="middle" font-size="17" fill="#b4c5db">Aire: azul/naranja · Señal de control: línea discontinua</text></g></svg>