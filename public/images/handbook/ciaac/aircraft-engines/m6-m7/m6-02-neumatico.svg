<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="m6-02-neumatico-title m6-02-neumatico-desc"><title id="m6-02-neumatico-title">Aire almacenado → trabajo → escape</title><desc id="m6-02-neumatico-desc">Una línea de reposición del compresor atraviesa un antirretorno hacia la botella. El aire almacenado pasa por reductora y control hacia el actuador; el aire usado sale al ambiente. Dos volúmenes contienen el mismo número de partículas para mostrar compresibilidad.</desc><defs><marker id="m6-02-neumatico-arrow-65d8ef" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#65d8ef"/></marker><marker id="m6-02-neumatico-arrow-edc36b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#edc36b"/></marker><marker id="m6-02-neumatico-arrow-ffa66b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#ffa66b"/></marker><marker id="m6-02-neumatico-arrow-8795a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#8795a8"/></marker></defs><rect width="720" height="450" rx="20" fill="#0b1730"/><g font-family="DejaVu Sans, sans-serif"><text x="28" y="38" text-anchor="start" font-size="25" fill="#edc36b">Aire almacenado → trabajo → escape</text><rect x="28" y="125" width="125" height="68" rx="12" fill="#142743" stroke="#65d8ef" stroke-width="2"/><text x="90.5" y="166.0" text-anchor="middle" font-size="20" fill="#edf5ff">Botella</text><rect x="194" y="125" width="140" height="68" rx="12" fill="#142743" stroke="#65d8ef" stroke-width="2"/><text x="264.0" y="166.0" text-anchor="middle" font-size="20" fill="#edf5ff">Reductora</text><rect x="390" y="125" width="122" height="68" rx="12" fill="#142743" stroke="#65d8ef" stroke-width="2"/><text x="451.0" y="166.0" text-anchor="middle" font-size="20" fill="#edf5ff">Control</text><rect x="560" y="125" width="134" height="68" rx="12" fill="#142743" stroke="#65d8ef" stroke-width="2"/><text x="627.0" y="166.0" text-anchor="middle" font-size="20" fill="#edf5ff">Actuador</text><path d="M153 159 L194 159" fill="none" stroke="#65d8ef" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m6-02-neumatico-arrow-65d8ef)"/><path d="M334 159 L390 159" fill="none" stroke="#65d8ef" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m6-02-neumatico-arrow-65d8ef)"/><path d="M512 159 L560 159" fill="none" stroke="#65d8ef" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m6-02-neumatico-arrow-65d8ef)"/><path d="M451 193 V246 H672" fill="none" stroke="#65d8ef" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m6-02-neumatico-arrow-65d8ef)"/><text x="558" y="279" text-anchor="middle" font-size="19" fill="#65d8ef">Escape al ambiente</text><rect x="30" y="318" width="154" height="50" rx="12" fill="#142743" stroke="#edc36b" stroke-width="2"/><text x="107.0" y="350.0" text-anchor="middle" font-size="20" fill="#edf5ff">Compresor</text><path d="M184 343 H225 V236 H91 V193" fill="none" stroke="#edc36b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m6-02-neumatico-arrow-edc36b)"/><text x="286" y="330" text-anchor="middle" font-size="18" fill="#edc36b">Reposición</text><text x="287" y="355" text-anchor="middle" font-size="18" fill="#edc36b">de aire</text><path d="M209 252 L190 236 L209 220 M189 220 V252" fill="none" stroke="#edc36b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="321" y="235" text-anchor="middle" font-size="17" fill="#edc36b">Antirretorno</text><rect x="439" y="317" width="98" height="66" rx="12" fill="#142743" stroke="#65d8ef" stroke-width="2"/><rect x="577" y="340" width="98" height="43" rx="12" fill="#142743" stroke="#65d8ef" stroke-width="2"/><text x="488" y="310" text-anchor="middle" font-size="16" fill="#edf5ff">Volumen 1</text><text x="626" y="333" text-anchor="middle" font-size="16" fill="#edf5ff">Menor V</text><circle cx="455" cy="335" r="3" fill="#65d8ef" stroke="#65d8ef" stroke-width="3"/><circle cx="480" cy="351" r="3" fill="#65d8ef" stroke="#65d8ef" stroke-width="3"/><circle cx="514" cy="333" r="3" fill="#65d8ef" stroke="#65d8ef" stroke-width="3"/><circle cx="458" cy="370" r="3" fill="#65d8ef" stroke="#65d8ef" stroke-width="3"/><circle cx="508" cy="369" r="3" fill="#65d8ef" stroke="#65d8ef" stroke-width="3"/><circle cx="590" cy="353" r="3" fill="#65d8ef" stroke="#65d8ef" stroke-width="3"/><circle cx="614" cy="365" r="3" fill="#65d8ef" stroke="#65d8ef" stroke-width="3"/><circle cx="659" cy="355" r="3" fill="#65d8ef" stroke="#65d8ef" stroke-width="3"/><circle cx="591" cy="374" r="3" fill="#65d8ef" stroke="#65d8ef" stroke-width="3"/><circle cx="649" cy="375" r="3" fill="#65d8ef" stroke="#65d8ef" stroke-width="3"/><path d="M28 405 L692 405" fill="none" stroke="#142743" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="360" y="433" text-anchor="middle" font-size="17" fill="#b4c5db">Esquema funcional · El gas es compresible; no exige retorno líquido</text></g></svg>