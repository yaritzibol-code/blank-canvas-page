<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="m6-09-pitot-estatica-title m6-09-pitot-estatica-desc"><title id="m6-09-pitot-estatica-title">Dos presiones, tres instrumentos</title><desc id="m6-09-pitot-estatica-desc">Pitot entrega presión total Pt al anemómetro. La presión estática Ps se ramifica al anemómetro, altímetro y VSI. En un VSI convencional, Ps llega directamente a la cápsula y mediante una restricción a la caja. Pt menos Ps aproxima presión dinámica sólo a baja compresibilidad.</desc><defs><marker id="m6-09-pitot-estatica-arrow-65d8ef" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#65d8ef"/></marker><marker id="m6-09-pitot-estatica-arrow-edc36b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#edc36b"/></marker><marker id="m6-09-pitot-estatica-arrow-ffa66b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#ffa66b"/></marker><marker id="m6-09-pitot-estatica-arrow-8795a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#8795a8"/></marker></defs><rect width="720" height="450" rx="20" fill="#0b1730"/><g font-family="DejaVu Sans, sans-serif"><text x="28" y="38" text-anchor="start" font-size="25" fill="#edc36b">Dos presiones, tres instrumentos</text><rect x="26" y="86" width="150" height="55" rx="12" fill="#142743" stroke="#edc36b" stroke-width="2"/><text x="101.0" y="120.5" text-anchor="middle" font-size="20" fill="#edf5ff">Pitot: Pt</text><path d="M176 112 H289" fill="none" stroke="#edc36b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m6-09-pitot-estatica-arrow-edc36b)"/><rect x="292" y="84" width="174" height="59" rx="12" fill="#142743" stroke="#edc36b" stroke-width="2"/><text x="379.0" y="120.5" text-anchor="middle" font-size="20" fill="#edf5ff">Anemómetro</text><rect x="26" y="199" width="150" height="57" rx="12" fill="#142743" stroke="#65d8ef" stroke-width="2"/><text x="101.0" y="234.5" text-anchor="middle" font-size="20" fill="#edf5ff">Estática: Ps</text><path d="M176 227 H234 V162 H378 V143" fill="none" stroke="#65d8ef" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m6-09-pitot-estatica-arrow-65d8ef)"/><path d="M234 227 H298" fill="none" stroke="#65d8ef" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m6-09-pitot-estatica-arrow-65d8ef)"/><rect x="301" y="199" width="161" height="57" rx="12" fill="#142743" stroke="#65d8ef" stroke-width="2"/><text x="381.5" y="234.5" text-anchor="middle" font-size="20" fill="#edf5ff">Altímetro</text><path d="M234 227 V327 H301" fill="none" stroke="#65d8ef" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m6-09-pitot-estatica-arrow-65d8ef)"/><rect x="301" y="301" width="161" height="56" rx="12" fill="#142743" stroke="#65d8ef" stroke-width="2"/><text x="381.5" y="336.0" text-anchor="middle" font-size="20" fill="#edf5ff">VSI</text><text x="554" y="95" text-anchor="middle" font-size="22" fill="#edc36b">Pt − Ps ≈ q</text><text x="580" y="123" text-anchor="middle" font-size="16" fill="#b4c5db">Baja compresibilidad</text><rect x="491" y="165" width="204" height="220" rx="12" fill="#142743" stroke="#8795a8" stroke-width="2"/><text x="593" y="195" text-anchor="middle" font-size="18" fill="#edc36b">Interior del VSI</text><text x="593" y="226" text-anchor="middle" font-size="17" fill="#65d8ef">Ps</text><path d="M593 235 V250 H528 V295" fill="none" stroke="#65d8ef" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m6-09-pitot-estatica-arrow-65d8ef)"/><path d="M593 250 H657 V267" fill="none" stroke="#65d8ef" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M649 267 L665 274 L649 281 L665 288 L657 294" fill="none" stroke="#65d8ef" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M657 294 L657 314" fill="none" stroke="#65d8ef" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m6-09-pitot-estatica-arrow-65d8ef)"/><text x="534" y="333" text-anchor="middle" font-size="15" fill="#edf5ff">Directa</text><text x="650" y="356" text-anchor="middle" font-size="15" fill="#edf5ff">Restricción</text><text x="538" y="357" text-anchor="middle" font-size="15" fill="#b4c5db">Cápsula</text><text x="650" y="379" text-anchor="middle" font-size="15" fill="#b4c5db">Caja</text><text x="236" y="384" text-anchor="middle" font-size="16" fill="#b4c5db">Una presión total; una estática compartida</text><path d="M28 405 L692 405" fill="none" stroke="#142743" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="360" y="433" text-anchor="middle" font-size="17" fill="#b4c5db">Pt no es q · Conexiones de presión; no flujo continuo de servicio</text></g></svg>