<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="m7-01-servicios-title m7-01-servicios-desc"><title id="m7-01-servicios-title">Cuatro servicios de telecomunicaciones</title><desc id="m7-01-servicios-desc">Servicio fijo entre estaciones; móvil entre tierra y aeronave; radionavegación proporciona orientación mediante radioayudas; radiodifusión envía información desde un emisor a múltiples receptores. Es un mapa de funciones, no una asignación de frecuencias ni una limitación a voz.</desc><defs><marker id="m7-01-servicios-arrow-65d8ef" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#65d8ef"/></marker><marker id="m7-01-servicios-arrow-edc36b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#edc36b"/></marker><marker id="m7-01-servicios-arrow-ffa66b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#ffa66b"/></marker><marker id="m7-01-servicios-arrow-8795a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#8795a8"/></marker></defs><rect width="720" height="450" rx="20" fill="#0b1730"/><g font-family="DejaVu Sans, sans-serif"><text x="28" y="38" text-anchor="start" font-size="25" fill="#edc36b">Cuatro servicios de telecomunicaciones</text><rect x="24" y="65" width="326" height="155" rx="12" fill="#142743" stroke="#8795a8" stroke-width="2"/><text x="187" y="96" text-anchor="middle" font-size="21" fill="#edc36b">Fijo aeronáutico</text><rect x="370" y="65" width="326" height="155" rx="12" fill="#142743" stroke="#8795a8" stroke-width="2"/><text x="533" y="96" text-anchor="middle" font-size="21" fill="#edc36b">Móvil aeronáutico</text><rect x="24" y="229" width="326" height="155" rx="12" fill="#142743" strok