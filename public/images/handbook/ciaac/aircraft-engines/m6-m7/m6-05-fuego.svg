<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="m6-05-fuego-title m6-05-fuego-desc"><title id="m6-05-fuego-title">Detectar no es extinguir</title><desc id="m6-05-fuego-desc">El calor afecta una unión de metales distintos y genera una señal respecto a una referencia térmica; el sistema interpreta la señal y advierte. Extintor portátil separado de la cadena de detección. Clases A, B y C bajo convención FAA/NFPA; no se prescribe un agente universal.</desc><defs><marker id="m6-05-fuego-arrow-65d8ef" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#65d8ef"/></marker><marker id="m6-05-fuego-arrow-edc36b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#edc36b"/></marker><marker id="m6-05-fuego-arrow-ffa66b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#ffa66b"/></marker><marker id="m6-05-fuego-arrow-8795a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#8795a8"/></marker></defs><rect width="720" height="450" rx="20" fill="#0b1730"/><g font-family="DejaVu Sans, sans-serif"><text x="28" y="38" text-anchor="start" font-size="25" fill="#edc36b">Detectar no es extinguir</text><rect x="25" y="110" width="110" height="58" rx="12" fill="#142743" stroke="#ffa66b" stroke-width="2"/><text x="80.0" y="146.0" text-anchor="middle" font-size="20" fill="#edf5ff">Calor</text><path d="M135 139 L178 139" fill="none" stroke="#ffa66b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m6-05-fuego-arrow-ffa66b)"/><rect x="185" y="98" width="187" height="98" rx="12" fill="#142743" stroke="#ffa66b" stroke-width="2"/><text x="278" y="127" text-anchor="middle" font-size="18" fill="#edf5ff">Unión caliente</text><path d="M215 175 H274 V149 H340" fill="none" stroke="#65d8ef" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M215 167 H266 V141 H340 V149" fill="none" stroke="#edc36b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="340" cy="149" r="4" fill="#ffa66b" stroke="#ffa66b" stroke-width="3"/><text x="278" y="219" text-anchor="middle" font-size="17" fill="#b4c5db">Metales distintos</text><path d="M372 143 L418 143" fill="none" stroke="#edc36b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m6-05-fuego-arrow-edc36b)"/><rect x="421" y="115" width="107" height="57" rx="12" fill="#142743" stroke="#edc36b" stroke-width="2"/><text x="474.5" y="150.5" text-anchor="middle" font-size="20" fill="#edf5ff">Señal</text><path d="M528 143 L567 143" fill="none" stroke="#edc36b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m6-05-fuego-arrow-edc36b)"/><rect x="570" y="115" width="123" height="57" rx="12" fill="#142743" stroke="#ffa66b" stroke-width="2"/><text x="631.5" y="150.5" text-anchor="middle" font-size="20" fill="#edf5ff">Alarma</text><path d="M219 196 V257 H380 V196" fill="none" stroke="#8795a8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7"/><text x="299" y="285" text-anchor="middle" font-size="18" fill="#b4c5db">Referencia térmica</text><rect x="26" y="311" width="442" height="74" rx="12" fill="#142743" stroke="#8795a8" stroke-width="2"/><text x="247" y="339" text-anchor="middle" font-size="17" fill="#edf5ff">Clases A / B / C: convención FAA/NFPA</text><text x="247" y="368" text-anchor="middle" font-size="18" fill="#edc36b">C: equipo eléctrico energizado</text><rect x="563" y="315" width="35" height="66" rx="12" fill="#ffa66b" stroke="#ffa66b" stroke-width="2"/><path d="M573 315 V303 H610 V335" fill="none" stroke="#ffa66b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="581" y="288" text-anchor="middle" font-size="18" fill="#edf5ff">Portátil</text><text x="581" y="402" text-anchor="middle" font-size="15" fill="#b4c5db">Equipo separado</text><path d="M28 405 L692 405" fill="none" stroke="#142743" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="360" y="433" text-anchor="middle" font-size="17" fill="#b4c5db">Cadena conceptual del termopar · Agente adecuado al fuego y al equipo</text></g></svg>