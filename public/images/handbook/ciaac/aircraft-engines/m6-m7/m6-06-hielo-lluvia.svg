<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="m6-06-hielo-lluvia-title m6-06-hielo-lluvia-desc"><title id="m6-06-hielo-lluvia-title">Tres mecanismos; zonas limitadas</title><desc id="m6-06-hielo-lluvia-desc">Tres cortes independientes: borde calentado para anti-hielo, bota neumática deformada que fractura hielo, y vidrio con tratamiento hidrofóbico para lluvia. Las fuentes térmica y neumática se rotulan por separado. No se representa protección total de una aeronave.</desc><defs><marker id="m6-06-hielo-lluvia-arrow-65d8ef" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#65d8ef"/></marker><marker id="m6-06-hielo-lluvia-arrow-edc36b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#edc36b"/></marker><marker id="m6-06-hielo-lluvia-arrow-ffa66b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#ffa66b"/></marker><marker id="m6-06-hielo-lluvia-arrow-8795a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#8795a8"/></marker></defs><rect width="720" height="450" rx="20" fill="#0b1730"/><g font-family="DejaVu Sans, sans-serif"><text x="28" y="38" text-anchor="start" font-size="25" fill="#edc36b">Tres mecanismos; zonas limitadas</text><rect x="24" y="73" width="208" height="313" rx="12" fill="#142743" stroke="#8795a8" stroke-width="2"/><text x="128" y="109" text-anchor="middle" font-size="20" fill="#edc36b">Prevenir hielo</text><rect x="256" y="73" width="208" height="313" rx="12" fill="#142743" stroke="#8795a8" stroke-width="2"/><text x="360" y="109" text-anchor="middle" font-size="20" fill="#edc36b">Retirar hielo</text><rect x="488" y="73" width="208" height="313" rx="12" fill="#142743" stroke="#8795a8" stroke-width="2"/><text x="592" y="109" text-anchor="middle" font-size="20" fill="#edc36b">Desviar lluvia</text><path d="M213 188 H112 C38 188 38 280 112 280 H213" fill="none" stroke="#8795a8" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M206 201 H113 C62 201 62 267 113 267 H206" fill="none" stroke="#ffa66b" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><text x="128" y="321" text-anchor="middle" font-size="18" fill="#edf5ff">Borde calentado</text><text x="128" y="352" text-anchor="middle" font-size="16" fill="#ffa66b">Calor eléctrico</text><text x="128" y="374" text-anchor="middle" font-size="16" fill="#ffa66b">o aire caliente</text><path d="M440 195 H343 C273 195 273 276 343 276 H440" fill="none" stroke="#8795a8" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M344 195 C263 167 253 289 344 276" fill="none" stroke="#65d8ef" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M314 165 L289 175 M271 197 L261 220 M268 251 L281 274" fill="none" stroke="#edf5ff" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><text x="360" y="320" text-anchor="middle" font-size="18" fill="#edf5ff">Bota se deforma</text><text x="360" y="351" text-anchor="middle" font-size="16" fill="#65d8ef">Inflado neumático</text><text x="360" y="374" text-anchor="middle" font-size="16" fill="#b4c5db">Hielo se fractura</text><path d="M518 277 L661 184" fill="none" stroke="#8795a8" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><path d="M535 210 Q522 233 535 234 Q548 233 535 210" fill="none" stroke="#65d8ef" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M570 188 Q557 211 570 212 Q583 211 570 188" fill="none" stroke="#65d8ef" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M610 165 Q597 188 610 189 Q623 188 610 165" fill="none" stroke="#65d8ef" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M590 244 L649 205" fill="none" stroke="#65d8ef" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m6-06-hielo-lluvia-arrow-65d8ef)"/><text x="592" y="319" text-anchor="middle" font-size="18" fill="#edf5ff">Vidrio tratado</text><text x="592" y="351" text-anchor="middle" font-size="16" fill="#65d8ef">Gotas hidrofóbicas</text><text x="592" y="374" text-anchor="middle" font-size="16" fill="#b4c5db">No elimina hielo</text><path d="M28 405 L692 405" fill="none" stroke="#142743" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="360" y="433" text-anchor="middle" font-size="17" fill="#b4c5db">Esquemas locales · Disponibilidad y uso dependen de la aeronave</text></g></svg>