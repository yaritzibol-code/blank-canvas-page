<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="m6-08-vacio-title m6-08-vacio-desc"><title id="m6-08-vacio-title">El aire mueve dos giros en paralelo</title><desc id="m6-08-vacio-desc">Aire filtrado atraviesa en paralelo un indicador de actitud y un indicador direccional, llega al colector y luego a la bomba que descarga al ambiente. Indicador de succión conectado al colector; reguladora admite aire al lado de succión. No hay altímetro conectado.</desc><defs><marker id="m6-08-vacio-arrow-65d8ef" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#65d8ef"/></marker><marker id="m6-08-vacio-arrow-edc36b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#edc36b"/></marker><marker id="m6-08-vacio-arrow-ffa66b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#ffa66b"/></marker><marker id="m6-08-vacio-arrow-8795a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#8795a8"/></marker></defs><rect width="720" height="450" rx="20" fill="#0b1730"/><g font-family="DejaVu Sans, sans-serif"><text x="28" y="38" text-anchor="start" font-size="25" fill="#edc36b">El aire mueve dos giros en paralelo</text><rect x="22" y="147" width="104" height="60" rx="12" fill="#142743" stroke="#65d8ef" stroke-width="2"/><text x="74.0" y="184.0" text-anchor="middle" font-size="20" fill="#edf5ff">Filtro</text><path d="M126 177 H161 V117 H210" fill="none" stroke="#65d8ef" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m6-08-vacio-arrow-65d8ef)"/><path d="M161 177 V267 H210" fill="none" stroke="#65d8ef" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m6-08-vacio-arrow-65d8ef)"/><circle cx="265" cy="117" r="51" fill="#0b1730" stroke="#8795a8" stroke-width="3"/><path d="M222 117 H308" fill="none" stroke="#65d8ef" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M243 106 L265 117 L287 106" fill="none" stroke="#edc36b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="265" y="190" text-anchor="middle" font-size="19" fill="#edf5ff">Actitud</text><circle cx="265" cy="267" r="51" fill="#0b1730" stroke="#8795a8" stroke-width="3"/><text x="265" y="247" text-anchor="middle" font-size="16" fill="#edf5ff">N</text><path d="M244 279 L265 255 L285 279" fill="none" stroke="#edc36b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="265" y="342" text-anchor="middle" font-size="19" fill="#edf5ff">Rumbo</text><path d="M316 117 H374 V177 H461" fill="none" stroke="#65d8ef" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m6-08-vacio-arrow-65d8ef)"/><path d="M316 267 H374 V177" fill="none" stroke="#65d8ef" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m6-08-vacio-arrow-65d8ef)"/><text x="472" y="285" text-anchor="middle" font-size="17" fill="#b4c5db">Colector</text><circle cx="501" cy="177" r="38" fill="#0b1730" stroke="#65d8ef" stroke-width="3"/><path d="M485 195 L525 177 L485 159 Z" fill="none" stroke="#65d8ef" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="501" y="239" text-anchor="middle" font-size="19" fill="#edf5ff">Bomba</text><path d="M539 177 L686 177" fill="none" stroke="#65d8ef" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m6-08-vacio-arrow-65d8ef)"/><text x="619" y="215" text-anchor="middle" font-size="18" fill="#65d8ef">Descarga</text><path d="M397 177 V85 H458" fill="none" stroke="#edc36b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="487" cy="85" r="28" fill="#0b1730" stroke="#edc36b" stroke-width="3"/><path d="M486 85 L499 71" fill="none" stroke="#edc36b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="578" y="90" text-anchor="middle" font-size="18" fill="#edc36b">Succión</text><path d="M685 345 H420 V177" fill="none" stroke="#65d8ef" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m6-08-vacio-arrow-65d8ef)"/><rect x="550" y="322" width="134" height="47" rx="12" fill="#142743" stroke="#8795a8" stroke-width="2"/><text x="617.0" y="352.5" text-anchor="middle" font-size="20" fill="#edf5ff">Reguladora</text><text x="471" y="378" text-anchor="middle" font-size="17" fill="#b4c5db">Admite aire al lado de succión</text><path d="M28 405 L692 405" fill="none" stroke="#142743" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="360" y="433" text-anchor="middle" font-size="17" fill="#b4c5db">Ejemplo de sistema de vacío · Flechas = sentido del aire</text></g></svg>