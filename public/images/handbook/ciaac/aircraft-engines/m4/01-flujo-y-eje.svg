<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="m4-t1-title m4-t1-desc"><title id="m4-t1-title">Dos recorridos: gas y trabajo</title><desc id="m4-t1-desc">Turborreactor de flujo directo. Gas de izquierda a derecha por entrada, compresor, combustión, turbina y tobera. Eje mecánico continuo desde turbina a compresor, con accesorios fuera del conducto.</desc><defs><marker id="m4-t1-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64d8ec"/></marker><marker id="m4-t1-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#f2c46d"/></marker><marker id="m4-t1-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ff9291"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="400" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="35" font-size="23" fill="#edf3fa" text-anchor="start" font-weight="600" id="m4-t1-label-0">Dos recorridos: gas y trabajo</text><text x="24" y="69" font-size="17" fill="#64d8ec" text-anchor="start" font-weight="400" id="m4-t1-label-1">GAS →</text><text x="484" y="69" font-size="17" fill="#f2c46d" text-anchor="start" font-weight="400" id="m4-t1-label-2">POTENCIA POR EJE ←</text><text x="80" y="109" font-size="18" fill="#edf3fa" text-anchor="middle" font-weight="400" id="m4-t1-label-3">Entrada</text><text x="211" y="109" font-size="18" fill="#edf3fa" text-anchor="middle" font-weight="400" id="m4-t1-label-4">Compresor</text><text x="356" y="109" font-size="18" fill="#edf3fa" text-anchor="middle" font-weight="400" id="m4-t1-label-5">Combustión</text><text x="502" y="109" font-size="18" fill="#edf3fa" text-anchor="middle" font-weight="400" id="m4-t1-label-6">Turbina</text><text x="636" y="109" font-size="18" fill="#edf3fa" text-anchor="middle" font-weight="400" id="m4-t1-label-7">Tobera</text><path d="M 32 151 L 160 131 L 270 151 L 290 137 L 447 137 L 465 151 L 560 151 L 673 174" stroke="#8393a9" stroke-width="3" fill="none"/><path d="M 32 239 L 160 259 L 270 239 L 290 253 L 447 253 L 465 239 L 560 239 L 673 216" stroke="#8393a9" stroke-width="3" fill="none"/><path d="M 173 153 L 182 195 L 173 237" stroke="#8393a9" stroke-width="5" fill="none"/><path d="M 196 153 L 205 195 L 196 237" stroke="#8393a9" stroke-width="5" fill="none"/><path d="M 219 153 L 228 195 L 219 237" stroke="#8393a9" stroke-width="5" fill="none"/><path d="M 242 153 L 251 195 L 242 237" stroke="#8393a9" stroke-width="5" fill="none"/><path d="M 479 154 L 470 195 L 479 237" stroke="#8393a9" stroke-width="5" fill="none"/><path d="M 509 154 L 500 195 L 509 237" stroke="#8393a9" stroke-width="5" fill="none"/><path d="M 539 154 L 530 195 L 539 237" stroke="#8393a9" stroke-width="5" fill="none"/><path d="M 305 179 Q 321 161 340 175 Q 362 147 388 177 Q 415 173 433 194 Q 408 218 380 207 Q 351 232 329 208 Q 308 217 305 179" stroke="#f2c46d" stroke-width="2" fill="#f2c46d"/><line x1="174" y1="195" x2="540" y2="195" stroke="#f2c46d" stroke-width="6"/><line x1="466" y1="286" x2="219" y2="286" stroke="#f2c46d" stroke-width="3" marker-end="url(#m4-t1-gold)"/><text x="343" y="313" font-size="18" fill="#f2c46d" text-anchor="middle" font-weight="400" id="m4-t1-label-8">Turbina → compresor</text><line x1="42" y1="175" x2="132" y2="175" stroke="#64d8ec" stroke-width="3" marker-end="url(#m4-t1-cyan)"/><line x1="270" y1="175" x2="292" y2="175" stroke="#64d8ec" stroke-width="3" marker-end="url(#m4-t1-cyan)"/><line x1="437" y1="175" x2="464" y2="175" stroke="#64d8ec" stroke-width="3" marker-end="url(#m4-t1-cyan)"/><line x1="563" y1="175" x2="687" y2="175" stroke="#64d8ec" stroke-width="3" marker-end="url(#m4-t1-cyan)"/><rect x="45" y="285" width="138" height="53" rx="12" fill="#13243a" stroke="none" stroke-width="2"/><text x="114" y="317" font-size="17" fill="#edf3fa" text-anchor="middle" font-weight="400" id="m4-t1-label-9">Accesorios</text><path d="M 198 196 L 198 268 L 114 268 L 114 285" stroke="#f2c46d" stroke-width="2" fill="none"/><text x="24" y="374" font-size="16" fill="#b4c3d5" text-anchor="start" font-weight="400" id="m4-t1-label-10">El gas sigue el conducto; el eje transmite trabajo, no aire.</text></g></svg>