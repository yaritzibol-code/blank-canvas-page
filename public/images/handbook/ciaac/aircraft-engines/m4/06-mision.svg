<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="m4-t6-title m4-t6-desc"><title id="m4-t6-title">La misión decide la comparación</title><desc id="m4-t6-desc">Dos fichas de misión relacionan instrucción local con potencia, velocidad y costo horario; transporte rápido con altitud, alcance, carga y velocidad. Tres símbolos representan recíproco, turbohélice y turbofan sin ranking numérico.</desc><defs><marker id="m4-t6-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64d8ec"/></marker><marker id="m4-t6-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#f2c46d"/></marker><marker id="m4-t6-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ff9291"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="400" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="35" font-size="23" fill="#edf3fa" text-anchor="start" font-weight="600" id="m4-t6-label-0">La misión decide la comparación</text><rect x="24" y="67" width="327" height="139" rx="12" fill="#13243a" stroke="none" stroke-width="2"/><rect x="369" y="67" width="327" height="139" rx="12" fill="#13243a" stroke="none" stroke-width="2"/><text x="42" y="97" font-size="21" fill="#edf3fa" text-anchor="start" font-weight="600" id="m4-t6-label-1">Instrucción local</text><text x="387" y="97" font-size="21" fill="#edf3fa" text-anchor="start" font-weight="600" id="m4-t6-label-2">Transporte rápido</text><text x="42" y="130" font-size="18" fill="#b4c3d5" text-anchor="start" font-weight="400" id="m4-t6-label-3">Potencia necesaria</text><text x="42" y="158" font-size="18" fill="#b4c3d5" text-anchor="start" font-weight="400" id="m4-t6-label-4">Velocidad y costo por hora</text><text x="42" y="186" font-size="18" fill="#f2c46d" text-anchor="start" font-weight="400" id="m4-t6-label-5">Recíproco + hélice</text><text x="387" y="130" font-size="18" fill="#b4c3d5" text-anchor="start" font-weight="400" id="m4-t6-label-6">Altitud, alcance y carga</text><text x="387" y="158" font-size="18" fill="#b4c3d5" text-anchor="start" font-weight="400" id="m4-t6-label-7">Velocidad de crucero</text><text x="387" y="186" font-size="18" fill="#f2c46d" text-anchor="start" font-weight="400" id="m4-t6-label-8">Turbofan</text><text x="360" y="247" font-size="19" fill="#64d8ec" text-anchor="middle" font-weight="600" id="m4-t6-label-9">COMPARA LA MISMA MISIÓN</text><circle cx="131" cy="294" r="25" fill="none" stroke="#8393a9" stroke-width="2"/><rect x="118" y="283" width="26" height="18" rx="2" fill="none" stroke="#f2c46d" stroke-width="2"/><line x1="131" y1="301" x2="139" y2="315" stroke="#f2c46d" stroke-width="3"/><text x="131" y="347" font-size="19" fill="#edf3fa" text-anchor="middle" font-weight="400" id="m4-t6-label-10">Recíproco</text><circle cx="361" cy="294" r="25" fill="none" stroke="#8393a9" stroke-width="2"/><line x1="361" y1="270" x2="361" y2="318" stroke="#f2c46d" stroke-width="5"/><circle cx="361" cy="294" r="5" fill="#f2c46d" stroke="#f2c46d" stroke-width="2"/><text x="361" y="347" font-size="19" fill="#edf3fa" text-anchor="middle" font-weight="400" id="m4-t6-label-11">Turbohélice</text><circle cx="591" cy="294" r="25" fill="none" stroke="#8393a9" stroke-width="2"/><line x1="591" y1="294" x2="610.0" y2="294.0" stroke="#f2c46d" stroke-width="3"/><line x1="591" y1="294" x2="600.5" y2="310.4544826719043" stroke="#f2c46d" stroke-width="3"/><line x1="591" y1="294" x2="581.5" y2="310.4544826719043" stroke="#f2c46d" stroke-width="3"/><line x1="591" y1="294" x2="572.0" y2="294.0" stroke="#f2c46d" stroke-width="3"/><line x1="591" y1="294" x2="581.5" y2="277.5455173280957" stroke="#f2c46d" stroke-width="3"/><line x1="591" y1="294" x2="600.5" y2="277.5455173280957" stroke="#f2c46d" stroke-width="3"/><text x="591" y="347" font-size="19" fill="#edf3fa" text-anchor="middle" font-weight="400" id="m4-t6-label-12">Turbofan</text><text x="24" y="374" font-size="16" fill="#b4c3d5" text-anchor="start" font-weight="400" id="m4-t6-label-13">Sin ganador universal: iguala tarea, condiciones y unidades.</text></g></svg>