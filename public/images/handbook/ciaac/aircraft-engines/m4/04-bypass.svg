<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="m4-t4-title m4-t4-desc"><title id="m4-t4-title">Una bifurcación, dos cuentas</title><desc id="m4-t4-desc">Tras el fan, 50 kilogramos por segundo en total rodean el núcleo y 10 lo atraviesan. Ambas corrientes salen a la derecha. Relación bypass 50 dividido entre 10 igual a 5; fracción másica 50 entre 60, 83,3 por ciento. El grosor no representa empuje.</desc><defs><marker id="m4-t4-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64d8ec"/></marker><marker id="m4-t4-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#f2c46d"/></marker><marker id="m4-t4-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ff9291"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="400" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="35" font-size="23" fill="#edf3fa" text-anchor="start" font-weight="600" id="m4-t4-label-0">Una bifurcación, dos cuentas</text><text x="24" y="69" font-size="18" fill="#edf3fa" text-anchor="start" font-weight="400" id="m4-t4-label-1">Entrada: 60 kg/s</text><line x1="128" y1="110" x2="128" y2="264" stroke="#f2c46d" stroke-width="9"/><text x="129" y="295" font-size="19" fill="#f2c46d" text-anchor="middle" font-weight="400" id="m4-t4-label-2">Fan</text><line x1="34" y1="186" x2="112" y2="186" stroke="#64d8ec" stroke-width="3" marker-end="url(#m4-t4-cyan)"/><path d="M 140 183 C 166 183 163 118 207 118 L 667 118" stroke="#64d8ec" stroke-width="4" fill="none" marker-end="url(#m4-t4-cyan)"/><path d="M 140 190 C 166 190 164 257 207 257 L 667 257" stroke="#64d8ec" stroke-width="4" fill="none" marker-end="url(#m4-t4-cyan)"/><rect x="210" y="153" width="366" height="70" rx="8" fill="#263348" stroke="#8393a9" stroke-width="2"/><text x="393" y="182" font-size="20" fill="#edf3fa" text-anchor="middle" font-weight="400" id="m4-t4-label-3">NÚCLEO</text><text x="393" y="208" font-size="17" fill="#b4c3d5" text-anchor="middle" font-weight="400" id="m4-t4-label-4">Compresor · cámara · turbinas</text><line x1="145" y1="186" x2="204" y2="186" stroke="#f2c46d" stroke-width="3" marker-end="url(#m4-t4-gold)"/><line x1="583" y1="186" x2="679" y2="186" stroke="#f2c46d" stroke-width="3" marker-end="url(#m4-t4-gold)"/><text x="375" y="100" font-size="19" fill="#64d8ec" text-anchor="middle" font-weight="400" id="m4-t4-label-5">Derivación total: 50 kg/s</text><text x="624" y="222" font-size="18" fill="#f2c46d" text-anchor="middle" font-weight="400" id="m4-t4-label-6">10 kg/s</text><rect x="201" y="282" width="223" height="61" rx="12" fill="#13243a" stroke="none" stroke-width="2"/><text x="312" y="308" font-size="23" fill="#f2c46d" text-anchor="middle" font-weight="400" id="m4-t4-label-7">50 / 10 = 5 : 1</text><text x="312" y="332" font-size="17" fill="#b4c3d5" text-anchor="middle" font-weight="400" id="m4-t4-label-8">Relación bypass</text><rect x="441" y="282" width="255" height="61" rx="12" fill="#13243a" stroke="none" stroke-width="2"/><text x="568" y="308" font-size="23" fill="#64d8ec" text-anchor="middle" font-weight="400" id="m4-t4-label-9">50 / 60 ≈ 83,3 %</text><text x="568" y="332" font-size="17" fill="#b4c3d5" text-anchor="middle" font-weight="400" id="m4-t4-label-10">Fracción másica derivada</text><text x="24" y="374" font-size="16" fill="#b4c3d5" text-anchor="start" font-weight="400" id="m4-t4-label-11">50 kg/s es la suma del paso exterior; no indica fracción de empuje.</text></g></svg>