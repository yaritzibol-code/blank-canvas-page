<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="m4-t5-title m4-t5-desc"><title id="m4-t5-title">Geometría de cámaras y zona caliente</title><desc id="m4-t5-desc">Arriba cámaras tubulares con carcasas individuales, tuboanular con tubos dentro de carcasa común, y anular con volumen continuo. Abajo difusor, revestimiento perforado, aire de refrigeración, guías fijas, rotor, carcasa y tobera; gas hacia la derecha.</desc><defs><marker id="m4-t5-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64d8ec"/></marker><marker id="m4-t5-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#f2c46d"/></marker><marker id="m4-t5-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ff9291"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="450" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="35" font-size="23" fill="#edf3fa" text-anchor="start" font-weight="600" id="m4-t5-label-0">Geometría de cámaras y zona caliente</text><text x="128" y="72" font-size="19" fill="#edf3fa" text-anchor="middle" font-weight="400" id="m4-t5-label-1">Tubular</text><circle cx="128" cy="137" r="17" fill="#0b1728" stroke="#8393a9" stroke-width="2"/><circle cx="163.0" cy="137.0" r="12" fill="#f2c46d" stroke="#8393a9" stroke-width="2"/><circle cx="163.0" cy="137.0" r="15" fill="none" stroke="#8393a9" stroke-width="2"/><circle cx="145.5" cy="167.31088913245534" r="12" fill="#f2c46d" stroke="#8393a9" stroke-width="2"/><circle cx="145.5" cy="167.31088913245534" r="15" fill="none" stroke="#8393a9" stroke-width="2"/><circle cx="110.5" cy="167.31088913245534" r="12" fill="#f2c46d" stroke="#8393a9" stroke-width="2"/><circle cx="110.5"