<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="m4-t7-title m4-t7-desc"><title id="m4-t7-title">Acelerar gas, recibir empuje</title><desc id="m4-t7-desc">Gas entra a 100 y sale a 300 metros por segundo hacia la derecha, en el marco del motor. Empuje sobre el motor hacia la izquierda. Caudal 20 da 4000 newtons y 16 da 3200 si no cambian velocidades; presión igualada y masa del combustible despreciada.</desc><defs><marker id="m4-t7-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64d8ec"/></marker><marker id="m4-t7-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#f2c46d"/></marker><marker id="m4-t7-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ff9291"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="400" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="35" font-size="23" fill="#edf3fa" text-anchor="start" font-weight="600" id="m4-t7-label-0">Acelerar gas, recibir empuje</text><text x="24" y="72" font-size="18" fill="#b4c3d5" text-anchor="start" font-weight="400" id="m4-t7-label-1">Una corriente · velocidades relativas al motor</text><rect x="232" y="104" width="229" height="91" rx="12" fill="#27364b" stroke="#8393a9" stroke-width="2"/><text x="346" y="142" font-size="22" fill="#edf3fa" text-anchor="middle" font-weight="400" id="m4-t7-label-2">Motor</text><text x="346" y="174" font-size="21" fill="#f2c46d" text-anchor="middle" font-weight="400" id="m4-t7-label-3">20 kg/s</text><line x1="29" y1="149" x2="219" y2="149" stroke="#64d8ec" stroke-width="3" marker-end="url(#m4-t7-cyan)"/><line x1="473" y1="149" x2="687" y2="149" stroke="#64d8ec" stroke-width="3" marker-end="url(#m4-t7-cyan)"/><text x="119" y="118" font-size="20" fill="#64d8ec" text-anchor="middle" font-weight="400" id="m4-t7-label-4">100 m/s</text><text x="583" y="118" font-size="20" fill="#64d8ec" text-anchor="middle" font-weight="400" id="m4-t7-label-5">300 m/s</text><line x1="452" y1="228" x2="239" y2="228" stroke="#f2c46d" stroke-width="3" marker-end="url(#m4-t7-gold)"/><text x="344" y="261" font-size="18" fill="#f2c46d" text-anchor="middle" font-weight="400" id="m4-t7-label-6">Empuje sobre el motor</text><rect x="24" y="283" width="672" height="61" rx="12" fill="#13243a" stroke="none" stroke-width="2"/><text x="47" y="310" font-size="20" fill="#edf3fa" text-anchor="start" font-weight="400" id="m4-t7-label-7">20 × (300 − 100) = 4 000 N</text><text x="47" y="333" font-size="20" fill="#edf3fa" text-anchor="start" font-weight="400" id="m4-t7-label-8">16 × (300 − 100) = 3 200 N</text><text x="676" y="311" font-size="17" fill="#b4c3d5" text-anchor="end" font-weight="400" id="m4-t7-label-9">Mismas</text><text x="676" y="334" font-size="17" fill="#b4c3d5" text-anchor="end" font-weight="400" id="m4-t7-label-10">velocidades</text><text x="24" y="374" font-size="16" fill="#b4c3d5" text-anchor="start" font-weight="400" id="m4-t7-label-11">Presión de salida = ambiente; masa de combustible despreciada.</text></g></svg>