<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="m4-t2-title m4-t2-desc"><title id="m4-t2-title">Continuidad, secuencia y balance</title><desc id="m4-t2-desc">Brayton separa espacialmente compresión, calor y expansión; los cuatro tiempos de Otto se suceden. Calor ideal a presión constante en Brayton y volumen constante en Otto. Balance didáctico 100 menos 65 igual a 35.</desc><defs><marker id="m4-t2-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64d8ec"/></marker><marker id="m4-t2-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#f2c46d"/></marker><marker id="m4-t2-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ff9291"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="400" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="35" font-size="23" fill="#edf3fa" text-anchor="start" font-weight="600" id="m4-t2-label-0">Continuidad, secuencia y balance</text><rect x="24" y="59" width="672" height="103" rx="12" fill="#13243a" stroke="none" stroke-width="2"/><text x="40" y="85" font-size="19" fill="#64d8ec" text-anchor="start" font-weight="600" id="m4-t2-label-1">BRAYTON · secciones simultáneas</text><text x="126" y="126" font-size="19" fill="#edf3fa" text-anchor="middle" font-weight="400" id="m4-t2-label-2">Comprimir</text><text x="352" y="126" font-size="19" fill="#edf3fa" text-anchor="middle" font-weight="400" id="m4-t2-label-3">Añadir calor</text><text x="580" y="126" font-size="19" fill="#edf3fa" text-anchor="middle" font-weight="400" id="m4-t2-label-4">Expandir</text><line x1="200" y1="120" x2="247" y2="120" stroke="#64d8ec" stroke-width="3" marker-end="url(#m4-t2-cyan)"/><line x1="436" y1="120" x2="488" y2="120" stroke="#64d8ec" stroke-width="3" marker-end="url(#m4-t2-cyan)"/><text x="352" y="151" font-size="16" fill="#b4c3d5" text-anchor="middle" font-weight="400" id="m4-t2-label-5">Aporte de calor ideal: presión constante</text><rect x="24" y="176" width="672" height="95" rx="12" fill="#13243a" stroke="none" stroke-width="2"/><text x="40" y="203" font-size="19" fill="#f2c46d" text-anchor="start" font-weight="600" id="m4-t2-label-6">OTTO · cuatro tiempos sucesivos</text><text x="100" y="234" font-size="18" fill="#edf3fa" text-anchor="middle" font-weight="400" id="m4-t2-label-7">Admisión</text><text x="268" y="234" font-size="18" fill="#edf3fa" text-anchor="middle" font-weight="400" id="m4-t2-label-8">Compresión</text><text x="445" y="234" font-size="18" fill="#edf3fa" text-anchor="middle" font-weight="400" id="m4-t2-label-9">Expansión</text><text x="611" y="234" font-size="18" fill="#edf3fa" text-anchor="middle" font-weight="400" id="m4-t2-label-10">Escape</text><text x="360" y="260" font-size="16" fill="#b4c3d5" text-anchor="middle" font-weight="400" id="m4-t2-label-11">Aporte de calor ideal: volumen constante</text><text x="53" y="323" font-size="31" fill="#f2c46d" text-anchor="start" font-weight="400" id="m4-t2-label-12">100</text><text x="135" y="320" font-size="30" fill="#edf3fa" text-anchor="start" font-weight="400" id="m4-t2-label-13">−</text><text x="180" y="323" font-size="31" fill="#64d8ec" text-anchor="start" font-weight="400" id="m4-t2-label-14">65</text><text x="239" y="320" font-size="30" fill="#edf3fa" text-anchor="start" font-weight="400" id="m4-t2-label-15">=</text><text x="284" y="323" font-size="31" fill="#f2c46d" text-anchor="start" font-weight="400" id="m4-t2-label-16">35</text><text x="370" y="311" font-size="19" fill="#edf3fa" text-anchor="start" font-weight="400" id="m4-t2-label-17">Trabajo neto del ejemplo</text><text x="370" y="338" font-size="16" fill="#b4c3d5" text-anchor="start" font-weight="400" id="m4-t2-label-18">Antes de accesorios y otras pérdidas</text><text x="54" y="348" font-size="16" fill="#b4c3d5" text-anchor="start" font-weight="400" id="m4-t2-label-19">turbina</text><text x="168" y="348" font-size="16" fill="#b4c3d5" text-anchor="start" font-weight="400" id="m4-t2-label-20">compresor</text><text x="289" y="348" font-size="16" fill="#b4c3d5" text-anchor="start" font-weight="400" id="m4-t2-label-21">neto</text><text x="24" y="374" font-size="16" fill="#b4c3d5" text-anchor="start" font-weight="400" id="m4-t2-label-22">Modelo ideal y unidades didácticas; no son datos de un motor.</text></g></svg>