<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="m4-t8-title m4-t8-desc"><title id="m4-t8-title">Reconocer mecanismos distintos</title><desc id="m4-t8-desc">Cuatro paneles cualitativos independientes, sin escala temporal: hot supera límite térmico; hung tiene encendido sin alcanzar ralentí; wet tiene combustible sin combustión establecida; desplome muestra separación sobre un álabe. FOD no excluye giro y los patrones pueden coexistir.</desc><defs><marker id="m4-t8-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64d8ec"/></marker><marker id="m4-t8-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#f2c46d"/></marker><marker id="m4-t8-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ff9291"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="720" height="450" rx="18" fill="#0b1728" stroke="none" stroke-width="2"/><text x="24" y="35" font-size="23" fill="#edf3fa" text-anchor="start" font-weight="600" id="m4-t8-label-0">Reconocer mecanismos distintos</text><rect x="24" y="64" width="326" height="147" rx="12" fill="#13243a" stroke="none" stroke-width="2"/><text x="39" y="92" font-size="20" fill="#edf3fa" text-anchor="start" font-weight="600" id="m4-t8-label-1">Hot start</text><rect x="370" y="64" width="326" height="147" rx="12" fill="#13243a" stroke="none" stroke-width="2"/><text x="385" y="92" font-size="20" fill="#edf3fa" text-anchor="start" font-weight="600" id="m4-t8-label-2">Hung start</text><rect x="24" y="224" width="326" height="147" rx="12" fill="#13243a" stroke="none" stroke-width="2"/><text x="39" y="252" font-size="20" fill="#edf3fa" text-anchor="start" font-weight="600" id="m4-t8-label-3">Wet start</text><rect x="370" y="224" width="326" height="147" rx="12" fill="#13243a" stroke="none" stroke-width="2"/><text x="385" y="252" font-size="20" fill="#edf3fa" text-anchor="start" font-weight="600" id="m4-t8-label-4">Desplome</text><line x1="64" y1="173" x2="64" y2="112" stroke="#8393a9" stroke-width="9"/><line x1="64" y1="173" x2="64" y2="117" stroke="#ff9291" stroke-width="7"/><line x1="48" y1="136" x2="81" y2="136" stroke="#f2c46d" stroke-width="2"/><text x="95" y="139" font-size="18" fill="#ff9291" text-anchor="start" font-weight="400" id="m4-t8-label-5">Supera el límite</text><text x="95" y="165" font-size="17" fill="#b4c3d5" text-anchor="start" font-weight="400" id="m4-t8-label-6">térmico del modelo</text><line x1="405" y1="172" x2="405" y2="111" stroke="#8393a9" stroke-width="9"/><line x1="405" y1="172" x2="405" y2="150" stroke="#f2c46d" stroke-width="7"/><line x1="390" y1="124" x2="422" y2="124" stroke="#64d8ec" stroke-width="2"/><text x="435" y="137" font-size="18" fill="#edf3fa" text-anchor="start" font-weight="400" id="m4-t8-label-7">Hubo encendido</text><text x="435" y="163" font-size="18" fill="#f2c46d" text-anchor="start" font-weight="400" id="m4-t8-label-8">Giro bajo ralentí</text><path d="M 65 269 Q 46 290 47 300 A 18 18 0 0 0 83 300 Q 84 290 65 269" stroke="#64d8ec" stroke-width="2" fill="#64d8ec"/><text x="99" y="292" font-size="17" fill="#edf3fa" text-anchor="start" font-weight="400" id="m4-t8-label-9">Combustible presente</text><text x="99" y="319" font-size="19" fill="#64d8ec" text-anchor="start" font-weight="400" id="m4-t8-label-10">Sin combustión</text><text x="99" y="344" font-size="17" fill="#b4c3d5" text-anchor="start" font-weight="400" id="m4-t8-label-11">establecida</text><path d="M 405 335 Q 428 292 474 318 Q 454 333 405 335" stroke="#8393a9" stroke-width="2" fill="#8393a9"/><path d="M 397 293 Q 431 272 451 286 Q 484 294 465 307 Q 449 305 460 294" stroke="#64d8ec" stroke-width="3" fill="none"/><line x1="478" y1="293" x2="516" y2="293" stroke="#64d8ec" stroke-width="3" marker-end="url(#m4-t8-cyan)"/><text x="529" y="310" font-size="18" fill="#64d8ec" text-anchor="start" font-weight="400" id="m4-t8-label-12">Flujo</text><text x="529" y="334" font-size="18" fill="#64d8ec" text-anchor="start" font-weight="400" id="m4-t8-label-13">separado</text><text x="24" y="400" font-size="17" fill="#b4c3d5" text-anchor="start" font-weight="400" id="m4-t8-label-14">FOD: ingestión de objetos → daño posible, aunque siga girando.</text><text x="24" y="430" font-size="16" fill="#b4c3d5" text-anchor="start" font-weight="400" id="m4-t8-label-15">Patrones cualitativos; pueden coexistir. Aplica el manual del modelo.</text></g></svg>