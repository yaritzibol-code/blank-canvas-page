<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" role="img" aria-labelledby="title desc"><title id="title">Ladera · identificar el datum</title><desc id="desc">Perfil conceptual. TDZE 2,220 ft, umbral 2,210 ft MSL; no son sinónimos. ILS DA 2,420 ft con H 200 ft sobre TDZE; LOC MDA 2,700 ft con H 480 ft sobre TDZE. Aeródromo 2,240 ft MSL; altura de circling sobre el aeródromo. Ejemplo ficticio FlightPath; sin escala; no usar para navegación.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#9a681d"/></marker></defs><rect width="600" height="680" rx="20" fill="#fcf7eb"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="37" font-size="18" fill="#9a681d" font-weight="700" text-anchor="start">FLIGHTPATH  /  AULA FICTICIA</text><text x="28" y="79" font-size="28" fill="#14283f" font-weight="700" text-anchor="start">Ladera · identificar el datum</text><path d="M40 420 H560" fill="none" stroke="#14283f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="410" y="402" width="140" height="17" rx="14" fill="#14283f" stroke="#14283f" stroke-width="2"/><text x="38" y="468" font-size="23" fill="#14283f" font-weight="400" text-anchor="start">TDZE: 2,220 ft · umbral: 2,210 ft</text><path d="M60 180 L450 405" fill="none" stroke="#9a681d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M105 205 L225 310 H440" fill="none" stroke="#14283f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="295" y="285" font-size="25" fill="#9a681d" font-weight="700" text-anchor="start">LOC MDA 2,700</text><text x="80" y="385" font-size="25" fill="#9a681d" font-weight="700" text-anchor="start">ILS DA 2,420</text><text x="40" y="535" font-size="24" fill="#14283f" font-weight="400" text-anchor="start">H LOC = 2,700 − 2,220 = 480 ft</text><text x="40" y="574" font-size="23" fill="#14283f" font-weight="400" text-anchor="start">La altura usa el datum rotulado.</text><path d="M28 615 H572" fill="none" stroke="#eee1c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="642" font-size="21" fill="#14283f" font-weight="400" text-anchor="start">Ejemplo ficticio · Sin escala</text><text x="28" y="667" font-size="19" fill="#14283f" font-weight="400" text-anchor="start">No usar para navegación</text></g></svg>
