<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" role="img" aria-labelledby="title desc"><title id="title">Alba · vista horizontal</title><desc id="desc">Ruta de aproximación de oeste a este por IF, FAF y pista 09 con curso 090°. Frustrada continúa a SALIDA y vira a la izquierda hacia RETORNO cruzando a o por encima de 4,000 ft MSL. Rutas sin escala. Ejemplo ficticio FlightPath; sin escala; no usar para navegación.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#9a681d"/></marker></defs><rect width="600" height="660" rx="20" fill="#fcf7eb"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="37" font-size="18" fill="#9a681d" font-weight="700" text-anchor="start">FLIGHTPATH  /  AULA FICTICIA</text><text x="28" y="79" font-size="28" fill="#14283f" font-weight="700" text-anchor="start">Alba · vista horizontal</text><path d="M55 305 H390" fill="none" stroke="#9a681d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="90" cy="305" r="7" fill="#14283f"/><text x="90" y="287" font-size="22" fill="#14283f" font-weight="400" text-anchor="middle">IF</text><circle cx="240" cy="305" r="7" fill="#14283f"/><text x="240" y="287" font-size="22" fill="#14283f" font-weight="400" text-anchor="middle">FAF</text><rect x="365" y="278" width="64" height="54" rx="14" fill="#14283f" stroke="#14283f" stroke-width="2"/><text x="397" y="313" font-size="22" fill="#fcf7eb" font-weight="700" text-anchor="middle">09</text><text x="130" y="365" font-size="25" fill="#14283f" font-weight="400" text-anchor="start">Curso final 090° →</text><text x="85" y="400" font-size="23" fill="#14283f" font-weight="400" text-anchor="start">FAF: 3,000 ft · MAX 160 kt</text><path d="M429 305 H520 V175 H280" fill="none" stroke="#9a681d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 10" marker-end="url(#arrow)"/><circle cx="520" cy="305" r="7" fill="#14283f"/><text x="520" y="287" font-size="22" fill="#14283f" font-weight="400" text-anchor="middle">SALIDA</text><circle cx="280" cy="175" r="7" fill="#14283f"/><text x="280" y="157" font-size="22" fill="#14283f" font-weight="400" text-anchor="middle">RETORNO</text><text x="290" y="130" font-size="25" fill="#9a681d" font-weight="700" text-anchor="start">≥ 4,000 ft</text><text x="45" y="475" font-size="23" fill="#14283f" font-weight="400" text-anchor="start">Continua: aproximación</text><text x="45" y="512" font-size="23" fill="#14283f" font-weight="400" text-anchor="start">Discontinua: frustrada del ejercicio</text><text x="45" y="550" font-size="22" fill="#14283f" font-weight="400" text-anchor="start">Trayectoria 090° ≠ rumbo sin deriva</text><path d="M28 595 H572" fill="none" stroke="#eee1c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="622" font-size="21" fill="#14283f" font-weight="400" text-anchor="start">Ejemplo ficticio · Sin escala</text><text x="28" y="647" font-size="19" fill="#14283f" font-weight="400" text-anchor="start">No usar para navegación</text></g></svg>
