<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 716" role="img" aria-labelledby="title desc"><title id="title">Seis lecturas conectadas</title><desc id="desc">Mapa conceptual original. Identidad Alba; LOC-A 110.9 MHz, curso 090°, elevación del aeródromo 1520 ft, umbral y TDZE 1500 ft. ILS DA 1,700 ft y H 200 ft; LOC MDA 1,900 ft y H 400 ft. Frustrada hacia SALIDA y RETORNO a o por encima de 4,000 ft MSL. Ejemplo ficticio FlightPath; sin escala; no usar para navegación.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#9a681d"/></marker></defs><rect width="600" height="716" rx="20" fill="#fcf7eb"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="37" font-size="18" fill="#9a681d" font-weight="700" text-anchor="start">FLIGHTPATH  /  AULA FICTICIA</text><text x="28" y="79" font-size="28" fill="#14283f" font-weight="700" text-anchor="start">Seis lecturas conectadas</text><rect x="28" y="115" width="544" height="73" rx="14" fill="#fffdf8" stroke="#eee1c4" stroke-width="2"/><text x="45" y="142" font-size="20" fill="#9a681d" font-weight="700" text-anchor="start">1  IDENTIDAD</text><text x="45" y="171" font-size="22" fill="#14283f" font-weight="400" text-anchor="start">Alba · escenario ficticio</text><rect x="28" y="201" width="544" height="73" rx="14" fill="#fffdf8" stroke="#eee1c4" stroke-width="2"/><text x="45" y="228" font-size="20" fill="#9a681d" font-weight="700" text-anchor="start">2  GUÍA Y REFERENCIAS</text><text x="45" y="257" font-size="22" fill="#14283f" font-weight="400" text-anchor="start">LOC-A · 090° · umbral 1,500 ft</text><rect x="28" y="287" width="544" height="73" rx="14" fill="#fffdf8" stroke="#eee1c4" stroke-width="2"/><text x="45" y="314" font-size="20" fill="#9a681d" font-weight="700" text-anchor="start">3  MSA</text><text x="45" y="343" font-size="22" fill="#14283f" font-weight="400" text-anchor="start">Centro AULA · 25 NM · emergencia</text><rect x="28" y="373" width="544" height="73" rx="14" fill="#fffdf8" stroke="#eee1c4" stroke-width="2"/><text x="45" y="400" font-size="20" fill="#9a681d" font-weight="700" text-anchor="start">4  RUTA Y PERFIL</text><text x="45" y="429" font-size="22" fill="#14283f" font-weight="400" text-anchor="start">IF → FAF → pista didáctica 09</text><rect x="28" y="459" width="544" height="73" rx="14" fill="#fffdf8" stroke="#eee1c4" stroke-width="2"/><text x="45" y="486" font-size="20" fill="#9a681d" font-weight="700" text-anchor="start">5  MÍNIMOS</text><text x="45" y="515" font-size="22" fill="#14283f" font-weight="400" text-anchor="start">ILS DA 1,700 / LOC MDA 1,900 ft</text><rect x="28" y="545" width="544" height="73" rx="14" fill="#fffdf8" stroke="#eee1c4" stroke-width="2"/><text x="45" y="572" font-size="20" fill="#9a681d" font-weight="700" text-anchor="start">6  FRUSTRADA</text><text x="45" y="601" font-size="22" fill="#14283f" font-weight="400" text-anchor="start">SALIDA → RETORNO ≥ 4,000 ft</text><path d="M28 651 H572" fill="none" stroke="#eee1c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="678" font-size="21" fill="#14283f" font-weight="400" text-anchor="start">Ejemplo ficticio · Sin escala</text><text x="28" y="703" font-size="19" fill="#14283f" font-weight="400" text-anchor="start">No usar para navegación</text></g></svg>
