<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 612" role="img" aria-labelledby="title desc"><title id="title">Alba · secuencia de frustrada</title><desc id="desc">1  Al alcanzar DA sin referencias: Iniciar frustrada, sin nivelar; 2  Trayectoria inicial ficticia: Track 090° hasta SALIDA; 3  Después de SALIDA: Virar izquierda hacia RETORNO; 4  Cruce en RETORNO: A o por encima de 4,000 ft MSL Ejemplo ficticio FlightPath; sin escala; no usar para navegación.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#9a681d"/></marker></defs><rect width="600" height="612" rx="20" fill="#fcf7eb"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="37" font-size="18" fill="#9a681d" font-weight="700" text-anchor="start">FLIGHTPATH  /  AULA FICTICIA</text><text x="28" y="79" font-size="28" fill="#14283f" font-weight="700" text-anchor="start">Alba · secuencia de frustrada</text><rect x="28" y="108" width="544" height="90" rx="14" fill="#fffdf8" stroke="#eee1c4" stroke-width="2"/><text x="46" y="138" font-size="21" fill="#9a681d" font-weight="700" text-anchor="start">1  Al alcanzar DA sin referencias</text><text x="46" y="173" font-size="26" fill="#14283f" font-weight="700" text-anchor="start">Iniciar frustrada, sin nivelar</text><rect x="28" y="214" width="544" height="90" rx="14" fill="#fffdf8" stroke="#eee1c4" stroke-width="2"/><text x="46" y="244" font-size="21" fill="#9a681d" font-weight="700" text-anchor="start">2  Trayectoria inicial ficticia</text><text x="46" y="279" font-size="26" fill="#14283f" font-weight="700" text-anchor="start">Track 090° hasta SALIDA</text><rect x="28" y="320" width="544" height="90" rx="14" fill="#fffdf8" stroke="#eee1c4" stroke-width="2"/><text x="46" y="350" font-size="21" fill="#9a681d" font-weight="700" text-anchor="start">3  Después de SALIDA</text><text x="46" y="385" font-size="26" fill="#14283f" font-weight="700" text-anchor="start">Virar izquierda hacia RETORNO</text><rect x="28" y="426" width="544" height="90" rx="14" fill="#fffdf8" stroke="#eee1c4" stroke-width="2"/><text x="46" y="456" font-size="21" fill="#9a681d" font-weight="700" text-anchor="start">4  Cruce en RETORNO</text><text x="46" y="491" font-size="26" fill="#14283f" font-weight="700" text-anchor="start">A o por encima de 4,000 ft MSL</text><path d="M28 547 H572" fill="none" stroke="#eee1c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="574" font-size="21" fill="#14283f" font-weight="400" text-anchor="start">Ejemplo ficticio · Sin escala</text><text x="28" y="599" font-size="19" fill="#14283f" font-weight="400" text-anchor="start">No usar para navegación</text></g></svg>
