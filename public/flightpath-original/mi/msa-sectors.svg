<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" role="img" aria-labelledby="title desc"><title id="title">MSA · sectores inventados</title><desc id="desc">MSA ficticia centrada en AULA, radio 25 NM. Sector norte 4,000 ft, sur 5,000 ft MSL, división 090°/270° desde el centro. Uso de emergencia; no equivale a altitudes de aproximación. Ejemplo ficticio FlightPath; sin escala; no usar para navegación.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#9a681d"/></marker></defs><rect width="600" height="660" rx="20" fill="#fcf7eb"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="37" font-size="18" fill="#9a681d" font-weight="700" text-anchor="start">FLIGHTPATH  /  AULA FICTICIA</text><text x="28" y="79" font-size="28" fill="#14283f" font-weight="700" text-anchor="start">MSA · sectores inventados</text><circle cx="300" cy="290" r="150" fill="#fffdf8" stroke="#9a681d" stroke-width="4"/><path d="M150 290 H450" fill="none" stroke="#14283f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="300" cy="290" r="7" fill="#14283f"/><text x="300" y="224" font-size="23" fill="#9a681d" font-weight="700" text-anchor="middle">NORTE</text><text x="300" y="260" font-size="30" fill="#14283f" font-weight="700" text-anchor="middle">4,000 ft</text><text x="300" y="337" font-size="23" fill="#9a681d" font-weight="700" text-anchor="middle">SUR</text><text x="300" y="375" font-size="30" fill="#14283f" font-weight="700" text-anchor="middle">5,000 ft</text><text x="300" y="120" font-size="24" fill="#14283f" font-weight="400" text-anchor="middle">N ↑</text><text x="38" y="490" font-size="23" fill="#14283f" font-weight="400" text-anchor="start">Centro: punto AULA · radio 25 NM</text><text x="38" y="522" font-size="23" fill="#14283f" font-weight="400" text-anchor="start">Límite E–O (090° / 270° desde AULA)</text><text x="38" y="554" font-size="23" fill="#14283f" font-weight="400" text-anchor="start">Emergencia: no autoriza descenso</text><path d="M28 595 H572" fill="none" stroke="#eee1c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="622" font-size="21" fill="#14283f" font-weight="400" text-anchor="start">Ejemplo ficticio · Sin escala</text><text x="28" y="647" font-size="19" fill="#14283f" font-weight="400" text-anchor="start">No usar para navegación</text></g></svg>
