<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" role="img" aria-labelledby="title desc"><title id="title">Alba · altitudes y decisiones</title><desc id="desc">Perfil conceptual sin escala. FAF 3,000 ft MSL. ILS DA 1,700 ft; LOC MDA 1,900 ft. Umbral y TDZE 1,500 ft MSL. DA no se convierte en tramo nivelado; MDA no es el punto MAPt. Ejemplo ficticio FlightPath; sin escala; no usar para navegación.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#9a681d"/></marker></defs><rect width="600" height="660" rx="20" fill="#fcf7eb"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="37" font-size="18" fill="#9a681d" font-weight="700" text-anchor="start">FLIGHTPATH  /  AULA FICTICIA</text><text x="28" y="79" font-size="28" fill="#14283f" font-weight="700" text-anchor="start">Alba · altitudes y decisiones</text><path d="M45 430 H555" fill="none" stroke="#14283f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="469" font-size="23" fill="#14283f" font-weight="400" text-anchor="start">Umbral = TDZE: 1,500 ft MSL</text><path d="M70 180 L440 407" fill="none" stroke="#9a681d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="95" cy="195" r="7" fill="#14283f"/><text x="95" y="177" font-size="22" fill="#14283f" font-weight="400" text-anchor="middle">FAF</text><text x="145" y="145" font-size="24" fill="#14283f" font-weight="400" text-anchor="start">3,000 ft</text><path d="M320 338 H538" fill="none" stroke="#14283f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><text x="358" y="326" font-size="23" fill="#9a681d" font-weight="700" text-anchor="start">DA 1,700</text><path d="M260 299 H540" fill="none" stroke="#14283f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><text x="374" y="280" font-size="23" fill="#9a681d" font-weight="700" text-anchor="start">MDA 1,900</text><rect x="420" y="412" width="130" height="17" rx="14" fill="#14283f" stroke="#14283f" stroke-width="2"/><text x="34" y="525" font-size="22" fill="#14283f" font-weight="400" text-anchor="start">DA: punto de decisión durante descenso</text><text x="34" y="563" font-size="22" fill="#14283f" font-weight="400" text-anchor="start">MDA: límite; leer también el MAPt</text><path d="M28 595 H572" fill="none" stroke="#eee1c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="622" font-size="21" fill="#14283f" font-weight="400" text-anchor="start">Ejemplo ficticio · Sin escala</text><text x="28" y="647" font-size="19" fill="#14283f" font-weight="400" text-anchor="start">No usar para navegación</text></g></svg>
