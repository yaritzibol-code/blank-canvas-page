<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" role="img" aria-labelledby="title desc"><title id="title">Leer antes de interpretar</title><desc id="desc">Convenciones exclusivas del aula: punto rotulado, flecha de trayectoria y línea discontinua para frustrada. La simbología operacional se verifica en la leyenda de la publicación aplicable. Ejemplo ficticio FlightPath; sin escala; no usar para navegación.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#9a681d"/></marker></defs><rect width="600" height="660" rx="20" fill="#fcf7eb"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="37" font-size="18" fill="#9a681d" font-weight="700" text-anchor="start">FLIGHTPATH  /  AULA FICTICIA</text><text x="28" y="79" font-size="28" fill="#14283f" font-weight="700" text-anchor="start">Leer antes de interpretar</text><rect x="28" y="112" width="544" height="125" rx="14" fill="#fffdf8" stroke="#eee1c4" stroke-width="2"/><circle cx="70" cy="170" r="7" fill="#14283f"/><text x="100" y="153" font-size="25" fill="#14283f" font-weight="700" text-anchor="start">Punto rotulado</text><text x="100" y="193" font-size="22" fill="#14283f" font-weight="400" text-anchor="start">La función la declara la leyenda</text><rect x="28" y="252" width="544" height="125" rx="14" fill="#fffdf8" stroke="#eee1c4" stroke-width="2"/><path d="M53 315 H90" fill="none" stroke="#9a681d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="110" y="292" font-size="25" fill="#14283f" font-weight="700" text-anchor="start">Flecha de trayectoria</text><text x="110" y="333" font-size="22" fill="#14283f" font-weight="400" text-anchor="start">Aquí significa dirección de vuelo</text><rect x="28" y="392" width="544" height="142" rx="14" fill="#fffdf8" stroke="#eee1c4" stroke-width="2"/><path d="M48 460 H88" fill="none" stroke="#9a681d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 8"/><text x="110" y="433" font-size="25" fill="#14283f" font-weight="700" text-anchor="start">Línea discontinua</text><text x="110" y="472" font-size="21" fill="#14283f" font-weight="400" text-anchor="start">Aquí indica ruta de frustrada.</text><text x="110" y="504" font-size="21" fill="#14283f" font-weight="400" text-anchor="start">No es una leyenda aeronáutica.</text><path d="M28 595 H572" fill="none" stroke="#eee1c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="622" font-size="21" fill="#14283f" font-weight="400" text-anchor="start">Ejemplo ficticio · Sin escala</text><text x="28" y="647" font-size="19" fill="#14283f" font-weight="400" text-anchor="start">No usar para navegación</text></g></svg>
