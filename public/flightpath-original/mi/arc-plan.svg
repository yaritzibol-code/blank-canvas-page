<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" role="img" aria-labelledby="title desc"><title id="title">Arco ficticio · este y norte</title><desc id="desc">Arco 10 NM del VOR/DME ficticio AULA-DME 114.8 MHz, ubicado en el punto AULA, desde radial 090° hacia radial 030°; tramo este 7,000 ft, tramo norte 6,200 ft MSL. IF D10, R030; transición inbound 210° D10 a D8, 2 NM; descender después del IF de 6,200 ft a 5,800 ft MSL al llegar a D8. Esquema sin escala; valores no diseñados como procedimiento. Ejemplo ficticio FlightPath; sin escala; no usar para navegación.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#9a681d"/></marker></defs><rect width="600" height="660" rx="20" fill="#fcf7eb"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="37" font-size="18" fill="#9a681d" font-weight="700" text-anchor="start">FLIGHTPATH  /  AULA FICTICIA</text><text x="28" y="79" font-size="28" fill="#14283f" font-weight="700" text-anchor="start">Arco ficticio · este y norte</text><path d="M185 390 L385 390" fill="none" stroke="#14283f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><path d="M185 390 L285 217" fill="none" stroke="#14283f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><path d="M385 390 A200 200 0 0 0 285 217" fill="none" stroke="#9a681d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="185" cy="390" r="7" fill="#14283f"/><text x="38" y="438" font-size="24" fill="#14283f" font-weight="400" text-anchor="start">AULA-DME 114.8 MHz</text><path d="M383 362 A200 200 0 0 0 350 277" fill="none" stroke="#9a681d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="385" cy="390" r="7" fill="#14283f"/><text x="400" y="393" font-size="21" fill="#14283f" font-weight="400" text-anchor="start">R090</text><circle cx="285" cy="217" r="7" fill="#14283f"/><text x="268" y="187" font-size="23" fill="#14283f" font-weight="400" text-anchor="start">IF · R030</text><text x="395" y="280" font-size="26" fill="#9a681d" font-weight="700" text-anchor="start">10 NM</text><path d="M280 225 L230 310" fill="none" stroke="#9a681d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="52" y="255" font-size="24" fill="#14283f" font-weight="400" text-anchor="start">N ↑</text><text x="38" y="497" font-size="22" fill="#14283f" font-weight="400" text-anchor="start">Este: 7,000 ft · norte: 6,200 ft</text><text x="38" y="529" font-size="22" fill="#14283f" font-weight="400" text-anchor="start">D10 6,200 ft → D8 5,800 ft</text><text x="38" y="561" font-size="22" fill="#14283f" font-weight="400" text-anchor="start">El radio se mide desde AULA-DME</text><path d="M28 595 H572" fill="none" stroke="#eee1c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="622" font-size="21" fill="#14283f" font-weight="400" text-anchor="start">Ejemplo ficticio · Sin escala</text><text x="28" y="647" font-size="19" fill="#14283f" font-weight="400" text-anchor="start">No usar para navegación</text></g></svg>
