<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" role="img" aria-labelledby="title desc"><title id="title">Arco · transición al perfil</title><desc id="desc">D10 a D8 AULA-DME: curso 210°, distancia 2 NM; cruzar IF/D10 a 6,200 ft MSL y descender a 5,800 ft MSL al llegar a D8. FAF D5.0 AULA-DME / D4.7 LOC-ARC, altitud 4,800 ft MSL. Perfil conceptual sin escala. Ejemplo ficticio FlightPath; sin escala; no usar para navegación.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#9a681d"/></marker></defs><rect width="600" height="660" rx="20" fill="#fcf7eb"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="37" font-size="18" fill="#9a681d" font-weight="700" text-anchor="start">FLIGHTPATH  /  AULA FICTICIA</text><text x="28" y="79" font-size="28" fill="#14283f" font-weight="700" text-anchor="start">Arco · transición al perfil</text><path d="M65 165 L185 230 L345 330 L490 430" fill="none" stroke="#9a681d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="65" cy="165" r="7" fill="#14283f"/><text x="40" y="135" font-size="23" fill="#14283f" font-weight="400" text-anchor="start">D10</text><circle cx="185" cy="230" r="7" fill="#14283f"/><text x="155" y="205" font-size="23" fill="#14283f" font-weight="400" text-anchor="start">D8</text><circle cx="345" cy="330" r="7" fill="#14283f"/><text x="320" y="300" font-size="23" fill="#14283f" font-weight="400" text-anchor="start">FAF</text><text x="35" y="200" font-size="23" fill="#9a681d" font-weight="700" text-anchor="start">6,200 ft</text><text x="142" y="274" font-size="23" fill="#9a681d" font-weight="700" text-anchor="start">5,800 ft</text><text x="370" y="350" font-size="25" fill="#9a681d" font-weight="700" text-anchor="start">4,800 ft</text><text x="35" y="491" font-size="23" fill="#14283f" font-weight="400" text-anchor="start">Tramo D10 → D8: 210° · 2 NM</text><text x="35" y="523" font-size="23" fill="#14283f" font-weight="400" text-anchor="start">FAF: D5.0 AULA-DME / D4.7 LOC-ARC</text><text x="35" y="555" font-size="23" fill="#14283f" font-weight="400" text-anchor="start">No intercambiar estaciones DME</text><path d="M28 595 H572" fill="none" stroke="#eee1c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="622" font-size="21" fill="#14283f" font-weight="400" text-anchor="start">Ejemplo ficticio · Sin escala</text><text x="28" y="647" font-size="19" fill="#14283f" font-weight="400" text-anchor="start">No usar para navegación</text></g></svg>
