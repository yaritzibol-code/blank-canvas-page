<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" role="img" aria-labelledby="title desc"><title id="title">Espera ficticia · izquierda</title><desc id="desc">Espera al oeste del fijo AULA, virajes izquierdos, inbound 090°, outbound 270°, altitud 6,000 ft MSL. Lado de espera al norte de la trayectoria inbound. Longitud, velocidad y entrada no especificadas. Ejemplo ficticio FlightPath; sin escala; no usar para navegación.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#9a681d"/></marker></defs><rect width="600" height="660" rx="20" fill="#fcf7eb"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="37" font-size="18" fill="#9a681d" font-weight="700" text-anchor="start">FLIGHTPATH  /  AULA FICTICIA</text><text x="28" y="79" font-size="28" fill="#14283f" font-weight="700" text-anchor="start">Espera ficticia · izquierda</text><path d="M420 340 C540 340 540 200 420 200 H190 C70 200 70 340 190 340 H420" fill="none" stroke="#9a681d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M485 323 C505 300 505 270 496 247" fill="none" stroke="#9a681d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M129 213 C104 230 104 278 117 307" fill="none" stroke="#9a681d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M350 340 H415" fill="none" stroke="#9a681d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M330 200 H250" fill="none" stroke="#9a681d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="420" cy="340" r="7" fill="#14283f"/><text x="423" y="380" font-size="23" fill="#14283f" font-weight="400" text-anchor="middle">FIJO AULA</text><text x="300" y="175" font-size="24" fill="#14283f" font-weight="400" text-anchor="middle">Outbound 270° ←</text><text x="280" y="320" font-size="24" fill="#14283f" font-weight="400" text-anchor="middle">Inbound 090° →</text><text x="300" y="275" font-size="27" fill="#9a681d" font-weight="700" text-anchor="middle">6,000 ft MSL</text><text x="40" y="132" font-size="23" fill="#14283f" font-weight="400" text-anchor="start">N ↑</text><text x="35" y="468" font-size="22" fill="#14283f" font-weight="400" text-anchor="start">Virajes a la izquierda · al oeste del fijo</text><text x="35" y="500" font-size="22" fill="#14283f" font-weight="400" text-anchor="start">Lado de espera: norte del inbound</text><text x="35" y="532" font-size="22" fill="#14283f" font-weight="400" text-anchor="start">Longitud de tramo: no especificada</text><text x="35" y="564" font-size="22" fill="#14283f" font-weight="400" text-anchor="start">No inferir una entrada por este dibujo</text><path d="M28 595 H572" fill="none" stroke="#eee1c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="622" font-size="21" fill="#14283f" font-weight="400" text-anchor="start">Ejemplo ficticio · Sin escala</text><text x="28" y="647" font-size="19" fill="#14283f" font-weight="400" text-anchor="start">No usar para navegación</text></g></svg>
