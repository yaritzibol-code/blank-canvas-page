<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" role="img" aria-labelledby="title desc"><title id="title">Frustrada ≠ circuito de espera</title><desc id="desc">Secuencia de aula: ascender por el radial 120° de AULA-DME hasta D4; virar izquierda a AULA y cruzar a o por encima de 6,000 ft MSL. La espera independiente tiene inbound 090°, outbound 270° y virajes izquierdos. Ejemplo ficticio FlightPath; sin escala; no usar para navegación.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#9a681d"/></marker></defs><rect width="600" height="660" rx="20" fill="#fcf7eb"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="37" font-size="18" fill="#9a681d" font-weight="700" text-anchor="start">FLIGHTPATH  /  AULA FICTICIA</text><text x="28" y="79" font-size="28" fill="#14283f" font-weight="700" text-anchor="start">Frustrada ≠ circuito de espera</text><path d="M175 200 L410 340" fill="none" stroke="#9a681d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#arrow)"/><circle cx="175" cy="200" r="7" fill="#14283f"/><text x="65" y="204" font-size="23" fill="#14283f" font-weight="400" text-anchor="start">AULA</text><circle cx="410" cy="340" r="7" fill="#14283f"/><text x="460" y="382" font-size="22" fill="#14283f" font-weight="400" text-anchor="end">D4 AULA-DME</text><path d="M422 326 C555 90 255 70 185 188" fill="none" stroke="#9a681d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#arrow)"/><text x="242" y="320" font-size="24" fill="#9a681d" font-weight="700" text-anchor="start">R120</text><text x="325" y="115" font-size="22" fill="#14283f" font-weight="400" text-anchor="middle">Viraje izquierdo</text><text x="35" y="441" font-size="22" fill="#14283f" font-weight="400" text-anchor="start">Frustrada: ascender por R120 hasta D4</text><text x="35" y="473" font-size="22" fill="#14283f" font-weight="400" text-anchor="start">Después: virar izquierda hacia AULA</text><text x="35" y="505" font-size="22" fill="#14283f" font-weight="400" text-anchor="start">Cruzar AULA a ≥ 6,000 ft MSL</text><text x="35" y="537" font-size="22" fill="#14283f" font-weight="400" text-anchor="start">Espera: inbound 090° · outbound 270°</text><path d="M28 595 H572" fill="none" stroke="#eee1c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="28" y="622" font-size="21" fill="#14283f" font-weight="400" text-anchor="start">Ejemplo ficticio · Sin escala</text><text x="28" y="647" font-size="19" fill="#14283f" font-weight="400" text-anchor="start">No usar para navegación</text></g></svg>
